/* =========================================================
   B · BÓNG TỐI
   ========================================================= */
function shadowGeom(S) {
  const W = 720, H = 420, cy = 196, xs = 96, xScr = 652;
  const rs = Math.max(1, +S.rs), xo = Math.max(180, Math.min(560, +S.xo)), ho = Math.max(12, +S.ho);
  const at = (ya, yb) => {                       /* nối (xs, ya) qua (xo, yb) tới màn */
    const t = (xScr - xs) / (xo - xs);
    return ya + (yb - ya) * t;
  };
  /* bóng tối: tia từ mép XA của nguồn qua mép vật. nửa tối: tia từ mép gần. */
  const umT = at(cy - rs, cy - ho), umB = at(cy + rs, cy + ho);
  const penT = at(cy + rs, cy - ho), penB = at(cy - rs, cy + ho);
  const hasUmBra = umT < umB;
  return { W, H, cy, xs, xScr, rs, xo, ho, penT, penB, umT, umB, hasUmBra, scale: 0.4 };
}

function simShadowBody(S) {
  const g = shadowGeom(S);
  const rays = [];
  const pts = [[g.cy - g.rs, g.cy - g.ho], [g.cy + g.rs, g.cy + g.ho], [g.cy + g.rs, g.cy - g.ho], [g.cy - g.rs, g.cy + g.ho]];
  pts.forEach(([a, b], i) => {
    const t = (g.xScr - g.xs) / (g.xo - g.xs);
    const yEnd = a + (b - a) * t;
    rays.push(`<line x1="${g.xs}" y1="${a}" x2="${g.xScr}" y2="${yEnd}" stroke="var(--accent)" stroke-width=".9" opacity="${i === 2 ? .55 : .38}"/>`);
  });
  const clipped = (v) => Math.max(40, Math.min(g.H - 40, v));
  return `<div class="sim-stage">
    <svg viewBox="0 0 ${g.W} ${g.H}" class="sim-svg" id="simSvg" role="img" aria-label="Bóng tối và bóng nửa tối">
      <rect width="${g.W}" height="${g.H}" fill="var(--paper)"/>
      <rect x="${g.xScr}" y="26" width="16" height="${g.H - 52}" fill="var(--card)" stroke="var(--ink-2)" stroke-width="1.3"/>
      <text x="${g.xScr + 8}" y="20" text-anchor="middle" class="sim-lab">màn</text>
      ${rays.join('')}
      ${g.hasUmBra ? `<rect x="${g.xScr + 1}" y="${clipped(g.penT)}" width="14" height="${Math.max(2, clipped(g.penB) - clipped(g.penT))}" fill="var(--ink)" opacity=".16"/>` : ''}
      ${g.hasUmBra ? `<rect x="${g.xScr + 1}" y="${clipped(g.umT)}" width="14" height="${Math.max(2, clipped(g.umB) - clipped(g.umT))}" fill="var(--ink)" opacity=".85"/>` : `<rect x="${g.xScr + 1}" y="${clipped(g.penT)}" width="14" height="${Math.max(2, clipped(g.penB) - clipped(g.penT))}" fill="var(--ink)" opacity=".85"/>`}
      <g id="simLamp">
        <circle cx="${g.xs}" cy="${g.cy}" r="${g.rs + 7}" fill="url(#simLampG)"/>
        <line x1="${g.xs}" y1="${g.cy - g.rs}" x2="${g.xs}" y2="${g.cy + g.rs}" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
        <text x="${g.xs}" y="${g.cy - g.rs - 14}" text-anchor="middle" class="sim-lab">nguồn sáng</text>
      </g>
      <defs><radialGradient id="simLampG"><stop offset="0" stop-color="#ffd88a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient></defs>
      <g id="simBlocker" style="cursor:grab">
        <rect x="${g.xo - 5}" y="${g.cy - g.ho}" width="10" height="${g.ho * 2}" fill="var(--ink)" stroke="var(--accent)" stroke-width="1.4"/>
        <rect x="${g.xo - 22}" y="${g.cy - g.ho - 10}" width="44" height="${g.ho * 2 + 20}" fill="transparent"/>
        <text x="${g.xo}" y="${g.cy + g.ho + 22}" text-anchor="middle" class="sim-tag">vật cản · kéo ngang</text>
      </g>
      <line x1="${g.xScr - 12}" y1="${clipped(g.umT)}" x2="${g.xScr - 12}" y2="${clipped(g.umB)}" stroke="var(--ink)" stroke-width="1"/>
      <text x="${g.xScr - 20}" y="${(clipped(g.umT) + clipped(g.umB)) / 2 + 3}" text-anchor="end" class="sim-tag">${simNum((g.umB - g.umT) * g.scale, 1)} cm</text>
      <line x1="${g.xScr - 12}" y1="${clipped(g.penT)}" x2="${g.xScr - 12}" y2="${clipped(g.umT)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${g.xScr - 20}" y="${clipped(g.penT) - 5}" text-anchor="end" class="sim-lab">bóng nửa tối</text>
    </svg>
  </div>`;
}

function simShadowCtl(S) {
  const g = shadowGeom(S);
  return `<div class="sim-panel">
    <span class="kicker">Thay đổi</span>
    <label class="sim-row"><span>Bề rộng nguồn</span><input type="range" id="sRs" min="1" max="60" step="1" value="${S.rs}"><b id="sRsV">${S.rs} px</b></label>
    <label class="sim-row"><span>Cao vật cản</span><input type="range" id="sHo" min="12" max="110" step="1" value="${S.ho}"><b id="sHoV">${S.ho} px</b></label>
    <label class="sim-row"><span>Vị trí vật</span><input type="range" id="sXo" min="180" max="560" step="1" value="${S.xo}"><b id="sXoV">${S.xo}</b></label>
    <div class="sim-stats">
      <div><b>${g.hasUmBra ? simNum((g.umB - g.umT) * g.scale, 1) : '0'}</b><span>cm · bóng tối</span></div>
      <div><b>${simNum((g.penB - g.penT) * g.scale, 1)}</b><span>cm · bóng nửa tối</span></div>
    </div>
    <div class="sim-btns"><button class="btn ghost sm" id="sRec">Ghi vào sổ thí nghiệm</button></div>
    <div class="sim-note">Nguồn càng rộng hoặc vật càng gần màn thì <b>bóng tối nhỏ lại</b> và vùng nửa tối loe ra. Kéo nguồn về 1 px là có nguồn điểm — lúc đó chỉ còn bóng tối sắc cạnh.</div>
  </div>`;
}

/* =========================================================
   C · ĐỘNG NĂNG
   ========================================================= */
const SIM_EN = { g: 9.8, px: 85, run: 4.0, flat: 5.2, x0: 84, y1: 292 };

function simEnergySolve(S) {
  const g = SIM_EN.g;
  const h0 = Math.max(0.2, +S.h0);
  const m = Math.max(0.05, +S.m);
  const mu = Math.max(0, +S.mu);
  const d1 = SIM_EN.run;                      /* chạy ngang trên dốc (m) */
  const L1 = Math.sqrt(d1 * d1 + h0 * h0);    /* chiều dài mặt dốc (m) */
  const sinA = h0 / L1, cosA = d1 / L1;
  const L2 = SIM_EN.flat;

  const stateAt = s => {
    const onSlope = s <= L1;
    const wf = mu * m * g * (cosA * Math.min(s, L1) + Math.max(0, s - L1));
    const hh = onSlope ? h0 * (1 - s / L1) : 0;
    const ek = Math.max(0, m * g * h0 - m * g * hh - wf);
    return { s, onSlope, wf, h: hh, v: Math.sqrt(2 * ek / m), ek, et: m * g * hh };
  };
  const total = L1 + L2;
  let sStop = total, started = false;
  for (let s = 0.02; s <= total; s += 0.01) {
    const e = stateAt(s).ek;
    if (e > 0.001) started = true;
    else if (started) { sStop = s; break; }
  }
  if (!started) sStop = 0;
  if (mu === 0) sStop = total;
  return { L1, L2, d1, h0, m, mu, sinA, cosA, stateAt, sStop, E0: m * g * h0, offEnd: sStop >= total - 0.02 };
}

function simEnergyBody(S) {
  const p = simEnergySolve(S);
  const B = SIM_EN;
  const s = Math.max(0, Math.min(S._s || 0, p.sStop));
  const st = p.stateAt(s);
  const x0 = B.x0, y1 = B.y1, y0 = y1 - p.h0 * B.px;
  const x1 = x0 + p.d1 * B.px, x2 = x1 + p.L2 * B.px;
  const W = Math.round(x2 + 44), H = 420;

  const pt = (() => {
    if (s <= p.L1) { const k = s / p.L1; return { x: x0 + (x1 - x0) * k, y: y0 + (y1 - y0) * k }; }
    return { x: x1 + (s - p.L1) * B.px, y: y1 };
  })();

  const bx = 56, by = 30, barW = Math.round(Math.min(430, W - 150));
  const tot = Math.max(0.001, p.E0);
  const w1 = Math.max(0, st.ek / tot) * barW, w2 = Math.max(0, st.et / tot) * barW, w3 = Math.max(0, st.wf / tot) * barW;
  const ang = Math.atan2(p.h0, p.d1) * 180 / Math.PI;

  return `<div class="sim-stage">
    <svg viewBox="0 0 ${W} ${H}" class="sim-svg" id="simSvg" role="img" aria-label="Động năng và thế năng trên dốc">
      <rect width="${W}" height="${H}" fill="var(--paper)"/>
      <path d="M${x0} ${y0}L${x1} ${y1}H${x2}V${y1 + 34}H${x0}Z" fill="var(--rule)" opacity=".38"/>
      <path d="M${x0} ${y0}L${x1} ${y1}H${x2}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${x0 - 10}" y="${(y0 + y1) / 2}" text-anchor="end" class="sim-tag">h₀ = ${simNum(p.h0, 1)} m</text>
      <text x="${(x0 + x1) / 2 - 34}" y="${(y0 + y1) / 2 - 12}" class="sim-lab">dốc ${simNum(ang, 0)}°</text>
      <line x1="${x1}" y1="${y1 + 12}" x2="${x2}" y2="${y1 + 12}" stroke="var(--rule-2)" stroke-width="1"/>
      <text x="${(x1 + x2) / 2}" y="${y1 + 26}" text-anchor="middle" class="sim-lab">mặt ngang ${simNum(p.L2, 1)} m</text>

      <line x1="${pt.x}" y1="${pt.y}" x2="${pt.x}" y2="${y1 + 44}" stroke="var(--rule-2)" stroke-width="1" stroke-dasharray="3 3"/>
      <g id="simBall">
        <ellipse cx="${pt.x}" cy="${pt.y - 2}" rx="12" ry="3" fill="var(--ink)" opacity=".12"/>
        <circle cx="${pt.x}" cy="${pt.y - 13}" r="13" fill="var(--accent)" opacity=".94"/>
        <circle cx="${pt.x - 4}" cy="${pt.y - 17}" r="4" fill="#fff" opacity=".32"/>
      </g>
      <text x="${pt.x}" y="${y1 + 58}" text-anchor="middle" class="sim-tag">${simNum(s, 2)} m</text>

      <text x="${bx}" y="${by}" class="sim-lab">NĂNG LƯỢNG · cơ năng ban đầu ${simNum(p.E0, 1)} J</text>
      <rect x="${bx}" y="${by + 8}" width="${barW}" height="18" fill="var(--rule)"/>
      <rect x="${bx}" y="${by + 8}" width="${w1}" height="18" fill="var(--accent)"/>
      <rect x="${bx + w1}" y="${by + 8}" width="${w2}" height="18" fill="var(--green)"/>
      <rect x="${bx + w1 + w2}" y="${by + 8}" width="${w3}" height="18" fill="var(--ink-3)" opacity=".55"/>
      <g>
        <text x="${bx}" y="${by + 40}" class="sim-tag acc">■ động năng ${simNum(st.ek, 1)} J</text>
        <text x="${bx + 196}" y="${by + 40}" class="sim-tag" fill="var(--green)">■ thế năng ${simNum(st.et, 1)} J</text>
        <text x="${bx}" y="${by + 57}" class="sim-tag dim">■ mất do ma sát ${simNum(st.wf, 1)} J</text>
        <text x="${bx + 196}" y="${by + 57}" class="sim-tag">v = ${simNum(st.v, 2)} m/s</text>
      </g>
      ${p.offEnd ? `<text x="${W - 16}" y="${H - 14}" text-anchor="end" class="sim-warn">ma sát nhỏ quá — bóng chạy hết băng</text>` : ''}
    </svg>
  </div>`;
}

function simEnergyCtl(S) {
  const p = simEnergySolve(S);
  return `<div class="sim-panel">
    <span class="kicker">Thay đổi</span>
    <label class="sim-row"><span>Khối lượng m</span><input type="range" id="sM" min="0.1" max="2" step="0.05" value="${S.m}"><b id="sMV">${simNum(S.m, 2)} kg</b></label>
    <label class="sim-row"><span>Độ cao h₀</span><input type="range" id="sH0" min="0.4" max="2" step="0.05" value="${S.h0}"><b id="sH0V">${simNum(S.h0, 2)} m</b></label>
    <label class="sim-row"><span>Ma sát μ</span><input type="range" id="sMu" min="0" max="0.6" step="0.01" value="${S.mu}"><b id="sMuV">${simNum(S.mu, 2)}</b></label>
    <div class="sim-btns">
      <button class="btn sm" id="sRun">${S.run ? '❚❚ Dừng' : '▶ Thả bóng'}</button>
      <button class="btn ghost sm" id="sReset">Về đỉnh dốc</button>
    </div>
    <div class="sim-stats">
      <div><b>${simNum(p.E0, 1)}</b><span>J · năng lượng ban đầu</span></div>
      <div><b>${simNum(p.sStop - p.L1, 1)}</b><span>m · quãng đường trên mặt ngang</span></div>
    </div>
    <div class="sim-btns"><button class="btn ghost sm" id="sRec">Ghi vào sổ thí nghiệm</button></div>
    <div class="sim-note">Thả bóng: thế năng đổi dần thành động năng, nên <b>v lớn nhất ở chân dốc</b>. Phần bị ma sát “lấy đi” hiện màu xám — bật μ = 0 thì bóng chạy mãi.</div>
  </div>`;
}

/* =========================================================
   PAGE + BIND
   ========================================================= */
const SIM_BODY = { refr: simRefrBody, shadow: simShadowBody, energy: simEnergyBody };
const SIM_CTL = { refr: simRefrCtl, shadow: simShadowCtl, energy: simEnergyCtl };

function renderSim() {
  const S = simState();
  if (S.run && S.st !== 'energy') S.run = false;
  $('#main').innerHTML = `<section class="wrap wide sim-page">
    ${pageHead('Băng thí nghiệm · ánh sáng và chuyển động', 'Kéo là thấy, số đo hiện ngay',
    'Ba bàn tương tác như phòng thí nghiệm ảo: khúc xạ qua mặt nước, bóng tối – bóng nửa tối, và bóng lăn trên dốc với động năng – thế năng. Mọi hình đều tự căn lại theo số liệu bạn đặt.')}
    <div class="lab-tabs sim-tabs">${SIM_TABS.map(([k, t, s]) => `
      <button data-sim="${k}" class="${S.st === k ? 'on' : ''}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>
    <div class="sim-grid">
      <div id="simStageHost">${SIM_BODY[S.st](S)}</div>
      <div id="simCtlHost">${SIM_CTL[S.st](S)}</div>
    </div>
  </section>`;
  simBind();
}

function simPaint() {
  const S = simState();
  const host = $('#simStageHost');
  if (host) host.innerHTML = SIM_BODY[S.st](S);
  const ctl = $('#simCtlHost');
  if (ctl) ctl.innerHTML = SIM_CTL[S.st](S);
  simBind();
}

let simTimer = null;
function simStopLoop() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

function simBind() {
  const S = simState();
  simStopLoop();

  $$('.sim-tabs [data-sim]').forEach(b => b.onclick = () => {
    simStopLoop();
    S.st = b.dataset.sim; S.run = false; S._s = 0;
    save(); renderSim();
  });

  const rec = $('#sRec');
  if (rec) rec.onclick = () => {
    const L = (typeof LAB_ST === 'function') ? LAB_ST() : null;
    if (!L) { toast('Chưa mở được sổ thí nghiệm'); return; }
    let cells = [];
    if (S.st === 'refr') {
      const n1 = +S.n1, n2 = +S.n2, th = +S.th1;
      const s2 = n1 * Math.sin(th * Math.PI / 180) / n2;
      cells = ['khúc xạ · n₁=' + simNum(n1, 2) + ' · n₂=' + simNum(n2, 2),
        'i=' + simNum(th, 0) + '°', s2 <= 1 ? 'r=' + simNum(Math.asin(s2) * 180 / Math.PI, 1) + '°' : 'phản xạ toàn phần'];
    } else if (S.st === 'shadow') {
      const g = shadowGeom(S);
      cells = ['bóng · nguồn ' + simNum(S.rs, 0) + ' px', 'vật ở ' + simNum(S.xo, 0),
        'bóng tối=' + simNum((g.umB - g.umT) * g.scale, 1) + ' cm', 'nửa tối=' + simNum((g.penB - g.penT) * g.scale, 1) + ' cm'];
    } else {
      const p = simEnergySolve(S), st = p.stateAt(Math.min(S._s || 0, p.sStop));
      cells = ['dốc · m=' + simNum(S.m, 2) + ' kg', 'h₀=' + simNum(S.h0, 1) + ' m', 'μ=' + simNum(S.mu, 2),
        'Eđ=' + simNum(st.ek, 1) + ' J', 'v=' + simNum(st.v, 2) + ' m/s'];
    }
    cells.unshift('băng thí nghiệm · ' + (S.st === 'refr' ? 'khúc xạ' : S.st === 'shadow' ? 'bóng tối' : 'động năng'));
    if (typeof labAddLog === 'function') labAddLog(L, cells);
    save(); toast('Đã ghi vào sổ thí nghiệm');
  };

  const slider = (id, key, fmt) => {
    const el = $('#' + id);
    if (!el) return;
    el.oninput = () => {
      S[key] = +el.value;
      const lab = $('#' + id + 'V');
      if (lab) lab.textContent = fmt(+el.value);
      save(); simPaint();
    };
  };

  if (S.st === 'refr') {
    slider('sTh1', 'th1', v => v + '°');
    $$('[data-n1]').forEach(b => b.onclick = () => { S.n1 = +b.dataset.n1; save(); simPaint(); });
    $$('[data-n2]').forEach(b => b.onclick = () => { S.n2 = +b.dataset.n2; save(); simPaint(); });
  }

  if (S.st === 'shadow') {
    slider('sRs', 'rs', v => v + ' px');
    slider('sHo', 'ho', v => v + ' px');
    slider('sXo', 'xo', v => String(v));
    /* kéo vật cản trên hình */
    const bl = $('#simBlocker');
    if (bl) {
      bl.onpointerdown = e => {
        e.preventDefault();

        const move = ev => {
          const box = svg.getBoundingClientRect();
          const x = (ev.clientX - box.left) * (720 / box.width);
          S.xo = Math.max(180, Math.min(560, Math.round(x)));
          const sl = $('#sXo'); if (sl) sl.value = S.xo;
          const lb = $('#sXoV'); if (lb) lb.textContent = String(S.xo);
          simPaint();
        };
        const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); save(); };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
      };
    }
  }

  if (S.st === 'energy') {
    slider('sM', 'm', v => simNum(v, 2) + ' kg');
    slider('sH0', 'h0', v => simNum(v, 2) + ' m');
    slider('sMu', 'mu', v => simNum(v, 2));
    const run = $('#sRun'), reset = $('#sReset');
    if (reset) reset.onclick = () => { S._s = 0; S.run = false; save(); simPaint(); };
    if (run) run.onclick = () => {
      S.run = !S.run;
      if (!S.run) { save(); simPaint(); return; }
      if ((S._s || 0) >= simEnergySolve(S).sStop - 0.01) S._s = 0;
      save(); simPaint();
      const p = simEnergySolve(S);
      simTimer = setInterval(() => {
        if (!document.querySelector('#simSvg')) { simStopLoop(); return; }
        const st = simState();
        const vNow = p.stateAt(Math.max(0, Math.min(st._s || 0, p.sStop))).v;
        let s = (st._s || 0) + Math.max(0.02, vNow * 0.055);
        if (s >= p.sStop) { s = p.sStop; st.run = false; simStopLoop(); }
        st._s = s;
        const host = $('#simStageHost');
        if (host) host.innerHTML = SIM_BODY.energy(st);
        const bar = $('#sRun');
        if (bar && !st.run) bar.textContent = '▶ Thả lại';
      }, 40);
    };
  }
}

/* ---------- 1. quantity extraction ---------- */
/* Each unit knows: the quantity it measures, its SI factor, and the
   symbols a student might type. Order matters: longer first. */
const SP_UNITS = [
  { u: 'kΩ', q: 'R', f: 1e3 }, { u: 'MΩ', q: 'R', f: 1e6 }, { u: 'Ω', q: 'R', f: 1 },
  { u: 'mV', q: 'U', f: 1e-3 }, { u: 'kV', q: 'U', f: 1e3 }, { u: 'V', q: 'U', f: 1 },
  { u: 'mA', q: 'I', f: 1e-3 }, { u: 'A', q: 'I', f: 1 },
  { u: 'kW', q: 'P', f: 1e3 }, { u: 'W', q: 'P', f: 1 },
  { u: 'kJ', q: 'A', f: 1e3 }, { u: 'J', q: 'A', f: 1 },
  { u: 'km/h', q: 'v', f: 1 / 3.6 }, { u: 'm/s', q: 'v', f: 1 }, { u: 'km', q: 's', f: 1e3 },
  { u: 'cm³', q: 'V', f: 1e-6 }, { u: 'm³', q: 'V', f: 1 }, { u: 'lít', q: 'V', f: 1e-3 },
  { u: 'g/cm³', q: 'D', f: 1e3 }, { u: 'kg/m³', q: 'D', f: 1 },
  { u: 'g', q: 'm', f: 1e-3 }, { u: 'kg', q: 'm', f: 1 },
  { u: 'm', q: 's', f: 1 }, { u: 'cm', q: 's', f: 1e-2 }, { u: 'mm', q: 's', f: 1e-3 },
  { u: 'N', q: 'F', f: 1 }, { u: '°C', q: 't', f: 1 }, { u: 'cal', q: 'Q', f: 4.18 },
  { u: 'phút', q: 't', f: 60 }, { u: 'giây', q: 't', f: 1 }, { u: 'giờ', q: 't', f: 3600 },
  { u: 'Hz', q: 'f', f: 1 }, { u: 'nm', q: 'λ', f: 1e-9 }, { u: 'K', q: 'T', f: 1 },
];

const SP_QNAME = {
  R: 'điện trở', U: 'hiệu điện thế', I: 'cường độ dòng điện', P: 'công suất',
  A: 'công / năng lượng', v: 'vận tốc', s: 'quãng đường / độ dài', V: 'thể tích',
  D: 'khối lượng riêng', m: 'khối lượng', F: 'lực', t: 'nhiệt độ / thời gian',
  Q: 'nhiệt lượng', f: 'tần số', λ: 'bước sóng', T: 'nhiệt độ tuyệt đối',
};

/* Pull "12 Ω", "0,5 A", "1,2 kΩ" out of free text. */
function spParse(text) {
  const out = [];
  const src = String(text || '').replace(/\u00a0/g, ' ');
  /* number, optional space, unit word — longest unit first so kΩ beats Ω */
  const units = SP_UNITS.slice().sort((a, b) => b.u.length - a.u.length);
  units.forEach(({ u, q, f }) => {
    const re = new RegExp('(-?\\d+(?:[.,]\\d+)?)\\s*' + u.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&') +
      '(?![a-zA-ZÀ-ỹ])', 'g');
    let m;
    while ((m = re.exec(src))) {
      const raw = m[1].replace(',', '.');
      const val = parseFloat(raw);
      if (!isFinite(val)) continue;
      /* skip if this match is inside a longer unit already taken */
      if (out.some(o => o.start === m.index && o.unit.length > u.length)) continue;
      out.push({
        start: m.index, end: m.index + m[0].length,
        val, unit: u, qty: q, si: val * f, raw: m[0].trim(),
      });
    }
  });
  /* de-duplicate overlapping hits, keep the longest unit */
  out.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const keep = [];
  let lastEnd = -1;
  out.forEach(o => {
    if (o.start < lastEnd) return;
    keep.push(o);
    lastEnd = o.end;
  });
  return keep;
}

/* Which law fits these quantities? Ranked, with the reason spelled out. */
const SP_LAWS = [
  {
    id: 'ohm', name: 'Định luật Ôm', f: 'I = U / R',
    needs: ['U', 'R'], solve: 'I',
    why: 'Có hiệu điện thế và điện trở → tìm được cường độ dòng điện.',
  },
  {
    id: 'power', name: 'Công suất điện', f: 'P = U × I = I²R = U²/R',
    needs: ['U', 'I'], solve: 'P',
    why: 'Có U và I → công suất (hoặc ngược lại, tìm U khi biết P và I).',
  },
  {
    id: 'joule', name: 'Định luật Jun–Len-xơ', f: 'Q = I² R t',
    needs: ['I', 'R'], solve: 'Q',
    why: 'Có dòng điện, điện trở và thời gian → nhiệt lượng toả ra.',
  },
  {
    id: 'work', name: 'Công cơ học', f: 'A = F × s',
    needs: ['F', 's'], solve: 'A',
    why: 'Có lực và quãng đường → công thực hiện.',
  },
  {
    id: 'speed', name: 'Vận tốc', f: 'v = s / t',
    needs: ['s', 'v'], solve: 't',
    why: 'Có quãng đường và vận tốc → thời gian đi hết quãng đường.',
  },
  {
    id: 'density', name: 'Khối lượng riêng', f: 'D = m / V',
    needs: ['m', 'V'], solve: 'D',
    why: 'Có khối lượng và thể tích → khối lượng riêng.',
  },
  {
    id: 'heat', name: 'Phương trình cân bằng nhiệt', f: 'Q = m c Δt',
    needs: ['m', 't'], solve: 'Q',
    why: 'Có khối lượng và nhiệt độ → nhiệt lượng (cần thêm nhiệt dung riêng c).',
  },
];

function spSolve(text) {
  const qty = spParse(text);
  const have = {};
  qty.forEach(q => { if (!have[q.qty]) have[q.qty] = q; });
  const keys = Object.keys(have);

  const ranked = SP_LAWS.map(l => {
    const hit = l.needs.filter(n => have[n]).length;
    return { law: l, hit, full: hit === l.needs.length };
  }).filter(x => x.hit > 0).sort((a, b) => b.hit - a.hit);

  /* compute a numeric answer when the law is fully satisfied */
  let answer = null;
  const top = ranked.find(x => x.full);
  if (top) {
    const g = k => have[k] ? have[k].si : null;
    try {
      if (top.law.id === 'ohm') answer = { v: g('U') / g('R'), u: 'A', sym: 'I' };
      if (top.law.id === 'power') answer = { v: g('U') * g('I'), u: 'W', sym: 'P' };
      if (top.law.id === 'work') answer = { v: g('F') * g('s'), u: 'J', sym: 'A' };
      if (top.law.id === 'density') answer = { v: g('m') / g('V'), u: 'kg/m³', sym: 'D' };
      if (top.law.id === 'speed' && g('s') && g('v')) answer = { v: g('s') / g('v'), u: 's', sym: 't' };
    } catch (e) { answer = null; }
  }
  return { qty, have, ranked, answer, keys };
}

/* ---------- 3. sense check ---------- */
/* Thresholds are deliberately generous — this is a "does this smell
   wrong" filter, not a grader. Every band cites a real textbook case. */
const SP_SENSE = [
  { q: 'I', min: 1e-6, max: 20, u: 'A', why: 'Mạch điện học ở lớp 9 thường dưới 5 A. Cỡ 1000 A là đoản mạch hoặc nhầm đơn vị.' },
  { q: 'U', min: 0.1, max: 1000, u: 'V', why: 'Nguồn pin/acquy trong phòng thí nghiệm 1,5–12 V; mạng điện 220 V.' },
  { q: 'R', min: 0.1, max: 1e6, u: 'Ω', why: 'Điện trở thường 1 Ω – 1 MΩ. Nhỏ hơn 0,1 Ω dễ là nhầm mili-ôhm.' },
  { q: 'P', min: 0.01, max: 3000, u: 'W', why: 'Bóng đèn 3–100 W; ấm điện ~1000 W. 10⁶ W là nhầm kW thành W.' },
  { q: 'v', min: 0.1, max: 100, u: 'm/s', why: 'Xe đạp ~5 m/s, xe máy ~15 m/s, âm thanh 340 m/s.' },
  { q: 'D', min: 100, max: 25000, u: 'kg/m³', why: 'Nước 1000, sắt 7800, chì 11300 kg/m³.' },
  { q: 'm', min: 1e-4, max: 100, u: 'kg', why: 'Dụng cụ thí nghiệm lớp 9 nặng gam đến vài kg.' },
];

function spSense(text) {
  return spParse(text).map(p => {
    const band = SP_SENSE.find(b => b.q === p.qty);
    if (!band) return null;
    const ok = p.si >= band.min && p.si <= band.max;
    return { ...p, ok, band, note: ok ? 'hợp lí' : 'đáng ngờ — ' + band.why };
  }).filter(Boolean);
}

          <div class="sp-law-h"><b>${esc(x.law.name)}</b>
            <span class="mono">${esc(x.law.f)}</span>
            ${x.full ? `<span class="sp-tag">${en ? 'solvable' : 'giải được'}</span>` : ''}</div>
          <p>${esc(x.law.why)}</p>
        </div>`).join('')}</div>` : ''}
      ${r.answer ? `<div class="sp-ans"><span class="kicker">${en ? 'Answer' : 'Đáp số'}</span>
        <b>${r.answer.sym} = ${spFmt(r.answer.v)} ${r.answer.u}</b></div>` : ''}
      ${spSense(text).length ? `<div class="sp-sense">
        ${spSense(text).map(s => `<span class="sp-sense-p ${s.ok ? 'ok' : 'no'}">${esc(s.raw)}</span>`).join('')}
        ${spSense(text).every(s => s.ok) ? `<i class="sp-ok-t">${en ? 'all plausible' : 'đều hợp lí'}</i>`
        : `<i class="sp-no-t">${en ? 'something looks off' : 'có chỗ đáng ngờ'}</i>`}</div>` : ''}`;
  };

  $('#spGo').onclick = () => run($('#spIn').value);
  $('#spDemo').onclick = () => {
    const demo = en
      ? 'A resistor of 12 Ω is connected to a 6 V supply. Find the current.'
      : 'Một điện trở 12 Ω được mắc vào hiệu điện thế 6 V. Tính cường độ dòng điện chạy qua.';
    $('#spIn').value = demo;
    run(demo);
  };

  /* ---- formula drill ---- */
  const drill = $('#spDrill');
  if (drill) drill.onclick = () => {
    const idx = {};
    SP_FORMULAS.forEach(f => { idx[f.id] = f; });
    /* weakest first: box 0 … box 6 */
    const order = SP_FORMULAS.slice().sort((a, b) =>
      (S.specialBox[a.id] || 0) - (S.specialBox[b.id] || 0));
    let i = 0, right = 0;
    const host = $('#spDrillOut');
    const step = () => {
      if (i >= order.length) {
        host.innerHTML = `<div class="sp-done"><b>${right}/${order.length} ${en ? 'correct' : 'đúng'}</b>
          <p class="sy-note">${en ? 'Boxes updated. Come back tomorrow — spacing is the point.'
          : 'Đã cập nhật hộp. Mai quay lại — giãn cách mới là điều tạo ra trí nhớ.'}</p></div>`;
        save();
        return;
      }
      const f = order[i];
      host.innerHTML = `<div class="sp-drill">
        <span class="kicker">${i + 1}/${order.length}</span>
        <p class="sp-drill-q">${esc(f.q)}</p>
        <input id="spDA" type="text" placeholder="${en ? 'formula…' : 'công thức…'}">
        <div class="sy-btnrow"><button class="btn sm" id="spDGo">${en ? 'Check' : 'Kiểm tra'}</button>
          <button class="btn ghost sm" id="spDSee">${en ? 'Show' : 'Xem đáp án'}</button></div>
        <p class="sy-note" id="spDRes"></p>
      </div>`;
      const judge = (showOnly) => {
        const got = showOnly ? '' : $('#spDA').value;
        const ok = !showOnly && spFormulaMatch(got, f.a);
        if (!showOnly) {
          const box = S.specialBox[f.id] || 0;
          S.specialBox[f.id] = ok ? Math.min(6, box + 1) : 1;
          if (ok) right++;
          save();
        }
        $('#spDRes').innerHTML = (showOnly ? '' :
          ok ? `<b class="sp-y">✓ ${en ? 'correct' : 'đúng'}</b>` : `<b class="sp-n">✕ ${en ? 'not quite' : 'chưa đúng'}</b>`)
          + ` <span class="mono">${esc(f.a)}</span>`;
        i++;
        setTimeout(step, showOnly ? 900 : 620);
      };
      $('#spDGo').onclick = () => judge(false);
      $('#spDA').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); judge(false); } };
      $('#spDSee').onclick = () => judge(true);
      $('#spDA').focus();
    };
    step();
  };
}

/* Format a computed number the way a physics answer should look. */
function spFmt(v) {
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 1e5)) {
    const e = Math.floor(Math.log10(a));
    const m = v / Math.pow(10, e);
    return m.toFixed(2).replace('.', ',') + ' × 10' + spSup(e);
  }
  return (Math.round(v * 1000) / 1000).toString().replace('.', ',');
}
function spSup(n) {
  const map = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

/* Formula answers are typed, so be generous: ignore spaces, case,
   and × vs * vs . — the student knows the physics, not the syntax. */
function spFormulaMatch(input, answer) {
  const norm = s => String(s || '').toLowerCase()
    .replace(/[×⋅·*]/g, '').replace(/\s+/g, '').replace(/\./g, '').replace(/,/g, '');
  const a = norm(input), b = norm(answer);
  if (!a) return false;
  if (a === b) return true;
  /* allow "U/R" for "U / R" and "I2Rt" for "I² R t" */
  return a.replace(/²/g, '2').replace(/³/g, '3') === b.replace(/²/g, '2').replace(/³/g, '3');
}


/* ---- mục Vật lí ---- */
/* =========================================================
   PHYSICS HUB · #/physics
   ---------------------------------------------------------
   Physics already had more pieces than any other subject — a 52-session
   plan, a problem reader, a circuit board, a nested-circuit builder, an
   interactive lab, a formula sheet, 236 lectures — but they were scattered
   across menu entries with no front door. A student who wanted "physics"
   had to know which of nine pages to open.

   This is that front door. It shows, in order:
     1. where you are in the plan, and the next thing to do
     2. the tools, grouped by what they are for
     3. the formulas you should already know, searchable
     4. weak topics, from real quiz answers

   Every number comes from existing state. Nothing here is a duplicate of
   another page's data; it is a view over it.
   ========================================================= */

/* The tool index is data, so the hub cannot drift from the real routes.
   `need` explains WHEN to reach for the tool — a menu of names is useless
   without that, which is why the original menu was hard to navigate. */
const PH_TOOLS = [
  {
    group: 'Giải bài',
    items: [
      { href: '#/solve', name: 'Máy giải đề', need: 'Đề có số liệu, cần lời giải từng bước' },
      { href: '#/special', name: 'Đọc đề tự động', need: 'Dán cả đề, máy rút đại lượng và chọn định luật' },
      { href: '#/calc', name: 'Máy tính công thức', need: 'Biết công thức, chỉ cần bấm số' },
    ],
  },
  {
    group: 'Mạch điện',
    items: [
      { href: '#/build', name: 'Bảng mạch', need: 'Gõ công thức hoặc kéo thả linh kiện' },
      { href: '#/builder', name: 'Mạch lồng nhau', need: 'Nhiều tầng nối tiếp / song song' },
    ],
  },
  {
    group: 'Thực hành',
    items: [
      { href: '#/lab', name: 'Phòng thí nghiệm ảo', need: 'Bốn bàn thực hành, kéo thả đo đạc' },
      { href: '#/sim', name: 'Mô phỏng', need: 'Xem hiện tượng chạy thay vì đọc công thức' },
    ],

    items: [

      { href: '#/papers', name: 'Luyện đề', need: 'Đề tự tạo, chấm theo chủ đề' },
      { href: '#/library', name: 'Bài giảng', need: '236 bài đã chọn lọc theo chủ đề' },
    ],
  },
];

/* Weakest topics from real quiz answers — the only honest source.
   Below 3 attempts a topic is not "weak", it is simply unknown, and saying
   otherwise would send students to revise things they already know. */
function phWeakTopics(limit) {
  /* Answers are stored keyed by question id and carry no topic — the topic
     has to be looked up in the question bank. My first version read
     `a.topic`, which never exists, so the list was always empty and looked
     like a "not enough data" state rather than a bug. */
  const topicOf = {};
  (typeof QS !== 'undefined' ? QS : []).forEach(q => { topicOf[q.id] = q.t; });
  const stat = {};
  TOPICS.forEach(t => { stat[t.id] = { id: t.id, name: t.name, n: 0, ok: 0 }; });
  Object.keys(state.ans || {}).forEach(k => {
    const a = ansOf(k);
    if (!a) return;
    let tp = topicOf[k];
    if (tp === undefined) {
      /* flashcard ids are prefixed by topic where they follow that scheme */
      const m = String(k).match(/^t(\d+)/);
      if (m) tp = +m[1];
    }
    if (tp === undefined || !stat[tp]) return;
    stat[tp].n++;
    if (a.ok) stat[tp].ok++;
  });
  const rows = Object.keys(stat).map(k => stat[k]).filter(r => r.n >= 3);
  rows.forEach(r => { r.rate = r.ok / r.n; });
  rows.sort((a, b) => a.rate - b.rate || b.n - a.n);
  return rows.slice(0, limit || 3);
}

    ${next ? `<a class="ph-next" href="${sessionHref(next.d.n, next.s.n)}">

    <div class="ph-phases">
      ${phaseRows.map(r => `<div class="ph-phase">

    </div>

    <div class="ph-sec">

        <span class="kicker">${en ? 'Tools' : 'Công cụ'}</span>

    <div class="ph-two">

        <p class="ph-big">${mastered}<span>/${cards}</span></p>
        <p class="sy-note">${en

            <span class="ph-weak-n">${esc(w.name)}</span>
