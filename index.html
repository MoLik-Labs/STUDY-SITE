========================================================= */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--ink);color:var(--paper);
  padding:10px 16px;font-size:12.5px;text-decoration:none}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.tile:focus-visible,
.em:focus-visible,.qa-chip:focus-visible,.chip-btn:focus-visible,.picktile:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
#main:focus{outline:none}
.lib-rows{display:flex;flex-direction:column}
.lib-more{width:100%;margin:0;padding:8px;border:1px dashed var(--rule-2);background:transparent;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.lib-more:hover{color:var(--accent);border-color:var(--accent);background:var(--card)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* calc: tab chủ đề thành dải cuộn ngang trên điện thoại */
@media(max-width:820px){
  .calc-tabs{flex-wrap:nowrap;overflow-x:auto;gap:0;margin-top:16px;scrollbar-width:none}
  .calc-tabs::-webkit-scrollbar{display:none}
  .calc-tab{flex:0 0 auto;padding:9px 14px 8px 0;margin-right:14px;font-size:12px}
  .calc-tab i{display:none}
  .calc-tab.on i{display:none}
  .tile-list{max-height:214px}
}
.calc-bad{border:1px solid var(--rule);border-left:2px solid var(--accent);background:var(--card);
  padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-top:10px}
.calc-bad b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px}

/* phiên học hôm nay — 3 việc */
.routine{border:1px solid var(--rule);background:var(--card);padding:13px 16px;margin:10px 0 4px}
.routine.all{border-left:2px solid var(--green);background:var(--green-soft)}
.rt-h{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rt-h b{font-size:13px;font-weight:600;font-family:var(--serif)}
.rt-bar{flex:1;min-width:120px;height:5px;background:var(--card-2);border:1px solid var(--rule);display:block;max-width:240px}
.rt-bar i{display:block;height:100%;background:var(--accent)}
.rt-rows{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;border-top:1px solid var(--rule)}
.rt-row{display:grid;grid-template-columns:16px 1fr;grid-template-rows:auto auto;gap:1px 7px;
  padding:9px 12px 9px 0;border-right:1px solid var(--rule);text-decoration:none;align-items:baseline}
.rt-row:last-child{border-right:0}
.rt-tick{font-family:var(--mono);font-size:11px;color:var(--green);grid-row:span 2;align-self:center}
.rt-k{font-size:12.5px;color:var(--ink);font-weight:500}
.rt-v{font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--ink-3)}
.rt-go{display:none}
.rt-row:not(.ok):hover .rt-k{color:var(--accent)}
.rt-row.ok .rt-k{color:var(--ink-2)}
@media(max-width:820px){
  .rt-rows{grid-template-columns:1fr}
  .rt-row{border-right:0;border-bottom:1px solid var(--rule);padding:8px 0}
  .rt-row:last-child{border-bottom:0}
  .rt-v{margin-left:23px}
}

/* heat strip 14 ngày */
.heat{border:1px solid var(--rule);background:var(--card);padding:13px 16px;margin:22px 0 4px}
.heat-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.heat-h .muted{font-family:var(--mono);font-size:9px;letter-spacing:.04em}
.heat-cells{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.hc{aspect-ratio:1;border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--mono);background:var(--paper)}
.hc b{font-size:9px;font-weight:500;color:var(--ink-2);line-height:1}
.hc span{font-size:7px;letter-spacing:.03em;color:var(--ink-3)}
.hc.l1{background:var(--heat1)}.hc.l2{background:var(--heat2)}.hc.l3{background:var(--heat3)}.hc.l4{background:var(--accent);border-color:var(--accent)}
.hc.l4 b,.hc.l4 span{color:#f8f4ec}
.hc.l3 b{color:#2a2118}
@media(max-width:820px){.hc span{display:none}.hc{border-radius:2px}}
.hc.now{border-color:var(--ink)}
.hc.now span{color:var(--accent);font-weight:600}
@media(max-width:560px){
  .numrow{flex-wrap:wrap}
  .numbox input{width:auto;min-width:96px;flex:1}
  .numbox{flex:1;min-width:0}
}

/* dock gọn trên điện thoại */
@media(max-width:640px){
  #main{padding-bottom:104px}
  .pomo.min{width:auto;padding:5px 8px;flex-direction:row;gap:6px;align-items:center}
  .pomo.min .hg-box{width:26px}
  .pomo.min .hg{width:26px;height:40px}
  .pomo.min .pomo-meta{margin:0}
  .pomo.min .pomo-ph,.pomo.min .pomo-modes,.pomo.min .pomo-dots{display:none}
  .pomo.min .pomo-t{font-size:11px}
  .pomo.min .pomo-play{width:18px;height:18px}
  .pomo.pix.min .px-box{width:52px}
  .pomo.pix.min{padding:4px 7px;flex-direction:row;align-items:center;gap:6px}
  .pomo.pix.min .pomo-meta{flex-direction:row}
}

/* =========================================================
   BỘ MÀU — 7 theme, chữ và nền đổi theo
========================================================= */
html[data-theme="midnight"]{
  --paper:#12110e; --card:#1b1a15; --card-2:#23211a;
  --ink:#efeade; --ink-2:#c3bcae; --ink-3:#a09a8b;
  --rule:#2e2b24; --rule-2:#423d33;
  --accent:#d98d5b; --accent-soft:#3a2b1c;
  --green:#7fb08a; --green-soft:#1f2c21;
  --heat1:#2a261e; --heat2:#3d372b; --heat3:#6b5c43; --heat4:#d98d5b;
}
html[data-theme="midnight"] .toast{background:#efeade;color:#12110e}
html[data-theme="midnight"] .hc.l3 b{color:#12110e}
html[data-theme="midnight"] .pcard.star{background:var(--card)}
html[data-theme="midnight"] .topbar{border-top-color:var(--ink)}

html[data-theme="moss"]{
  --paper:#eef0e7; --card:#f7f8f2; --card-2:#e3e7d9;
  --ink:#1b211a; --ink-2:#48513f; --ink-3:#6d7663;
  --rule:#d3d8c6; --rule-2:#bcc4ab;
  --accent:#4a6b3a; --accent-soft:#dfe6d2;
  --green:#3f6b4e; --green-soft:#e0e9db;
  --heat1:#e2e6d6; --heat2:#c6cfb2; --heat3:#94a67c; --heat4:#4a6b3a;
}
html[data-theme="slate"]{
  --paper:#eef0f3; --card:#f8f9fb; --card-2:#e4e8ee;
  --ink:#14181f; --ink-2:#454e5c; --ink-3:#6c7787;
  --rule:#d2d8e2; --rule-2:#b9c2d0;
  --accent:#2f5f92; --accent-soft:#dbe5f1;
  --green:#3c6b5a; --green-soft:#dfe9e6;
  --heat1:#e2e7ef; --heat2:#c3cee0; --heat3:#8fa3c2; --heat4:#2f5f92;
}
html[data-theme="amber"]{
  --paper:#f7efe0; --card:#fdf8ec; --card-2:#f0e4cd;
  --ink:#20180e; --ink-2:#54452f; --ink-3:#7a684d;
  --rule:#e2d3b6; --rule-2:#cdb995;
  --accent:#a85a1c; --accent-soft:#f3e0c6;
  --green:#4c6b3f; --green-soft:#e6ebd9;
  --heat1:#efe2c9; --heat2:#dcc79f; --heat3:#bf9d6b; --heat4:#a85a1c;
}
html[data-theme="pixel"]{
  --paper:#f2f2ee; --card:#fffef8; --card-2:#e6e6df;
  --ink:#111111; --ink-2:#3b3b3b; --ink-3:#63635b;
  --rule:#c9c9bf; --rule-2:#a3a396;
  --accent:#1f6f4a; --accent-soft:#dcece2;
  --green:#1f6f4a; --green-soft:#dcece2;
  --heat1:#dfe0d6; --heat2:#b9bcab; --heat3:#7d9c86; --heat4:#1f6f4a;
}
html[data-theme="pixelnight"]{
  --paper:#14161a; --card:#1c2026; --card-2:#262b33;
  --ink:#eef1f4; --ink-2:#b9c0c9; --ink-3:#98a2ae;
  --rule:#333a44; --rule-2:#48505c;
  --accent:#5fd39a; --accent-soft:#1c3329;
  --green:#5fd39a; --green-soft:#1c3329;
  --heat1:#232b26; --heat2:#2f4438; --heat3:#3f7a5d; --heat4:#5fd39a;
}
html[data-theme="pixelnight"] .toast{background:#eef1f4;color:#14161a}
html[data-theme="pixelnight"] .hc.l3 b{color:#0f1216}
html[data-theme="pixelnight"] .pcard.star{background:var(--card)}

/* nền lưới 8px cho theme pixel */
html[data-theme^="pixel"] body{
  background-image:linear-gradient(rgba(127,127,127,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(127,127,127,.09) 1px,transparent 1px);
  background-size:8px 8px;
}
html[data-theme^="pixel"] *{border-radius:0!important}
html[data-theme^="pixel"] .brand b,
html[data-theme^="pixel"] h1,
html[data-theme^="pixel"] .sec-h,
html[data-theme^="pixel"] .hero h1{font-family:var(--mono);letter-spacing:-.03em;font-weight:600}
html[data-theme^="pixel"] .btn{box-shadow:3px 3px 0 var(--ink);border:1.5px solid var(--ink)}
html[data-theme^="pixel"] .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
html[data-theme^="pixel"] .btn.ghost{box-shadow:3px 3px 0 var(--rule-2);border-color:var(--rule-2)}
html[data-theme^="pixel"] .qcard,
html[data-theme^="pixel"] .today,
html[data-theme^="pixel"] .routine,
html[data-theme^="pixel"] .plan,
html[data-theme^="pixel"] .heat,
html[data-theme^="pixel"] .lab-panel,
html[data-theme^="pixel"] .set-sec,
html[data-theme^="pixel"] .theme-card{border-width:2px}
html[data-theme^="pixel"] .opt{box-shadow:2px 2px 0 var(--rule)}
html[data-theme^="pixel"] .pomo{box-shadow:4px 4px 0 var(--ink);border-width:2px}

/* =========================================================
   TUỲ BIẾN — bố cục trang, mật độ, bo góc, chuyển động
========================================================= */
html[data-density="compact"] .wrap{padding-top:26px}
html[data-density="compact"] .qcard{padding:13px 15px}
html[data-density="compact"] .sec-h{margin:30px 0 10px}
html[data-density="compact"] .today,html[data-density="compact"] .routine{padding:10px 13px;margin:12px 0 2px}
html[data-radius="soft"] .qcard,html[data-radius="soft"] .today,html[data-radius="soft"] .routine,
html[data-radius="soft"] .plan,html[data-radius="soft"] .heat,html[data-radius="soft"] .btn,
html[data-radius="soft"] .opt,html[data-radius="soft"] .chip,html[data-radius="soft"] .tb-search,
html[data-radius="soft"] .theme-card,html[data-radius="soft"] .set-sec,
html[data-radius="soft"] .lab-panel,html[data-radius="soft"] .pomo{border-radius:10px}
html[data-radius="soft"] .opt{border-radius:6px}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{
  animation-duration:.001ms!important;transition-duration:.001ms!important}

/* =========================================================
   TRANG TUỲ BIẾN
========================================================= */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
.set-sec{border:1px solid var(--rule);background:var(--card);padding:16px 18px 18px}
.set-sec:first-child{grid-column:1/-1}
.set-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid var(--rule)}
.set-h .muted{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-3)}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.theme-card{border:1px solid var(--rule);background:var(--paper);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}
.theme-card:hover{border-color:var(--rule-2);transform:translateY(-1px)}
.theme-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tc-prev{display:flex;gap:0;height:44px;border:1px solid var(--rule);overflow:hidden}
.tc-prev i{flex:1}
.tc-prev b{width:17px}
.tc-prev u{width:12px;text-decoration:none}
.tc-name{font-size:12.5px;font-weight:500;color:var(--ink)}
.tc-note{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.acc-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.acc-dot{width:26px;height:26px;border:1px solid var(--rule-2);color:var(--paper);font-size:12px;display:grid;place-items:center}
.acc-dot.on{outline:2px solid var(--ink);outline-offset:2px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.set-row:first-of-type{border-top:0}
.set-l{font-size:12.5px;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--rule);flex-wrap:wrap}
.seg button{padding:6px 11px;font-size:11.5px;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover{background:var(--card-2)}
.seg button.on:hover{background:var(--ink)}
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.pm-preset{border:1px solid var(--rule);background:var(--paper);padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.pm-i{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pm-preset label{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:5px;justify-content:space-between}
.pm-preset input{width:52px;border:1px solid var(--rule);background:var(--card);padding:3px 5px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink);text-align:right}
.pm-prev{margin-top:12px;border-top:1px dashed var(--rule);padding-top:14px}
.pm-prev>.kicker{display:block;margin-bottom:8px}
.pv-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pv-wrap .pomo{flex:0 0 auto;box-shadow:none;border-color:var(--rule)}
.pv-cap{display:flex;flex-direction:column;gap:3px;min-width:0}
.pv-cap b{font-family:var(--serif);font-size:14px;font-weight:600}
.pv-cap span{font-size:11.5px;color:var(--ink-2)}
.pv-cap .pv-note{font-size:11px;color:var(--ink-3);line-height:1.45;max-width:34ch}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.store-cell{background:var(--Paper);background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.store-cell b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.store-cell span{font-size:10.5px;color:var(--ink-3);line-height:1.4}
.store-cell i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase}
.store-cell i.ok{color:var(--green)}
.store-cell i.bad{color:var(--accent)}
.set-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.hist-box{margin-top:10px}
.hist-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px}
.hist-h .muted{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.hist-list{border:1px solid var(--rule);max-height:230px;overflow:auto}
.hist-row{display:grid;grid-template-columns:104px 1fr 54px auto;gap:8px;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--ink-2)}
.hist-row:last-child{border-bottom:0}
.hist-row .mono{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.danger{margin-top:16px;border:1px solid var(--rule);border-left:2px solid var(--accent);padding:11px 13px}
.danger p{font-size:11.5px;color:var(--ink-2);margin:5px 0 9px;line-height:1.5}
@media(max-width:980px){
  .set-grid{grid-template-columns:1fr}
  .theme-grid{grid-template-columns:repeat(2,1fr)}
  .pm-grid{grid-template-columns:1fr}
  .store-grid{grid-template-columns:1fr}
  .hist-row{grid-template-columns:1fr auto;gap:4px 8px}
  .hist-row span:nth-child(2){grid-column:1}
}

/* =========================================================
   POMODORO PIXEL
========================================================= */
.px-box{display:none}
.pomo.pix .hg-box{display:none}
.pomo.pix .px-box{display:block;width:78px;padding:2px 0 0}
.pomo.pix .pxg{width:100%;height:auto;display:block;image-rendering:pixelated;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.pomo.pix .pomo-t{font-size:12px;letter-spacing:.03em}
.px-box.flip{animation:pxflip .62s ease-in-out}
@keyframes pxflip{
  0%{transform:rotate(0) scale(1)}
  48%{transform:rotate(92deg) scale(.9)}
  52%{transform:rotate(-92deg) scale(.9)}
  100%{transform:rotate(0) scale(1)}
}
.pv-wrap .pomo.pix .px-box{width:78px}

/* =========================================================
   NHẠC — âm lượng + tự nhỏ khi mở bài giảng
========================================================= */
.mu-vol{display:grid;grid-template-columns:18px 1fr 34px auto;gap:7px;align-items:center;
  padding:9px 11px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--card-2)}
.mu-vol-i{font-size:11px;line-height:1;text-align:center}
#muVol{-webkit-appearance:none;appearance:none;height:4px;background:var(--rule-2);outline:none}
#muVol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--ink);border:0;cursor:pointer}
#muVol::-moz-range-thumb{width:11px;height:11px;background:var(--ink);border:0;cursor:pointer}
.mu-vol-v{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);text-align:right}
.mu-mute{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule);padding:3px 6px;color:var(--ink-3);white-space:nowrap}
.mu-mute:hover{border-color:var(--ink);color:var(--ink)}
.mu-mute[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mu-duck{display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-bottom:1px solid var(--rule)}
.mu-duck-l{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.seg.mini{margin-top:1px}
.seg.mini button{padding:4px 8px;font-size:10px}

/* nhạc: trạng thái chờ phát */
.mu-idle{display:flex;flex-direction:column;gap:7px;align-items:flex-start;padding:14px 12px;
  border:1px dashed var(--rule-2);background:var(--paper)}
.mu-idle span{font-size:11px;color:var(--ink-3);line-height:1.5}
.mu-vol{grid-template-columns:18px 1fr 34px auto auto}
.mu-stop{width:22px;height:20px;border:1px solid var(--rule);font-size:8px;color:var(--ink-3);line-height:1}
.mu-stop:hover{border-color:var(--accent);color:var(--accent)}

/* ETA dưới hàng số liệu */
.eta{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);
  margin:10px 0 0;padding:7px 10px;border:1px dashed var(--rule);background:var(--card)}

/* bảng phím tắt */
.keys-ov .ov-panel{background:var(--card)}
.keys-grid{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.krow{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;background:var(--card);padding:8px 12px}
.krow kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule-2);padding:2px 6px;
  background:var(--paper);color:var(--ink);justify-self:start;white-space:nowrap}
.krow span{font-size:12px;color:var(--ink-2)}
@media(max-width:560px){.krow{grid-template-columns:104px 1fr;gap:8px}.krow span{font-size:11.5px}}
.keys-ov .ov-panel{height:auto;max-height:88vh;overflow:auto;width:min(520px,calc(100vw - 32px))}
.keys-ov{align-items:flex-start}
.keys-ov .ov-panel{align-self:flex-start}

/* =========================================================
   BẢNG MẠCH — công thức + kéo thả
   ========================================================= */
.bd-page{padding-bottom:60px}
.bd-formula{margin-top:24px}
.bd-fbox{display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);background:var(--card);
  padding:4px 5px 4px 14px;transition:border-color .15s,box-shadow .15s}
.bd-fbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(179,64,47,.09)}
.bd-fbox.err{border-color:#b3402f;background:rgba(179,64,47,.06)}
.bd-fbox input{flex:1;min-width:0;border:0;background:none;outline:none;padding:9px 0;
  font-family:var(--mono);font-size:16px;letter-spacing:.01em;color:var(--ink)}
.bd-fbox input::placeholder{color:var(--ink-3)}
.bd-hint{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:9px}
.bd-read{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3)}
.bd-read b{color:var(--ink-2);font-weight:500}
.bd-eg{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);align-items:center}
.bd-eg button{border:1px solid var(--rule-2);background:var(--card);font-family:var(--mono);font-size:9.5px;
  padding:3px 7px;color:var(--ink-2);cursor:pointer}
.bd-eg button:hover{border-color:var(--accent);color:var(--accent)}
.bd-err{font-family:var(--mono);font-size:10.5px;color:#b3402f;margin-top:7px;min-height:14px}

.bd-grid{display:grid;grid-template-columns:172px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.bd-pal{position:sticky;top:78px}
.bd-tools{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bd-tool{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);background:var(--card);
  padding:8px 9px;cursor:grab;touch-action:none;transition:border-color .12s,transform .12s}
.bd-tool svg{width:44px;height:22px;flex:none}
.bd-tool span{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);text-align:left}
.bd-tool:hover{border-color:var(--ink);transform:translateY(-1px)}
.bd-tool:active{cursor:grabbing}
.bd-field{display:grid;grid-template-columns:16px 1fr 16px;gap:6px;align-items:center;margin-top:6px}
.bd-field span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.bd-field input{width:100%;border:1px solid var(--rule);background:var(--paper);padding:5px 7px;font:inherit;
  font-family:var(--mono);font-size:12px;outline:none}
.bd-field input:focus{border-color:var(--accent)}
.bd-field i{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-style:normal}
.bd-tips{font-size:10.5px;line-height:1.5;color:var(--ink-3);margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}

.bd-stage{min-width:0}
.bd-board{position:relative;border:1px solid var(--rule-2);background-color:var(--card);
  background-image:radial-gradient(circle at 1px 1px,var(--rule) 1px,transparent 0);
  background-size:18px 18px;overflow:hidden}
.bd-svg{display:block;width:100%;height:auto}
.bd-part{cursor:grab}
.bd-part .bd-hit{transition:fill .12s}
.bd-part:hover .bd-hit{fill:rgba(127,127,127,.10)}
.bd-part.sel .bd-hit{fill:rgba(179,64,47,.07)}
.bd-name{font-family:var(--mono);font-size:10px;fill:var(--ink-2);letter-spacing:.02em}
.bd-val{font-family:var(--mono);font-size:9.5px;fill:var(--accent)}
.bd-val.acc{fill:var(--accent)}
.bd-letter{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.bd-letter.acc{fill:var(--accent)}
.bd-src{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
.bd-src.acc{fill:var(--accent)}
.bd-plate{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
.bd-warn{font-family:var(--mono);font-size:10px;fill:#b3402f;letter-spacing:.06em}
.bd-cur{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:.1 15;animation:bdflow var(--d,1.2s) linear infinite;opacity:.85}
@keyframes bdflow{to{stroke-dashoffset:-15.1}}
[data-motion="off"] .bd-cur{display:none}

.bd-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.bd-btn{border:1px solid var(--rule-2);background:var(--card);font-family:var(--mono);font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;color:var(--ink-2);cursor:pointer}
.bd-btn:hover{border-color:var(--ink);color:var(--ink)}
.bd-sp{flex:1}
.bd-scrollhint{display:none;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--ink-3)}

.bd-outs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:22px}
.bd-kpi{background:var(--card);padding:12px 14px}
.bd-kpi span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.bd-kpi b{display:block;font-family:var(--serif);font-size:25px;font-weight:400;margin-top:3px;line-height:1.1}
.bd-kpi b i{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--ink-3);margin-left:2px}
.bd-tablewrap{margin-top:24px}
.bd-tablewrap .tbl-wrap{margin-top:8px}
.bd-kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.bd-notes{margin-top:16px}
.bd-note{font-size:12px;line-height:1.55;color:var(--ink-2);margin:0 0 6px;padding-left:12px;border-left:2px solid var(--accent)}

/* ghost + caret + trash */
.bd-ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-6px,-50%);
  display:flex;align-items:center;gap:6px;padding:5px 9px;background:var(--card);
  border:1px solid var(--accent);box-shadow:0 10px 26px rgba(20,18,14,.18);opacity:.96}
.bd-ghost svg{width:44px;height:22px}
.bd-ghost span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bd-caret{position:fixed;z-index:98;width:2px;background:var(--accent);pointer-events:none;
  box-shadow:0 0 0 1px rgba(179,64,47,.18)}
.bd-trash{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:7px;
  padding:8px 12px;border:1px dashed var(--rule-2);background:var(--card);color:var(--ink-3);
  font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .15s,color .15s,border-color .15s}
.bd-trash.on{opacity:1;color:#b3402f;border-color:#b3402f}

/* popover sửa linh kiện */
.bd-pop{position:fixed;z-index:97;width:262px;background:var(--card);border:1px solid var(--ink);
  padding:13px 14px 14px;box-shadow:0 18px 46px rgba(20,18,14,.2)}
.bd-pop-h{display:flex;align-items:baseline;gap:8px;margin-bottom:11px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.bd-pop-h b{font-family:var(--serif);font-size:20px;font-weight:500}
.bd-pop-h span{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.bd-x{margin-left:auto;border:0;background:none;font-size:19px;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 3px}
.bd-x:hover{color:var(--accent)}
.bd-kinds{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:11px}
.bd-kinds button{border:1px solid var(--rule-2);background:var(--paper);font:inherit;font-size:11px;
  padding:6px 4px;color:var(--ink-2);cursor:pointer}
.bd-kinds button:hover{border-color:var(--ink-2)}
.bd-kinds button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bd-slide{display:grid;grid-template-columns:1fr 64px 14px;gap:7px;align-items:center;margin:4px 0 12px}
.bd-slide input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:18px}
.bd-slide input[type=number]{border:1px solid var(--rule);background:var(--paper);padding:5px 7px;
  font-family:var(--mono);font-size:12px;width:100%;outline:none}
.bd-slide input[type=number]:focus{border-color:var(--accent)}
.bd-slide i{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-style:normal}
.bd-switch{width:100%;border:1px solid var(--rule-2);background:var(--paper);font-family:var(--mono);
  font-size:10px;letter-spacing:.05em;padding:9px 8px;cursor:pointer;color:var(--ink-2);margin-bottom:11px}
.bd-switch.on{border-color:var(--accent);color:var(--accent);background:rgba(179,64,47,.06)}
.bd-pophint{font-size:10.5px;line-height:1.5;color:var(--ink-3);margin:0 0 11px}
.bd-pop-f{display:grid;grid-template-columns:34px 34px 1fr;gap:5px}
.bd-pop-f button{border:1px solid var(--rule-2);background:var(--paper);font-family:var(--mono);font-size:11px;
  padding:6px 0;cursor:pointer;color:var(--ink-2)}
.bd-pop-f button:hover{border-color:var(--ink)}
.bd-pop-f button.danger{color:#b3402f;border-color:rgba(179,64,47,.4)}
.bd-pop-f button.danger:hover{background:#b3402f;color:#fff;border-color:#b3402f}

body.bd-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.bd-dragging .bd-part{cursor:grabbing}

@media(max-width:900px){
  .bd-grid{grid-template-columns:minmax(0,1fr)}
  .bd-pal{position:static}
  .bd-tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;overflow:visible}
  .bd-tool{flex-direction:column;gap:3px;padding:7px 3px;min-width:0}
  .bd-tool svg{width:100%;height:20px}
  .bd-tool span{font-size:7.5px;letter-spacing:.03em;text-align:center;line-height:1.15}
  .bd-outs{grid-template-columns:1fr 1fr}
  .bd-fbox input{font-size:14px}
  .bd-board{overflow-x:auto}
  .bd-svg{min-width:600px}
  .bd-scrollhint{display:inline}
}
@media(max-width:560px){
  .bd-fbox{padding-left:10px}
  .bd-kpi b{font-size:21px}
  .bd-pop{width:min(262px,calc(100vw - 24px))}
  .bd-eg{display:none}
}

/* nguồn điện + tự căn lại */
.bd-gens{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0 8px}
.bd-gens button{border:1px solid var(--rule-2);background:var(--paper);font-family:var(--mono);font-size:9px;
  letter-spacing:.04em;padding:6px 3px;color:var(--ink-2);cursor:pointer;line-height:1.2}
.bd-gens button:hover{border-color:var(--ink-2)}
.bd-gens button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bd-genx{margin-top:6px}
.bd-gentip{font-size:10px;line-height:1.45;color:var(--ink-3);margin:2px 0 0}
#bdCanvas.settle .bd-part{animation:bdSettle .42s cubic-bezier(.2,.7,.3,1) both}
#bdCanvas.settle .bd-part:nth-child(2){animation-delay:.03s}
#bdCanvas.settle .bd-part:nth-child(3){animation-delay:.06s}
#bdCanvas.settle .bd-part:nth-child(4){animation-delay:.09s}
@keyframes bdSettle{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
[data-motion="off"] #bdCanvas.settle .bd-part{animation:none}
.bd-ac{animation:bdAcPulse 1.6s ease-in-out infinite}
@keyframes bdAcPulse{0%,100%{opacity:.35}50%{opacity:1}}

/* =========================================================
   BĂNG THÍ NGHIỆM
   ========================================================= */
.sim-page{padding-bottom:70px}
.sim-tabs{margin-top:22px}
.sim-grid{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;margin-top:16px;align-items:start}
.sim-stage{border:1px solid var(--rule-2);background:var(--card);overflow:hidden}
.sim-svg{display:block;width:100%;height:auto}
.sim-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3)}
.sim-tag{font-family:var(--mono);font-size:12.5px;fill:var(--ink-2)}
.sim-tag.dim{fill:var(--ink-3)}
.sim-tag.acc{fill:var(--accent)}
.sim-val{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.sim-val.acc{fill:var(--accent)}
.sim-warn{font-family:var(--mono);font-size:10.5px;fill:#b3402f;letter-spacing:.04em}

.sim-panel{border:1px solid var(--rule-2);background:var(--card);padding:14px 15px 16px}
.sim-row{display:grid;grid-template-columns:1fr;gap:3px;margin-top:11px}
.sim-row>span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sim-row input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.sim-row b{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--accent)}
.sim-chips{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.sim-chips button{border:1px solid var(--rule-2);background:var(--paper);font-family:var(--mono);font-size:9px;
  padding:6px 3px;color:var(--ink-2);cursor:pointer}
.sim-chips button:hover{border-color:var(--ink-2)}
.sim-chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sim-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:14px}
.sim-stats>div{background:var(--card);padding:9px 10px}
.sim-stats b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.1}
.sim-stats span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.sim-note{font-size:11.5px;line-height:1.6;color:var(--ink-2);margin-top:14px;border-top:1px solid var(--rule);padding-top:11px}
.sim-btns{display:flex;gap:6px;margin-top:13px}
.sim-btns .btn{flex:1}

@media(max-width:900px){
  .sim-grid{grid-template-columns:minmax(0,1fr)}
  .sim-panel{order:2}
}
@media(max-width:900px){
  .sim-stage{overflow-x:auto}
  .sim-svg{min-width:540px}
}

/* =========================================================
   TRƯỜNG HỌC — khoá học, studio, kho tệp
   ========================================================= */
.scope-chip{display:flex;flex-direction:column;line-height:1.1;padding:5px 10px;border:1px solid var(--rule-2);
  background:var(--card);text-decoration:none;white-space:nowrap}
.scope-chip b{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.scope-chip span{font-family:var(--serif);font-size:13.5px;color:var(--ink)}
.scope-chip:hover{border-color:var(--ink)}
.tb-more{position:relative}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:230px;background:var(--card);border:1px solid var(--ink);
  box-shadow:0 18px 44px rgba(20,18,14,.18);padding:6px;display:none;flex-direction:column;z-index:90}
.tb-menu.on{display:flex}
.tb-menu a{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-2);padding:8px 10px;text-decoration:none;cursor:pointer}
.tb-menu a:hover{background:var(--paper);color:var(--accent)}
.tb-sep{height:1px;background:var(--rule);margin:5px 4px}

/* ---- dải lớp ---- */
.shelf-page{padding-bottom:70px}
.grade-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:22px}
.gchip{background:var(--card);border:0;padding:10px 4px 9px;cursor:pointer;text-align:center;transition:background .14s}
.gchip b{display:block;font-family:var(--serif);font-size:19px;font-weight:400;line-height:1;color:var(--ink)}
.gchip span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip:hover{background:var(--paper)}
.gchip.on{background:var(--ink)}
.gchip.on b{color:var(--paper)}
.gchip.on span{color:rgba(255,255,255,.62)}

.shelf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:30px 0 16px}
.shelf-head h2{font-family:var(--serif);font-size:clamp(20px,2.4vw,27px);font-weight:400;margin:6px 0 0}
.shelf-act{display:flex;gap:6px;flex-wrap:wrap}

.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.subj-card{display:grid;grid-template-columns:54px minmax(0,1fr) 18px;gap:12px;align-items:center;
  background:var(--card);padding:15px 15px 14px;text-decoration:none;animation:subjIn .3s both;animation-delay:calc(var(--i)*22ms)}
@keyframes subjIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[data-motion="off"] .subj-card{animation:none}
.subj-mono{display:grid;place-items:center;width:54px;height:54px;border:1px solid var(--rule-2);
  font-family:var(--serif);font-size:19px;letter-spacing:-.01em;color:var(--ink-2)}
.subj-body{min-width:0}
.subj-body b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:500;line-height:1.22;color:var(--ink)}
.subj-body i{display:block;font-style:normal;font-size:11px;line-height:1.45;color:var(--ink-3);margin-top:3px}

.school-strip{display:grid;grid-template-columns:minmax(0,1fr) 1.05fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:8px}
.ss-main{background:var(--card);padding:20px 22px;text-decoration:none;transition:background .15s}
.ss-main b{display:block;font-family:var(--serif);font-size:clamp(19px,2.1vw,25px);font-weight:400;line-height:1.24;color:var(--ink);margin:7px 0 0}
.ss-main .ss-sub{display:block;font-size:12px;line-height:1.6;color:var(--ink-3);margin-top:7px;max-width:56ch}
.ss-main:hover{background:var(--paper)}
.ss-main:hover b{color:var(--accent)}
.ss-links{display:grid;grid-template-columns:1fr;background:var(--paper)}
.ss-links a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 18px;text-decoration:none;
  border-bottom:1px solid var(--rule)}
.ss-links a:last-child{border-bottom:0}
.ss-links a b{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink)}
.ss-links a span{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ss-links a:hover{background:var(--card)}
.ss-links a:hover b{color:var(--accent)}
@media(max-width:760px){.school-strip{grid-template-columns:1fr}}
.school-strip{display:flex;flex-wrap:wrap;background:var(--rule);border:1px solid var(--rule);gap:1px}
.school-strip .ss-main{flex:1 1 52%;min-width:0}
.school-strip .ss-links{flex:1 1 44%;min-width:0}
.school-strip{padding:0}
.ll-flags{display:flex;align-items:center;gap:5px}
.ll-done{font-family:var(--mono);font-size:9px;color:var(--paper);background:var(--ok,#2f6b3f);padding:2px 5px;line-height:1}
.resume{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;
  border:1px solid var(--ink);background:var(--card);padding:13px 16px;margin-top:18px;text-decoration:none;
  border-left:3px solid var(--accent)}
.resume .kicker{grid-row:1;grid-column:1}
.resume b{grid-row:1;grid-column:2;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);line-height:1.3}
.resume .resume-meta{grid-row:2;grid-column:2;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--ink-3)}
.resume .resume-go{grid-row:1/3;grid-column:3;align-self:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent)}
.resume:hover{background:var(--paper)}
@media(max-width:640px){.resume{grid-template-columns:1fr auto}.resume .kicker{grid-column:1/-1}.resume b{grid-column:1}.resume .resume-meta{grid-column:1}.resume .resume-go{grid-row:2/4;grid-column:2}}

/* =========================================================
   STUDY OS — trung tâm tự học
   ========================================================= */
.sy-page{padding-bottom:90px}
.rail-study{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.rs-main{display:block;text-decoration:none;background:var(--ink);color:var(--paper);padding:10px 12px}
.rs-main b{display:block;font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.2}
.rs-main span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.07em;text-transform:uppercase;
  color:rgba(255,255,255,.6);margin-top:3px}
.rs-main.on{background:var(--accent)}
.rs-main:hover{background:#000}
[data-theme="pixel"] .rs-main{background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
[data-theme="pixel"] .rs-main span{color:var(--ink-3)}
[data-theme="pixel"] .rs-main.on{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="pixel"] .rs-main.on span{color:rgba(255,255,255,.75)}

/* ---- hero ---- */
.sy-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center;
  border-bottom:1px solid var(--rule);padding:6px 0 22px}
.sy-hero h1{font-family:var(--serif);font-size:clamp(27px,3.6vw,42px);font-weight:400;line-height:1.14;margin:8px 0 0}
.sy-hero h1 em{font-style:italic;color:var(--accent)}
.sy-hero p{font-size:13.5px;line-height:1.7;color:var(--ink-2);margin:10px 0 0;max-width:62ch}
.sy-hero p b{color:var(--ink)}
.sy-hero-r{display:flex;align-items:center;gap:20px}
.sy-ring{--p:0;width:120px;height:120px;position:relative;flex:none}
.sy-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sy-ring circle{fill:none;stroke-width:7}
.sy-r-bg{stroke:var(--rule)}
.sy-r-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:326.7;
  stroke-dashoffset:calc(326.7 - 326.7 * var(--p) / 100);transition:stroke-dashoffset .5s}
.sy-ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.sy-ring-t b{display:block;font-family:var(--serif);font-size:26px;font-weight:400;line-height:1}
.sy-ring-t span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.sy-hero-stats{display:flex;flex-direction:column;gap:6px}
.sy-hero-stats span{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3)}
.sy-hero-stats b{font-family:var(--serif);font-size:17px;color:var(--ink);margin-right:3px}

/* ---- việc hôm nay ---- */
.sy-do{margin-top:24px}
.sy-do-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sy-do-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:8px}
.sy-task{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;gap:10px;align-items:center;
  border:1px solid var(--rule);background:var(--card);padding:12px;text-decoration:none;transition:border-color .15s,background .15s}
.sy-task:hover{border-color:var(--ink)}
.sy-task-n{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--rule);width:26px;height:26px;
  display:grid;place-items:center}
.sy-task-b b{display:block;font-family:var(--serif);font-size:15px;font-weight:500;line-height:1.25;color:var(--ink)}
.sy-task-b i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:3px}
.sy-task-go{font-family:var(--mono);color:var(--ink-3)}
.sy-task.done{background:var(--paper)}
.sy-task.done .sy-task-n{background:var(--accent);color:#fff;border-color:var(--accent)}
.sy-task.done .sy-task-b b{color:var(--ink-3)}

.sy-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.sy-box{border:1px solid var(--rule);background:var(--card);padding:16px}
.sy-box-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sy-mini{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--accent);text-decoration:none}
.sy-mini:hover{text-decoration:underline}
.sy-note{font-size:11.5px;line-height:1.6;color:var(--ink-3);margin:8px 0 0}
.sy-note b{color:var(--ink-2)}
.sy-btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* heatmap */
.sy-heat{display:flex;gap:6px;align-items:flex-start}
.sy-heat-days{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:7px;color:var(--ink-3);
  padding-top:0;line-height:1}
.sy-heat-days span{height:11px;display:flex;align-items:center}
.sy-heat-grid{display:flex;gap:2px;flex:1}
.sy-week{display:flex;flex-direction:column;gap:2px;flex:1}
.sy-cell{display:block;height:11px;border-radius:1px;background:var(--rule)}
.sy-cell.lv1{background:color-mix(in srgb,var(--accent) 26%,var(--paper))}
.sy-cell.lv2{background:color-mix(in srgb,var(--accent) 50%,var(--paper))}
.sy-cell.lv3{background:color-mix(in srgb,var(--accent) 74%,var(--paper))}
.sy-cell.lv4{background:var(--accent)}
.sy-cell.fut{opacity:.25}
.sy-legend{display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:7px;color:var(--ink-3)}
.sy-legend i{display:block;width:9px;height:9px;background:var(--rule);border-radius:1px}
.sy-legend i.l1{background:color-mix(in srgb,var(--accent) 26%,var(--paper))}
.sy-legend i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--paper))}
.sy-legend i.l3{background:color-mix(in srgb,var(--accent) 74%,var(--paper))}
.sy-legend i.l4{background:var(--accent)}
.sy-box-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.sy-box-f b{color:var(--ink)}

/* kpi thẻ */
.sy-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.sy-kpi>div{background:var(--paper);padding:9px 10px}
.sy-kpi b{display:block;font-family:var(--serif);font-size:23px;font-weight:400;line-height:1}
.sy-kpi span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:3px;line-height:1.3}
.sy-cfrost{height:3px;background:var(--rule);margin-top:12px}
.sy-cfrost i{display:block;height:100%;background:var(--accent)}

/* tiến độ môn */
.sy-prog{display:flex;flex-direction:column;gap:5px}
.sy-prow{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;text-decoration:none;padding:3px 0}
.sy-pname{font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy-pbar{height:5px;background:var(--rule);display:block}
.sy-pbar i{display:block;height:100%;background:var(--ink-2)}
.sy-pnum{font-family:var(--mono);font-size:8.5px;color:var(--ink-3);text-align:right}
.sy-prow:hover .sy-pname{color:var(--accent)}
.sy-prow:hover .sy-pbar i{background:var(--accent)}

.sy-notes{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.sy-note-item{background:var(--paper);padding:9px 10px;display:block;text-decoration:none}
.sy-note-item b{display:block;font-size:11.5px;color:var(--ink);font-weight:500;line-height:1.35}
.sy-note-item i{display:block;font-style:normal;font-size:10.5px;line-height:1.5;color:var(--ink-3);margin-top:2px}
.sy-note-item:hover{background:var(--card)}
.sy-plan-mini{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:3px}
.sy-plan-mini b{font-family:var(--serif);font-size:14.5px;font-weight:500}
.sy-plan-mini span{font-size:10.5px;color:var(--ink-3)}
.sy-tools{margin-top:20px}
.sy-tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px;margin-top:8px}
.sy-tool-grid a{border:1px solid var(--rule);background:var(--paper);padding:9px 11px;text-decoration:none;display:block}
.sy-tool-grid a b{display:block;font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink)}
.sy-tool-grid a span{display:block;font-size:10px;color:var(--ink-3);margin-top:2px}
.sy-tool-grid a:hover{border-color:var(--accent)}
.sy-tool-grid a:hover b{color:var(--accent)}

/* ---- flashcards ---- */
.cd-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:16px 0 14px}
.cd-top .kicker b{color:var(--ink);font-weight:600}
#cdBody{margin-bottom:20px}
.cd-card{border:1px solid var(--ink);background:var(--card);padding:18px 20px}
.cd-prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cd-bar{flex:1;height:3px;background:var(--rule)}
.cd-bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.cd-box{font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cd-face{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.cd-q{font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);line-height:1.35;color:var(--ink);margin-top:4px}
.cd-div{height:1px;background:var(--rule);margin:16px 0}
.cd-a{font-size:15px;line-height:1.7;color:var(--ink-2);margin-top:4px;white-space:pre-wrap}
.cd-show{margin-top:16px;align-self:flex-start;border:1px solid var(--ink);background:var(--paper);
  font:inherit;font-size:12.5px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cd-show:hover{background:var(--ink);color:var(--paper)}
.cd-show kbd{font-family:var(--mono);font-size:8px;border:1px solid currentColor;padding:1px 4px;opacity:.6}
.cd-grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.cd-g{border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:12px;padding:10px 6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink-2)}
.cd-g kbd{font-family:var(--mono);font-size:8px;opacity:.5}
.cd-g:hover{border-color:var(--ink);color:var(--ink)}
.cd-g.g0:hover{background:#b3402f;color:#fff;border-color:#b3402f}
.cd-g.g1:hover{background:#b98a2e;color:#fff;border-color:#b98a2e}
.cd-g.g2:hover{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
.cd-g.g3:hover{background:#33566b;color:#fff;border-color:#33566b}
.cd-done{border:1px solid var(--ink);background:var(--card);padding:22px 24px;text-align:center}
.cd-done h3{font-family:var(--serif);font-size:clamp(21px,2.6vw,28px);font-weight:400;margin:8px 0 14px}
.cd-done-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);max-width:480px;margin:0 auto}
.cd-done-grid>div{background:var(--paper);padding:10px}
.cd-done-grid b{display:block;font-family:var(--serif);font-size:22px;font-weight:400}
.cd-done-grid span{display:block;font-size:9.5px;color:var(--ink-3)}
.cd-done-btns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.cd-list-h{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.cd-list{border-top:1px solid var(--rule)}
.cd-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto 24px;gap:12px;align-items:center;
  padding:9px 2px;border-bottom:1px solid var(--rule)}
.cd-row-f{font-size:12.5px;color:var(--ink);line-height:1.45}
.cd-row-b{font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cd-row-m{font-family:var(--mono);font-size:8px;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap}
.cd-row-x{display:flex;justify-content:flex-end}

/* ---- luyện đề ---- */
.pr-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end;
  border:1px solid var(--rule);background:var(--card);padding:14px 16px;margin:16px 0}
.pr-form .st-row{margin:0}
.pr-go{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pr-body{margin:16px 0}
.pr-card{border:1px solid var(--ink);background:var(--card);padding:18px 20px}
.pr-topic{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:2px 0 8px}
.pr-hint{font-size:11.5px;color:var(--ink-3);margin:14px 0 0}
.pr-wrong{margin-top:18px;text-align:left;border-top:1px solid var(--rule);padding-top:12px}
.pr-w{display:block;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--rule)}
.pr-w b{display:block;font-size:12.5px;font-weight:500;color:var(--ink);line-height:1.45}
.pr-w i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:2px}
.pr-w:hover b{color:var(--accent)}
.pr-hist{border-top:1px solid var(--rule)}
.pr-hrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 46px;gap:10px;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--rule);font-size:11px;color:var(--ink-2)}
.pr-hrow b{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink)}
.pr-hrow i{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--ink-3)}
.pr-hrow em{font-family:var(--mono);font-size:10px;font-style:normal;text-align:right}
.pr-hrow em.good{color:#2f6b3f}.pr-hrow em.mid{color:#b98a2e}.pr-hrow em.bad{color:#b3402f}

/* ---- kế hoạch ---- */
.pl-form{border:1px solid var(--rule);background:var(--card);padding:16px;margin:16px 0}
.pl-form .st-row{margin-bottom:12px}
.pl-body{margin-top:8px}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--rule);padding-bottom:16px}
.pl-head h2{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);font-weight:400;margin:6px 0 0}
.pl-ring{--p:0;width:96px;height:96px;position:relative;flex:none}
.pl-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pl-ring circle{fill:none;stroke-width:7}
.pl-ring .sy-r-fg{stroke-dasharray:326.7;stroke-dashoffset:calc(326.7 - 326.7 * var(--p) / 100)}
.pl-ring .sy-ring-t b{font-size:21px}
.pl-days{margin-top:14px}
.pl-day{border:1px solid var(--rule);background:var(--card);margin-bottom:6px}
.pl-day>summary{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px;align-items:center;
  padding:10px 12px;cursor:pointer;list-style:none}
.pl-day>summary::-webkit-details-marker{display:none}
.pl-date{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.pl-title{font-family:var(--serif);font-size:14.5px;color:var(--ink)}
.pl-cnt{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:right}
.pl-day.today{border-color:var(--accent);border-left:3px solid var(--accent)}
.pl-day.today .pl-title{color:var(--accent)}
.pl-day.done .pl-date,.pl-day.done .pl-title{color:var(--ink-3);text-decoration:line-through}
.pl-items{padding:0 12px 10px 22px}
.pl-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;
  border-top:1px dashed var(--rule)}
.pl-check{width:17px;height:17px;border:1px solid var(--rule-2);background:var(--paper);cursor:pointer;
  font-size:10px;line-height:1;color:#fff;padding:0;display:grid;place-items:center}
.pl-item.ok .pl-check{background:var(--accent);border-color:var(--accent)}
.pl-item a{font-size:12.5px;color:var(--ink-2);text-decoration:none;line-height:1.4}
.pl-item a:hover{color:var(--accent);text-decoration:underline}
.pl-item.ok a{color:var(--ink-3);text-decoration:line-through}
.pl-kind{font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}

/* ---- tập trung ---- */
.fc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.fc-main{border:1px solid var(--rule);background:var(--card);padding:22px;display:flex;flex-direction:column;align-items:center}
.fc-modes{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.fc-mode{border:1px solid var(--rule);background:var(--paper);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  padding:6px 11px;cursor:pointer;color:var(--ink-2)}
.fc-mode:hover{border-color:var(--ink)}
.fc-mode.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fc-ring{--p:0;width:min(300px,72vw);aspect-ratio:1;position:relative}
.fc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fc-ring circle{fill:none;stroke-width:9}
.fc-bg{stroke:var(--rule)}
.fc-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:653.45;stroke-dashoffset:calc(653.45 - 653.45 * var(--p) / 100);transition:stroke-dashoffset .4s}
.fc-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.fc-t b{display:block;font-family:var(--serif);font-size:clamp(42px,7vw,60px);font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.fc-t span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.fc-btns{display:flex;gap:7px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.fc-note{text-align:center;max-width:42ch}
.fc-side{display:flex;flex-direction:column;gap:12px}
.fc-week{display:flex;gap:6px;align-items:flex-end;height:108px;margin-top:6px}
.fc-wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.fc-wbar{flex:1;width:100%;background:var(--paper);border:1px solid var(--rule);display:flex;align-items:flex-end}
.fc-wbar i{display:block;width:100%;background:var(--accent);min-height:1px}
.fc-wcol span{font-family:var(--mono);font-size:7.5px;color:var(--ink-3);white-space:nowrap}
.fc-wcol em{font-family:var(--mono);font-size:8px;font-style:normal;color:var(--ink-2)}
.fc-log{display:flex;flex-direction:column;gap:4px}
.fc-lrow{display:grid;grid-template-columns:38px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:11px}
.fc-lrow b{font-family:var(--mono);font-size:9px;color:var(--ink-3);font-weight:400}
.fc-lrow span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-lrow em{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--accent);text-align:right}

/* ---- ghi chú trong bài đọc ---- */
.sy-note-box{margin-top:30px;border:1px solid var(--rule);background:var(--card);padding:16px 17px}
.sy-nb-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sy-saved{font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:#2f6b3f;text-transform:uppercase}
.sy-note-box textarea{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:13.5px;
  line-height:1.7;padding:10px 11px;outline:none;resize:vertical;color:var(--ink)}
.sy-note-box textarea:focus{border-color:var(--accent)}
.sy-nb-f{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.sy-nb-f .sy-note{margin:0}

@media(max-width:1000px){
  .sy-hero{grid-template-columns:1fr}
  .sy-hero-r{justify-content:flex-start}
  .sy-grid2{grid-template-columns:1fr}
  .fc-wrap{grid-template-columns:1fr}
  .pr-form{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .sy-hero-r{flex-direction:row;align-items:center}
  .sy-kpi{grid-template-columns:1fr 1fr 1fr}
  .pr-form{grid-template-columns:1fr}
  .cd-row{grid-template-columns:1fr auto;gap:4px 10px}
  .cd-row-b{display:none}
  .cd-grades{grid-template-columns:1fr 1fr}
  .cd-done-grid{grid-template-columns:1fr 1fr}
  .sy-ring{width:96px;height:96px}
  .sy-ring-t b{font-size:21px}
  .pl-head{flex-direction:column;align-items:flex-start}
}
.sy-backup{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
  border:1px solid var(--rule);background:var(--card);padding:14px 16px;margin-top:14px}
.sy-bk-l{flex:1 1 320px}
.sy-bk-l p{font-size:11.5px;line-height:1.65;color:var(--ink-3);margin:6px 0 0;max-width:70ch}
.sy-bk-l code{font-family:var(--mono);font-size:10.5px;background:var(--paper);border:1px solid var(--rule);padding:1px 4px}
.sy-bk-r{display:flex;gap:6px;flex-wrap:wrap}
/* ---- CTA Học hôm nay trên trang chủ ---- */
.hero-study{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  border:1px solid var(--ink);background:var(--card);padding:15px 18px;margin:16px 0 0;text-decoration:none;
  border-left:3px solid var(--accent);transition:background .15s}
.hero-study:hover{background:var(--paper)}
.hs-l{display:block;min-width:0}
.hs-l b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink);line-height:1.2;margin-top:5px}
.hs-sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.hs-r{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hs-r em{font-family:var(--serif);font-size:26px;font-style:normal;color:var(--accent);line-height:1}
.hs-r i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.hs-r u{text-decoration:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink);
  border-bottom:1px solid var(--accent);padding-bottom:1px;margin-left:8px}
.hero-study:hover .hs-l b{color:var(--accent)}

/* ---- tiến độ tổng ---- */
.pg-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:18px 0}
.pg-k{background:var(--card);padding:13px 14px}
.pg-k b{display:block;font-family:var(--serif);font-size:clamp(21px,2.4vw,28px);font-weight:400;line-height:1;margin-top:6px}
.pg-k em{display:block;font-family:var(--mono);font-size:8.5px;font-style:normal;letter-spacing:.05em;color:var(--ink-3);margin-top:4px}
.pg-k em.up{color:#2f6b3f}
.pg-k em.down{color:#b3402f}
.pg-advice{border:1px solid var(--ink);background:var(--card);padding:15px 16px;border-left:3px solid var(--accent)}
.pg-adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:9px}
.pg-adv{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;background:var(--paper);padding:11px 12px;text-decoration:none}
.pg-adv-n{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.pg-adv-b b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3}
.pg-adv-b i{display:block;font-style:normal;font-size:10.5px;line-height:1.55;color:var(--ink-3);margin-top:3px}
.pg-adv-go{grid-column:2;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-top:2px}
.pg-adv:hover{background:var(--card)}
.pg-adv:hover .pg-adv-b b{color:var(--accent)}
.pg-bars{display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:8px}
.pg-bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.pg-bpair{flex:1;display:flex;gap:2px;align-items:flex-end;width:100%}
.pg-bwrap{flex:1;height:100%;display:flex;align-items:flex-end;background:transparent}
.pg-bwrap i{display:block;width:100%;min-height:1px}
.pg-bwrap i.cur{background:var(--accent)}
.pg-bwrap i.prev{background:color-mix(in srgb,var(--accent) 28%,var(--paper))}
.pg-bcol span{font-family:var(--mono);font-size:7.5px;color:var(--ink-3)}
.pg-bcol em{font-family:var(--mono);font-size:8px;font-style:normal;color:var(--ink-2)}
.pg-acc{display:flex;flex-direction:column;gap:6px}
.pg-arow{display:grid;grid-template-columns:104px minmax(0,1fr) 74px;gap:9px;align-items:center}
.pg-aname{font-family:var(--mono);font-size:9px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-abar{height:6px;background:var(--rule);display:block}
.pg-abar i{display:block;height:100%}
.pg-abar i.good{background:#2f6b3f}
.pg-abar i.mid{background:#b98a2e}
.pg-abar i.bad{background:#b3402f}
.pg-anum{font-family:var(--mono);font-size:8.5px;color:var(--ink-3);text-align:right}
.pg-boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.pg-bx{background:var(--paper);padding:7px 4px;text-align:center}
.pg-bx b{display:block;font-family:var(--serif);font-size:17px;font-weight:400;line-height:1}
.pg-bx span{display:block;font-family:var(--mono);font-size:7px;color:var(--ink-3);margin-top:3px}
.pg-bx i{display:block;font-size:7.5px;font-style:normal;color:var(--ink-3);margin-top:1px}
.pg-plan{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.pg-plan b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;margin-top:4px}
.pg-plan span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.pg-pbar{height:4px;background:var(--rule);margin:8px 0 6px}
.pg-pbar i{display:block;height:100%;background:var(--accent)}
@media(max-width:1000px){.pg-kpi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.pg-aname{font-size:8px}.pg-arow{grid-template-columns:78px minmax(0,1fr) 60px}.pg-boxes{grid-template-columns:repeat(4,1fr)}}

.pg-bpair{position:relative;border-bottom:1px solid var(--rule)}
.pg-bwrap i{min-height:2px}

.sy-hero-q{display:flex;flex-direction:column;gap:5px;align-items:flex-start;margin-top:14px}
.sy-hero-q .sy-note{margin:0}

/* ---- theme sang trọng bổ sung ---- */
html[data-theme="ivory"]{
  --paper:#f7f4ec; --card:#fffdf7; --card-2:#efe9dc;
  --ink:#1a1813; --ink-2:#4a453a; --ink-3:#6f6959;
  --rule:#e0d9c8; --rule-2:#c9bfa6;
  --accent:#8a6a2f; --accent-soft:#f0e6cd;
  --green:#4a6b45; --green-soft:#e6ecdd;
  --heat1:#eee8d9; --heat2:#ddd2b6; --heat3:#c2ad7f; --heat4:#8a6a2f;
}
html[data-theme="bordeaux"]{
  --paper:#f4ecea; --card:#fbf6f4; --card-2:#ece0dd;
  --ink:#1e1416; --ink-2:#503c40; --ink-3:#7a6266;
  --rule:#e2d2cf; --rule-2:#cbb0ab;
  --accent:#6f2433; --accent-soft:#f0dcdf;
  --green:#456b52; --green-soft:#e2ecdf;
  --heat1:#efe0df; --heat2:#dcc2c1; --heat3:#bd8f92; --heat4:#6f2433;
}
html[data-theme="ink"]{
  --paper:#eef1f4; --card:#f9fbfc; --card-2:#e3e9ef;
  --ink:#0f1620; --ink-2:#3b4a5c; --ink-3:#657485;
  --rule:#d3dbe3; --rule-2:#b8c4d0;
  --accent:#1d3a5c; --accent-soft:#dde6f0;
  --green:#2f6b5a; --green-soft:#dcebe5;
  --heat1:#e1e7ee; --heat2:#c2cfdf; --heat3:#8ba1bd; --heat4:#1d3a5c;
}
html[data-theme="lotus"]{
  --paper:#f6efef; --card:#fdf8f8; --card-2:#efe2e3;
  --ink:#221a1c; --ink-2:#544246; --ink-3:#7e6a6e;
  --rule:#e4d5d7; --rule-2:#cfb6b9;
  --accent:#8c4353; --accent-soft:#f4e0e4;
  --green:#4b6b55; --green-soft:#e4ecdf;
  --heat1:#efe1e2; --heat2:#ddc6c9; --heat3:#c19ba2; --heat4:#8c4353;
}
html[data-theme="graphite"]{
  --paper:#222426; --card:#2c2f32; --card-2:#35393d;
  --ink:#f3f2ef; --ink-2:#c6c4bd; --ink-3:#a3a09a;
  --rule:#3c4044; --rule-2:#51565b;
  --accent:#d9b26a; --accent-soft:#3a3325;
  --green:#8fbf9a; --green-soft:#24312a;
  --heat1:#2f3234; --heat2:#454136; --heat3:#7a6a45; --heat4:#d9b26a;
}
html[data-theme="graphite"] .toast{background:#f3f2ef;color:#222426}
html[data-theme="graphite"] .topbar{border-top-color:var(--ink)}
html[data-theme="ocean"]{
  --paper:#e9eef2; --card:#f7fafc; --card-2:#dde5eb;
  --ink:#101a1e; --ink-2:#354a52; --ink-3:#5e7480;
  --rule:#cfdae1; --rule-2:#b2c3cd;
  --accent:#1e5f6f; --accent-soft:#d5e8ec;
  --green:#2b6b5f; --green-soft:#d9eae7;
  --heat1:#dde7ec; --heat2:#bfd3dc; --heat3:#87a9b8; --heat4:#1e5f6f;
}

/* ---- thời khoá biểu ---- */
.tt-page{padding-bottom:90px}
.tt-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0 14px}
.tt-tabs{display:flex;gap:4px;flex-wrap:wrap}
.tt-tab{border:1px solid var(--rule);background:var(--card);font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  padding:6px 10px;cursor:pointer;color:var(--ink-2)}
.tt-tab:hover{border-color:var(--ink-2);color:var(--ink)}
.tt-tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tt-tab.add{font-size:12px;padding:4px 9px}
.tt-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--card);padding:0}
.tt-grid{display:grid;grid-template-columns:var(--cols);min-width:680px}
.tt-corner,.tt-dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:7px 4px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--paper)}
.tt-corner span{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tt-dh b{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink)}
.tt-dh span{font-family:var(--mono);font-size:7px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tt-dh.first{border-left:0}
.tt-sess{grid-column:1/-1;background:var(--paper);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 8px}
.tt-srow{height:0;border-bottom:0}
.tt-time{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper);
  font-family:var(--mono);font-size:9px;color:var(--ink-3);cursor:pointer;padding:8px 0}
.tt-time:hover{color:var(--accent)}
.tt-cell{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--card);
  min-height:52px;padding:5px 6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;
  align-items:flex-start;justify-content:center;transition:background .12s}
.tt-cell.empty i{font-style:normal;color:var(--rule-2);font-size:12px;margin:0 auto;opacity:0;transition:opacity .12s}
.tt-cell.empty:hover i{opacity:1;color:var(--accent)}
.tt-cell.empty:hover{background:var(--paper)}
.tt-cell.filled{background:var(--cb);border-left:3px solid var(--cd)}
.tt-cell.filled b{font-family:var(--serif);font-size:12.5px;font-weight:500;color:var(--cf);line-height:1.2}
.tt-cell.filled i{font-style:normal;font-size:8.5px;color:var(--cf);opacity:.78;line-height:1.2}
.tt-cell.filled u{text-decoration:none;font-family:var(--mono);font-size:7px;color:var(--cf);opacity:.62}
.tt-cell.filled:hover{filter:brightness(.97)}
[data-theme="graphite"] .tt-cell.filled,[data-theme="midnight"] .tt-cell.filled,
[data-theme="pixelnight"] .tt-cell.filled{filter:saturate(.92) brightness(.9)}
.tt-legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:12px}
.tt-lg{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;padding:3px 7px;border:1px solid}
.tt-settings{display:grid;grid-template-columns:2fr repeat(3,minmax(84px,1fr));gap:10px;margin-top:18px;
  border:1px solid var(--rule);background:var(--card);padding:12px 14px}
.tt-settings .st-row{margin:0}
.tt-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:12px;border-top:1px dashed var(--rule);
  font-size:10.5px;color:var(--ink-3)}
.tt-sign{font-family:var(--mono);font-size:9px}
.tt-brand{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--accent)}

/* popover sửa tiết */
.tt-pop{position:absolute;z-index:200;width:290px;background:var(--card);border:1px solid var(--ink);
  box-shadow:0 18px 44px rgba(20,18,14,.22);padding:12px}
.tt-pop-h{display:flex;align-items:center;margin-bottom:8px}
.tt-pop-h b{font-family:var(--serif);font-size:15px;font-weight:500}
.tt-pop-h .bd-x{margin-left:auto}
.tt-pf{display:block;margin-bottom:8px}
.tt-pf>span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.tt-pf input,.tt-pf select{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:12.5px;
  padding:6px 8px;outline:none;color:var(--ink)}
.tt-pf input:focus{border-color:var(--accent)}
.tt-pf2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tt-colors{display:flex;gap:4px;flex-wrap:wrap}
.tt-c{width:22px;height:22px;border:1px solid;cursor:pointer;display:grid;place-items:center;padding:0}
.tt-c i{display:block;width:7px;height:7px}
.tt-c.on{outline:2px solid var(--ink);outline-offset:1px}
.tt-pop-f{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--rule)}

/* ---- lịch ---- */
.cal-page{padding-bottom:90px}
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-arr{border:1px solid var(--rule);background:var(--card);width:26px;height:26px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.cal-arr:hover{border-color:var(--ink);color:var(--ink)}
.cal-label{font-family:var(--serif);font-size:17px;font-weight:400;margin-left:6px}
.cal-views{display:flex;gap:3px}
.cal-v{border:1px solid var(--rule);background:var(--card);font-family:var(--mono);font-size:9px;padding:5px 9px;cursor:pointer;color:var(--ink-2)}
.cal-v.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cal-grid{border:1px solid var(--rule);background:var(--card)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--rule)}
.cal-dh{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  padding:7px 6px;text-align:center;border-right:1px solid var(--rule)}
.cal-dh:last-child{border-right:0}
.cal-dh b{display:block;font-family:var(--serif);font-size:12px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0}
.cal-dh span{display:block;font-size:7.5px;margin-top:1px}
.cal-dh.today b{color:var(--accent)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-grid.week .cal-body{grid-template-columns:repeat(7,1fr);min-height:260px}
.cal-cell{min-height:92px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:4px 5px 6px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--paper)}
.cal-cell.other{background:var(--paper);opacity:.55}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-dn{font-family:var(--mono);font-size:9px;color:var(--ink-3);align-self:flex-start}
.cal-cell.today .cal-dn{color:var(--paper);background:var(--accent);padding:1px 4px}
.cal-evs{display:flex;flex-direction:column;gap:2px;flex:1}
.cal-ev{font-size:9.5px;line-height:1.3;padding:2px 4px;background:var(--cb);color:var(--cf);
  border-left:2px solid var(--cd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev i{font-style:normal;font-family:var(--mono);font-size:7.5px;opacity:.7;margin-right:3px}
.cal-ev.done{opacity:.5;text-decoration:line-through}
.cal-ev:hover{filter:brightness(.96)}
.cal-ev.big{display:block;padding:6px 7px;border-left-width:3px;white-space:normal;margin-bottom:4px}
.cal-ev.big b{display:block;font-size:11px;font-weight:500;line-height:1.35;margin-top:1px}
.cal-more{font-family:var(--mono);font-size:7.5px;color:var(--ink-3);padding-left:3px}
