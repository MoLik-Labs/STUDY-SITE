}

function t(key, lang) {
  const row = I18N[key];
  if (!row) return key;                     /* key tự hiện ra = bug nhìn thấy được */
  const L = lang || i18nLang();
  return row[L] != null ? row[L] : (row.vi != null ? row.vi : key);
}

/* Đặt ngôn ngữ, cập nhật <html lang>, lưu lại */
function setLang(lang) {
  const L = lang === 'en' ? 'en' : 'vi';
  if (!state.prefs) state.prefs = {};
  state.prefs.lang = L;
  try { document.documentElement.setAttribute('lang', L); } catch (e) { }
  save();
  if (typeof render === 'function') render();
  return L;
}

/* Dùng trong template cho gọn: tl('nav_study') */
const tl = key => t(key);


/* ---- tài khoản & đồng bộ ---- */
/* =========================================================
   TÀI KHOẢN & ĐỒNG BỘ — tuỳ chọn, không bắt buộc
   ---------------------------------------------------------
   · Chế độ khách (mặc định) chạy hoàn toàn trên máy và không tải thêm gì.
   · Đăng nhập bằng liên kết qua email hoặc Google, qua Firebase Auth.
     Firebase chỉ được tải khi cần: có phiên trước đó, đang quay về từ liên kết,
     hoặc mở mục Tài khoản trong Cài đặt.
   · Dữ liệu nằm ở users/{uid}/keys/{khoá}, mỗi khoá một tài liệu. Chỉ gửi phần đã đổi.
     Quy tắc bảo mật nằm ở firestore.rules. Trình duyệt chỉ giữ khoá web công khai.
   · Không bao giờ ghi đè dữ liệu của app đang chạy trong bộ nhớ. Thay đổi từ thiết bị
     khác được giữ trong vnl9.remote và áp dụng khi tải lại trang, TRƯỚC khi app đọc kho lưu.
   · Xung đột: khoá nào đang có sửa đổi chưa đồng bộ trên máy này thì giữ bản trên máy.
     Khi đăng nhập lần đầu, bản trên máy được sao lưu vào lịch sử trước khi lấy dữ liệu tài khoản.
   ========================================================= */
const Account = (() => {
  const SESSION_KEY = 'vnl9.session'; /* {user:{id,email}}: không có token, Firebase giữ phiên */
  const PENDING_KEY = 'vnl9.pending'; /* 'google' khi đang chờ quay về từ Google */
  const EMAIL_KEY = 'vnl9.email';     /* email đã nhận liên kết, để hoàn tất trên cùng trình duyệt */
  const BASE_KEY = 'vnl9.sync';       /* {khoá: hash bản đã đồng bộ} */
  const REMOTE_KEY = 'vnl9.remote';   /* thay đổi từ máy khác, chờ tải lại */
  const TIME_KEY = 'vnl9.synced';
  const PULL_KEY = 'vnl9.pulled';     /* mốc updatedAt đã kéo về (ISO) */
  const PULL_SLACK = 60000;           /* lùi 60 giây: hai lần ghi lệch thứ tự không bị bỏ sót */
  const SKIP = ['prefs', 'pane', 'last', 'seenWelcome']; /* trạng thái riêng từng máy */
  const BATCH = 400;                  /* Firestore: một lô tối đa 500 thao tác */
  const PUSH_DELAY = 1500;
  const PULL_EVERY = 120000;
  const ERR_KEY = 'vnl9.acct_err';    /* lỗi cần hiện sau khi tải lại trang */
  const MSG_EXPIRED = 'Liên kết đăng nhập không hợp lệ hoặc đã hết hạn. Hãy gửi lại liên kết.';
  const MSG_SAME_BROWSER = 'Hãy mở liên kết trên cùng trình duyệt đã dùng để nhận email.';
  const MSG_RECENT = 'Vì bảo mật, hãy đăng xuất, đăng nhập lại rồi xoá tài khoản ngay.';
  const CFG_URL = '/assets/config.js';   /* Worker phục vụ lúc chạy từ biến môi trường */
  const SDK_URL = '/assets/firebase-sdk.js';

  let cloudCfg = null;
  const cfgReady = import(CFG_URL).then(m => { cloudCfg = m.CLOUD || null; return cloudCfg; }, () => null);
  const enabled = () => !!(cloudCfg && cloudCfg.apiKey);
  let sdkPromise = null, sdkNow = null;
  const sdkOf = () => sdkPromise || (sdkPromise = import(SDK_URL).then(m => (sdkNow = m.createSdk(cloudCfg))));
  /* Mã lỗi Firebase → câu tiếng Việt. Chỉ gọi sau khi SDK đã tải nên sdkNow có sẵn. */
  const friendly = e => (sdkNow ? sdkNow.friendly(e && e.code) : 'Có lỗi khi kết nối. Thử lại sau.');

  /* Ghi lại hàm gốc TRƯỚC khi bọc: đây là đường ghi không đồng bộ. */
  const rawWrite = AppStore.write;

  let session = null, timer = 0, running = false, again = false, wiping = false;
  let lastError = '', syncState = 'idle', host = null, lastSig = '';

  /* ---------- lưu trữ nhỏ ---------- */
  const get = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const del = k => { try { localStorage.removeItem(k); } catch (e) {} };

  /* FNV-1a 32 bit: chỉ dùng để so sánh thay đổi, không dùng cho bảo mật. */
  function hashOf(v) {
    const s = JSON.stringify(v === undefined ? null : v);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16) + ':' + s.length;
  }

  function localState() {
    try { const g = AppStore.readSync(); return (g && g.data) || {}; } catch (e) { return {}; }
  }
  /* Chỉ đồng bộ những khoá nằm trong danh sách trắng của store.js. */
  const syncKeys = st => Object.keys(st).filter(k => SAFE_KEYS.includes(k) && !SKIP.includes(k));

  /* ---------- phiên đăng nhập ---------- */
  function loadSession() {
    const s = get(SESSION_KEY);
    session = s && s.user && /^[A-Za-z0-9_-]{1,128}$/.test(String(s.user.id || '')) ? s : null;
  }
  function setSession(u) {
    session = { user: { id: u.uid, email: u.email || '' } };
    put(SESSION_KEY, session);
  }
  function clearSession() {
    session = null;
    [SESSION_KEY, BASE_KEY, REMOTE_KEY, TIME_KEY, PULL_KEY, PENDING_KEY, EMAIL_KEY].forEach(del);
  }
  const backUrl = () => location.origin + location.pathname;
  const uidOf = () => (session && session.user ? session.user.id : '');

  /* ---------- Firebase (qua firebase-sdk.js, tải lười) ---------- */
  async function sendLink(email) {
    const sdk = await sdkOf();
    try {
      await sdk.sendEmailLink(email, backUrl());
    } catch (e) {
      throw new Error(friendly(e));
    }
    put(EMAIL_KEY, email);
  }

  async function signInGoogle() {
    put(PENDING_KEY, 'google');
    const sdk = await sdkOf();
    try {
      await sdk.startGoogle(backUrl());
    } catch (e) {
      del(PENDING_KEY);
      throw new Error(friendly(e));
    }
  }

  /* Quay về từ liên kết email hoặc Google: nhận phiên rồi tải lại trang sạch. */
  async function takeCallback() {
    const href = location.href;
    const pending = get(PENDING_KEY) === 'google';
    const sdk = await sdkOf();
    const isLink = sdk.isEmailLink(href);
    if (!isLink && !pending) return;
    del(PENDING_KEY);
    history.replaceState(null, '', location.pathname + '#/settings?s=acct');
    const fail = msg => {
      put(ERR_KEY, msg);
      location.replace(backUrl() + '#/settings?s=acct');
    };
    try {
      let user = null;
      if (isLink) {
        const email = get(EMAIL_KEY);
        if (!email) return fail(MSG_SAME_BROWSER);
        user = await sdk.completeEmailLink(email, href);
      } else {
        user = await sdk.finishRedirect();
        if (!user) return;
      }
      setSession(user);
      del(EMAIL_KEY);
      await prepareFirstSync();
      /* Tải lại có chủ đích: áp dụng dữ liệu tài khoản TRƯỚC khi app đọc kho lưu. */
      location.replace(backUrl() + '#/settings?s=acct');
    } catch (e) {
      clearSession();
      fail(MSG_EXPIRED);
    }
  }

  async function signOut() {
    try { const sdk = await sdkOf(); await sdk.signOut(); } catch (e) { /* phiên có thể đã hết */ }
    clearSession();
    lastError = '';
    setSync('idle');
    banner();
  }

  /* Xoá toàn bộ dữ liệu của tài khoản (cả Vật lí lẫn kế hoạch học), rồi xoá tài khoản.
     Firebase chỉ cho xoá tài khoản khi vừa đăng nhập; kiểm tra trước để không xoá dở dang. */
  async function deleteAccount() {
    const sdk = await sdkOf();
    if (Date.now() - sdk.lastSignInMs() > 4 * 60 * 1000) throw new Error(MSG_RECENT);
    const uid = uidOf();
    try {
      await sdk.deleteDoc('planners/' + uid);
      await sdk.deleteCollection('users/' + uid + '/keys');
      await sdk.deleteDoc('users/' + uid);
      await sdk.deleteAuthUser();
    } catch (e) {
      throw new Error(friendly(e));
    }
    clearSession();
    setSync('idle');
  }

  /* ---------- dữ liệu ---------- */
  const parseVal = s => { try { return JSON.parse(s); } catch (e) { return null; } };

  async function listKeys(uid, since) {
    const sdk = await sdkOf();
    const docs = await sdk.listDocs('users/' + uid + '/keys', since || '');
    return docs.map(d => ({ key: d.id, value: parseVal(d.data.value), updated_at: d.data.updatedAt || '' }));
  }

  /* Lần đầu trên máy này: lấy dữ liệu từ đám mây, nhưng sao lưu bản trên máy trước. */
  async function prepareFirstSync() {
    const st = localState();
    del(PULL_KEY);
    const rows = await listKeys(uidOf());
    if (!rows.length) { put(BASE_KEY, {}); return; } /* đám mây trống: đẩy hết lên sau */
    const remote = {};
    rows.forEach(r => { if (SAFE_KEYS.includes(r.key)) remote[r.key] = r.value; });
    put(REMOTE_KEY, { keys: remote, force: true, at: Date.now() });
    put(BASE_KEY, {});
    const differs = Object.keys(remote).some(k => k in st && hashOf(st[k]) !== hashOf(remote[k]));
    if (differs) { try { AppStore.backupNow(st, 'trước khi đồng bộ tài khoản'); } catch (e) {} }
  }

  /* Áp dụng thay đổi chờ sẵn. Chạy đồng bộ khi nạp script, trước khi app đọc state. */
  function applyPending() {
    const p = get(REMOTE_KEY);
    if (!p || !p.keys) return;
    const st = localState();
    const base = get(BASE_KEY) || {};
    const next = Object.assign({}, st);
    Object.keys(p.keys).forEach(k => {
      if (!SAFE_KEYS.includes(k) || SKIP.includes(k)) return;
      const remoteH = hashOf(p.keys[k]);
      const localH = k in st ? hashOf(st[k]) : null;
      const baseH = k in base ? base[k] : null;
      if (p.force || localH === baseH) {
        if (localH !== remoteH) next[k] = sanitize(p.keys[k], 0, { n: 200000 });
        base[k] = remoteH;
      }
      /* còn lại: máy này có sửa chưa đồng bộ — giữ bản trên máy, lần đẩy sau sẽ gửi đi */
    });
    try { rawWrite(next); } catch (e) { return; }
    put(BASE_KEY, base);
    del(REMOTE_KEY);
  }

  /* ---------- đồng bộ ---------- */
  function setSync(s) { syncState = s; emit(); }

  async function push() {
    if (!session || wiping) return;
    if (running) { again = true; return; } /* ghi mới trong lúc đang đẩy: chạy lại ngay khi xong */
    if (get(REMOTE_KEY)) return;           /* đang chờ tải lại: không đẩy bản cũ đè lên đám mây */
    running = true;
    setSync('syncing');
    try {
      const sdk = await sdkOf();
      const uid = uidOf();
      const st = localState();
      const base = get(BASE_KEY) || {};
      const changed = syncKeys(st).filter(k => base[k] !== hashOf(st[k]));
      for (let i = 0; i < changed.length; i += BATCH) {
        const slice = changed.slice(i, i + BATCH);
        const at = new Date().toISOString();
        await sdk.setDocs(slice.map(k => ({
          path: 'users/' + uid + '/keys/' + k,
          data: { value: JSON.stringify(st[k] === undefined ? null : st[k]), updatedAt: at },
        })));
        slice.forEach(k => { base[k] = hashOf(st[k]); });
        put(BASE_KEY, base);
      }
      put(TIME_KEY, Date.now());
      lastError = '';
      setSync('ok');
    } catch (e) {
      lastError = 'Chưa đồng bộ được. Dữ liệu vẫn an toàn trên máy này và sẽ thử lại.';
      setSync('error');
    } finally {
      running = false;
      if (again) { again = false; schedule(); }
    }
  }

  async function pull() {
    if (!session || running || wiping || get(REMOTE_KEY)) return;
    running = true;
    try {
      const mark = get(PULL_KEY);
      const since = mark ? new Date(Date.parse(mark) - PULL_SLACK).toISOString() : '';
      const rows = await listKeys(uidOf(), since);
      const remote = {};
      let newest = mark ? Date.parse(mark) : 0;
      rows.forEach(r => {
        const t = Date.parse(r.updated_at || '');
        if (t > newest) newest = t;
        if (SAFE_KEYS.includes(r.key) && !SKIP.includes(r.key)) remote[r.key] = r.value;
      });
      if (newest) put(PULL_KEY, new Date(newest).toISOString());
      const st = localState();
      const base = get(BASE_KEY) || {};
      const diff = {};
      Object.keys(remote).forEach(k => {
        const remoteH = hashOf(remote[k]);
        const localH = k in st ? hashOf(st[k]) : null;
        const baseH = k in base ? base[k] : null;
        if (localH !== remoteH && localH === baseH) diff[k] = remote[k];
      });
      if (Object.keys(diff).length) put(REMOTE_KEY, { keys: diff, force: false, at: Date.now() });
      lastError = '';
    } catch (e) {
      lastError = 'Không kiểm tra được thay đổi từ tài khoản lúc này.';
    } finally { running = false; emit(); banner(); }
  }

  /* Banner toàn trang khi có thay đổi từ máy khác: không để người dùng học
     hàng giờ trên một bản cũ mà không biết. Bấm để tải lại và áp dụng. */
  function banner() {
    let b = document.getElementById('acctBanner');
    const want = !!get(REMOTE_KEY) && !!session;
    if (!want) { if (b) b.remove(); return; }
    if (b) return;
    b = document.createElement('div');
    b.id = 'acctBanner';
    b.className = 'acct-banner';
    b.setAttribute('role', 'status');
    b.innerHTML = '<span>Có thay đổi từ thiết bị khác.</span><button class="btn sm" type="button">Tải lại để áp dụng</button>';
    b.querySelector('button').addEventListener('click', () => location.reload());
    document.body.appendChild(b);
  }

  function schedule() {
    if (!session) return;
    clearTimeout(timer);
    timer = setTimeout(() => { push(); }, PUSH_DELAY);
  }

  /* Xoá dữ liệu học của Vật lí trên đám mây, GIỮ tài khoản và hồ sơ (đặt rỗng).
     Chặn đồng bộ trong lúc xoá để không đẩy lại dữ liệu cũ. Nếu một bước lỗi thì ném lỗi,
     và người gọi không xoá dữ liệu trên máy: người dùng thử lại. */
  async function wipeCloud() {
    if (!session) return;
    wiping = true;
    try {
      clearTimeout(timer);
      /* đợi lần đẩy đang chạy kết thúc, nếu không nó sẽ ghi lại mốc cũ sau khi xoá */
      for (let i = 0; running && i < 400; i++) await new Promise(r => setTimeout(r, 25));
      const sdk = await sdkOf();
      const uid = uidOf();
      await sdk.deleteCollection('users/' + uid + '/keys');
      await sdk.setDoc('users/' + uid, { displayName: '', grade: '' }, { merge: true });
      /* đám mây giờ rỗng: mốc đồng bộ cũng rỗng, không còn gì để kéo về */
      put(BASE_KEY, {});
      del(PULL_KEY);
      del(REMOTE_KEY);
      put(TIME_KEY, Date.now());
    } finally { wiping = false; }
  }

  async function loadProfile() {
    const sdk = await sdkOf();
    const d = await sdk.getDoc('users/' + uidOf());
    return {
      display_name: (d && d.displayName) || null,
      grade: d && d.grade ? Number(d.grade) || null : null,
    };
  }

  async function saveProfile(name, grade) {
    const sdk = await sdkOf();
    await sdk.setDoc('users/' + uidOf(), {
      displayName: String(name || '').slice(0, 60),
      grade: grade ? String(grade).slice(0, 40) : '',
      updatedAt: new Date().toISOString(),
    }, { merge: true });
  }

  /* ---------- giao diện ---------- */
  function snapshot() {
    return {
      enabled: enabled(),
      signedIn: !!session,
      email: session ? session.user.email : '',
      pending: !!get(REMOTE_KEY),
      syncedAt: get(TIME_KEY) || 0,
      syncState: syncState,
      error: lastError || get(ERR_KEY) || '',
    };
  }

  const escH = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function view(s) {
    if (!s.enabled) {
      return `<p class="acct-lead">Đồng bộ đám mây chưa bật trên bản này.</p>
        <p class="muted">Bạn vẫn dùng đầy đủ mọi tính năng ở chế độ khách: dữ liệu nằm trên máy này.</p>`;
    }
    if (!s.signedIn) {
      return `<p class="acct-lead">Đăng nhập để đồng bộ giữa các thiết bị.</p>
        <p class="muted">Không bắt buộc. Chế độ khách vẫn lưu mọi thứ trên máy này. Khi đăng nhập, chỉ lưu email, tên hiển thị, lớp và dữ liệu học.</p>
        <form class="acct-form" data-acct="mail">
          <label class="acct-field">Email
            <input type="email" name="email" required autocomplete="email" maxlength="254"></label>
          <button class="btn sm" type="submit">Gửi liên kết đăng nhập</button>
        </form>
        <button class="btn ghost sm" type="button" data-acct="google">Tiếp tục với Google</button>
        <p class="muted acct-msg" data-acct-msg role="status">${escH(s.error)}</p>`;
    }
    const when = s.syncedAt ? new Date(s.syncedAt).toLocaleString('vi-VN') : 'chưa có';
    const stateTxt = { syncing: 'Đang đồng bộ…', error: 'Chưa đồng bộ được', ok: 'Đã đồng bộ', idle: 'Sẵn sàng' }[s.syncState] || 'Sẵn sàng';
    return `<p class="acct-lead">Đã đăng nhập: <b>${escH(s.email)}</b></p>
      <p class="muted">${stateTxt} · lần cuối: ${escH(when)}</p>
      <p class="muted acct-privacy">Chỉ lưu email, tên hiển thị, lớp và dữ liệu học. Không quảng cáo, không chia sẻ cho bên thứ ba.</p>
      ${s.pending ? `<div class="acct-pending"><span>Có thay đổi từ thiết bị khác.</span>
        <button class="btn sm" type="button" data-acct="reload">Tải lại để áp dụng</button></div>` : ''}
      <div class="acct-row">
        <button class="btn sm" type="button" data-acct="sync">Đồng bộ ngay</button>
        <button class="btn ghost sm" type="button" data-acct="out">Đăng xuất</button>
      </div>
      <form class="acct-form acct-profile" data-acct="profile">
        <label class="acct-field">Tên hiển thị
          <input name="name" maxlength="60" autocomplete="nickname" data-acct-name></label>
        <label class="acct-field">Lớp
          <select name="grade" data-acct-grade>
            <option value="">Chưa chọn</option>
            ${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">Lớp ${i + 1}</option>`).join('')}
          </select></label>
        <button class="btn ghost sm" type="submit">Lưu hồ sơ</button>
      </form>
      <div class="acct-danger">
        <span>Xoá tài khoản sẽ xoá dữ liệu trên máy chủ. Dữ liệu trên máy này vẫn còn.</span>
        <button class="btn ghost sm" type="button" data-acct="delete">Xoá tài khoản trên máy chủ</button>
      </div>
      <p class="muted acct-msg" data-acct-msg role="status">${escH(s.error)}</p>`;
  }

  function say(text) {
    const m = host && host.querySelector('[data-acct-msg]');
    if (m) m.textContent = text;
  }

  function bind(el) {
    el.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-acct]');
      if (!b) return;
      const what = b.dataset.acct;
      try {
        if (what === 'google') { say('Đang chuyển sang Google…'); await signInGoogle(); }
        if (what === 'sync') { await push(); say(syncState === 'error' ? lastError : 'Đã đồng bộ.'); }
        if (what === 'reload') { location.reload(); }
        if (what === 'out') { await signOut(); }
        if (what === 'delete') {
          uiConfirm('Xoá tài khoản', 'Xoá tài khoản và toàn bộ dữ liệu trên máy chủ? Dữ liệu trên máy này vẫn còn.',
            async () => {
              try { await deleteAccount(); render(true); }
              catch (e) { say(e && e.message ? e.message : 'Không xoá được tài khoản lúc này. Thử lại sau.'); }
            }, { danger: true, okText: 'Xoá tài khoản' });
          return;
        }
      } catch (e) {
        say(e && e.message ? e.message : 'Có lỗi, thử lại sau.');
      }
      if (what === 'out') render(true);
    });

    el.addEventListener('submit', async ev => {
      ev.preventDefault();
      const f = ev.target;
      try {
        if (f.dataset.acct === 'mail') {
          const email = f.elements.email.value.trim();
          say('Đang gửi…');
          await sendLink(email);
          say('Đã gửi liên kết. Mở email và bấm vào liên kết để đăng nhập.');
        }
        if (f.dataset.acct === 'profile') {
          await saveProfile(f.elements.name.value.trim(), f.elements.grade.value);
          say('Đã lưu hồ sơ.');
        }
      } catch (e) {
        say(e && e.message ? e.message : 'Không gửi được. Kiểm tra kết nối rồi thử lại.');
      }
    });
  }

  function render(force) {
    if (!host || !host.isConnected) return;
    const s = snapshot();
    const sig = JSON.stringify(Object.assign({}, s, { syncedAt: 0 }));
    if (!force && sig === lastSig) return;
    lastSig = sig;
    host.innerHTML = view(s);
    if (s.signedIn && enabled()) {
      loadProfile().then(p => {
        const n = host.querySelector('[data-acct-name]');
        const g = host.querySelector('[data-acct-grade]');
        if (n) n.value = p.display_name || '';
        if (g) g.value = p.grade ? String(p.grade) : '';
      }).catch(() => {});
    }
  }

  function emit() {
    if (host && host.isConnected) render(false);
  }

  function mount(el) {
    if (!el) return;
    host = el;
    bind(el);
    render(true);
    del(ERR_KEY);
  }


  /* ---------- khởi động ---------- */
  /* Bọc đường ghi: mỗi lần app lưu thì lên lịch đẩy (chỉ khi đã đăng nhập). */
  AppStore.write = function (state, opts) {
    const ok = rawWrite(state, opts);
    schedule();
    return ok;
  };

  loadSession();
  applyPending();
  if (get(ERR_KEY) && !location.hash.startsWith('#/settings')) del(ERR_KEY);

  /* Khách không có gì để đồng bộ: không tải Firebase, không gọi mạng. */
  const cloudWanted = () => new URLSearchParams(location.search).has('oobCode')
    || !!get(PENDING_KEY) || !!session || location.hash.startsWith('#/settings');
  cfgReady.then(() => {
    if (!enabled()) return;
    document.addEventListener('DOMContentLoaded', banner);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
    setInterval(() => { if (!document.hidden) pull(); }, PULL_EVERY);
    if (!cloudWanted()) return;
    (async () => {
      try {
        await takeCallback();
        if (session) {
          const sdk = await sdkOf();
          const u = await sdk.authReady();
          if (u) setSession(u); else clearSession();
          if (session) setTimeout(pull, 1500);
        }
      } catch (e) {
        clearSession();
      }
      emit();
      banner();
    })();
  });

  return {
    mount, snapshot,
    enabled: () => enabled(),
    signedIn: () => !!session,
    wipeCloud,
  };
})();

   SEARCH
========================================================= */
function searchAll(q){
  const k=toks(q); if(!k.length) return [];
  const hit=(txt)=>{const t=norm(txt);return k.every(w=>t.includes(w));};
  const score=(txt)=>{const t=norm(txt);let s=0;k.forEach(w=>{if(t.includes(w))s++;});return s;};
  const out=[];
  DAYS.forEach(d=>d.sessions.forEach(s=>{
    if(hit(s.title+' '+s.obj+' '+d.title)) out.push({g:'Bài học',t:s.title,d:`Ngày ${String(d.n).padStart(2,'0')} · Ca ${s.n}`,href:sessionHref(d.n,s.n),sc:score(s.title+' '+s.obj)*2});
  }));
  Object.entries(LIB).forEach(([id,v])=>{
    if(hit(v.t+' '+(WHO[v.who]||''))) out.push({g:'Bài giảng',t:v.t,d:v.d,href:'#/vid/'+id,sc:score(v.t)});
  });
  QA.forEach((x,i)=>{
    if(hit(x.q+' '+x.k)) out.push({g:'Hỏi đáp',t:x.q,d:'',href:'#/qa?q='+encodeURIComponent(x.q),sc:score(x.q)*1.5});
  });
  NOTES.forEach(n=>n.rows.forEach(([a,b])=>{
    if(hit(a+' '+b.replace(/<[^>]+>/g,' '))) out.push({g:'Công thức',t:a,d:b.replace(/<[^>]+>/g,''),href:'#/notes?q='+encodeURIComponent(a),sc:score(a)});
  }));
  return out.sort((a,b)=>b.sc-a.sc).slice(0,14);
}

/* =========================================================
   Q&A ENGINE
========================================================= */
const QA_IDX=QA.map(x=>({x,set:new Set(norm(x.q+' '+x.k).split(' '))}));
const QA_DF=(()=>{const d={};QA_IDX.forEach(o=>o.set.forEach(w=>d[w]=(d[w]||0)+1));return d;})();

function askQA(query, topic){
  const raw=toks(query);
  if(!raw.length) return [];
  // bỏ những từ quá phổ biến (xuất hiện ở >22% câu) để tránh khớp rác
  const rare=raw.filter(w=>!QA_DF[w]||QA_DF[w]<=QA.length*0.22);
  const use=rare.length?rare:raw;
  const qn=norm(query);
  const scored=QA_IDX.map(o=>{
    let hit=0;
    use.forEach(w=>{ if(o.set.has(w)) hit++; });
    const frac=hit/use.length;
    if(!hit) return {x:o.x,s:-1};
    let s=frac*10+hit*0.4;
    if(topic&&o.x.t===topic) s+=0.9;
    if(qn.length>3&&norm(o.x.q).includes(qn)) s+=6;
    return {x:o.x,s,frac};
  }).filter(o=>o.s>=0&&o.frac>=0.5).sort((a,b)=>b.s-a.s);
  return scored.slice(0,3).map(o=>o.x);
}

/* Khám phá — popup trên thanh trên.
   Trước đây mỗi lần đổi trang lại gắn thêm một listener 'click' vào document
   mà không bao giờ gỡ, nên sau N trang có N listener chạy mãi. Giờ chỉ gắn
   một lần; phần tử được thay bằng innerHTML nên gắn lại cũng vô hại. */
let explMenuOff = null;
function bindExploreMenu() {
  const mb = $('#tbMoreBtn'), mm = $('#tbMenu');
  if (!mb || !mm) return;
  const setOpen = on => {
    mm.classList.toggle('on', on);
    mb.setAttribute('aria-expanded', String(on));
  };
  const isOpen = () => mm.classList.contains('on');
  if (explMenuOff) explMenuOff();
  mb.onclick = e => { e.stopPropagation(); setOpen(!isOpen()); };
  const onDoc = ev => { if (isOpen() && !mm.contains(ev.target) && ev.target !== mb) setOpen(false); };
  const onKey = ev => {
    if (ev.key === 'Escape' && isOpen()) { setOpen(false); mb.focus(); }
  };
  document.addEventListener('click', onDoc);
  document.addEventListener('keydown', onKey);
  explMenuOff = () => {
    document.removeEventListener('click', onDoc);
    document.removeEventListener('keydown', onKey);
    explMenuOff = null;
  };
  /* Chọn một mục thì ĐI TỚI ĐÓ rồi mới đóng.
     Bản cũ chỉ đóng menu: handler đóng được gán sau handler điều hướng nên ghi
     đè nó, và vì <a> không có href nên trình duyệt cũng không tự chuyển trang.
     Kết quả: bấm mục nào cũng chỉ làm menu biến mất — không đi đâu cả. */
  $$('#tbMenu [data-nav]').forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      setOpen(false);
      closeRail();
      go(a.dataset.nav);
    };
    a.onkeydown = ev => {
      const rows = $$('#tbMenu [data-nav]');
      const i = rows.indexOf(a);
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const next = ev.key === 'ArrowDown' ? (i + 1) % rows.length : (i - 1 + rows.length) % rows.length;
        rows[next].focus();
      } else if (ev.key === 'Home') { ev.preventDefault(); rows[0].focus(); }
      else if (ev.key === 'End') { ev.preventDefault(); rows[rows.length - 1].focus(); }
    };
  });
}

  const h=(location.hash||'#/').split('?')[0];

      </div>
      <div class="sim-grid">
        <div class="sim-canvas"><svg id="lensSvg" viewBox="0 0 640 250" role="img" aria-label="Sơ đồ dựng ảnh qua thấu kính hội tụ"></svg></div>
        <div class="sim-ctrl">
          <label class="sim-row"><span>Tiêu cự f</span><b id="fVal">10 cm</b>
            <input type="range" id="fRange" min="5" max="25" step="1" value="10"></label>

          <div class="sim-legend">
            <span><i style="background:var(--accent)"></i>vật</span>

        </div>
      </div>

  const draw=()=>{
    const f=+$('#fRange').value, d=+$('#dRange').value;
    $('#fVal').textContent=f+' cm'; $('#dVal').textContent=d+' cm';
    const S=3.1, AX=132, LX=320, H=44;
    const xO=LX-d*S;
    const atFocus=Math.abs(d-f)<0.4;
    const dp=atFocus?null:d*f/(d-f);
    const real=dp!==null&&dp>0;
    const xi=dp===null?null:LX+dp*S;
    // ảnh thật thì ngược chiều (nằm dưới trục), ảnh ảo thì cùng chiều (nằm trên)
    const hiRaw=dp===null?0:-(H*dp/d);
    const hi=Math.max(-104,Math.min(104,hiRaw));
    const inFrame=xi!==null&&xi>8&&xi<632;
    const cx=xi===null?null:Math.max(16,Math.min(624,xi));
    const yTip=dp===null?null:AX-hi;
    const F1=LX-f*S, F2=LX+f*S;

    let rays='';
    // tia tới song song trục chính
    rays+=`<path d="M${xO} ${AX-H} H${LX}" class="ray"/>`;
    // tia tới qua quang tâm
    rays+=`<path d="M${xO} ${AX-H} L${LX} ${AX}" class="ray"/>`;

    if(dp!==null){
      if(real){
        rays+=`<path d="M${LX} ${AX-H} L${cx} ${yTip}" class="ray"/>`;
        rays+=`<path d="M${LX} ${AX} L${cx} ${yTip}" class="ray"/>`;
        // kéo dài qua ảnh một đoạn ngắn
        const dx=cx-LX, dy=yTip-(AX-H);
        rays+=`<path d="M${cx} ${yTip} L${Math.min(628,cx+26)} ${yTip+dy*26/Math.max(dx,1)}" class="ray" opacity=".45"/>`;
      }else{
        const m1=H/(f*S);
        rays+=`<path d="M${LX} ${AX-H} L${628} ${(AX-H)+m1*(628-LX)}" class="ray"/>`;
        const m2=H/(d*S);
        rays+=`<path d="M${LX} ${AX} L${628} ${AX+m2*(628-LX)}" class="ray"/>`;
        rays+=`<path d="M${LX} ${AX-H} L${cx} ${yTip}" class="ray dash"/>`;
        rays+=`<path d="M${LX} ${AX} L${cx} ${yTip}" class="ray dash"/>`;
      }
    }else{
      // vật tại tiêu điểm: tia ló song song
      rays+=`<path d="M${LX} ${AX-H} L${628} ${AX-H}" class="ray"/>`;
      rays+=`<path d="M${LX} ${AX} L${628} ${AX-(AX-H)/Math.max(1,(LX-xO))*(628-LX)}" class="ray" opacity=".5"/>`;
    }

    $('#lensSvg').innerHTML=`
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#8b2e22"/>
        </marker>
        <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#17150f"/>
        </marker>
      </defs>
      <line x1="12" y1="${AX}" x2="628" y2="${AX}" class="axis"/>
      <line x1="${LX}" y1="18" x2="${LX}" y2="246" class="lens"/>
      <path d="M${LX-7} 30 L${LX} 18 L${LX+7} 30" class="lenscap"/>
      <path d="M${LX-7} 234 L${LX} 246 L${LX+7} 234" class="lenscap"/>
      <circle cx="${F1}" cy="${AX}" r="2.6" class="fdot"/><circle cx="${F2}" cy="${AX}" r="2.6" class="fdot"/>
      <text x="${F1-4}" y="${AX+18}" class="flab">F</text>
      <text x="${F2-4}" y="${AX+18}" class="flab">F′</text>
      <text x="${LX+8}" y="${AX-9}" class="flab">O</text>
      <line x1="${xO}" y1="${AX}" x2="${xO}" y2="${AX-H}" class="obj" marker-end="url(#ar)"/>
      <text x="${xO-4}" y="${AX-H-8}" class="oblab">AB</text>
      ${rays}
      ${dp!==null&&inFrame?`<line x1="${cx}" y1="${AX}" x2="${cx}" y2="${yTip}" class="${real?'img':'img virt'}" marker-end="url(#ab)"/>
      <text x="${cx-8}" y="${yTip+(yTip<AX?-8:16)}" class="oblab">A′B′</text>`:''}
      <text x="16" y="242" class="small">d = ${d} cm · f = ${f} cm</text>
      <text x="466" y="242" class="small">${dp===null?'d = f → chùm ló song song':`d′ = ${dp.toFixed(1)} cm`}</text>`;

    const out=$('#lensOut');
    if(dp===null){ out.innerHTML='<b>Vật đặt đúng tiêu điểm.</b> Các tia ló song song với nhau, không tạo ảnh rõ trên màn.'; return; }
    const k=Math.abs(dp/d);
    const kind=real?'Ảnh thật, ngược chiều':'Ảnh ảo, cùng chiều';
    const size=k>1.02?'lớn hơn vật':(k<0.98?'nhỏ hơn vật':'bằng vật');
    const zone=real&&d>2*f?'Vật ngoài 2F ⇒ ảnh trong khoảng F′–2F′.':(real&&d<2*f?'Vật trong khoảng F–2F ⇒ ảnh ngoài 2F′.':'');
    out.innerHTML=`<b>${kind}, ${size}.</b> d′ = ${dp.toFixed(1)} cm · |k| = ${k.toFixed(2)}.
      <span style="display:block;color:var(--ink-3);margin-top:4px">${real?'Hứng được trên màn, khác phía vật.':'Không hứng được trên màn, cùng phía với vật.'} ${zone}</span>`;
  };
  $('#fRange').oninput=draw; $('#dRange').oninput=draw; draw();
}

/* ---------- question engine ---------- */
const QS=QUIZ.map((q,i)=>Object.assign({id:i},q));
const qType=q=>q.type||'mcq';

/* ---------- chấm câu điền số: dung sai tương đối + kiểm tra đơn vị ---------- */
const UNIT_ALIAS={'ω':'Ω','ohm':'Ω','ôôm':'Ω','vôn':'V','ampe':'A','watt':'W','jun':'J','niuton':'N',
  'gam':'g','kilogam':'kg','giây':'s','phút':'min','giờ':'h','độ':'°C','do':'°C','c':'°C','oc':'°C'};
const unitNorm=u=>{
  let x=norm(u).replace(/\s+/g,'');
  x=x.replace(/m3/g,'m³').replace(/cm3/g,'cm³').replace(/dm3/g,'dm³').replace(/mm2/g,'mm²').replace(/cm2/g,'cm²');
  return UNIT_ALIAS[x]||x;
};
const unitOf=q=>unitNorm(q.unit||'');
function parseNum(str){
  const raw=String(str||'').replace(',','.').replace(/−/g,'-').trim();
  const m=raw.match(/^([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s*([^\d.\s].*)?$/);
  if(!m) return {v:NaN,unit:''};
  return {v:parseFloat(m[1]),unit:m[2]||''};
}
const numTol=q=>Math.max(q.tol||0,Math.abs(q.a)*0.005);
const numOK=(q,p)=>{
  if(typeof p!=='number'||!isFinite(p)) return false;
  const d=Math.abs(p-q.a);
  if(d<=numTol(q)) return true;
  /* chấp nhận làm tròn khác số chữ số có nghĩa: so ở mức 3 chữ số */
  const sig=v=>{const s=Math.abs(v).toPrecision(3);return parseFloat(s);};
  return sig(p)===sig(q.a)&&Math.abs(q.a)>0;
};
const MULTI={};

function isCorrect(q,p){
  const t=qType(q);
  if(t==='multi') return Array.isArray(p)&&p.length===q.a.length&&q.a.every(x=>p.includes(x));
  if(t==='tf') return p===q.a;
  if(t==='num') return numOK(q,p);
  if(t==='order') return Array.isArray(p)&&p.length===q.s.length&&p.every((v,i)=>v===i);
  return p===q.a;
}
function recordAns(id,ok,p){
  if(typeof srsRecord==='function') return srsRecord(id,ok,p);
  state.ans[id]={ok:ok,p:p,at:Date.now()};
  activity(1); save();
}
function quizFor(dn,sn,d){
  const t=TOPIC_OF_DAY(d);
  const bank=QS.filter(q=>q.t===t);
  if(!bank.length) return [];
  const start=(dn*3+sn)%bank.length;
  const out=[];
  for(let i=0;i<Math.min(3,bank.length);i++) out.push(bank[(start+i)%bank.length]);
  return out;
}
const TYPE_LABEL={mcq:'Trắc nghiệm',multi:'Nhiều đáp án',tf:'Đúng / Sai',num:'Điền số',order:'Sắp xếp bước',pick:'Chọn hình'};
const ORD={},PICK={},ordSeen={};

function renderQuestion(host,q,opt){
  opt=opt||{};
  const t=qType(q);
  const exam=!!opt.exam;
  const revealed=!exam&&!!opt.revealed;
  const picked=exam?(opt.picks?opt.picks[q.id]:opt.picked):opt.picked;
  const ok=revealed?isCorrect(q,picked):null;
  let body='';

  if(t==='mcq'||t==='multi'){
    const sel=t==='multi'?(Array.isArray(picked)?picked:(MULTI[q.id]||[])):picked;
    body='<div class="opts">'+q.o.map((o,i)=>{
      const on=t==='multi'?sel.includes(i):sel===i;
      let cls='opt'+(on?' pick':'');
      if(revealed){
        const isAns=t==='multi'?q.a.includes(i):i===q.a;
        if(isAns) cls+=' right';
        if(on&&!isAns) cls+=' wrong';
      }
      return `<button class="${cls}" data-o="${i}" ${revealed?'disabled':''}>
        <span class="oi">${t==='multi'?'<span class="mbox'+(on?' on':'')+'"></span>':'ABCD'[i]}</span>
        <span class="ot">${o}</span></button>`;
    }).join('')+'</div>';
    if(t==='multi'&&!revealed&&!exam){
      body+=`<div class="qfoot"><span class="qscore">Chọn tất cả đáp án đúng rồi bấm kiểm tra</span><button class="btn sm" data-check="1">Kiểm tra</button></div>`;
    }
  }else if(t==='tf'){
    const cls=(v)=>{let c='opt tfb';if(revealed){ if(q.a===v)c+=' right'; else if(picked===v)c+=' wrong'; }else if(picked===v)c+=' pick';return c;};
    body=`<div class="tfrow">
      <button class="${cls(true)}" data-tf="1" ${revealed?'disabled':''}>Đúng</button>
      <button class="${cls(false)}" data-tf="0" ${revealed?'disabled':''}>Sai</button>
    </div>`;
  }else if(t==='order'){
    if(!ORD[q.id]) ORD[q.id]=shuffleIdx(q.s.map((_,i)=>i));
    const cur=picked&&Array.isArray(picked)?picked.slice():ORD[q.id].slice();
    body=`<div class="ordlist">`+cur.map((oi,pos)=>{
      let cls='ord-row';
      if(revealed) cls+=oi===pos?' right':' wrong';
      return `<div class="${cls}" draggable="${revealed?'false':'true'}" data-pos="${pos}">
        <span class="ord-n">${pos+1}</span><span class="ord-t">${q.s[oi]}</span>
        ${revealed?'':`<span class="ord-mv"><button data-up="${pos}" aria-label="Lên">↑</button><button data-dn="${pos}" aria-label="Xuống">↓</button></span>`}
      </div>`;
    }).join('')+`</div>`;
    if(!revealed) body+=`<div class="qfoot"><span class="qscore">Kéo thả hoặc dùng mũi tên để xếp đúng thứ tự</span><button class="btn sm" data-check="1">Kiểm tra</button></div>`;
  }else if(t==='pick'){
    if(PICK[q.id]===undefined&&!picked) PICK[q.id]=null;
    const sel=(picked!==undefined&&picked!==null)?picked:PICK[q.id];
    body=`<div class="pickgrid">`+q.tiles.map((svg,i)=>{
      let cls='picktile'+(sel===i?' on':'');
      if(revealed) cls+=i===q.a?' right':(sel===i?' wrong':'');
      return `<button class="${cls}" data-i="${i}" draggable="${revealed?'false':'true'}" aria-pressed="${sel===i}">${svg}<span class="picklbl">${'ABCD'[i]}</span></button>`;
    }).join('')+`</div>`;
    if(!revealed) body+=`<div class="qfoot"><span class="qscore">Chọn hoặc kéo hình đúng vào khung bên dưới</span><button class="btn sm" data-check="1">Kiểm tra</button></div><div class="pickslot" id="pickSlot">Kéo hình đúng vào đây</div>`;
  }else{
    body=`<div class="numrow">
      <span class="numbox"><input class="numin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Nhập số" title="Gõ số, hoặc số kèm đơn vị (ví dụ 12${q.unit?' '+q.unit:''})" value="${picked===undefined||picked===null?'':picked}" ${revealed?'disabled':''}><span class="unit">${q.unit||''}</span></span>
      ${revealed?'':'<button class="btn sm" data-check="1">Kiểm tra</button>'}
    </div><div class="uunit"></div>`;
  }

  let fb='';
  if(revealed){
    const right=t==='multi'?q.a.map(i=>'ABCD'[i]).join(', '):(t==='num'?q.a+(q.unit?' '+q.unit:'')+(numTol(q)>0?` <span class="tol">(nhận sai số ±${Math.round(numTol(q)*1000)/1000}${q.unit?' '+q.unit:''})</span>`:''):(t==='tf'?(q.a?'Đúng':'Sai'):(t==='pick'?'Hình '+'ABCD'[q.a]:(t==='order'?'Thứ tự đúng là các bước 1 → '+q.s.length:'ABCD'[q.a]))));
    fb=`<div class="exp${ok?'':' bad'}"><b>${ok?'Đúng.':'Chưa đúng — đáp án '+right+'.'}</b> ${q.e||''}</div>`;
  }

  host.innerHTML=`<div class="qcard">
    <div class="qtop"><span class="qtype">${TYPE_LABEL[t]}</span><span class="qtopic">${topicName(q.t)}</span></div>
    <div class="qst">${q.q}</div>
    ${body}${fb}
  </div>`;

  const finish=(p)=>{
    if(exam){ opt.picks[q.id]=p; if(opt.onPick) opt.onPick(q.id,p); renderQuestion(host,q,opt); return; }
    const good=isCorrect(q,p);
    recordAns(q.id,good,p);
    opt.picked=p; opt.revealed=true;
    renderQuestion(host,q,opt);
    if(opt.onAnswer) opt.onAnswer(good);
  };

  if(t==='multi'&&!revealed&&!exam){
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o; const cur=MULTI[q.id]||[];
      MULTI[q.id]=cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i);
      renderQuestion(host,q,opt);
    });
    const c=$('[data-check]',host); if(c) c.onclick=()=>finish(MULTI[q.id]||[]);
  }else if(t==='multi'&&exam){
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o; const cur=(opt.picks[q.id]||[]);
      finish(cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i));
    });
  }else if(t==='mcq'){
    $$('.opt',host).forEach(b=>b.onclick=()=>finish(+b.dataset.o));
  }else if(t==='tf'){
    $$('[data-tf]',host).forEach(b=>b.onclick=()=>finish(b.dataset.tf==='1'));
  }else if(t==='order'){
    const cur=(picked&&Array.isArray(picked)?picked.slice():ORD[q.id].slice());
    const move=(from,to)=>{
      if(to<0||to>=cur.length) return;
      const a=cur.slice(); const [x]=a.splice(from,1); a.splice(to,0,x);
      ORD[q.id]=a; renderQuestion(host,q,Object.assign({},opt,{picked:undefined,revealed:false}));
    };
    $$('.ord-row',host).forEach(r=>{
      r.ondragstart=e=>{ e.dataTransfer.setData('text/plain',r.dataset.pos); r.classList.add('drag'); };
      r.ondragend=()=>r.classList.remove('drag');
      r.ondragover=e=>e.preventDefault();
      r.ondrop=e=>{ e.preventDefault(); const from=+e.dataTransfer.getData('text/plain'); move(from,+r.dataset.pos); };
    });
    $$('.ord-mv button',host).forEach(b=>b.onclick=()=>{
      const p=+ (b.dataset.up!==undefined?b.dataset.up:b.dataset.dn);
      move(p, b.dataset.up!==undefined?p-1:p+1);
    });
    const c=$('[data-check]',host); if(c) c.onclick=()=>finish(cur);
  }else if(t==='pick'){
    const choose=i=>{ PICK[q.id]=i; renderQuestion(host,q,Object.assign({},opt,{picked:undefined,revealed:false})); };
    $$('.picktile',host).forEach(b=>{
      b.onclick=()=>{ if(exam){ finish(+b.dataset.i); } else choose(+b.dataset.i); };
      b.ondragstart=e=>{ e.dataTransfer.setData('text/plain','pick:'+b.dataset.i); };
    });
    const ps=$('#pickSlot',host);
    if(ps){
      ps.ondragover=e=>{ e.preventDefault(); ps.classList.add('hot'); };
      ps.ondragleave=()=>ps.classList.remove('hot');
      ps.ondrop=e=>{
        e.preventDefault(); ps.classList.remove('hot');
        const raw=e.dataTransfer.getData('text/plain')||'';
        const i=+raw.replace('pick:','');
        if(!isNaN(i)){ PICK[q.id]=i; const c2=$('[data-check]',host); c2&&c2.click(); }
      };
    }
    const c=$('[data-check]',host); if(c) c.onclick=()=>{ if(PICK[q.id]===null||PICK[q.id]===undefined) return; finish(PICK[q.id]); };
  }else if(t==='num'){
    const inp=$('.numin',host);
    const read=()=>{
      const {v,unit}=parseNum(inp.value);
      if(!isFinite(v)) return {v:NaN,unit};
      if(unit&&q.unit&&unitNorm(unit)!==unitOf(q)) return {v,unit,mismatch:true};
      if(unit&&!q.unit) return {v,unit};
      return {v,unit};
    };
    const warn=(msg)=>{
      inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400);
      const w=$('.uunit',host); if(w){ w.textContent=msg; w.style.display='block'; }
      toast(msg); inp.focus();
    };
    if(inp){
      inp.onchange=()=>{
        if(!exam) return;
        const r=read();
        if(r.mismatch){ warn('Sai đơn vị — đáp án cần '+q.unit); return; }
        finish(isFinite(r.v)?r.v:null);
      };
      inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();const b=$('[data-check]',host);b&&b.click();} };
      inp.oninput=()=>{ const w=$('.uunit',host); if(w) w.style.display='none'; };
    }
    const c=$('[data-check]',host);
    if(c) c.onclick=()=>{
      const r=read();
      if(!isFinite(r.v)){ warn('Chưa có số. Gõ ví dụ: 12 hoặc 12 '+(q.unit||'')); return; }
      if(r.mismatch){ warn('Số đúng hướng rồi, nhưng đơn vị phải là '+q.unit+'.'); return; }
      finish(r.v);
    };
  }
}

const topicName=id=>{const t=TOPICS.find(x=>x.id===id);return t?'Chủ đề '+t.id:'Tổng hợp';};
function shuffleIdx(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderQuizPane(host,d,s,qs){
  if(!qs.length){host.innerHTML='<p style="color:var(--ink-3)">Chưa có câu hỏi cho chủ đề này.</p>';return;}
  let idx=0;
  const draw=()=>{
    const q=qs[idx];
    const a=ansOf(q.id);
    host.innerHTML=`
      <div class="quiz">
        <div class="qmeta">
          <span class="kicker">Câu ${idx+1} / ${qs.length}</span>
          <span class="qdots">${qs.map((x,i)=>{
            const p=ansOf(x.id);
            const c=i===idx?'cur':(p?(p.ok?'ok':'no'):'');
            return `<i class="${c}"></i>`;
          }).join('')}</span>
        </div>
        <div id="qslot"></div>
        <div class="qfoot">
          <span class="qscore">${qs.filter(x=>!!ansOf(x.id)).length} / ${qs.length} câu đã trả lời · đúng ${qs.filter(x=>{const a=ansOf(x.id);return a&&a.ok;}).length}</span>
          <span style="display:flex;gap:8px">
            ${idx>0?'<button class="btn ghost sm" id="prevQ">← Câu trước</button>':''}
            ${idx<qs.length-1?'<button class="btn ghost sm" id="nextQ">Câu tiếp →</button>':''}
            <button class="btn sm" id="againQ">Làm lại</button>
          </span>
        </div>
      </div>`;
    renderQuestion($('#qslot'),q,{picked:a?a.p:undefined,revealed:!!a,onAnswer:()=>{draw();}});
    const n=$('#nextQ'),p=$('#prevQ'),ag=$('#againQ');
    if(n) n.onclick=()=>{idx=Math.min(qs.length-1,idx+1);draw();};
    if(p) p.onclick=()=>{idx=Math.max(0,idx-1);draw();};
    if(ag) ag.onclick=()=>{qs.forEach(x=>delete state.ans[x.id]);save();idx=0;draw();};
  };
  draw();
}

function qaItemHTML(x,topic){
  const rel=Object.entries(LIB).filter(([id,v])=>v.topic===x.t&&v.pick).slice(0,2);

  </div>`;
}

const TOPIC_OF_DAY=d=>{
  const m=String(d.theme).match(/Chủ đề\s+(\d+)/);
  return m?+m[1]:12;
};

   RENDER — LIBRARY
========================================================= */
let libFilter={scope:'all',teacher:'all',q:''};
function renderLibrary(){
  /* The search box wrote to this variable, so it has to be mutable. It was
     `const`, and every keystroke threw "Assignment to constant variable" — the
     library search was dead, with no visible error beyond the box not
     filtering. Keep it in libFilter so the text survives a re-render. */
  let q=libFilter.q;
  const counts={};
  Object.values(LIB).forEach(v=>counts[v.topic]=(counts[v.topic]||0)+1);
  $('#main').innerHTML=`
    <section class="wrap wide">
      <div class="page-head">
        <span class="kicker">Thư viện · ${VID_COUNT} bài giảng đã kiểm chứng</span>
        <h1 style="margin-top:8px">Toàn bộ bài giảng</h1>
        <p>Bấm vào một dòng để phát ngay trong trang. Bài đánh dấu <b>chọn</b> là bài nên xem trước.</p>
      </div>
      <div class="filters">
        <button class="chip" data-scope="all" aria-pressed="${libFilter.scope==='all'}">Tất cả</button>
        <button class="chip" data-scope="pick" aria-pressed="${libFilter.scope==='pick'}">Bài chọn</button>
        <button class="chip" data-scope="vna" aria-pressed="${libFilter.scope==='vna'}">Thầy VNA</button>
        <button class="chip" data-scope="seen" aria-pressed="${libFilter.scope==='seen'}">Đã xem</button>
        <span class="sep"></span>
        <input id="libq" value="${esc(q)}" placeholder="Tìm bài giảng…" style="border:1px solid var(--rule);background:var(--card);padding:6px 10px;font:inherit;font-size:12.5px;min-width:200px" autocomplete="off">
        <span class="count" id="libcount"></span>
      </div>
      <div id="libgroups"></div>
    </section>`;
  const draw=()=>{
    const normq=norm(q); const out=$('#libgroups'); let total=0; out.innerHTML='';
    TOPICS.forEach(tp=>{
      const rows=Object.entries(LIB).filter(([id,v])=>{
        if(v.topic!==tp.id) return false;
        if(libFilter.scope==='pick'&&!v.pick) return false;
        if(libFilter.scope==='vna'&&v.who!=='VNA') return false;
        if(libFilter.scope==='seen'&&!state.watched[id]) return false;
        if(normq && !norm(v.t+' '+id+' '+(WHO[v.who]||'')).includes(normq)) return false;
        return true;
      });
      if(!rows.length) return;
      total+=rows.length;
      rows.sort((a,b)=>(b[1].pick?1:0)-(a[1].pick?1:0));
      const g=document.createElement('div');
      g.className='lib-group';
      const K=normq?rows.length:4;        /* có từ khoá thì mở hết */
      const rowHTML=([id,v],i)=>`<button class="lib-row${(state.watched||{})[id]?' seen':''}" data-vid="${id}">
          <span class="i">${String(i+1).padStart(2,'0')}</span>
          <span class="t">${v.pick?'<em>chọn</em>':''}${v.t}</span>
          <span class="w">${shortWho(v.who)}</span>
          <span class="d">${v.d||'—'}</span>
        </button>`;
      g.innerHTML=`<div class="lib-head"><span class="n">${tp.n}</span><h3>${tp.name}</h3><span class="c">${rows.length} bài</span></div>
        <div class="lib-rows">${rows.slice(0,K).map(rowHTML).join('')}</div>
        ${rows.length>K?`<button class="lib-more" data-left="${rows.length-K}">+ ${rows.length-K} bài nữa của chủ đề ${tp.n}</button>`:''}`;
      const more=g.querySelector('.lib-more');
      if(more) more.onclick=()=>{
        g.querySelector('.lib-rows').insertAdjacentHTML('beforeend',rows.slice(K).map(rowHTML).join(''));
        more.remove();
        $$('.lib-row',g).forEach(r=>r.onclick=()=>openVideoModal(r.dataset.vid));
      };
      out.appendChild(g);
    });
    $('#libcount').textContent=`${total} / ${VID_COUNT} bài`;
    $$('.lib-row').forEach(r=>r.onclick=()=>openVideoModal(r.dataset.vid));
  };
  draw();
  $$('.chip[data-scope]').forEach(b=>b.onclick=()=>{
    libFilter.scope=b.dataset.scope;
    $$('.chip[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.scope===libFilter.scope));
    draw();
  });
  $('#libq').oninput=e=>{q=e.target.value;libFilter.q=q;draw();};
}

      <div class="notes" id="notes"></div>
    </section>`;
  const draw=()=>{
    const nq=norm(q); let n=0;
    $('#notes').innerHTML=NOTES.map(b=>{
      const rows=b.rows.filter(([k,v])=>!nq||norm(k+' '+v.replace(/<[^>]+>/g,' ')).includes(nq));
      if(!rows.length) return '';
      n+=rows.length;
      return `<div class="note-block">
        <div class="note-h"><span class="n">${b.n}</span><h3>${b.name}</h3><span class="g">${b.grade}</span></div>
        ${rows.map(([k,v])=>`<div class="note-row" data-copy="${esc(k+': '+v.replace(/<[^>]+>/g,''))}">
          <span class="note-k">${k}</span><span class="note-f">${v}</span></div>`).join('')}
        <p class="note-foot">${b.foot}</p>
      </div>`;
    }).join('');
    $('#notecount').textContent=`${n} công thức`;
    $$('[data-copy]').forEach(r=>r.onclick=()=>{
      const t=r.dataset.copy;
      if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Đã chép: '+t)).catch(()=>toast(t));
      else toast(t);
    });
  };
  draw();
  $('#noteq').oninput=e=>{q=e.target.value;draw();};
}

   quên (trước đây 24 trang là ngõ cụt: chỉ còn thanh trên để thoát). */
/* Quay lại: nút thật trên trang, không bắt người dùng mò nút Back của trình
   duyệt — trên web app, nút đó thường rời khỏi trang này luôn. */
function routeBack(){
  const main=$('#main');
  if(!main) return;
  const path=(location.hash||'#/').replace(/^#/,'').split('?')[0];
  const root=(path.split('/').filter(Boolean)[0])||'';
  if(!root||root==='discover') return;          /* trang chủ và Khám phá không cần lùi */
  if(main.querySelector('.pg-back')) return;
  const a=document.createElement('a');
  a.className='pg-back'; a.href='#/discover';
  a.innerHTML='<span aria-hidden="true">←</span> Khám phá';
  a.setAttribute('aria-label','Về trang Khám phá');
  main.insertBefore(a, main.firstChild);
}

function routeNext(){
  const main=$('#main');
  if(!main) return;
  routeBack();
  if(main.querySelector('.next-steps')) return;      /* đã có, không thêm lần nữa */
  const host=document.createElement('div');
  host.innerHTML=(typeof explNextHtml==='function')?explNextHtml(location.hash):'';
  const node=host.firstElementChild;
  if(node) main.appendChild(node);
}
function routeOut(){
  routeNext();
  return undefined;
}

/* =========================================================
   FOCUS TRAP — giữ phím Tab trong hộp thoại đang mở
   Mọi overlay (lịch, thời khoá biểu, uiPrompt, xoá dữ liệu) đều dựa vào
   phần tử .ov-panel[role=dialog|alertdialog]. Không có bẫy này thì Tab
   sẽ chạy ra sau lớp phủ và người dùng bàn phím bị lạc.
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const panels = [...document.querySelectorAll('.ov-panel[role="dialog"],.ov-panel[role="alertdialog"]')];
  const panel = panels[panels.length - 1];
  if (!panel) return;
  const items = [...panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && (document.activeElement === last || !panel.contains(document.activeElement))) {
    e.preventDefault(); first.focus();
  }
}, true);

    const b=e.key==='ArrowLeft'?$('.lnav-btn:not(.r)'):$('.lnav-btn.r');
    if(b){e.preventDefault();go(b.getAttribute('href'));}
  }
});

            ghi chú từng ca, bảng thống kê

/* ---------- helpers ---------- */
const ALLQ=QS;
const wrongList=()=>ALLQ.filter(q=>{const a=ansOf(q.id);return a&&!a.ok;});
const reviewList=()=>typeof dueList==='function'?dueList():wrongList();
const answerStats=()=>{
  /* đếm qua ansOf: một mục null trong state.ans làm Object.values().filter
     ném lỗi và cả trang Thống kê trắng. */
  const keys=Object.keys(state.ans||{});
  let ok=0, n=0;
  keys.forEach(k=>{ const a=ansOf(k); if(a){ n++; if(a.ok) ok++; } });
  return {n, ok};
};
function pageHead(kicker,h1,p){
  return `<div class="page-head"><span class="kicker">${kicker}</span>
    <h1 style="margin-top:8px">${h1}</h1><p>${p||''}</p></div>`;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* =========================================================
   1 · EXAM — 15 câu ngẫu nhiên, 20 phút, bảng điểm theo chủ đề
========================================================= */
const EXAM_N=15, EXAM_SEC=20*60;
let EXAM=null;

function pickExam(n){
  const byTopic={};
  ALLQ.forEach(q=>{(byTopic[q.t]=byTopic[q.t]||[]).push(q);});
  const keys=Object.keys(byTopic);
  const out=[];
  // vòng 1: mỗi chủ đề một câu
  shuffle(keys).forEach(k=>{ if(out.length<n) out.push(shuffle(byTopic[k])[0]); });
  // vòng 2: lấp đầy từ pool còn lại
  const rest=shuffle(ALLQ.filter(q=>!out.includes(q)));
  while(out.length<n&&rest.length) out.push(rest.pop());
  return shuffle(out);
}

function drillExam(tags,n,label){
  const pool=ALLQ.filter(q=>tags.includes(q.t));
  if(!pool.length){ toast('Chưa có câu cho chủ đề này'); return; }
  const byT={};
  pool.forEach(q=>{(byT[q.t]=byT[q.t]||[]).push(q);});
  const out=[];
  Object.keys(byT).forEach(k=>out.push(shuffle(byT[k])[0]));
  const rest=shuffle(pool.filter(q=>!out.includes(q)));
  while(out.length<(n||12)&&rest.length) out.push(rest.pop());
  EXAM={qs:shuffle(out),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,
        label:'Luyện phổ đề · '+(label||'đề đã chọn')};
  location.hash='#/exam';
  if(location.hash==='#/exam') renderExam();
}
function drillQuestions(list,label){
  if(!list||!list.length){ toast('Không có câu nào'); return; }
  EXAM={qs:list.slice(),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,
        label:'Luyện lại · '+(label||list.length+' câu')};
  location.hash='#/exam';
  if(location.hash==='#/exam') renderExam();
}

let __examUnbind=null;   /* gỡ listener + đồng hồ của lượt thi trước (kể cả khi đã bốc đề mới) */
function renderExam(){
  if(!EXAM){
    const r=typeof examRestore==='function'?examRestore():null;
    if(r){ EXAM=r; setTimeout(()=>toast('Đã khôi phục đề đang làm'),60); }
    else EXAM={qs:pickExam(EXAM_N),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,label:''};
  }
  /* dọn listener + đồng hồ của lượt vẽ trước, tránh gắn trùng (bấm F sẽ đảo 2 lần) */
  if(__examUnbind){ try{ __examUnbind(); }catch(e){} __examUnbind=null; }
  if(typeof EXAM._cleanup==='function'){ try{ EXAM._cleanup(); }catch(e){} delete EXAM._cleanup; }
  const EH=EXAM.label||'Thi thử · 15 câu · 20 phút';
  const ES=EXAM.label
    ? 'Đề luyện riêng · '+EXAM.qs.length+' câu · chấm xong có bảng theo chủ đề'
    : 'Đề ngẫu nhiên toàn chương trình · '+EXAM.qs.length+' câu';
  $('#main').innerHTML=`<section class="wrap wide">
    ${pageHead(EH,ES,'Mỗi lượt bốc lại câu mới từ 12 chủ đề. Không xem lời giải trong lúc làm; nộp bài mới có bảng điểm theo chủ đề.')}
    <div class="exam-bar" id="examBar">
      <span class="exam-clock" id="clock">20:00</span>
      <div class="exam-prog"><i id="examProg"></i></div>
      <span class="exam-cnt" id="examCnt">0 / 15</span>
      <button class="btn sm" id="examSubmit">Nộp bài</button>
      <button class="btn ghost sm" id="examReset">Đề mới</button>
    </div>
    <div class="exam-map" id="examMap"></div>
    <div id="examBody"></div>
    <p class="exam-keys">Phím: <b>1–4 / A–D</b> chọn đáp án · <b>↑ ↓</b> chuyển câu · <b>F</b> cắm cờ xem lại · <b>Enter</b> sang câu trống kế tiếp</p>
  </section>`;
  const body=$('#examBody');
  if(EXAM.done&&EXAM.report){
    const bar=$('#examBar'); if(bar) bar.style.display='none';
    showReport(EXAM.report.rows,EXAM.report.rep,EXAM.report.auto);
    return;
  }
  startClock();

  const drawList=()=>{
    body.innerHTML=EXAM.qs.map((q,i)=>`<div class="exam-q" id="eq${i}">
      <div class="exam-qn"><span class="num">${i+1}</span><span class="qtype">${TYPE_LABEL[qType(q)]}</span></div>
      <div id="eqslot${i}"></div>
    </div>`).join('');
    EXAM.qs.forEach((q,i)=>{
      renderQuestion($('#eqslot'+i),q,{exam:true,picks:EXAM.picks,onPick:updateBar});
    });
    updateBar();
  };
  const updateBar=()=>{
    const n=Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined&&EXAM.picks[k]!==null&&!(Array.isArray(EXAM.picks[k])&&!EXAM.picks[k].length)).length;
    $('#examCnt').textContent=`${n} / ${EXAM.qs.length}`;
    $('#examProg').style.width=(n/EXAM.qs.length*100)+'%';
    if(typeof examPersist==='function') examPersist(EXAM);
    paintMap(n);
  };
  let CUR=0;
  const isAnswered=i=>{const v=EXAM.picks[EXAM.qs[i].id];return v!==undefined&&v!==null&&!(Array.isArray(v)&&!v.length);};
  const paintMap=(n)=>{
    const m=$('#examMap'); if(!m) return;
    m.innerHTML=EXAM.qs.map((q,i)=>`<button class="em${isAnswered(i)?' done':''}${EXAM.flags&&EXAM.flags[q.id]?' flag':''}${i===CUR?' cur':''}"
      data-j="${i}" aria-label="Câu ${i+1}${isAnswered(i)?' đã làm':''}">${i+1}</button>`).join('')
      +`<span class="em-l">${n}/${EXAM.qs.length} đã làm · ${EXAM.flags?Object.keys(EXAM.flags).filter(k=>EXAM.flags[k]).length:0} cờ</span>`;
    $$('.em',m).forEach(b=>b.onclick=()=>jumpTo(+b.dataset.j));
  };
  const jumpTo=i=>{
    i=Math.max(0,Math.min(EXAM.qs.length-1,i)); CUR=i;
    const el=$('#eq'+i); if(!el) return;
    el.scrollIntoView({block:'center',behavior:'smooth'});
    $$('.exam-q').forEach(x=>x.classList.remove('cur'));
    el.classList.add('cur');
    paintMap(Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined).length);
    const f=el.querySelector('.opt:not([disabled])'); if(f) setTimeout(()=>f.focus({preventScroll:true}),220);
  };
  const currentFromScroll=()=>{
    const bar=$('#examBar'); const top=(bar?bar.getBoundingClientRect().bottom:0)+70;
    let best=0,bd=1e9;
    $$('.exam-q').forEach((el,i)=>{const d=Math.abs(el.getBoundingClientRect().top-top); if(d<bd){bd=d;best=i;}});
    return best;
  };
  const pickNth=n=>{
    const i=CUR, q=EXAM.qs[i], slot=$('#eqslot'+i); if(!slot) return;
    const t=qType(q);
    if(t==='mcq'){const b=slot.querySelectorAll('.opt')[n]; if(b) b.click();}
    else if(t==='multi'){const b=slot.querySelectorAll('.opt')[n]; if(b) b.click();}
    else if(t==='tf'){const b=slot.querySelector('[data-tf="'+(n===0?'1':'0')+'"]'); if(b) b.click();}
    else if(t==='num'){
      const inp=slot.querySelector('.numin');
      if(inp){ inp.focus(); inp.select&&inp.select(); toast('Câu này điền số — gõ đáp án rồi Enter'); }
    }
    else {const b=slot.querySelectorAll('.picktile')[n]; if(b) b.click();}
  };
  const onKey=e=>{
    if(!EXAM||EXAM.done) return;
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k=e.key;
    if(/^[1-4]$/.test(k)){e.preventDefault(); pickNth(+k-1);}
    else if(/^[a-dA-D]$/.test(k)){e.preventDefault(); pickNth('abcd'.indexOf(k.toLowerCase()));}
    else if(k==='ArrowDown'||k==='j'){e.preventDefault(); jumpTo(CUR+1);}
    else if(k==='ArrowUp'||k==='k'){e.preventDefault(); jumpTo(CUR-1);}
    else if(k==='f'||k==='F'){
      e.preventDefault(); EXAM.flags=EXAM.flags||{};
      const id=EXAM.qs[CUR].id; EXAM.flags[id]=!EXAM.flags[id];
      if(typeof examPersist==='function') examPersist(EXAM);
      paintMap(Object.keys(EXAM.picks).filter(x=>EXAM.picks[x]!==undefined).length);
      toast(EXAM.flags[id]?'Đã cắm cờ câu '+(CUR+1):'Bỏ cờ câu '+(CUR+1));
    }
    else if(k==='Enter'){
      e.preventDefault();
      let next=-1;
      for(let d=1;d<=EXAM.qs.length;d++){const i=(CUR+d)%EXAM.qs.length; if(!isAnswered(i)){next=i;break;}}
      jumpTo(next<0?CUR:next);
    }
  };
  document.addEventListener('keydown',onKey);
  const scroller=()=>{if(!EXAM||EXAM.done)return; CUR=currentFromScroll(); paintMap(Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined).length);};
  window.addEventListener('scroll',scroller,{passive:true});
  drawList();

  EXAM._cleanup=()=>{ document.removeEventListener('keydown',onKey); window.removeEventListener('scroll',scroller); clearInterval(EXAM.timer); };
  __examUnbind=EXAM._cleanup;
  function startClock(){
    const tick=()=>{
      if(!EXAM||EXAM.done) return;
      const left=EXAM_SEC-Math.floor((Date.now()-EXAM.t0)/1000);
      EXAM.left=Math.max(0,left);
      const m=String(Math.floor(EXAM.left/60)).padStart(2,'0'), s=String(EXAM.left%60).padStart(2,'0');
      const c=$('#clock'); if(!c) return;
      c.textContent=`${m}:${s}`;
      c.classList.toggle('warn',EXAM.left<=120);
      EXAM._tk=(EXAM._tk||0)+1;
      if(typeof examPersist==='function'&&EXAM._tk%5===0) examPersist(EXAM);
      if(EXAM.left<=0){ clearInterval(EXAM.timer); submit(true); }
    };
    clearInterval(EXAM.timer); EXAM.timer=setInterval(tick,1000); tick();
    return ()=>clearInterval(EXAM.timer);
  }

  function submit(auto){
    if(EXAM.done) return;
    EXAM.done=true; clearInterval(EXAM.timer);
    if(typeof examClear==='function') examClear();
    const bar=$('#examBar'); if(bar) bar.style.display='none';
    const rows=EXAM.qs.map(q=>{
      const p=EXAM.picks[q.id];
      const ok=isCorrect(q,p);
      if(typeof srsRecord==='function') srsRecord(q.id,ok,p);
      else state.ans[q.id]={ok:ok,p:p,at:Date.now()};
      return {q,ok,p};
    });
    const score=rows.filter(r=>r.ok).length;
    const byT={};
    rows.forEach(r=>{ const k=r.q.t; byT[k]=byT[k]||{n:0,ok:0}; byT[k].n++; if(r.ok) byT[k].ok++; });
    if(auto){
      try{ if(typeof chime==='function') chime(true); }catch(e){}
      toast('Hết giờ — đã tự nộp bài');
    }
    const rep={score,n:rows.length,byT,at:Date.now(),sec:EXAM_SEC-EXAM.left};
    state.runs=(state.runs||[]).concat(rep).slice(-20); save(); activity(3);
    EXAM.report={rows,rep,auto};
    showReport(rows,rep,auto);
  }

  function showReport(rows,rep,auto){
    const score=rep.score, byT=rep.byT;
    const pass=score>=rows.length*0.6;
    body.innerHTML=`
      <div class="exam-report">
        <div class="er-top">
          <div><span class="kicker">Kết quả</span><div class="er-score">${score}<span>/${rows.length}</span></div></div>
          <div class="er-verdict${pass?' ok':''}">${auto?'Hết giờ — tự nộp bài. ':''}${pass?'Đạt ngưỡng 60% · giữ nhịp này':'Dưới 60% · xem lại bảng chủ đề bên dưới'}</div>
        </div>
        <table class="er-tab"><thead><tr><th>Chủ đề</th><th>Đúng</th><th></th></tr></thead><tbody>
          ${Object.keys(byT).sort((a,b)=>a-b).map(k=>{
            const v=byT[k]; const pc=Math.round(v.ok/v.n*100);
            return `<tr><td>${topicName(+k)} · ${TOPICS.find(t=>t.id===+k)?TOPICS.find(t=>t.id===+k).name.replace(/<[^>]+>/g,''):''}</td>
              <td class="mono">${v.ok}/${v.n}</td>
              <td><span class="er-bar"><i style="width:${pc}%;background:${pc>=60?'var(--green)':'var(--accent)'}"></i></span></td></tr>`;
          }).join('')}
        </tbody></table>
        <div class="er-acts">
          <button class="btn" id="examAgain">Thi đề mới</button>
          <button class="btn ghost" id="examWrong">Luyện lại ${rows.filter(r=>!r.ok).length} câu sai</button>
          <a class="btn ghost" href="#/review">Vào hộp ôn cách quãng</a>
          <a class="btn ghost" href="#/stats">Xem toàn bộ tiến độ</a>
        </div>
        ${Object.keys(byT).filter(k=>byT[k].ok/byT[k].n<0.6).length?`<div class="er-weak">
          <span class="kicker">Chủ đề dưới 60% — luyện ngay</span>
          ${Object.keys(byT).filter(k=>byT[k].ok/byT[k].n<0.6).sort((a,b)=>byT[a].ok/byT[a].n-byT[b].ok/byT[b].n)
            .map(k=>`<button class="chip-btn" data-weak="${k}">${topicName(+k)} · ${Math.round(byT[k].ok/byT[k].n*100)}%</button>`).join('')}
        </div>`:''}
        <h3 class="er-h">Chữa từng câu</h3>
        ${rows.map((r,i)=>`<div class="exam-q${r.ok?' good':' bad'}">
          <div class="exam-qn"><span class="num">${i+1}</span><span class="qtype">${r.ok?'đúng':'sai'}</span></div>
          <div id="erslot${i}"></div></div>`).join('')}
      </div>`;
    rows.forEach((r,i)=>renderQuestion($('#erslot'+i),r.q,{picked:r.p,revealed:true}));
    $('#examAgain').onclick=()=>{ EXAM=null; if(typeof examClear==='function') examClear(); renderExam(); };
    const wb=$('#examWrong');
    if(wb) wb.onclick=()=>{ const bad=rows.filter(r=>!r.ok).map(r=>r.q); EXAM=null;
      if(typeof examClear==='function') examClear();
      drillQuestions(bad,'câu sai vừa làm'); };
    $$('[data-weak]').forEach(b=>b.onclick=()=>{ EXAM=null;
      if(typeof examClear==='function') examClear();
      drillExam([+b.dataset.weak],10,'chủ đề '+b.dataset.weak); });
    window.scrollTo({top:0,behavior:'smooth'});
  }

  $('#examSubmit').onclick=()=>{
    const n=Object.values(EXAM.picks).filter(v=>v!==undefined&&v!==null).length;
    if(!n) toast('Chưa chọn đáp án nào');
    submit(false);
  };
  $('#examReset').onclick=()=>{
    const answered=Object.keys(EXAM.picks||{}).length;
    const fresh=()=>{ EXAM=null; if(typeof examClear==='function') examClear(); renderExam(); toast('Đã bốc đề mới'); };
    if(!answered) return fresh();
    uiConfirm('Bốc đề mới', 'Đang làm dở <b>'+answered+' câu</b>. Bốc đề mới sẽ bỏ hết đáp án đã chọn.',
      fresh, { okText: 'Bốc đề mới' });
  };
}

/* =========================================================
   2 · REVIEW — luyện lại đúng những câu từng sai
========================================================= */
function renderReview(){
  const list=reviewList();
  const bx=typeof srsBoxes==='function'?srsBoxes():null;
  $('#main').innerHTML=`<section class="wrap">
    ${pageHead('Ôn cách quãng · hộp Leitner','Câu đến hạn được hỏi lại đúng lúc bạn sắp quên',
      list.length?`${list.length} câu đến hạn hôm nay. Trả lời đúng, câu lên hộp cao hơn (1 → 3 → 7 → 21 ngày); trả lời sai, câu về hộp 1 và gặp lại ngay.`
        :'Hôm nay không còn câu nào đến hạn. Làm một đề mới để mở rộng vùng lỗi.')}
    ${bx?`<div class="srs-strip">${bx.map((n,i)=>`<span class="${n?'':'dim'}"><b>${n}</b> ${['hộp 1 · hôm nay','hộp 2 · 1 ngày','hộp 3 · 3 ngày','hộp 4 · 7 ngày','hộp 5 · 21 ngày'][i]}</span>`).join('')}</div>`:''}
    <div id="revBody"></div>
  </section>`;
  const body=$('#revBody');
  if(!list.length){
    body.innerHTML=`<div class="empty-card"><p>Không còn câu đến hạn. Làm một đề thi thử để kiểm tra lại toàn bộ 12 chủ đề — câu sai sẽ tự vào hộp 1.</p>
      <a class="btn" href="#/exam">Thi thử 15 câu →</a></div>`;
    return;
  }
  let run=shuffle(list);
  let idx=0;
  const draw=()=>{
    if(idx>=run.length){
      const left=reviewList();
      if(left.length){ run=shuffle(left); idx=0; }
      else{
        body.innerHTML=`<div class="empty-card"><p>Đã sạch danh sách câu sai. Làm một đề mới để mở rộng vùng lỗi.</p><a class="btn" href="#/exam">Thi thử →</a></div>`;
        return;
      }
    }
    const q=run[idx];
    body.innerHTML=`
      <div class="qmeta"><span class="kicker">Câu ${idx+1} / ${run.length} · còn ${reviewList().length} câu đến hạn</span></div>
      <div id="revSlot"></div>
      <div class="qfoot"><span class="qscore">Nguồn: ${topicName(q.t)}</span>
        <span style="display:flex;gap:8px">
          <button class="btn ghost sm" id="revSkip">Bỏ qua</button>
          <button class="btn ghost sm" id="revNext">Câu tiếp →</button>
        </span></div>`;
    const slot=$('#revSlot');
    renderQuestion(slot,q,{revealed:false,picked:undefined,onAnswer:ok=>{
      const a=ansOf(q.id);
      if(a){
        const box=Math.min(4,a.box||0);
        toast(ok?`Đúng · lên hộp ${box+1}${SRS_DAYS[box]?` — ôn lại sau ${SRS_DAYS[box]} ngày`:' — ôn lại sau 21 ngày'}`
                :'Sai · về hộp 1, gặp lại ngay hôm nay');
      }
      setTimeout(()=>{ idx++; draw(); },1500);
    }});
    $('#revSkip').onclick=()=>{ idx++; draw(); };
    $('#revNext').onclick=()=>{ idx++; draw(); };
  };
  draw();
}

/* =========================================================
   3 · SOLVE — bài giải mẫu, mở dần từng bước
========================================================= */
function renderSolve(one){
  const list=SOLVE;
  if(one!==undefined&&!isNaN(one)&&list[one]) return renderSolveOne(one);
  $('#main').innerHTML=`<section class="wrap wide">
    ${pageHead(`Bài giải mẫu · ${list.length} bài`, 'Cách trình bày một bài tự luận', 'Mỗi bài mở dần theo bước: đọc đề → dựng lập luận → thay số → kết luận. Bấm từng bước để tự kiểm tra trước khi xem bước kế.')}
    <div class="solve-grid">

/* ---- máy tính ---- */
/* =========================================================
   LEARNING ENGINE v2
   · Ôn cách quãng 5 hộp (Leitner): 0 · 1 · 3 · 7 · 21 ngày
   · Mục tiêu ngày + chuỗi ngày học
   · Chẩn đoán chủ đề yếu, gợi ý việc học tiếp theo
   · Lưu và khôi phục bài thi đang làm
   ========================================================= */

const SRS_DAYS = [0, 1, 3, 7, 21];
const DAY_MS = 86400000;

/* ---------- ghi nhận một câu trả lời, cập nhật hộp ---------- */
function srsRecord(id, ok, p) {
  const prev = ansOf(id) || {};
  const box = ok ? Math.min(SRS_DAYS.length - 1, (prev.box || 0) + 1) : 0;
  const due = ok ? Date.now() + SRS_DAYS[box] * DAY_MS : Date.now();
  state.ans[id] = { ok, p, at: Date.now(), box, due, tries: (prev.tries || 0) + 1 };
  activity(ok ? 2 : 1);
  save();
}

/* ---------- danh sách đến hạn ôn ---------- */
function dueList() {
  const now = Date.now();
  return ALLQ.filter(q => {
    const a = ansOf(q.id);
    if (!a) return false;
    if (a.due === undefined) return !a.ok;       /* dữ liệu cũ: chỉ câu sai */
    return a.due <= now;
  });
}
function srsBoxes() {
  const c = [0, 0, 0, 0, 0];
  ALLQ.forEach(q => {
    const a = ansOf(q.id);
    if (!a) return;
    c[Math.min(4, a.box || 0)]++;
  });
  return c;
}

/* ---------- thống kê hôm nay ---------- */
/* Every reader of state.ans goes through here.
   The map is user-writable through localStorage/JSON import, so an entry can
   be null, a string, or `{}`. Before this guard, one null entry made
   todayStats() throw and the HOME PAGE failed to render — the most important
   page in the product, killed by a corrupt save. `at` defaults to 0 instead
   of undefined so arithmetic on it stays finite. */
function ansOf(id) {
  const a = state && state.ans ? state.ans[id] : null;
  return (a && typeof a === 'object') ? a : null;
}

function todayStats() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const from = t0.getTime();
  let n = 0, ok = 0;
  Object.keys(state.ans || {}).forEach(k => {
    const a = ansOf(k);
    if (a && typeof a.at === 'number' && a.at >= from) { n++; if (a.ok) ok++; }
  });
  const goal = state.goal || 20;
  return { n, ok, goal, pct: Math.min(100, Math.round(n / goal * 100)), streak: streak(), due: dueList().length };
}

/* ---------- chẩn đoán chủ đề ---------- */
function topicStats() {
  const rows = TOPICS.map(t => ({ id: t.id, name: t.name.replace(/&amp;/g, '&'), n: 0, ok: 0 }));
  const byId = {};
  rows.forEach(r => byId[r.id] = r);
  ALLQ.forEach(q => {
    const a = ansOf(q.id);
    if (!a) return;
    const r = byId[q.t]; if (!r) return;
    r.n++; if (a.ok) r.ok++;
  });
  rows.forEach(r => r.acc = r.n ? r.ok / r.n : null);
  return rows;
}
function weakTopics(k = 3) {
  const rows = topicStats().filter(r => r.n >= 2 && r.acc < 0.75);
  rows.sort((a, b) => a.acc - b.acc || b.n - a.n);
  const untouched = topicStats().filter(r => r.n === 0).slice(0, 2);
  return rows.slice(0, k).concat(rows.length < k ? untouched.slice(0, k - rows.length) : []);
}
function firstSessionOfTopic(tid) {
  for (const d of DAYS) for (const s of d.sessions) {
    if (TOPIC_OF_DAY(d) === tid) return { d, s };
  }
  return null;
}

/* ---------- dải "hôm nay" trên trang chủ ---------- */
function todayStrip() {
  const t = todayStats();
  const weak = weakTopics(1)[0];
  const ring = 2 * Math.PI * 15;
  const out = `<div class="today">
    <div class="today-ring">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--rule)" stroke-width="2.4"/>
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="2.4"
          stroke-dasharray="${(ring * t.pct / 100).toFixed(1)} ${ring}" stroke-linecap="round"
          transform="rotate(-90 18 18)"/>
      </svg>
      <b>${t.n}</b>
    </div>
    <div class="today-txt">
      <span class="kicker">Hôm nay · mục tiêu ${t.goal} câu</span>
      <h2>${t.n === 0 ? 'Chưa làm câu nào hôm nay' : `${t.n} câu, đúng ${t.ok} · ${Math.round(t.ok / t.n * 100)}%`}</h2>
      <p>${t.due ? `<b>${t.due}</b> câu đến hạn ôn cách quãng.` : 'Không còn câu nào đến hạn — làm đề mới để mở rộng.'}
        ${weak ? ` Chủ đề yếu nhất: <b>${weak.name}</b>${weak.acc !== null ? ` (${Math.round(weak.acc * 100)}%)` : ''}.` : ''}</p>
    </div>
    <div class="today-act">
      <a class="btn sm" href="#/review">${t.due ? `Ôn ${t.due} câu →` : 'Ôn cách quãng →'}</a>
      ${weak ? `<a class="btn ghost sm" href="#/exam" data-drill-topic="${weak.id}">Luyện chủ đề ${weak.id} →</a>` : ''}
      <span class="today-streak">${t.streak ? `Chuỗi ${t.streak} ngày` : 'Bắt đầu chuỗi hôm nay'}</span>
    </div>
  </div>`;
  /* todayStrip() trả về chuỗi HTML, nên phải gắn hành động sau khi đã chèn vào DOM */
  setTimeout(() => mountTopicDrills(), 0);
  return out;
}

/* ---------- ước lượng thời gian còn lại theo nhịp thực tế ---------- */
function etaText() {
  const dm = doneMap();
  const done = Object.keys(dm).filter(k => dm[k]).length;
  const left = TOTAL_SESS - done;
  if (left <= 0) return 'Đã học hết 52 ca — quay lại ôn cách quãng để giữ kiến thức.';
  const days = Object.keys(state.days || {}).filter(d => (state.days[d] || 0) > 0).length;
  if (days < 2) return `Còn ${left} ca. Học đều 4 ca/ngày là xong trong ${Math.ceil(left / 4)} ngày.`;
  const perDay = done / days;
  if (perDay <= 0.01) return `Còn ${left} ca — bắt đầu hôm nay để máy tính được nhịp của bạn.`;
  const daysLeft = Math.ceil(left / perDay);
  return `Còn ${left} ca · nhịp hiện tại ${perDay.toFixed(1)} ca/ngày ⇒ khoảng ${daysLeft} ngày nữa.`;
}

/* ---------- lịch 14 ngày ---------- */
function heatStrip(days = 14) {
  const out = [];
  const t = new Date(); t.setHours(0, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(t.getTime() - i * DAY_MS);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const n = state.days[k] || 0;
    const lv = n === 0 ? 0 : n < 4 ? 1 : n < 10 ? 2 : n < 20 ? 3 : 4;
    const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()];
    out.push({ wd, n, lv, d: d.getDate(), today: i === 0 });
  }
  const max = Math.max(1, ...out.map(o => o.n));
  return `<div class="heat">
    <div class="heat-h"><span class="kicker">Nhịp học ${days} ngày</span>
      <span class="muted">Đỉnh ${max} hoạt động/ngày · ${out.filter(o => o.n).length}/${days} ngày có học</span></div>
    <div class="heat-cells">${out.map(o => `<div class="hc l${o.lv}${o.today ? ' now' : ''}" title="${o.d}: ${o.n} hoạt động">
      <b>${o.n || ''}</b><span>${o.today ? 'nay' : o.wd}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:11px;margin:6px 0 0">Mỗi ô là một ngày: số trong ô là số hoạt động (câu trả lời, ca học, lượt thi). Ô đậm = ngày học dày.</p>
  </div>`;
}

/* ---------- bảng kế hoạch cho trang tiến độ ---------- */
function planCard() {
  const rows = topicStats();
  const weak = weakTopics(3);
  const boxes = srsBoxes();
  const total = boxes.reduce((a, b) => a + b, 0);
  return `<div class="plan">
    <div class="plan-h"><span class="kicker">Việc nên làm tiếp</span>
      <span class="muted">Tính từ ${total} câu bạn đã trả lời</span></div>
    <div class="plan-grid">
      <div class="plan-col">
        <h4>Chủ đề cần vá</h4>
        ${weak.length ? weak.map(w => {
          const fs = firstSessionOfTopic(w.id);
          const href = fs ? sessionHref(fs.d.n, fs.s.n) : '#/';
          return `<div class="plan-row">
            <span class="plan-n">${w.id}</span>
            <div><b>${w.name}</b><span class="muted">${w.n ? `${w.ok}/${w.n} câu đúng` : 'chưa làm câu nào'}</span></div>
