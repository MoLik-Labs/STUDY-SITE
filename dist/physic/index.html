/* ---------- phiên học hôm nay: 3 việc, đo được ---------- */
function nextSessionLink() {
  for (const d of DAYS) for (const s of d.sessions)
    if (!doneMap()[sid(d.n, s.n)]) return sessionHref(d.n, s.n);
  return '#/review';
}
function routineState() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const from = t0.getTime();
  const ansN = Object.keys(state.ans || {}).filter(k => {
    const a = ansOf(k);
    return a && typeof a.at === 'number' && a.at >= from;
  }).length;
  const lesN = Object.keys(state.doneAt || {}).filter(k => state.doneAt[k] >= from).length;
  const runN = (state.runs || []).filter(r => r.at >= from).length;
  const goal = state.goal || 20;
  return [
    { k: 'Ôn tập', need: Math.min(10, goal), have: ansN, href: '#/review', unit: 'câu' },
    { k: 'Học một ca', need: 1, have: lesN, href: nextSessionLink(), unit: 'ca' },
    { k: 'Thi một lượt', need: 1, have: runN, href: '#/exam', unit: 'lượt' }
  ];
}
function routineCard() {
  const rows = routineState();
  const done = rows.filter(r => r.have >= r.need).length;
  if (done === rows.length) {
    return `<div class="routine all"><div class="rt-h"><span class="kicker">Phiên hôm nay</span>
      <b>Đủ 3 việc — chốt sổ hôm nay.</b></div>
      <p class="muted">Mai quay lại: câu đến hạn sẽ tự xếp hàng vào mục Ôn cách quãng.</p></div>`;
  }
  return `<div class="routine"><div class="rt-h"><span class="kicker">Phiên hôm nay · ${done}/3 việc</span>
    <span class="rt-bar"><i style="width:${done / rows.length * 100}%"></i></span></div>
    <div class="rt-rows">${rows.map(r => {
      const ok = r.have >= r.need;
      return `<a class="rt-row${ok ? ' ok' : ''}" href="${r.href}">
        <span class="rt-tick">${ok ? '✓' : ''}</span>
        <span class="rt-k">${r.k}</span>
        <span class="rt-v">${Math.min(r.have, r.need)}/${r.need} ${r.unit}</span>
        ${ok ? '' : '<span class="rt-go">làm →</span>'}
      </a>`;
    }).join('')}</div></div>`;
}

/* =========================================================
   LƯU BÀI THI ĐANG LÀM
========================================================= */
function examSnapshot(EX) {
  if (!EX) return null;
  return { ids: EX.qs.map(q => q.id), picks: EX.picks, t0: EX.t0, left: EX.left, done: EX.done, label: EX.label || '' };
}
function examPersist(EX) {
  state.exam = examSnapshot(EX);
  save();
}
function examRestore() {
  const s = state.exam;
  if (!s || s.done || !s.ids) return null;
  const qs = s.ids.map(id => ALLQ.find(q => q.id === id)).filter(Boolean);
  if (qs.length < 3) return null;
  const left = s.left || 0;
  if (left <= 0) return null;
  return { qs, picks: s.picks || {}, left, t0: Date.now() - (EXAM_SEC - left) * 1000, done: false, report: null, label: s.label || '' };
}
function examClear() { delete state.exam; save(); }

/* Gắn hành động cho nút trong examBanner(). Gọi ngay sau khi chèn HTML. */
function examBannerBind() {
  const r = $('#examResume'), d = $('#examDrop');
  if (r) r.onclick = () => go('#/exam');
  if (d) d.onclick = () => {
    uiConfirm('Bỏ đề đang làm', 'Xoá đề và toàn bộ đáp án đã chọn?', () => {
      if (typeof examClear === 'function') examClear();
      EXAM = null; render();
    }, { danger: true, okText: 'Bỏ đề' });
  };
}

function examBanner(EX) {
  setTimeout(examBannerBind, 0);
  if (!EX) return '';
  const n = Object.keys(EX.picks || {}).length;
  return `<div class="exam-resume">
    <span class="kicker">Đang có đề làm dở</span>
    <b>${EX.qs.length} câu · đã trả lời ${n} · còn ${Math.floor(EX.left / 60)} phút</b>
    <span>
      <button class="btn sm" id="examResume">Làm tiếp</button>
      <button class="btn ghost sm" id="examDrop">Bỏ đề này</button>
    </span>
  </div>`;
}

let PAL = null;
function openPalette() {
  if (PAL && document.body.contains(PAL)) { PAL.querySelector('#ovq').focus(); return; }
  PAL = null;                        /* lớp phủ cũ bị gỡ tay thì mở lại được */
  const idx = PAL_INDEX_CACHE || (PAL_INDEX_CACHE = paletteIndex());
  const d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = `<div class="ov-panel" role="dialog" aria-label="Bảng lệnh">
    <div class="ov-in">
      <svg viewBox="0 0 16 16" style="width:15px;height:15px;stroke:#8b8478;fill:none;stroke-width:1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="ovq" placeholder="Gõ để tìm bài học, công thức, đề, dạng bài…" autocomplete="off">
      <span class="kicker">↑↓ · ENTER · ESC</span>
    </div>
    <div class="ov-body" id="ovbody"></div>
  </div>`;
  document.body.appendChild(d); PAL = d;
  const input = $('#ovq', d);
  input.focus();
  let sel = 0, rows = [];
  const close = () => { d.remove(); PAL = null; };
  d.onclick = e => { if (e.target === d) close(); };
  const render = () => {
    const q = input.value.trim();
    const k = toks(q);
    if (!k.length) {
      rows = idx.filter(o => o.g === 'Công cụ').slice(0, 8);
    } else {
      rows = idx.map(o => {
        let sc = 0;
        k.forEach(w => { if (o.n.includes(w)) sc += o.t.toLowerCase().includes(w) ? 3 : 1; });
        if (q && norm(o.t).includes(norm(q))) sc += 6;       /* khớp cả cụm thì lên đầu */
        if (o.act) sc -= 0.5;                          /* câu hỏi lẻ xếp sau bài học */
        return { o, sc };
      }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 16).map(x => x.o);
    }
    sel = 0;
    paint();
  };
  const paint = () => {
    $('#ovbody', d).innerHTML = rows.length
      ? `<div class="ov-sec">${input.value.trim() ? rows.length + ' kết quả' : 'Đi nhanh'}</div>` +
        rows.map((r, i) => `<div class="ov-row${i === sel ? ' on' : ''}" data-href="${r.href}"${r.act ? ` data-act="${r.act}"` : ''}>
          <span class="k">${r.g}</span><span class="t">${esc(r.t)}</span><span class="d">${r.act ? '↵ luyện ngay' : esc((r.d || '').slice(0, 60))}</span></div>`).join('')
      : '<div class="ov-sec">Không thấy. Thử: thấu kính, mạch cầu, hệ số góc, Bessel…</div>';
    $$('.ov-row', d).forEach((r, i) => {
      r.onmouseenter = () => { sel = i; paint(); };
      r.onclick = () => {
        const h = r.dataset.href, qid = r.dataset.act ? +r.dataset.act : null;
        close();
        if (qid) { const q = ALLQ.find(x => x.id === qid); if (q) drillQuestions([q], 'câu đã chọn'); }
        else go(h);
      };
    });
  };
  input.oninput = render;
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(rows.length - 1, sel + 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
    else if (e.key === 'Enter') {
      const r = rows[sel]; if (!r) return;
      close();
      if (r.act) { const q = ALLQ.find(x => x.id === r.act); if (q) drillQuestions([q], 'câu đã chọn'); }
      else go(r.href);
    }
  };
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
  render();
}

/* nhãn theo ngôn ngữ đang chọn; vi là nguồn nên luôn có */
const explLang = () => (typeof i18nLang === 'function' ? i18nLang() : 'vi');
const explName = it => (explLang() === 'en' && it.en ? it.en : it.vi);
const explGroupName = g => (explLang() === 'en' && g.en ? g.en : g.vi);

/* tra ngược: href → tên hiển thị. Dùng cho "vừa mở" và cho tiêu đề trang. */
function explToolAt(href) {
  const h = String(href || '').split('?')[0];
  for (const g of EXPLORE_GROUPS) {
    for (const it of g.items) if (it.href === h) return { group: g, item: it };
  }
  return null;
}

/* ---------------- "vừa mở" ----------------
   Ghi lại route người dùng thật sự ghé, tối đa 8 mục, mới nhất trước.
   Không lưu route có tham số (bài học, ngày) — danh sách sẽ đầy rác. */
function explorRecentList() {
  if (!state.explore || typeof state.explore !== 'object') state.explore = { recent: [] };
  if (!Array.isArray(state.explore.recent)) state.explore.recent = [];
  /* phần tử có thể hỏng (null, số, chuỗi) vì đây là dữ liệu người dùng sửa
     được. Lọc bỏ tại chỗ: một phần tử null từng làm cả trang Khám phá ném lỗi
     ngay trong lúc render, tức là mất luôn cả trang chứ không chỉ mất một thẻ. */
  state.explore.recent = state.explore.recent.filter(r => r && typeof r === 'object' && typeof r.href === 'string');
  return state.explore.recent;
}
function explRecord(hash) {
  const hit = explToolAt(hash);
  if (!hit || !hit.item.href) return;
  const list = explorRecentList();
  /* đã là mục mới nhất rồi thì thôi — nếu không, mỗi lần đổi trang lại ghi
     localStorage + IndexedDB + cookie, trong khi danh sách không đổi gì. */
  if (list[0] && list[0].href === hit.item.href) return;
  const i = list.findIndex(x => x.href === hit.item.href);
  const entry = { href: hit.item.href, at: Date.now(), n: hit.item.vi };
  if (i >= 0) list.splice(i, 1);
  list.unshift(entry);
  if (list.length > 8) list.length = 8;
  save();
}

/* ---------------- tìm kiếm ----------------
   Một hàm, một thứ hạng, dùng cho cả trang Khám phá và ô tìm trên thanh trên.
   `hit` đòi MỌI từ khoá cùng khớp — giống searchAll — nên "định luật ôm"
   không trả về mọi thứ có chữ "định luật". */
function explIndex() {
  const out = [];
  EXPLORE_GROUPS.forEach(g => g.items.forEach(it => out.push({
    kind: 'tool', g: explGroupName(g), t: explName(it), vi: it.vi,
    d: it.need, href: it.href, k: it.vi + ' ' + (it.en || '') + ' ' + (it.kw || '') + ' ' + it.need,
  })));

  if (typeof allLessons === 'function' && typeof SUBJECTS !== 'undefined') {
    const nm = id => { const x = SUBJECTS.find(s => s.id === id); return x ? x.name : id; };
    allLessons().forEach(l => out.push({
      kind: 'lesson', g: 'Lớp ' + l.g, t: l.t, d: nm(l.s) + (l.tag ? ' · ' + l.tag : ''),
      href: '#/read/' + l.id,
      k: l.t + ' ' + nm(l.s) + ' ' + l.g + ' ' + (l.aim || '') + ' ' + (l.tag || ''),
    }));
  }
  if (typeof DAYS !== 'undefined') {
    DAYS.forEach(d => d.sessions.forEach(s => out.push({
      kind: 'session', g: 'Lộ trình', t: s.title, d: 'Ngày ' + String(d.n).padStart(2, '0') + ' · ' + s.label,
      href: sessionHref(d.n, s.n), k: s.title + ' ' + (s.obj || '') + ' ' + d.title,
    })));
  }
  if (typeof NOTES !== 'undefined') {
    NOTES.forEach(n => n.rows.forEach(([a, b]) => {
      const plain = String(b).replace(/<[^>]+>/g, ' ');
      out.push({ kind: 'formula', g: 'Công thức', t: a, d: plain, href: '#/notes?q=' + encodeURIComponent(a), k: a + ' ' + plain });
    }));
  }
  if (Array.isArray(window.QA)) {
    window.QA.forEach(x => out.push({
      kind: 'qa', g: 'Hỏi đáp', t: x.q, d: '',
      href: '#/qa?q=' + encodeURIComponent(x.q), k: x.q + ' ' + (x.k || ''),
    }));
  }
  if (typeof PAPER_BANK !== 'undefined') {
    PAPER_BANK.forEach(p => out.push({
      kind: 'paper', g: 'Đề thi', t: (p.reg || '') + (p.y ? ' · ' + p.y : ''), d: p.note || '',
      href: '#/papers', k: (p.reg || '') + ' ' + (p.note || '') + ' ' + (p.y || '') + ' de thi',
    }));
  }

  /* n: chuỗi đã chuẩn hoá để so — tính một lần, không tính lại mỗi phím */
  return out.map(o => {
    const nm = norm(o.t + ' ' + o.d + ' ' + o.k);
    return { o, n: nm, nt: norm(o.t), titleCount: toks(o.t).length };
  });
}

/* Trọng số: khớp trong tên > khớp trong mô tả > khớp trong từ khoá.
   Công cụ và bài học được ưu tiên hơn câu hỏi lẻ, vì đó là thứ người ta
   đang tìm khi mở ô tìm. */
const EXPL_KIND_W = { tool: 2.2, lesson: 1.6, formula: 1.8, session: 1.3, qa: 1.0, paper: 1.1 };

function explSearch(q, limit) {
  const words = toks(q);
  if (!words.length) return [];
  const idx = window.EXPL_INDEX || (window.EXPL_INDEX = explIndex());
  const cap = limit || 24;
  const scored = [];
  for (let i = 0; i < idx.length; i++) {
    const row = idx[i];
    let ok = true, sc = 0;
    for (let w = 0; w < words.length; w++) {
      const word = words[w];
      if (row.n.indexOf(word) < 0) { ok = false; break; }
      if (row.nt.indexOf(word) >= 0) sc += 3;
      else sc += 1;
    }
    if (!ok) continue;
    sc *= EXPL_KIND_W[row.o.kind] || 1;
    if (row.nt === norm(q)) sc += 8;                    /* tên trùng khít */
    else if (row.nt.indexOf(norm(q)) === 0) sc += 3;     /* tên bắt đầu bằng */
    scored.push({ o: row.o, sc });
  }
  scored.sort((a, b) => b.sc - a.sc);
  const seen = new Set(), out = [];
  for (const r of scored) {
    const key = r.o.href + '|' + r.o.t;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(r.o);
    if (out.length >= cap) break;
  }
  return out;
}

/* ---------------- gợi ý: đọc tiếp / ôn tập ----------------
   Tất cả suy ra từ dữ liệu thật. Nếu chưa có gì để gợi ý thì trả null,
   thay vì bịa ra một "khoá học nên học tiếp". */
function explResume() {
  const S = (typeof schoolState === 'function') ? schoolState() : null;
  const last = S && S.soft && S.soft.lastRead;
  if (last && last.id && typeof lessonById === 'function') {
    const l = lessonById(last.id);
    if (l) return {
      kind: 'continue', href: '#/read/' + l.id, kicker: 'Đọc tiếp',
      title: l.t, sub: 'Lớp ' + l.g + ' · ' + (typeof syScopeName === 'function' ? syScopeName(l.g, l.s) : l.s),
    };
  }
  if (typeof syNextLesson === 'function') {
    const nx = syNextLesson();
    if (nx) return {
      kind: 'new', href: '#/read/' + nx.id, kicker: 'Bài mới',
      title: nx.t, sub: 'Lớp ' + nx.g + ' · ' + (typeof syScopeName === 'function' ? syScopeName(nx.g, nx.s) : nx.s),
    };
  }
  return null;
}

/* Việc đang chờ: thẻ đáo hạn, câu sai cần ôn. Chỉ trả về cái có số > 0. */
function explDue() {
  const out = [];
  let cards = 0, wrong = 0;
  try { cards = typeof syDue === 'function' ? syDue().length : 0; } catch (e) { cards = 0; }
  try { wrong = typeof dueList === 'function' ? dueList().length : 0; } catch (e) { wrong = 0; }
  if (cards) out.push({ href: '#/cards', n: cards, k: 'Thẻ đến hạn ôn', vi2: 'Ôn ngay' });
  if (wrong) out.push({ href: '#/review', n: wrong, k: 'Câu sai đến hạn', vi2: 'Luyện lại' });
  return out;
}

/* ---------------- trang #/discover ---------------- */
function renderDiscover(q0) {
  const q = (q0 || '').trim();
  const res = q ? explSearch(q, 30) : [];
  const resume = explResume();
  const due = explDue();
  const recent = explorRecentList().slice(0, 6).map(r => {
    const hit = explToolAt(r.href);
    return hit ? { href: r.href, t: explName(hit.item), d: hit.item.need } : null;
  }).filter(Boolean);
  /* recent entries pointing at routes that no longer exist are dropped above */

  const kindLabel = { tool: 'Công cụ', lesson: 'Bài học', formula: 'Công thức', session: 'Lộ trình', qa: 'Hỏi đáp', paper: 'Đề thi' };
  const mkRow = (r, i) => `<a class="expl-row${i === 0 && q ? ' on' : ''}" href="${r.href}" data-expl-row>
      <span class="k">${kindLabel[r.kind] || r.g}</span>
      <span class="t">${esc(r.t)}</span>
      <span class="d">${esc((r.d || '').slice(0, 76))}</span>
      <span class="go">→</span>
    </a>`;

  $('#main').innerHTML = `<section class="wrap wide expl-page">
    ${pageHead('Khám phá · ' + EXPLORE_GROUPS.reduce((n, g) => n + g.items.length, 0) + ' lối vào',
    'Một chỗ để mở mọi thứ',
    'Tìm bằng tiếng Việt có dấu hay không dấu đều được. Mỗi mục ghi rõ <em>khi nào nên dùng</em>, vì một danh sách tên gọi thì không giúp được gì khi bạn đang cần gấp.')}

    <form class="expl-search" id="explForm" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="explQ" value="${esc(q)}" placeholder="định luật ôm, thẻ ghi nhớ, mạch cầu, lớp 12 toán…" autocomplete="off" aria-label="Tìm trong toàn bộ khoá học">
      <kbd>ENTER</kbd>
    </form>

    ${q ? `<div class="expl-out" id="explOut">
      <div class="expl-h"><span class="kicker">${res.length} kết quả cho “${esc(q)}”</span>
        <a class="expl-clear" href="#/discover">xoá tìm kiếm</a></div>
      ${res.length ? res.map(mkRow).join('') : `<div class="expl-none">
        <b>Không thấy “${esc(q)}”</b>
        <p>Thử một từ khoá ngắn hơn, hoặc mở mục Hỏi đáp để tra theo câu hỏi thường gặp.</p>
        <a class="btn ghost sm" href="#/qa?q=${encodeURIComponent(q)}">Tra trong Hỏi đáp →</a>
      </div>`}
    </div>` : `
      ${due.length || resume ? `<div class="expl-top">
        ${resume ? `<a class="expl-resume" href="${resume.href}">
          <span class="kicker">${resume.kicker}</span>
          <b>${esc(resume.title)}</b>
          <i>${esc(resume.sub)}</i>
          <em>Mở bài →</em>
        </a>` : ''}
        ${due.map(d => `<a class="expl-due" href="${d.href}">
          <b>${d.n}</b><span>${d.k}</span><em>${d.vi2} →</em>
        </a>`).join('')}
      </div>` : `<div class="expl-empty-top">
        <b>Bắt đầu từ đâu?</b>
        <p>Chưa có bài nào đang đọc dở. Chọn lớp và môn để mở bài đầu tiên — hoặc thử ôn thẻ, làm một đề ngắn.</p>
        <a class="btn sm" href="#/subjects">Chọn lớp &amp; môn →</a>
      </div>`}

      ${recent.length ? `<div class="expl-sec">
        <div class="expl-sec-h"><span class="kicker">Vừa mở</span><a href="#/discover" data-expl-clear>xoá</a></div>
        <div class="expl-recent">${recent.map(r => `<a href="${r.href}"><b>${esc(r.t)}</b><i>${esc((r.d || '').slice(0, 40))}</i></a>`).join('')}</div>
      </div>` : ''}

      ${EXPLORE_GROUPS.map(g => `<div class="expl-sec" id="expl-${g.id}">
        <div class="expl-sec-h"><span class="kicker">${explGroupName(g)}</span><em>${g.items.length} mục</em></div>
        <div class="expl-grid">
          ${g.items.map(it => `<a class="expl-card" href="${it.href}">
            <b>${esc(explName(it))}</b>
            <span>${esc(it.need)}</span>
          </a>`).join('')}
        </div>
      </div>`).join('')}
    `}
  </section>`;

  const form = $('#explForm'), input = $('#explQ');
  form.onsubmit = e => { e.preventDefault(); go('#/discover?q=' + encodeURIComponent(input.value.trim())); };
  input.oninput = () => {
    /* gợi ý sống ngay dưới ô, không cần Enter — nhưng vẫn giữ Enter để chốt */
    const v = input.value.trim();
    const out = $('#explOut');
    if (!v) { if (out) out.remove(); return; }
    const r = explSearch(v, 12);
    let host = out;
    if (!host) {
      host = document.createElement('div');
      host.className = 'expl-out'; host.id = 'explOut';
      form.insertAdjacentElement('afterend', host);
    }
    host.innerHTML = `<div class="expl-h"><span class="kicker">${r.length} kết quả</span></div>` +
      (r.length ? r.map(mkRow).join('') :
        `<div class="expl-none"><b>Không thấy</b><p>Thử từ khoá ngắn hơn.</p></div>`);
  };
  input.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const rows = $$('[data-expl-row]', $('#explOut') || document);
      if (!rows.length) return;
      e.preventDefault();
      const cur = rows.findIndex(r => r.classList.contains('on'));
      const next = e.key === 'ArrowDown' ? Math.min(rows.length - 1, cur + 1) : Math.max(0, cur - 1 || 0);
      rows.forEach(r => r.classList.remove('on'));
      rows[next < 0 ? 0 : next].classList.add('on');
      rows[next < 0 ? 0 : next].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      const on = $('[data-expl-row].on') || $('[data-expl-row]');
      if (on) { e.preventDefault(); go(on.getAttribute('href')); }
    } else if (e.key === 'Escape') {
      input.value = ''; const out = $('#explOut'); if (out) out.remove();
    }
  };
  const clr = $('[data-expl-clear]');
  if (clr) clr.onclick = e => { e.preventDefault(); state.explore = { recent: [] }; save(); renderDiscover(''); };
  if (q) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  if (typeof syncScope === 'function') syncScope();
}

  '#/mine': ['#/studio', '#/files'],
  '#/files': ['#/studio', '#/mine'],

  '#/study': ['#/cards', '#/weekly'],
};

function explNextFor(hash) {
  const cur = String(hash || '').split('?')[0];
  const out = [];
  const push = h => {
    if (!h || h === cur || out.includes(h)) return;
    const hit = explToolAt(h) || (h === '#/' ? { item: { href: '#/' } } : null);
    if (!hit) return;
    out.push(h);
  };
  (EXPL_NEXT[cur] || []).forEach(push);
  /* anh em trong cùng nhóm */
  const g = EXPLORE_GROUPS.find(gr => gr.items.some(it => it.href === cur));
  if (g) g.items.forEach(it => { if (out.length < 3) push(it.href); });
  if (out.length < 3) push('#/physics');
  if (out.length < 3) push('#/discover');
  return out.slice(0, 3);
}

/* Nhãn cho dải "đi tiếp"; tiêu đề nhóm lấy từ bảng nên không bao giờ lệch. */
function explNextLabel(href) {
  if (href === '#/') return explLang() === 'en' ? '13-day plan' : 'Lộ trình 13 ngày';
  const hit = explToolAt(href);
  return hit ? explName(hit.item) : href;
}

function explNextHtml(hash) {
  const list = explNextFor(hash);
  if (!list.length) return '';
  return `<section class="wrap next-steps" aria-label="Đi tiếp">
    <div class="ns-h"><span class="kicker">Đi tiếp</span>
      <a href="#/discover">Mọi lối vào →</a></div>
    <div class="ns-grid">
      ${list.map((h, i) => {
        const hit = explToolAt(h);
        const why = i === 0 ? 'bước kế tiếp' : (hit && hit.item.need ? hit.item.need : '');
        return `<a class="ns-card${i === 0 ? ' ns-first' : ''}" href="${h}">
          <b>${esc(explNextLabel(h))}</b>
          <span>${esc((why || '').slice(0, 62))}</span>
        </a>`;
      }).join('')}
    </div>
  </section>`;
}
</script>

<!-- ===== VẬT LÍ — máy giải, mạch điện, phòng thí nghiệm ===== -->
<script>/* ---- giải đề ---- */
/* =========================================================
   SOLVER ENGINE
   Pure calculators (no network, no AI) + auto diagram drawing.
   Code in English. All user-facing strings in Vietnamese.
   ========================================================= */

/* ---------- number helpers ---------- */
const f2 = (x, d = 2) => {
  if (!isFinite(x)) return '—';
  let s = (+x).toFixed(d);
  s = s.replace(/\.?0+$/, '');
  if (s === '' || s === '-0') s = '0';
  return s.replace('.', ',');
};
const f3 = x => f2(x, 3);
const ok = v => isFinite(v) && v !== null && v !== undefined;
const sub = n => String(n).replace(/1/g, '₁').replace(/2/g, '₂').replace(/3/g, '₃');

/* ---------- categories & icon set ---------- */
const CATS = [
  { id: 'el', name: 'Điện học', note: 'Mạch điện, công suất, tiền điện' },
  { id: 'quang', name: 'Quang hình', note: 'Thấu kính, dựng ảnh' },
  { id: 'co', name: 'Cơ học', note: 'Chuyển động, lực, công' },
  { id: 'nhiet', name: 'Nhiệt học', note: 'Nhiệt lượng, cân bằng nhiệt' },
  { id: 'tu', name: 'Điện từ', note: 'Máy biến áp, hao phí, lực từ' }
];

const ICO = {
  circ: '<svg viewBox="0 0 40 24"><path d="M2 12h7M31 12h7" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="9" y="8" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="23" y="8" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M19 8v8" stroke="currentColor" stroke-width="1.2"/></svg>',
  lens: '<svg viewBox="0 0 40 24"><path d="M20 2c4 4 4 16 0 20-4-4-4-16 0-20Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 12h36" stroke="currentColor" stroke-width=".8" stroke-dasharray="2 2"/><circle cx="28" cy="12" r="1.2" fill="currentColor"/></svg>',
  move: '<svg viewBox="0 0 40 24"><path d="M3 18h34" stroke="currentColor" stroke-width="1"/><circle cx="8" cy="11" r="2" fill="currentColor"/><path d="M13 11h13M22 7l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  heat: '<svg viewBox="0 0 40 24"><rect x="17" y="2" width="6" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="19" y="12" width="2" height="8" fill="currentColor"/><path d="M28 6v12M32 9v6" stroke="currentColor" stroke-width="1.1"/></svg>',
  coil: '<svg viewBox="0 0 40 24"><path d="M6 18c0-8 6-8 6 0s6 8 6 0 6-8 6 0 6 8 6 0" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 6h36" stroke="currentColor" stroke-width=".8"/></svg>',
  drag: '<svg viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
};

/* =========================================================
   DRAWING — circuit (600 × 250 canvas)
   ========================================================= */
function svgCircuit(topology, v, r) {
  const P = [];
  const wire = (x1, y1, x2, y2) => P.push(`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`);
  const res = (x, y, w, h, label, val) => {
    P.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>`);
    P.push(`<text x="${x + w / 2}" y="${y - 7}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${label}</text>`);
    P.push(`<text x="${x + w / 2}" y="${y + h + 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--accent)">${val}</text>`);
  };
  const battery = (x, y) => {
    P.push(`<rect x="${x - 14}" y="${y - 17}" width="28" height="34" fill="var(--paper)"/>`);
    P.push(`<path d="M${x - 10} ${y - 13}v26M${x + 10} ${y - 8}v16" stroke="var(--ink)" stroke-width="1.8"/>`);
    const uShown = (typeof v.U === 'number' && isFinite(v.U)) ? v.U
      : ((typeof v.E === 'number' && isFinite(v.E)) ? v.E : null);
    if (uShown !== null) {
      P.push(`<text x="${x + 20}" y="${y + 4}" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${typeof v.E === 'number' && v.U === undefined ? 'E' : 'U'} = ${uShown} V</text>`);
    }
    if (+v.r > 0) P.push(`<text x="${x}" y="${y - 22}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">r = ${v.r} Ω</text>`);
  };
  const flow = (x, y) => P.push(`<path d="M${x} ${y}l-8 -4v8z" fill="var(--accent)"/>`);
  const top = 55, bot = 205, left = 110, right = 470, midY = (top + bot) / 2;
  const W = 100, H = 26;

  if (topology === 'ser') {
    /* Một số dạng bài (ví dụ "đèn sáng bình thường") dùng tên trường riêng
       (E, Ud, Pd) chứ không phải R1/R2/R3. Trước đây hình vẽ in thẳng
       `U = ${v.U} V` nên hiện ra "U = undefined V" — đúng loại lỗi làm người
       học mất tin vào lời giải. Chỉ vẽ nhãn khi thật sự có số. */
    const num = x => (typeof x === 'number' && isFinite(x)) ? x : null;
    const n = +v.R3 > 0 ? 3 : 2, lbl = ['R₁', 'R₂', 'R₃'], val = [v.R1, v.R2, v.R3];
    wire(left, top, right, top); wire(left, bot, right, bot);
    wire(left, top, left, bot); wire(right, top, right, bot);
    battery(left, midY);
    const gap = (right - left - n * W) / (n + 1);
    for (let i = 0; i < n; i++) {
      const x = left + gap + i * (W + gap);
      const rv = num(val[i]);
      res(x, top - H / 2, W, H, lbl[i], rv === null ? '' : rv + ' Ω');
    }
    flow(320, bot - 5);
    P.push(`<text x="300" y="${bot - 9}" font-family="var(--mono)" font-size="9" fill="var(--accent)">I</text>`);
  }
  if (topology === 'par') {
    const n = +v.R3 > 0 ? 3 : 2, lbl = ['R₁', 'R₂', 'R₃'], val = [v.R1, v.R2, v.R3];
    const ys = n === 3 ? [top - 5, midY + 5, bot + 5] : [top, bot];
    wire(left, top - 20, right, top - 20);
    wire(left, bot + 20, right, bot + 20);
    wire(left, top - 20, left, bot + 20); wire(right, top - 20, right, bot + 20);
    battery(left, midY);
    ys.forEach((y, i) => {
      wire(left, y, midY - W / 2, y);
      res(midY - W / 2, y - H / 2, W, H, lbl[i], val[i] + ' Ω');
      wire(midY + W / 2, y, right, y);
    });
  }
  if (topology === 'mixA') {
    const l2 = 120, r2 = 480;
    wire(l2, top, r2, top); wire(l2, bot, r2, bot);
    wire(l2, top, l2, bot); wire(r2, top, r2, bot);
    battery(l2, midY);
    wire(l2, top, l2 + 20, top);
    res(l2 + 20, top - H / 2, 90, H, 'R₁', v.R1 + ' Ω');
    wire(l2 + 110, top, l2 + 140, top);
    res(l2 + 140, top - H / 2, 90, H, 'R₂', v.R2 + ' Ω');
    wire(l2 + 230, top, r2, top);
    res(l2 + 60, bot - H / 2, 90, H, 'R₃', v.R3 + ' Ω');
    P.push(`<text x="${(l2 + r2) / 2}" y="${bot + 46}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">R₃ mắc song song với cả nhánh (R₁ nt R₂)</text>`);
  }
  if (topology === 'mixB') {
    const node1 = 290, node2 = 500;
    wire(left, top, right, top); wire(left, bot, right, bot);
    wire(left, top, left, bot); wire(right, top, right, bot);
    battery(left, midY);
    res(left + 20, top - H / 2, 90, H, 'R₁', v.R1 + ' Ω');
    wire(left + 110, top, node1, top);
    wire(node1, top, node1, 140);
    res(node1 + 20, top - H / 2, 100, H, 'R₂', v.R2 + ' Ω');
    wire(node1 + 120, top, node2, top);
    res(node1 + 20, 140 - H / 2, 100, H, 'R₃', v.R3 + ' Ω');
    wire(node1, 140, node1 + 20, 140); wire(node1 + 120, 140, node2, 140);
    wire(node2, top, node2, 140);
    wire(node2, top, right, top);
    P.push(`<text x="${(left + right) / 2}" y="${bot + 40}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">R₁ nối tiếp với cụm (R₂ // R₃)</text>`);
  }
  return `<svg viewBox="0 0 600 260" class="calc-svg" role="img" aria-label="Sơ đồ mạch điện">${P.join('')}</svg>`;
}

/* =========================================================
   DRAWING — lens (660 × 300)
   ========================================================= */
function svgLens(f, d, h, kind) {
  const Lx = 330, Ay = 165, W = 660, Hh = 300;
  const dp = d * f / (d - f);
  const k = -dp / d, hp = k * h;
  const real = dp > 0;
  const span = Math.max(d, Math.abs(dp), Math.abs(f) * 2, 5) * 1.2;
  const sc = (Lx - 45) / span;
  const sy = 95 / Math.max(h, Math.abs(hp) || 0.001);
  const X = cm => Lx + cm * sc, Y = cm => Ay - cm * sy;
  const out = [];
  out.push(`<path d="M12 ${Ay}H648" stroke="var(--rule-2)" stroke-width="1"/>`);
  const lh = 112;
  if (kind !== 'div') {
    out.push(`<path d="M${Lx} ${Ay - lh}c30 36 30 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
    out.push(`<path d="M${Lx} ${Ay - lh}c-30 36 -30 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
  } else {
    out.push(`<path d="M${Lx} ${Ay - lh}c-22 36 -22 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
    out.push(`<path d="M${Lx} ${Ay - lh}c22 36 22 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
  }
  [[-Math.abs(f), 'F'], [Math.abs(f), "F'"]].forEach(([fv, lab]) => {
    const x = X(fv);
    if (x > 16 && x < 644) {
      out.push(`<circle cx="${x}" cy="${Ay}" r="3.2" fill="var(--accent)"/>`);
      out.push(`<text x="${x}" y="${Ay + 18}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">${lab}</text>`);
    }
  });
  out.push(`<circle cx="${Lx}" cy="${Ay}" r="3" fill="var(--ink)"/><text x="${Lx + 7}" y="${Ay - 9}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">O</text>`);
  // object
  const bx = X(-d), by = Y(h);
  out.push(`<path d="M${bx} ${Ay}V${by}" stroke="var(--ink)" stroke-width="2.6"/>`);
  out.push(`<path d="M${bx - 5} ${by + 10}l5 -10 5 10z" fill="var(--ink)"/>`);
  out.push(`<text x="${bx}" y="${Ay + 30}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink)">A</text>`);
  out.push(`<text x="${bx - 11}" y="${by + 4}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--ink)">B</text>`);
  // rays
  const far = span * 1.02;
  out.push(`<path d="M${bx} ${by}H${Lx}L${X(far)} ${Y(h - h * far / f)}" fill="none" stroke="var(--green)" stroke-width="1.1" opacity=".85"/>`);
  out.push(`<path d="M${bx} ${by}L${X(far)} ${Y(-h * far / d)}" fill="none" stroke="var(--green)" stroke-width="1.1" opacity=".85"/>`);
  if (!real) {
    out.push(`<path d="M${Lx} ${by}L${X(dp)} ${Y(hp)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".7" fill="none"/>`);
    out.push(`<path d="M${Lx} ${Ay}L${X(dp)} ${Y(hp)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".7" fill="none"/>`);
  }
  // image
  const ix = X(dp), iy = Y(hp);
  if (ix > 8 && ix < 652) {
    out.push(`<path d="M${ix} ${Ay}V${iy}" stroke="var(--accent)" stroke-width="2.2"${real ? '' : ' stroke-dasharray="6 4"'}/>`);
    out.push(`<path d="M${ix - 5} ${iy + (hp > 0 ? 10 : -10)}l5 ${hp > 0 ? -10 : 10} 5 ${hp > 0 ? 10 : -10}z" fill="var(--accent)"/>`);
    out.push(`<text x="${ix}" y="${Ay + 30}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">A'</text>`);
    out.push(`<text x="${ix + 9}" y="${iy + 4}" font-family="var(--mono)" font-size="9" fill="var(--accent)">B'</text>`);
  }
  out.push(`<text x="${(bx + Lx) / 2}" y="${Ay + 62}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">d = ${f2(d)} cm</text>`);
  if (isFinite(dp)) out.push(`<text x="${(Lx + ix) / 2}" y="${Ay + 62}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">d' = ${f2(dp)} cm</text>`);
  return `<svg viewBox="0 0 ${W} ${Hh}" class="calc-svg" role="img" aria-label="Dựng ảnh qua thấu kính">${out.join('')}</svg>`;
}

/* ---------- motion diagram ---------- */
function svgMeet(x1, x2, v1, v2, same, t, pos) {
  const W = 660, Ay = 110, left = 40, right = 620;
  const lo = Math.min(x1, x2, pos) - 5, hi = Math.max(x1, x2, pos) + 5;
  const X = m => left + (m - lo) / (hi - lo) * (right - left);
  const out = [];
  out.push(`<path d="M${left} ${Ay}H${right}" stroke="var(--rule-2)" stroke-width="1"/>`);
  [x1, x2, pos].forEach((m, i) => {
    if (!ok(m)) return;
    const x = X(m);
    out.push(`<circle cx="${x}" cy="${Ay}" r="${i === 2 ? 6 : 5}" fill="${i === 2 ? 'var(--accent)' : 'var(--ink)'}"/>`);
    out.push(`<text x="${x}" y="${Ay - 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="${i === 2 ? 'var(--accent)' : 'var(--ink-2)'}">${i === 2 ? 'gặp · ' + f2(m, 1) + ' m' : 'x' + (i + 1) + ' = ' + f2(m, 1) + ' m'}</text>`);
  });
  if (ok(pos)) out.push(`<path d="M${X(pos)} ${Ay + 8}v16" stroke="var(--accent)" stroke-width="1"/>`);
  if (!same) {
    out.push(`<path d="M${X(x1)} ${Ay + 34}h26M${X(x1) + 22} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
    out.push(`<path d="M${X(x2)} ${Ay + 34}h-26M${X(x2) - 22} ${Ay + 30}l-5 4 5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
  } else {
    out.push(`<path d="M${X(x1)} ${Ay + 34}h34M${X(x1) + 30} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
    out.push(`<path d="M${X(x2)} ${Ay + 34}h34M${X(x2) + 30} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
  }
  out.push(`<text x="${left}" y="${Ay + 66}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">v₁ = ${v1} m/s · v₂ = ${v2} m/s · gặp sau ${f2(t, 2)} s</text>`);
  return `<svg viewBox="0 0 ${W} 190" class="calc-svg" role="img" aria-label="Sơ đồ chuyển động">${out.join('')}</svg>`;
}

/* ---------- buoyancy diagram ---------- */
function svgArch(sub, state, P, FA) {
  const out = [];
  const wl = 120, bx = 235, bw = 80, bh = 80;
  out.push(`<rect x="140" y="${wl}" width="370" height="105" fill="var(--card-2)" stroke="var(--rule-2)"/>`);
  out.push(`<path d="M140 ${wl}H510" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>`);
  out.push(`<text x="146" y="${wl - 7}" font-family="var(--mono)" font-size="9" fill="var(--accent)">mặt nước</text>`);
  const yTop = wl - bh * (1 - sub);
  out.push(`<rect x="${bx}" y="${yTop}" width="${bw}" height="${bh}" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>`);
  const cx = bx + bw / 2;
  // trọng lực: mũi tên hướng xuống, đặt dưới đáy vật
  out.push(`<path d="M${cx} ${yTop + bh + 8}V${yTop + bh + 46}" stroke="var(--ink)" stroke-width="1.4"/>`);
  out.push(`<path d="M${cx - 5} ${yTop + bh + 40}l5 6 5-6z" fill="var(--ink)"/>`);
  out.push(`<text x="${cx + 10}" y="${yTop + bh + 34}" font-family="var(--mono)" font-size="10" fill="var(--ink)">P${P !== undefined ? ' = ' + f2(P) + ' N' : ''}</text>`);
  // lực đẩy: mũi tên hướng lên, đặt trên đỉnh vật
  out.push(`<path d="M${cx} ${yTop - 8}V${yTop - 46}" stroke="var(--accent)" stroke-width="1.4"/>`);
  out.push(`<path d="M${cx - 5} ${yTop - 40}l5 -6 5 6z" fill="var(--accent)"/>`);
  out.push(`<text x="${cx + 10}" y="${yTop - 30}" font-family="var(--mono)" font-size="10" fill="var(--accent)">F_A${FA !== undefined ? ' = ' + f2(FA) + ' N' : ''}</text>`);
  out.push(`<text x="522" y="${wl + 40}" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${state}</text>`);
  out.push(`<text x="146" y="${wl + 96}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">phần chìm ${f2(sub * 100, 0)}% thể tích</text>`);
  return `<svg viewBox="0 0 660 250" class="calc-svg" role="img" aria-label="Sơ đồ lực đẩy Archimedes">${out.join('')}</svg>`;
}

/* ---------- 1. circuit ---------- */
S.el_circuit = {

    { k: 'r', l: 'Điện trở trong (bỏ trống = 0)', u: 'Ω', v: 0 },
    { k: 'R1', l: 'R₁', u: 'Ω', v: 6 },
    { k: 'R2', l: 'R₂', u: 'Ω', v: 6 },
    { k: 'R3', l: 'R₃ (chỉ dùng cho sơ đồ có R₃)', u: 'Ω', v: 6 }
  ],
  run(v) {
    const t = v.topology, r = +v.r || 0;
    const R1 = +v.R1, R2 = +v.R2, R3 = +v.R3;
    const out = [], st = [];
    let Rt, branches = [];
    if (t === 'ser') {
      const R = R3 > 0 ? R1 + R2 + R3 : R1 + R2;
      Rt = R + r;
      const fR = (R3 > 0 ? 'R = R₁ + R₂ + R₃' : 'R = R₁ + R₂') + (r ? ' + r' : '');
      push(st, 'Bước 1 · Điện trở tương đương', fR, `R = ${R3 > 0 ? `${R1} + ${R2} + ${R3}` : `${R1} + ${R2}`}${r ? ` + ${r}` : ''} = ${f2(Rt)} Ω`);
      const I = v.U / Rt;
      push(st, 'Bước 2 · Cường độ dòng điện', 'I = U / R', `I = ${v.U} / ${f2(Rt)} = ${f3(I)} A`);
      branches = [{ k: 'I', l: 'Dòng toàn mạch', v: I, u: 'A' }];
      const list = R3 > 0 ? [R1, R2, R3] : [R1, R2];
      list.forEach((R, i) => {
        const U = I * R;
        out.push({ l: `U${sub(i + 1)}`, v: U, u: 'V' });
        out.push({ l: `P${sub(i + 1)}`, v: I * I * R, u: 'W' });
        branches.push({ k: `U${sub(i + 1)}`, l: `Hiệu điện thế R${sub(i + 1)}`, v: U, u: 'V' });
      });
      if (r) push(st, 'Bước 3 · Độ giảm thế trên nguồn', 'U_nguồn = I·r', `${f3(I)} · ${r} = ${f3(I * r)} V · hiệu suất ${f2(I * (Rt - r) / v.U * 100, 1)}%`);
      out.unshift({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'Công suất toàn mạch', v: v.U * I, u: 'W' });
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    if (t === 'par') {
      const list = R3 > 0 ? [R1, R2, R3] : [R1, R2];
      const Rp = 1 / list.reduce((a, R) => a + 1 / R, 0);
      Rt = Rp + r;
      push(st, 'Bước 1 · Điện trở tương đương', list.length === 3 ? '1/R = 1/R₁ + 1/R₂ + 1/R₃' : '1/R = 1/R₁ + 1/R₂', `1/R = ${list.map(R => `1/${R}`).join(' + ')} ⇒ R = ${f2(Rp)} Ω`);
      const I = v.U / Rt;
      const Up = I * Rp;
      push(st, 'Bước 2 · Dòng toàn mạch', 'I = U / (R + r)', `I = ${v.U} / ${f2(Rt)} = ${f3(I)} A`);
      push(st, 'Bước 3 · Hiệu điện thế hai đầu mạch song song', 'U' + '‖' + ' = I·R', `U = ${f3(I)} · ${f2(Rp)} = ${f3(Up)} V`);
      list.forEach((R, i) => {
        out.push({ l: `I${sub(i + 1)}`, v: Up / R, u: 'A' });
        branches.push({ k: `I${sub(i + 1)}`, l: `Dòng qua R${sub(i + 1)}`, v: Up / R, u: 'A' });
      });
      out.unshift({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U hai nhánh', v: Up, u: 'V' });
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    if (t === 'mixA') { // (R1 nt R2) // R3
      const R12 = R1 + R2;
      const Rp = R12 * R3 / (R12 + R3);
      Rt = Rp + r;
      push(st, 'Bước 1 · Nhánh trên mắc nối tiếp', 'R₁₂ = R₁ + R₂', `R₁₂ = ${R1} + ${R2} = ${f2(R12)} Ω`);
      push(st, 'Bước 2 · Hai nhánh song song', 'R = R₁₂·R₃ / (R₁₂ + R₃)', `R = ${f2(R12)}·${R3} / (${f2(R12)} + ${R3}) = ${f2(Rp)} Ω`);
      const I = v.U / Rt, Up = I * Rp;
      push(st, 'Bước 3 · Dòng và hiệu điện thế', 'I = U/R_tđ ; U‖ = I·R', `I = ${f3(I)} A · U‖ = ${f3(Up)} V`);
      const I12 = Up / R12, I3 = Up / R3;
      out.push({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U hai nhánh', v: Up, u: 'V' },
        { l: 'I qua R₁ = I qua R₂', v: I12, u: 'A' }, { l: 'I qua R₃', v: I3, u: 'A' },
        { l: 'U₁', v: I12 * R1, u: 'V' }, { l: 'U₂', v: I12 * R2, u: 'V' }, { l: 'P toàn mạch', v: v.U * I, u: 'W' });
      branches = [{ k: 'I₁₂', l: 'Nhánh R₁ nt R₂', v: I12, u: 'A' }, { k: 'I₃', l: 'Nhánh R₃', v: I3, u: 'A' }];
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    // mixB: R1 nt (R2 // R3)
    const R23 = R2 * R3 / (R2 + R3);
    Rt = R1 + R23 + r;
    push(st, 'Bước 1 · Nhánh song song', 'R₂₃ = R₂·R₃/(R₂+R₃)', `R₂₃ = ${R2}·${R3}/(${R2}+${R3}) = ${f2(R23)} Ω`);
    push(st, 'Bước 2 · Điện trở toàn mạch', 'R = R₁ + R₂₃' + (r ? ' + r' : ''), `R = ${R1} + ${f2(R23)}${r ? ` + ${r}` : ''} = ${f2(Rt)} Ω`);
    const I = v.U / Rt, U23 = I * R23;
    push(st, 'Bước 3 · Dòng và hiệu điện thế', 'I = U/R ; U₂₃ = I·R₂₃', `I = ${f3(I)} A · U₂₃ = ${f3(U23)} V`);
    out.push({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U₁', v: I * R1, u: 'V' },
      { l: 'U₂ = U₃', v: U23, u: 'V' }, { l: 'I₂', v: U23 / R2, u: 'A' }, { l: 'I₃', v: U23 / R3, u: 'A' },
      { l: 'P toàn mạch', v: v.U * I, u: 'W' });
    branches = [{ k: 'I', l: 'Dòng chính', v: I, u: 'A' }, { k: 'I₂', l: 'Nhánh R₂', v: U23 / R2, u: 'A' }, { k: 'I₃', l: 'Nhánh R₃', v: U23 / R3, u: 'A' }];
    return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
  }
};

S.quang_lens = {
  cat: 'quang', name: 'Thấu kính: ảnh cách bao xa, cao bao nhiêu', tag: 'd′ = df/(d − f)',
  desc: 'Chọn thấu kính, nhập f, d, chiều cao vật — máy dựng ảnh và vẽ hình theo tỉ lệ.',
  fields: [
    { k: 'type', l: 'Loại thấu kính', type: 'tiles', opts: [['conv', 'Hội tụ (f > 0)'], ['div', 'Phân kì (f < 0)']], v: 'conv' },
    { k: 'f', l: 'Tiêu cự |f|', u: 'cm', v: 12 },
    { k: 'd', l: 'Khoảng cách vật – kính d', u: 'cm', v: 30 },
    { k: 'h', l: 'Chiều cao vật', u: 'cm', v: 3 }
  ],
  run(v) {
    const f = v.type === 'div' ? -Math.abs(v.f) : Math.abs(v.f);
    const d = v.d, dp = d * f / (d - f), k = -dp / d, hp = k * v.h;
    const real = dp > 0;
    const st = [], out = [];
    push(st, 'Bước 1 · Công thức thấu kính', '1/f = 1/d + 1/d′', `1/${f2(f)} = 1/${f2(d)} + 1/d′`);
    push(st, 'Bước 2 · Giải ra d′', 'd′ = d·f/(d − f)', `d′ = ${f2(d)}·${f2(f)}/(${f2(d)} − ${f2(f)}) = ${f2(dp)} cm`);
    push(st, 'Bước 3 · Độ phóng đại', '|k| = |d′|/d', `|k| = ${f2(Math.abs(dp))}/${f2(d)} = ${f2(Math.abs(k))}`);
    push(st, 'Bước 4 · Chiều cao ảnh', 'h′ = |k|·h', `h′ = ${f2(Math.abs(k))} · ${f2(v.h)} = ${f2(Math.abs(hp))} cm`);
    push(st, 'Bước 5 · Kết luận', 'Tính chất ảnh', real ? 'Ảnh thật, ngược chiều với vật, hứng được trên màn' : (f > 0 ? 'Ảnh ảo, cùng chiều, lớn hơn vật (vật trong tiêu cự)' : 'Ảnh ảo, cùng chiều, nhỏ hơn vật'));
    out.push({ l: 'd′', v: dp, u: 'cm' }, { l: 'h′', v: Math.abs(hp), u: 'cm' }, { l: 'Độ phóng đại |k|', v: Math.abs(k), u: '×' },
      { l: 'Tính chất', v: real ? 'thật, ngược chiều' : 'ảo, cùng chiều', u: '', text: true });
    return { out, steps: st, draw: { type: 'lens', f, d, h: v.h, kind: v.type }, note: real ? 'Ảnh thật nằm cùng phía bên kia kính so với vật.' : 'Ảnh ảo cùng phía với vật — vẽ bằng nét đứt.' };
  }
};

S.co_meet = {
  cat: 'co', name: 'Hai vật chuyển động gặp nhau', tag: 'cùng chiều · ngược chiều',
  desc: 'Nhập vị trí xuất phát và tốc độ — máy tính thời điểm gặp, quãng đường mỗi vật, vẽ trục toạ độ.',
  fields: [
    { k: 'mode', l: 'Chiều chuyển động', type: 'tiles', opts: [['opp', 'Ngược chiều'], ['same', 'Cùng chiều (đuổi nhau)']], v: 'opp' },
    { k: 'x1', l: 'Vị trí vật 1', u: 'm', v: 0 },
    { k: 'x2', l: 'Vị trí vật 2', u: 'm', v: 120 },
    { k: 'v1', l: 'Tốc độ vật 1', u: 'm/s', v: 6 },
    { k: 'v2', l: 'Tốc độ vật 2', u: 'm/s', v: 4 }
  ],
  run(v) {
    const same = v.mode === 'same';
    const rel = same ? Math.abs(v.v2 - v.v1) : v.v1 + v.v2;
    const gap = Math.abs(v.x2 - v.x1);
    const t = rel > 0 ? gap / rel : Infinity;
    const s1 = v.v1 * t, s2 = v.v2 * t;
    const meet = same ? v.x1 + s1 : (v.x1 < v.x2 ? v.x1 + s1 : v.x1 - s1);
    const st = [];
    push(st, 'Bước 1 · Khoảng cách ban đầu', 'Δx = |x₂ − x₁|', `Δx = ${f2(gap)} m`);
    push(st, 'Bước 2 · Tốc độ tương đối', same ? 'v_rel = |v₂ − v₁|' : 'v_rel = v₁ + v₂', `v_rel = ${same ? `|${v.v2} − ${v.v1}|` : `${v.v1} + ${v.v2}`} = ${f2(rel)} m/s`);
    push(st, 'Bước 3 · Thời gian gặp', 't = Δx / v_rel', `t = ${f2(gap)} / ${f2(rel)} = ${f2(t, 2)} s${ok(t) && t > 90 ? ` ≈ ${f2(t / 60, 1)} phút` : ''}`);
    push(st, 'Bước 4 · Chỗ gặp', 'x_gặp = x₁ ± v₁·t', `x_gặp = ${f2(meet, 1)} m · vật 1 đi ${f2(s1, 1)} m, vật 2 đi ${f2(s2, 1)} m`);
    return {
      out: [{ l: 'Thời gian gặp', v: t, u: 's' }, { l: 'Chỗ gặp', v: meet, u: 'm' }, { l: 'Quãng đường vật 1', v: s1, u: 'm' }, { l: 'Quãng đường vật 2', v: s2, u: 'm' }],
      steps: st, draw: { type: 'meet', x1: v.x1, x2: v.x2, v1: v.v1, v2: v.v2, same, t, pos: meet }
    };
  }
};

S.co_incline = {
  cat: 'co', name: 'Mặt phẳng nghiêng: lực, hiệu suất', tag: 'H = A_ci / A_tp',
  desc: 'Nhập khối lượng, chiều cao, chiều dài dốc và lực kéo thực tế.',
  fields: [{ k: 'm', l: 'Khối lượng', u: 'kg', v: 50 }, { k: 'h', l: 'Chiều cao dốc', u: 'm', v: 1.5 }, { k: 'l', l: 'Chiều dài dốc', u: 'm', v: 6 }, { k: 'F', l: 'Lực kéo thực tế', u: 'N', v: 150 }],

/* =========================================================
   UI
   ========================================================= */
const CALC_DEFAULT = { cat: 'el', id: 'el_circuit', vals: {}, saved: false };

function calcState() {
  if (!state.calc) state.calc = JSON.parse(JSON.stringify(CALC_DEFAULT));
  if (!state.calc.vals) state.calc.vals = {};
  return state.calc;
}

function renderCalc() {
  const cs = calcState();
  const cat = cs.cat || 'el';
  const list = Object.keys(S).filter(k => S[k].cat === cat);
  if (!list.includes(cs.id)) cs.id = list[0];
  const sol = S[cs.id];
  const vals = {};
  sol.fields.forEach(f => { vals[f.k] = cs.vals[cs.id] && cs.vals[cs.id][f.k] !== undefined ? cs.vals[cs.id][f.k] : f.v; });

  $('#main').innerHTML = `<section class="wrap wide">
    ${pageHead('Máy giải · nhập số liệu, ra lời giải và hình vẽ', 'Tự giải mọi dạng, không cần mạng',
    'Chọn dạng bài (bấm hoặc kéo thẻ vào khung), nhập số liệu — máy tính ngay từng bước và vẽ hình theo tỉ lệ. Kết quả có thể lưu vào phiếu để in.')}
    <div class="calc-tabs">
      ${CATS.map(c => `<button class="calc-tab${c.id === cat ? ' on' : ''}" data-cat="${c.id}">${c.name}<i>${c.note}</i></button>`).join('')}
    </div>
    <div class="calc-body">
      <aside class="calc-pick">
        <div class="kicker">Chọn dạng bài</div>
        <div class="tile-list" id="tileList">
          ${list.map(id => {
            const s = S[id];
            return `<button class="tile${id === cs.id ? ' on' : ''}" draggable="true" data-id="${id}">
              <span class="tile-ic">${ICO[s.cat === 'el' ? 'circ' : s.cat === 'quang' ? 'lens' : s.cat === 'co' ? 'move' : s.cat === 'nhiet' ? 'heat' : 'coil']}</span>
              <span class="tile-t">${s.name}</span><span class="tile-d">${s.tag}</span></button>`;
          }).join('')}
        </div>
        <div class="drop-zone" id="dropZone"><span class="kicker">Kéo thẻ vào đây</span></div>
      </aside>
      <div class="calc-work">
        <div class="calc-head">
          <div><h2>${sol.name}</h2><p>${sol.desc}</p></div>
          <span style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn ghost sm" href="#/build">Bảng mạch →</a>
            <button class="btn ghost sm" id="calcReset">Số liệu mẫu</button>
          </span>
        </div>
        <div class="calc-form" id="calcForm"></div>
        <div class="calc-out" id="calcOut"></div>
        <div class="calc-draw" id="calcDraw"></div>
        <div class="calc-steps" id="calcSteps"></div>
        <div class="calc-actions">
          <button class="btn" id="calcSave">Lưu vào phiếu của tôi</button>
          <a class="btn ghost" href="#/sheet">Mở phiếu & in →</a>
        </div>
      </div>
    </div>
  </section>`;

  const form = $('#calcForm');
  form.innerHTML = sol.fields.map(f => {
    if (f.type === 'tiles') {
      return `<div class="cf-row cf-tiles"><span class="cf-l">${f.l}</span><div class="cf-opts">
        ${f.opts.map(([k, t]) => `<button class="cf-opt${vals[f.k] === k ? ' on' : ''}" data-k="${f.k}" data-v="${k}">${t}</button>`).join('')}</div></div>`;
    }
    return `<label class="cf-row"><span class="cf-l">${f.l}</span>
      <span class="cf-in"><input type="number" step="any" inputmode="decimal" data-k="${f.k}" value="${vals[f.k]}"><i>${f.u || ''}</i></span></label>`;
  }).join('');

  const compute = () => {
    sol.fields.forEach(f => {
      if (f.type === 'tiles') return;
      const el = form.querySelector(`[data-k="${f.k}"]`);
      vals[f.k] = el && el.value !== '' ? parseFloat(String(el.value).replace(',', '.')) : f.v;
      if (!ok(vals[f.k])) vals[f.k] = f.v;
    });
    cs.vals[cs.id] = Object.assign({}, vals);
    save();
    let res;
    try { res = sol.run(vals); } catch (e) { $('#calcOut').innerHTML = '<p class="muted">Số liệu chưa hợp lệ — kiểm tra lại (tránh chia cho 0).</p>'; return; }
    const broken = (res.out || []).filter(o => !o.text && (!isFinite(+o.v) || o.v === undefined));
    if (broken.length) {
      $('#calcOut').innerHTML = `<div class="calc-bad"><b>Trường hợp đặc biệt</b>
        Số liệu này làm mẫu số bằng 0 (ví dụ d = f với thấu kính, hoặc vận tốc riêng bằng vận tốc dòng nước) nên bài toán không có nghiệm hữu hạn.
        Đổi một thông số rồi tính lại.</div>`;
      $('#calcDraw').innerHTML = '';
      $('#calcSteps').innerHTML = '';
      return;
    }
    $('#calcOut').innerHTML = `<div class="calc-res">${res.out.map(o => `<div class="cr${o.text ? ' txt' : ''}">
      <span class="cr-k">${o.l}</span><span class="cr-v">${o.text ? o.v : f2(o.v)}<i>${o.u || ''}</i></span></div>`).join('')}</div>`
      + (res.note ? `<p class="calc-note">${res.note}</p>` : '');
    $('#calcDraw').innerHTML = res.draw ? `<div class="calc-fig"><div class="kicker">Hình vẽ tự động</div>${drawFor(res.draw)}</div>` : '';
    $('#calcSteps').innerHTML = `<div class="kicker" style="margin:22px 0 10px">Lời giải từng bước</div>
      ${res.steps.map((s, i) => `<div class="cs">
        <div class="cs-h"><span class="cs-n">${String(i + 1).padStart(2, '0')}</span>${s.h}</div>
        <div class="cs-f">${s.f}</div><div class="cs-c">${s.c}</div></div>`).join('')}`;
  };

  const drawFor = d => {
    /* hình vẽ có thể mang sẵn số liệu riêng (d.U, d.R1, …) do dạng bài tự
       tính; nếu không thì dùng số người dùng vừa nhập. */
    if (d.type === 'circuit') return svgCircuit(d.topology, Object.assign({}, vals, d), { I: 0 });
    if (d.type === 'lens') return svgLens(d.f, d.d, d.h, d.kind);
    if (d.type === 'meet') return svgMeet(d.x1, d.x2, d.v1, d.v2, d.same, d.t, d.pos);
    if (d.type === 'arch') return svgArch(d.sub, d.state, d.P, d.FA);
    if (d.type === 'coil') return svgCoil(d.n1, d.n2);
    return '';
  };
  window.__drawFor = drawFor;

  form.querySelectorAll('input').forEach(inp => { inp.oninput = compute; });
  form.querySelectorAll('.cf-opt').forEach(b => b.onclick = () => {
    vals[b.dataset.k] = b.dataset.v;
    form.querySelectorAll(`.cf-opt[data-k="${b.dataset.k}"]`).forEach(x => x.classList.toggle('on', x === b));
    compute();
  });
  $('#calcReset').onclick = () => { delete cs.vals[cs.id]; renderCalc(); };

  $$('#tileList .tile').forEach(t => {
    t.onclick = () => { cs.id = t.dataset.id; renderCalc(); };
    t.ondragstart = e => { e.dataTransfer.setData('text/plain', t.dataset.id); };
  });
  const dz = $('#dropZone');
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('hot'); };
  dz.ondragleave = () => dz.classList.remove('hot');
  dz.ondrop = e => {
    e.preventDefault(); dz.classList.remove('hot');
    const id = e.dataTransfer.getData('text/plain');
    if (S[id]) { cs.id = id; renderCalc(); toast('Đã chọn: ' + S[id].name); }
  };
  $$('.calc-tab').forEach(b => b.onclick = () => { cs.cat = b.dataset.cat; cs.id = ''; renderCalc(); });

  $('#calcSave').onclick = () => {
    const name = S[cs.id].name;
    const summary = $('#calcOut').textContent.replace(/\s+/g, ' ').trim().slice(0, 160);
    state.book = state.book || [];
    state.book.unshift({ id: cs.id, name, vals: Object.assign({}, vals), out: summary, at: Date.now() });
    state.book = state.book.slice(0, 30);
    save(); toast('Đã lưu vào phiếu của tôi');
  };

  compute();
}

function svgCoil(n1, n2) {
  const out = [];
  out.push(`<rect x="120" y="60" width="120" height="120" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
  out.push(`<rect x="330" y="85" width="90" height="90" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
  for (let i = 0; i < 6; i++) out.push(`<path d="M${132 + i * 18} 60v-16" stroke="var(--ink-2)" stroke-width="1"/>`);
  for (let i = 0; i < 4; i++) out.push(`<path d="M${342 + i * 18} 85v-12" stroke="var(--ink-2)" stroke-width="1"/>`);
  out.push(`<text x="180" y="130" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">n₁ = ${n1}</text>`);
  out.push(`<text x="375" y="135" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">n₂ = ${n2}</text>`);
  out.push(`<path d="M240 120h90" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="4 3"/>`);
  return `<svg viewBox="0 0 520 220" class="calc-svg" role="img" aria-label="Máy biến áp">${out.join('')}</svg>`;
}

/* ---------- 19. Đèn sáng bình thường + biến trở + nguồn có r ---------- */
S.el_lamp = {
  cat: 'el', name: 'Đèn sáng bình thường — tìm biến trở', tag: 'Đèn + biến trở + nguồn có r',
  desc: 'Nhập nguồn (E, r) và số ghi trên đèn — máy tính dòng định mức, điện trở đèn, biến trở cần mắc và công suất tiêu hao.',
  fields: [
    { k: 'E', l: 'Suất điện động', u: 'V', v: 12 },
    { k: 'r', l: 'Điện trở trong', u: 'Ω', v: 1 },
    { k: 'Ud', l: 'Hiệu điện thế định mức của đèn', u: 'V', v: 6 },
    { k: 'Pd', l: 'Công suất định mức của đèn', u: 'W', v: 3 }
  ],
  run(v) {
    const E = +v.E, r = +v.r, Ud = +v.Ud, Pd = +v.Pd;
    const Id = Pd / Ud, Rd = Ud * Ud / Pd;
    const Ur = Id * r;
    const Ub = E - Ud - Ur;
    const Rb = Ub / Id;
    const Pb = Id * Id * Rb;
    const eff = (Ud * Id) / (E * Id) * 100;
    const out = [
      { l: 'Dòng định mức', v: Id, u: 'A' },
      { l: 'Điện trở đèn', v: Rd, u: 'Ω' },
      { l: 'Sụt áp trên r', v: Ur, u: 'V' },
      { l: 'Biến trở cần mắc', v: Rb, u: 'Ω' },
      { l: 'Công suất trên biến trở', v: Pb, u: 'W' },
      { l: 'Công suất nguồn', v: E * Id, u: 'W' },
      { l: 'Hiệu suất (phần đèn dùng)', v: eff, u: '%' }
    ];
    const steps = [
      { h: 'Bước 1 · Dòng và điện trở định mức', f: 'I_đm = P/U ; R_đ = U²/P', c: `I = ${f2(Pd)}/${f2(Ud)} = ${f3(Id)} A · R = ${f2(Ud)}²/${f2(Pd)} = ${f2(Rd)} Ω` },
      { h: 'Bước 2 · Sụt áp trên điện trở trong', f: 'U_r = I·r', c: `U_r = ${f3(Id)} · ${f2(r)} = ${f3(Ur)} V` },
      { h: 'Bước 3 · Định luật Ôm cho toàn mạch', f: 'E = U_đ + U_b + U_r', c: `U_b = ${f2(E)} − ${f2(Ud)} − ${f3(Ur)} = ${f3(Ub)} V` },
      { h: 'Bước 4 · Biến trở và công suất tiêu hao', f: 'R_b = U_b/I ; P_b = I²R_b', c: `R_b = ${f3(Ub)}/${f3(Id)} = ${f2(Rb)} Ω · P_b = ${f3(Id)}²·${f2(Rb)} = ${f2(Pb)} W` },
      { h: 'Bước 5 · Kiểm tra', f: 'P_nguồn = P_đ + P_b + P_r', c: `${f2(E * Id)} W = ${f2(Ud * Id)} + ${f2(Pb)} + ${f2(Id * Id * r)} — khớp.` }
    ];
    if (Ub <= 0) steps.push({ h: 'Lưu ý', f: 'U_b ≤ 0', c: 'Nguồn không đủ áp cho đèn sáng bình thường — phải tăng E hoặc giảm r/đổi đèn.' });
    /* Hình vẽ: đèn (R_đ) nối tiếp biến trở (R_b), nguồn E có điện trở trong r.
       Truyền đúng tên trường mà svgCircuit đọc (U/R1/R2/r) — trước đây chỉ
       truyền topology nên hình in ra "U = undefined V". */
    return { out, steps, draw: { type: 'circuit', topology: 'ser',
      U: E, r: r, R1: +Rd.toFixed(2), R2: +Rb.toFixed(2) } };
  }
};

  desc: 'Nhập suất điện động và điện trở trong — máy tìm giá trị biến trở cho công suất lớn nhất, kèm hiệu suất.',

/* ---------- 24. Thực nghiệm: đo tiêu cự bằng phương pháp Bessel ---------- */
S.tn_bessel = {

  desc: 'Giữ vật và màn cố định cách nhau L, dịch thấu kính thấy hai vị trí cho ảnh rõ cách nhau Δ — suy ra tiêu cự mà không cần đo d, d′.',

/* =========================================================
   TEACHER / STUDENT SHEET — generate, print, back up
   Everything runs locally: no server, no API.

function seeded(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}

const SHEET_TYPES = ['mcq', 'multi', 'tf', 'num', 'pick', 'order'];

function renderSheet() {
  const st = state.sheet || (state.sheet = { n: 12, topics: [], types: ['mcq', 'multi', 'tf', 'num'], key: true, seed: 'VNL9', title: 'Phiếu luyện Vật lí 9' });
  if (!st.topics.length) st.topics = TOPICS.map(t => t.id);

  $('#main').innerHTML = `<section class="wrap wide">
    ${pageHead('Phiếu của tôi · dành cho giáo viên và học sinh', 'Tạo phiếu in từ ngân hàng câu hỏi',
    'Chọn chủ đề, dạng câu, số câu và mã đề. Trang in ra sạch: chỉ câu hỏi, có ô ghi tên và điểm; bản có đáp án in ở trang cuối.')}
    <div class="sheet-grid no-print">
      <div class="sheet-ctrl">
        <label class="cf-row"><span class="cf-l">Tên phiếu</span>
          <span class="cf-in"><input id="shTitle" value="${esc(st.title)}" style="width:100%"></span></label>
        <label class="cf-row"><span class="cf-l">Số câu</span>
          <span class="cf-in"><input type="number" id="shN" min="4" max="40" value="${st.n}"></span></label>
        <label class="cf-row"><span class="cf-l">Mã đề</span>
          <span class="cf-in"><input id="shSeed" value="${esc(st.seed)}" style="width:100%"></span></label>
        <div class="cf-row"><span class="cf-l">Chủ đề</span>
          <div class="chipset" id="shTopics">
            ${TOPICS.map(t => `<button class="chip${st.topics.includes(t.id) ? ' on' : ''}" data-t="${t.id}">${t.id}</button>`).join('')}
            <button class="chip" data-t="all">tất cả</button>
          </div></div>
        <div class="cf-row"><span class="cf-l">Dạng câu</span>
          <div class="chipset" id="shTypes">
            ${SHEET_TYPES.map(k => `<button class="chip${st.types.includes(k) ? ' on' : ''}" data-k="${k}">${TYPE_LABEL[k]}</button>`).join('')}
          </div></div>
        <label class="cf-toggle"><input type="checkbox" id="shKey" ${st.key ? 'checked' : ''}> In kèm đáp án và lời giải</label>
        <div class="sheet-btns">
          <button class="btn" id="shMake">Tạo phiếu</button>
          <button class="btn ghost" id="shPrint">In / lưu PDF</button>
        </div>
        <p class="muted" style="margin-top:12px">Cùng một mã đề luôn ra cùng một phiếu — phát cho cả lớp vẫn công bằng. Đổi mã là ra đề khác.</p>
      </div>
      <div class="sheet-side">
        <div class="kicker">Bài đã lưu từ máy giải (${(state.book || []).length})</div>
        <div class="booklist" id="bookList">
          ${(state.book || []).length ? state.book.map((b, i) => `<div class="bookrow">
            <div><b>${esc(b.name)}</b><span>${esc(b.out || '')}</span></div>
            <button class="x" data-del="${i}" aria-label="Xoá">×</button></div>`).join('') : '<p class="muted">Chưa lưu bài nào. Vào <a href="#/calc">Máy giải</a>, nhập số liệu rồi bấm “Lưu vào phiếu của tôi”.</p>'}
        </div>
        <div class="kicker" style="margin-top:22px">Sao lưu tiến độ</div>
        <div class="sheet-btns">
          <button class="btn ghost sm" id="bkExport">Tải tệp JSON</button>
          <label class="btn ghost sm" style="cursor:pointer">Nhập tệp<input type="file" id="bkImport" accept="application/json" style="display:none"></label>
          <button class="btn ghost sm" id="bkReset">Xoá hết</button>
        </div>
        <p class="muted" style="margin-top:10px;font-size:11.5px">Tệp JSON chứa toàn bộ tiến độ, ghi chú, câu sai và điểm thi. Chuyển máy hoặc đưa cho học sinh khác mà không mất dữ liệu.</p>
      </div>
    </div>
    <div class="sheet-paper" id="sheetPaper"></div>
  </section>`;

  const draw = () => {
    const usable = QUIZ.filter(q => st.topics.includes(q.t) && st.types.includes(q.type || 'mcq'));
    const rnd = seeded(st.seed + '|' + st.n + '|' + st.topics.join(',') + '|' + st.types.join(','));
    const pool = usable.slice();
    const pick = [];
    while (pick.length < st.n && pool.length) {
      pick.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
    }
    const idx = q => pick.indexOf(q) + 1;
    const body = pick.map((q, i) => {
      const t = q.type || 'mcq';
      let ans = '';
      if (t === 'mcq' || t === 'multi') ans = '<div class="pq-opts">' + q.o.map((o, k) => `<div><span>${'ABCD'[k]}.</span> ${o}</div>`).join('') + '</div>';
      if (t === 'tf') ans = '<div class="pq-opts"><div>Đúng / Sai</div></div>';
      if (t === 'num') ans = `<div class="pq-opts"><div>Đáp số: ……… ${q.unit || ''}</div></div>`;
      if (t === 'pick') ans = '<div class="pq-opts"><div>Hình chọn: ………</div></div>';
      if (t === 'order') ans = '<div class="pq-opts"><div>Các bước: ' + q.s.map(() => '……').join(' → ') + '</div></div>';
      return `<div class="pq"><div class="pq-q"><b>${i + 1}.</b> ${q.q}</div>${ans}</div>`;
    }).join('');
    const key = pick.map((q, i) => {
      const t = q.type || 'mcq';
      let a = '';
      if (t === 'mcq') a = 'ABCD'[q.a];
      else if (t === 'multi') a = q.a.map(k => 'ABCD'[k]).join(', ');
      else if (t === 'tf') a = q.a ? 'Đúng' : 'Sai';
      else if (t === 'num') a = f2(q.a) + (q.unit ? ' ' + q.unit : '');
      else if (t === 'pick') a = 'Hình ' + 'ABCD'[q.a];
      else if (t === 'order') a = '1 → ' + q.s.map((_, k) => k + 1).join(' → ');
      return `<div class="pk"><b>${i + 1}.</b> <span>${a}</span>${q.e ? `<i>${q.e}</i>` : ''}</div>`;
    }).join('');
    $('#sheetPaper').innerHTML = `
      <div class="paper-head">
        <div class="kicker">Vật lí 9 · HSG KHTN 1 &amp; Chuyên Lý</div>
        <h1>${esc(st.title)}</h1>
        <div class="paper-meta"><span>Họ tên: …………………………………</span><span>Lớp: …………</span><span>Điểm: ………</span><span>Mã đề: ${esc(st.seed)}</span></div>
      </div>
      <div class="paper-q">${body}</div>
      ${st.key ? `<div class="paper-key"><div class="kicker">Đáp án &amp; lời giải</div>${key}</div>` : ''}
      <div class="paper-foot">Tạo tự động từ ${QUIZ.length} câu hỏi của lớp Vật lí 9 · ${new Date().toLocaleDateString('vi-VN')}</div>`;
    void idx;
  };

  $$('#shTopics .chip').forEach(b => b.onclick = () => {
    const id = b.dataset.t;
    if (id === 'all') st.topics = TOPICS.map(t => t.id);
    else st.topics = st.topics.includes(+id) ? st.topics.filter(x => x !== +id) : st.topics.concat(+id);
    if (!st.topics.length) st.topics = TOPICS.map(t => t.id);
    save(); renderSheet();
  });
  $$('#shTypes .chip').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    st.types = st.types.includes(k) ? st.types.filter(x => x !== k) : st.types.concat(k);
    if (!st.types.length) st.types = ['mcq'];
    save(); renderSheet();
  });
  $('#shN').onchange = e => { st.n = Math.max(4, Math.min(40, +e.target.value || 12)); save(); draw(); };
  $('#shSeed').onchange = e => { st.seed = e.target.value.trim() || 'VNL9'; save(); draw(); };
  $('#shTitle').onchange = e => { st.title = e.target.value; save(); draw(); };
  $('#shKey').onchange = e => { st.key = e.target.checked; save(); draw(); };
  $('#shMake').onclick = () => { st.seed = 'VNL9-' + Math.floor(Math.random() * 900 + 100); $('#shSeed').value = st.seed; save(); draw(); toast('Đã bốc mã đề mới'); };
  $('#shPrint').onclick = () => window.print();

  $$('#bookList [data-del]').forEach(b => b.onclick = () => {
    state.book.splice(+b.dataset.del, 1); save(); renderSheet();
  });
  $('#bkExport').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vat-li-9-tien-do.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  };
  $('#bkImport').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        state = Object.assign(loadState(), o);
        save(); toast('Đã nhập tiến độ'); render();
      } catch (err) { toast('Tệp không hợp lệ'); }
    };
    rd.readAsText(f);
  };
