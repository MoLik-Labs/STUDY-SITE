name: Hướng dẫn (GitHub Pages)

# Dựng web hướng dẫn (VitePress, tutorial/) và đưa lên GitHub Pages.
# Pull request: chỉ kiểm tra và dựng thử (link chết làm đỏ). main: dựng và deploy.
on:
  push:
    branches: [main]
    paths: ['tutorial/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['tutorial/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cài đặt
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra cấu trúc nội dung
        run: node --test tutorial/test/*.test.mjs

      - name: Dựng web hướng dẫn (link chết sẽ làm lỗi bước này)
        run: npm run docs:build

      # enablement: tự bật GitHub Pages (nguồn: GitHub Actions) nếu chưa bật; cần quyền quản trị repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tutorial/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
