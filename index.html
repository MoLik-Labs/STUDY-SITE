<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học mọi thứ — Vật lí 9 · lớp 1–12 · @nggkhaiz</title>
<meta name="app-version" content="10.1">
<meta name="description" content="Một trang để học mọi thứ: lộ trình Vật lí 9, trường học lớp 1–12, thẻ ghi nhớ cách quãng, luyện đề tự tạo, kế hoạch học, thời khoá biểu và lịch học. Tác giả @nggkhaiz — github.com/Ngg.Khaiz.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Ctext x='6' y='24' font-family='Georgia,serif' font-size='20' fill='%2317150f'%3E9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --heat1:#e6ded0; --heat2:#cfc3ae; --heat3:#a98f74; --heat4:#8b2e22;
  --paper:#f4f1ea; --card:#fbfaf6; --card-2:#efeade;
  --ink:#17150f; --ink-2:#4f4a41; --ink-3:#7a7264;
  --rule:#dbd5c6; --rule-2:#c6bfae;
  --accent:#8b2e22; --accent-soft:#f0e3dd;
  --green:#3f6b4e; --green-soft:#e4ece4;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI','DejaVu Sans',sans-serif;
  --mono:'JetBrains Mono','DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:258px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:calc(15px * var(--fs,1));line-height:1.62;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
code{font-family:var(--mono);font-size:.92em;background:var(--card-2);padding:1px 5px;border:1px solid var(--rule);white-space:nowrap}
b,strong{font-weight:600}

/* ============ TOPBAR ============ */
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-top:3px solid var(--ink);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1400px;margin:0 auto;padding:0 22px;height:54px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.tb-btn{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
.tb-btn:hover{color:var(--ink);border-bottom-color:var(--ink)}
.tb-search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);padding:6px 10px;min-width:190px;color:var(--ink-3);font-size:12.5px}
.tb-search svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.tb-search kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--rule);padding:1px 4px;color:var(--ink-3);margin-left:auto}
.menu-btn{display:none;font-family:var(--mono);font-size:11px;letter-spacing:.08em;border:1px solid var(--rule-2);padding:5px 8px}
.tb-ico{display:none;width:30px;height:30px;border:1px solid var(--rule);place-items:center}
.tb-ico svg{width:14px;height:14px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.rail-nav{display:none;padding:16px 20px 0;margin-top:16px;border-top:1px solid var(--rule)}
.rail-nav a{display:block;font-size:12.5px;color:var(--ink-2);padding:5px 0}
.rail-nav a:hover{color:var(--accent)}

.backdrop{display:none;position:fixed;inset:54px 0 0;background:rgba(0,0,0,.45);z-index:55}
.backdrop.on{display:block}
/* ============ SHELL ============ */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:54px;height:calc(100vh - 250px);overflow-y:auto;border-right:1px solid var(--rule);padding:18px 0 30px;-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:0}
.rail-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding:0 20px 8px}
.rail-phase{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 20px 5px;border-top:1px solid var(--rule);margin-top:8px}
.rail-link{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 20px;border-left:2px solid transparent}
.rail-link:hover{background:var(--card)}
.rail-link.on{border-left-color:var(--accent);background:var(--card)}
.rail-link .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail-link.on .n{color:var(--accent)}
.rail-link .t{font-size:12.5px;line-height:1.34;color:var(--ink-2)}
.rail-link.on .t{color:var(--ink);font-weight:500}
.rail-link .t i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:2px}
.rail-prog{margin:14px 20px 0;padding-top:12px;border-top:1px solid var(--rule)}
.rail-prog .bar{height:3px;background:var(--rule);margin-top:6px;position:relative}
.rail-prog .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}

.main{min-height:calc(100vh - 54px);padding:0 0 90px}
.wrap{max-width:1000px;margin:0 auto;padding:0 30px}
.wrap.wide{max-width:1140px}

/* ============ GENERIC ============ */
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(30px,3.6vw,42px);line-height:1.08}
h2{font-size:clamp(22px,2.4vw,28px);line-height:1.15}
h3{font-size:18px;line-height:1.25}
p{margin:0}
.rule{height:1px;background:var(--rule);border:0;margin:0}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule-2);padding:2px 6px;color:var(--ink-2);white-space:nowrap}
.tag.core{border-color:var(--rule-2);color:var(--accent)}
.tag.bonus{color:var(--ink-2);border-color:var(--rule-2)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);padding:9px 15px;font-size:12.5px;font-weight:500;border:1px solid var(--ink);transition:.15s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{background:var(--card);color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--rule);color:var(--ink-2);background:none;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card{background:var(--card);border:1px solid var(--rule)}

/* ============ HOME ============ */
.hero{padding:46px 0 30px;border-bottom:1px solid var(--rule)}
.hero .kicker{display:block;margin-bottom:14px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin-top:16px;max-width:56ch;color:var(--ink-2);font-size:15px}
.hero-row{display:flex;gap:26px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:26px}
.stats{display:flex;gap:0;border-top:1px solid var(--rule);flex-wrap:wrap}
.stat{padding:12px 26px 0 0;margin-right:26px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--serif);font-size:24px;line-height:1.2;margin-top:2px}
.continue{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--rule);padding:20px 22px;margin-top:30px}
.continue .kicker{display:block;margin-bottom:6px}
.continue h3{font-size:20px}
.continue p{color:var(--ink-2);font-size:13px;margin-top:4px}

.phase-block{padding:34px 0 6px;border-bottom:1px solid var(--rule)}
.phase-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phase-head .ph-n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.phase-head h2{font-size:20px}
.phase-head .ph-s{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-bottom:34px}
.daycard{background:var(--card);padding:15px 15px 13px;display:flex;flex-direction:column;gap:8px;min-height:132px;transition:.15s;position:relative;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.daycard:hover{background:var(--card)}
.daycard .d{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);display:flex;justify-content:space-between}
.daycard .t{font-family:var(--serif);font-size:15.5px;line-height:1.25;font-weight:600}
.daycard .m{margin-top:auto;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;align-items:center}
.daycard .dots{display:flex;gap:3px}
.daycard .dots i{width:5px;height:5px;border:1px solid var(--rule-2);display:block}
.daycard .dots i.on{background:var(--accent);border-color:var(--accent)}
.daycard.done .t{color:var(--ink-3)}

/* ============ DAY VIEW ============ */
.day-hero{padding:38px 0 26px;border-bottom:1px solid var(--rule)}
.day-hero .crumb{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.day-hero .crumb a{color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.day-hero .crumb a:hover{color:var(--accent)}
.day-hero h1{font-size:clamp(26px,3vw,36px)}
.day-hero p{color:var(--ink-2);margin-top:10px;max-width:60ch}
.sess-list{padding:8px 0 20px}
.sess{display:grid;grid-template-columns:76px minmax(0,1fr) 132px;gap:20px;padding:20px 0;border-bottom:1px solid var(--rule);align-items:start;cursor:pointer}
.sess:hover .sess-t{color:var(--accent)}
.sess .sess-n{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);line-height:1.6}
.sess .sess-c{display:flex;align-items:baseline;gap:10px}
.sess .sess-t{font-family:var(--serif);font-size:19px;line-height:1.25;font-weight:600;transition:.15s}
.sess .sess-o{color:var(--ink-2);font-size:13px;margin-top:6px;max-width:58ch}
.sess .sess-r{text-align:right;font-size:11.5px;color:var(--ink-3)}
.sess .sess-r b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);margin-bottom:4px}
.sess.done .sess-t{color:var(--ink-3)}
.sess.done .sess-t::after{content:" ✓";color:var(--green)}

/* ============ LESSON ============ */
.lesson-head{padding:26px 0 0}
.crumb{display:flex;gap:7px;align-items:center;color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;flex-wrap:wrap}
.crumb a:hover{color:var(--accent)}
.lesson-head h1{font-size:clamp(25px,3vw,34px);margin-top:12px;max-width:24ch}
.lesson-meta{display:flex;gap:0 14px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:12px;color:var(--ink-3)}
.seg{display:flex;gap:0;margin:22px 0 0;border-bottom:1px solid var(--rule)}
.seg button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg button:hover{color:var(--ink)}
.seg .cnt{font-size:9px;color:var(--ink-3);margin-left:5px}
.pane{padding:26px 0 40px}

/* player */
.room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:30px;align-items:start}
.player{position:relative;aspect-ratio:16/9;background:#14120e;border:1px solid var(--ink);overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;filter:grayscale(.2)}
.player .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,10,7,.92) 8%,rgba(12,10,7,.25) 55%,rgba(12,10,7,.35))}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 24px;color:#f6f2e8;text-align:left;cursor:pointer}
.poster .p-k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#c9bda8}
.poster .p-t{font-family:var(--serif);font-size:clamp(17px,1.7vw,22px);line-height:1.28;margin-top:7px;max-width:34ch;font-weight:600}
.poster .p-m{font-family:var(--mono);font-size:10px;color:#bfb3a0;margin-top:9px;display:flex;gap:10px;flex-wrap:wrap}
.poster .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border:1px solid rgba(246,242,232,.55);border-radius:50%;display:grid;place-items:center;background:rgba(20,18,14,.35);transition:.18s}
.poster:hover .play{background:var(--accent);border-color:var(--accent);transform:translate(-50%,-50%) scale(1.05)}
.poster .play::after{content:"";border-left:15px solid #f6f2e8;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.player-note{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.player-note a{color:var(--accent);border-bottom:1px solid #d8b9b3}
.vidlist{margin-top:18px;border-top:1px solid var(--rule)}
.vidrow{display:grid;grid-template-columns:22px minmax(0,1fr) 54px;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.vidrow:hover{background:var(--card)}
.vidrow.on{background:var(--accent-soft)}
.vidrow .i{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.vidrow .t{font-size:12.8px;line-height:1.35}
.vidrow .t em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid #d8b9b3;padding:1px 4px;margin-right:6px}
.vidrow .d{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right}

.side{position:sticky;top:74px}
.side-box{border-top:2px solid var(--ink);padding-top:12px;margin-bottom:22px}
.side-box .kicker{display:block;margin-bottom:8px}
.side-box p{font-size:13px;color:var(--ink-2);line-height:1.6}
.formula{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:13px 14px;font-family:var(--mono);font-size:12px;line-height:1.75;margin-top:10px;word-break:break-word}
.formula sup,.formula sub{font-size:.72em}
.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.done-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);padding:9px;font-size:12px;font-weight:500}
.done-btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.done-btn[aria-pressed="true"]::before{content:"✓"}

/* quiz */
.quiz{max-width:720px}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qdots{display:flex;gap:5px}
.qdots i{width:22px;height:3px;background:var(--rule);display:block}
.qdots i.ok{background:var(--green)}.qdots i.no{background:var(--accent)}.qdots i.cur{background:var(--ink)}
.qst{font-family:var(--serif);font-size:20px;line-height:1.35;font-weight:600;margin:6px 0 20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1px solid var(--rule);background:var(--card);transition:.12s}
.opt:hover{border-color:var(--ink-3)}
.opt .oi{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:2px}
.opt .ot{font-size:14px}
.opt.pick{border-color:var(--ink);background:var(--card)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .mbox{border-color:var(--green);background:var(--green)}
.opt.right .mbox::after{content:'';position:absolute;left:3.5px;top:0.5px;width:4px;height:8px;border-right:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(38deg)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.exp{margin-top:16px;border-left:3px solid var(--green);background:var(--card);padding:12px 14px;font-size:13px;color:var(--ink-2)}
.exp.bad{border-left-color:var(--accent)}
.exp b{color:var(--ink)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.qscore{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* Q&A */
.qa{max-width:760px}
.qa-search{display:flex;border:1px solid var(--ink);background:var(--card)}
.qa-search input{flex:1;border:0;background:none;padding:13px 15px;font:inherit;font-size:14.5px;outline:none}
.qa-search button{background:var(--ink);color:var(--paper);padding:0 18px;font-size:12px}
.qa-search button:hover{background:var(--accent)}
.qa-hint{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.qa-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.qa-chip{font-size:11.5px;border:1px solid var(--rule);padding:5px 10px;color:var(--ink-2);background:var(--card)}
.qa-chip:hover{border-color:var(--accent);color:var(--accent)}
.qa-out{margin-top:24px}
.qa-item{border-top:1px solid var(--rule);padding:16px 0}
.qa-item .qq{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.35;display:flex;gap:10px}
.qa-item .qq .qmark{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:3px}
.qa-item .qa-a{font-size:13.8px;color:var(--ink-2);margin-top:8px;padding-left:22px;line-height:1.68}
.qa-item .qa-a code{background:var(--card-2)}
.qa-src{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-left:22px}
.qa-src a{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;border:1px solid var(--rule);padding:3px 7px;color:var(--ink-2)}
.qa-src a:hover{border-color:var(--accent);color:var(--accent)}
.qa-empty{border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--card);padding:16px 18px;margin-top:8px}
.qa-empty h4{font-size:15px;font-family:var(--serif);margin-bottom:6px}
.qa-empty p{font-size:13px;color:var(--ink-2)}
.qa-mine{margin-top:28px;border-top:2px solid var(--ink);padding-top:14px}
.qa-mine h4{font-size:14px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.mine-row{display:flex;gap:12px;justify-content:space-between;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.mine-row button{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.mine-row button:hover{color:var(--accent)}

/* ============ LIBRARY / NOTES / PAPERS ============ */
.page-head{padding:38px 0 20px;border-bottom:1px solid var(--rule)}
.page-head h1{font-size:clamp(26px,3vw,34px)}
.page-head p{color:var(--ink-2);margin-top:10px;max-width:66ch;font-size:13.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);position:sticky;top:54px;background:var(--paper);z-index:15}
.filters .sep{width:1px;height:14px;background:var(--rule-2);margin:0 4px}
.filters .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.lib-group{padding-top:26px}
.lib-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.lib-head .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.lib-head h3{font-size:17px}
.lib-head .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.lib-row{display:grid;grid-template-columns:26px minmax(0,1fr) 46px 54px;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.lib-row:hover{background:var(--card)}
.lib-row .i{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.lib-row .t{font-size:13.3px;line-height:1.35}
.lib-row .t em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid #d8b9b3;padding:1px 4px;margin-right:6px}
.lib-row .w{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.lib-row .d{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right}
.lib-row.seen .t{color:var(--ink-3)}

.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 34px;padding-top:10px}
.note-block{padding:22px 0 6px;break-inside:avoid}
.note-h{display:flex;align-items:baseline;gap:9px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.note-h .n{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.note-h h3{font-size:15.5px}
.note-h .g{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.note-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.note-k{font-size:12px;color:var(--ink-2)}
.note-f{font-family:var(--mono);font-size:11.5px;text-align:right;line-height:1.5}
.note-foot{font-size:11px;color:var(--ink-3);padding:9px 0 4px;font-style:italic}
.papers-group{padding-top:26px}
.papers-h{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.papers-h h3{font-size:16px}
.papers-h .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.papers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:14px}
.paper{background:var(--card);border:1px solid var(--rule);padding:12px 13px;display:flex;flex-direction:column;gap:8px;min-height:112px}
.paper:hover{border-color:var(--ink-3)}
.paper-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.paper h4{font-family:var(--sans);font-size:13px;font-weight:500;line-height:1.35}
.paper-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}
.paper-links a{color:var(--accent);border-bottom:1px solid #d8b9b3}
.paper-links a:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ============ LESSON NAV ============ */
.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 0 0;border-top:1px solid var(--rule);margin-top:8px}
.lnav-btn{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--rule);background:var(--card);transition:.15s;max-width:100%}
.lnav-btn:hover{border-color:var(--accent)}
.lnav-btn.r{text-align:right;align-items:flex-end}
.lnav-btn span:last-child{font-family:var(--serif);font-size:14.5px;line-height:1.3;font-weight:600}
@media(max-width:560px){.lesson-nav{grid-template-columns:1fr}}

/* ============ SIM ============ */
.sim{margin-top:44px;border-top:2px solid var(--ink);padding-top:14px}
.sim-h .kicker{display:block;margin-bottom:6px}
.sim-h h3{font-size:19px}
.sim-h p{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.sim-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;margin-top:16px;align-items:start}
.sim-canvas{background:var(--card);border:1px solid var(--rule);padding:6px}
#lensSvg{width:100%;height:auto;display:block}
#lensSvg .axis{stroke:#c6bfae;stroke-width:1}
#lensSvg .lens{stroke:#17150f;stroke-width:1.4}
#lensSvg .lenscap{stroke:#17150f;stroke-width:1.4;fill:none}
#lensSvg .fdot{fill:#17150f}
#lensSvg .flab{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#8b8478}
#lensSvg .small{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#8b8478}
#lensSvg .oblab{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#17150f}
#lensSvg .obj{stroke:#8b2e22;stroke-width:2.6}
#lensSvg .img{stroke:#17150f;stroke-width:2.2}
#lensSvg .img.virt{stroke:#8b8478;stroke-dasharray:5 4}
#lensSvg .ray{stroke:#8b2e22;stroke-width:1;fill:none;opacity:.85}
#lensSvg .ray.dash{stroke:#8b8478;stroke-dasharray:4 4;opacity:.9}
.sim-ctrl{display:flex;flex-direction:column;gap:14px}
.sim-row{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:baseline;font-size:11.5px;color:var(--ink-2)}
.sim-row span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sim-row b{justify-self:end;font-family:var(--mono);font-size:11px;color:var(--ink)}
.sim-row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.sim-out{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--accent);padding-left:10px;line-height:1.55}
.sim-legend{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-3)}
.sim-legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
@media(max-width:760px){.sim-grid{grid-template-columns:minmax(0,1fr)}}

/* ============ SEARCH OVERLAY / MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(23,21,15,.42);z-index:80;display:flex;justify-content:center;padding:8vh 18px;backdrop-filter:blur(1px)}
.ov-panel{background:var(--paper);width:min(680px,100%);max-height:76vh;display:flex;flex-direction:column;border:1px solid var(--ink);box-shadow:0 24px 60px rgba(20,18,14,.22)}
.ov-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.ov-in input{flex:1;border:0;background:none;font:inherit;font-size:15px;outline:none}
.ov-body{overflow-y:auto;padding:8px 0 14px}
.ov-sec{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px 5px}
.ov-row{display:flex;gap:10px;align-items:baseline;padding:8px 16px;cursor:pointer;font-size:13px}
.ov-row:hover{background:var(--card)}
.ov-row .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);min-width:46px}
.ov-row .t{flex:1}
.ov-row .d{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.modal{position:fixed;inset:0;background:rgba(23,21,15,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-in{background:var(--paper);width:min(880px,100%);border:1px solid var(--ink)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.modal-h .x{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.modal-b{padding:0;background:#14120e}
.modal-f{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:9px 14px;border-top:1px solid var(--rule)}
.modal-f a{font-family:var(--mono);font-size:11px;color:var(--accent);border-bottom:1px solid var(--accent-soft)}
.modal-f a:hover{border-bottom-color:var(--accent)}
.modal-f span{font-size:11px;color:var(--ink-3);line-height:1.5;flex:1;min-width:220px}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ RESPONSIVE ============ */
@media(max-width:1180px){
  .days{grid-template-columns:repeat(3,minmax(0,1fr))}
  .room{grid-template-columns:minmax(0,1fr) 268px;gap:22px}
}
@media(max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:54px;left:0;bottom:0;height:auto;width:274px;background:var(--paper);z-index:60;transform:translateX(-102%);transition:.22s;box-shadow:14px 0 40px rgba(20,18,14,.12)}
  .rail.open{transform:none}
  .menu-btn{display:block}
  .brand span{display:none}
  .rail-nav{display:block}
  .room{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .notes{grid-template-columns:minmax(0,1fr)}
  .wrap{padding:0 20px}
}
@media(max-width:760px){
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
  .papers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tb-search{display:none}
  .tb-btn{display:none}
  .tb-ico{display:grid}
  .brand{flex:none}
  .sess{grid-template-columns:60px minmax(0,1fr);gap:12px}
  .sess .sess-r{grid-column:2;text-align:left;margin-top:2px}
  .hero{padding-top:32px}
  .hero-row{gap:18px}
  .stat{padding-right:16px;margin-right:16px}
}
@media(max-width:560px){
  .stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);margin-top:4px}
  .stat{border-right:1px solid var(--rule);border-top:0;padding:10px 12px 10px 0;margin:0}
  .stat:nth-child(2n){border-right:0;padding-left:12px}
  .stat .v{font-size:21px}
  .days{grid-template-columns:minmax(0,1fr)}
  .papers{grid-template-columns:minmax(0,1fr)}
  .topbar-in{padding:0 14px;gap:10px}
  .wrap{padding:0 14px}
  .seg button{padding:9px 9px 8px;font-size:9.5px}
  .lib-row{grid-template-columns:20px minmax(0,1fr) 44px}
  .lib-row .w{display:none}
  .note-row{grid-template-columns:minmax(0,1fr);gap:2px}
  .note-f{text-align:left}
  .continue{grid-template-columns:minmax(0,1fr)}
  .qa-search input{font-size:14px;padding:11px}
  .qa-search button{padding:0 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ FOOT ============ */
.foot{border-top:1px solid var(--rule);margin-top:0;background:var(--paper)}
.foot-in{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:18px;padding-bottom:26px;font-size:11px;color:var(--ink-3)}
.foot-in b{color:var(--ink-2);font-weight:600}

/* =========================================================
   CÔNG CỤ LUYỆN TẬP — câu hỏi 4 dạng, thi thử, bài giải, flashcard
   Giữ đúng ngôn ngữ editorial: nền giấy, đường kẻ 1px, không đổ bóng mềm.
========================================================= */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:13px}
.muted a{color:var(--accent);border-bottom:1px solid var(--accent-soft)}

/* ---------- thẻ câu hỏi ---------- */
.qcard{background:var(--card);border:1px solid var(--rule);padding:22px 24px}
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.qtype{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.qtopic{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.qst{font-size:15.5px;line-height:1.6;margin-bottom:16px;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 4px;border-bottom:1px solid var(--rule);background:none;font:inherit;font-size:13.5px;line-height:1.55;color:var(--ink-2);transition:.12s}
.opt:hover:not(:disabled){background:var(--card-2);color:var(--ink)}
.opt .oi{font-family:var(--mono);font-size:10px;letter-spacing:.06em;width:22px;flex:none;color:var(--ink-3);padding-top:3px;text-align:center}
.opt .ot b{font-weight:600;color:var(--ink)}
.opt.pick{border-left:2px solid var(--ink);padding-left:12px;background:var(--card-2);color:var(--ink)}
.opt.right,.opt.right:disabled{border-left:2px solid var(--green);padding-left:12px;background:var(--green-soft);color:var(--ink);opacity:1}
.opt.right .oi{color:var(--green)}
.opt.wrong,.opt.wrong:disabled{border-left:2px solid var(--accent);padding-left:12px;background:var(--accent-soft);color:var(--ink);text-decoration:line-through;text-decoration-thickness:1px;opacity:1}
.opt:disabled{cursor:default;opacity:.62}
.mbox{display:inline-block;width:13px;height:13px;border:1px solid var(--rule-2);background:var(--card);position:relative}
.mbox.on{background:var(--ink);border-color:var(--ink)}
.mbox.on::after{content:'';position:absolute;left:3px;top:0px;width:4px;height:8px;border-right:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(38deg)}
.opt.right .mbox{background:var(--green);border-color:var(--green)}
.opt.right .mbox::after{content:'';position:absolute;left:3px;top:0px;width:4px;height:8px;border-right:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(38deg)}
.opt.wrong .mbox{background:var(--accent);border-color:var(--accent)}
.opt.wrong .mbox::after{content:'';position:absolute;left:7px;top:1px;width:5px;height:1px;background:var(--paper);transform:rotate(45deg)}
.opt.wrong .mbox::before{content:'';position:absolute;left:7px;top:1px;width:5px;height:1px;background:var(--paper);transform:rotate(-45deg)}

.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px}
.opt.tfb{justify-content:center;border:1px solid var(--rule-2);padding:16px 10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.opt.tfb:hover{border-color:var(--ink)}
.opt.tfb.pick{background:var(--ink);color:var(--paper);border-color:var(--ink);padding-left:10px}
.opt.tfb.right{background:var(--green-soft);border-color:var(--green);padding-left:10px}
.opt.tfb.wrong{background:var(--accent-soft);border-color:var(--accent);padding-left:10px;text-decoration:none;color:var(--accent)}

.numrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.numbox{display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding:4px 2px;background:var(--card)}
.numin{border:0;background:none;font-family:var(--mono);font-size:20px;width:120px;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.numbox .unit{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.numin.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.qscore{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.exp{margin-top:16px;padding:13px 15px;background:var(--green-soft);border-left:2px solid var(--green);font-size:13px;line-height:1.65;color:var(--ink-2)}
.exp b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:5px}
.exp.bad{background:var(--accent-soft);border-left-color:var(--accent)}
.exp.bad b{color:var(--accent)}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.qdots{display:flex;gap:5px}
.qdots i{width:16px;height:3px;background:var(--rule-2);display:block}
.qdots i.ok{background:var(--green)}
.qdots i.no{background:var(--accent)}
.qdots i.cur{background:var(--ink);height:5px;margin-top:-1px}

/* ---------- thi thử ---------- */
.exam-bar{position:sticky;top:52px;z-index:6;display:flex;align-items:center;gap:14px;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin:18px 0 26px;flex-wrap:wrap}
.exam-clock{font-family:var(--mono);font-size:19px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--ink);min-width:70px}
.exam-clock.warn{color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.exam-prog{flex:1;height:3px;background:var(--rule);min-width:80px}
.exam-prog i{display:block;height:100%;background:var(--ink);transition:width .2s}
.exam-cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.exam-q{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;margin-bottom:34px}
.exam-q>*{min-width:0}
.exam-q [id^="eqslot"],.exam-q [id^="erslot"]{min-width:0}
.exam-qn{display:flex;flex-direction:column;gap:8px;align-items:center;padding-top:20px}
.exam-qn .num{font-family:var(--mono);font-size:13px;color:var(--ink);border:1px solid var(--rule-2);width:28px;height:28px;display:grid;place-items:center}
.exam-qn .qtype{writing-mode:vertical-rl;font-size:8px;letter-spacing:.16em}
.exam-q.bad .exam-qn .num{border-color:var(--accent);color:var(--accent)}
.exam-q.good .exam-qn .num{border-color:var(--green);color:var(--green)}
.exam-report{max-width:820px}
.er-top{display:flex;align-items:flex-end;gap:26px;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap}
.er-score{font-family:var(--mono);font-size:56px;line-height:1;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.er-score span{font-size:20px;color:var(--ink-3);margin-left:3px}
.er-verdict{font-size:13px;color:var(--accent);padding-bottom:8px;max-width:38ch}
.er-verdict.ok{color:var(--green)}
.er-tab,.tbl{width:100%;border-collapse:collapse;font-size:13px}
.er-tab th,.tbl th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 8px 0;border-bottom:1px solid var(--rule-2);font-weight:400}
.er-tab td,.tbl td{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.er-bar{display:inline-block;width:86px;height:4px;background:var(--rule);vertical-align:middle;margin-right:8px}
.er-bar i{display:block;height:100%}
.er-acts{display:flex;gap:10px;margin:22px 0 30px;flex-wrap:wrap}
.er-h{font-size:16px;margin:8px 0 18px;padding-top:18px;border-top:1px solid var(--rule-2)}
.tbl-wrap{overflow-x:auto;margin-bottom:26px}
.sec-h{font-size:17px;margin:32px 0 12px;padding-top:20px;border-top:1px solid var(--rule)}
.stats-4 .stat{min-width:140px}

/* ---------- luyện câu sai ---------- */
.empty-card{border:1px dashed var(--rule-2);padding:34px 26px;text-align:center;max-width:540px}
.empty-card p{color:var(--ink-2);font-size:13.5px;margin-bottom:16px}

/* ---------- bài giải mẫu ---------- */
.solve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:26px}
.solve-card{padding:22px 24px;background:var(--paper);transition:.15s;display:flex;flex-direction:column}
.solve-card:hover{background:var(--card)}
.solve-card h3{font-size:16.5px;margin:7px 0 8px;line-height:1.35}
.solve-card p{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-bottom:12px}
.solve-more{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:auto;padding-top:12px}
.solve-head{padding:18px 0 16px}
.solve-head h1{font-size:clamp(24px,3vw,32px);margin-top:8px}
.solve-prob{border-left:2px solid var(--accent);background:var(--card);padding:16px 20px;margin-bottom:24px}
.solve-prob p{font-size:14.5px;line-height:1.7;color:var(--ink)}
.solve-steps{border-top:1px solid var(--rule)}
.sstep{display:grid;grid-template-columns:80px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule);opacity:.32;transition:.2s;cursor:pointer}
.sstep.open{opacity:1;background:linear-gradient(to right,var(--card),transparent 70%)}
.sstep-n{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-top:4px}
.sstep-b{font-size:14px;line-height:1.72;color:var(--ink-2)}
.sstep.open .sstep-b{color:var(--ink)}
.solve-foot{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.solve-ans{margin-top:26px;border:1px solid var(--green);background:var(--green-soft);padding:18px 22px}
.solve-ans p{font-size:15px;line-height:1.7;margin-top:6px;font-weight:500}

/* ---------- flashcard ---------- */
.flash-bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px;gap:12px;flex-wrap:wrap}
.flash-wrap{perspective:1400px;max-width:640px;margin:0 auto}
.flash{display:block;width:100%;height:300px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.flash-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rule-2);background:var(--card);padding:30px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.flash-back{transform:rotateY(180deg);background:var(--card-2);border-color:var(--ink)}
.flash-q{font-size:23px;line-height:1.35;letter-spacing:-.01em}
.flash-f{font-size:19px}
.flash-f .fr,.flash-f .fx{display:block;margin:6px 0}
.flash-hint{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:auto}

/* ---------- ghi chú ca học ---------- */
.mynote{border:1px solid var(--rule);background:var(--card);margin-top:22px}
.mynote-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.mynote-st{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.mynote textarea{width:100%;border:0;background:none;padding:14px 16px;font:inherit;font-size:13.5px;line-height:1.65;color:var(--ink);resize:vertical;min-height:92px;outline:none}
.mynote textarea::placeholder{color:var(--ink-3)}
.mynote-f{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);gap:12px;flex-wrap:wrap}

/* ---------- dải công cụ ở trang chủ ---------- */
.toolbar{margin-top:26px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);margin-top:30px}
.tool{padding:20px 16px 22px 0;border-right:1px solid var(--rule);display:block;transition:.15s;position:relative}
.tool:last-child{border-right:0;padding-right:0}
.tool:hover{background:var(--card)}
.tool:hover h3{color:var(--accent)}
.tool h3{font-size:14.5px;margin:8px 0 8px;line-height:1.35;transition:.15s}
.tool p{font-size:11.5px;line-height:1.55;color:var(--ink-3)}


@media(max-width:760px){
  .toolbar{margin-top:26px;grid-template-columns:1fr 1fr}
  .tool{border-right:1px solid var(--rule);padding:16px 12px 16px 0}
  .tool:nth-child(2n){border-right:0;padding-left:14px;padding-right:0}
  .tool:nth-child(n+3){border-top:1px solid var(--rule)}
  .tool:last-child{grid-column:1/-1;border-right:0;padding-left:0;border-top:1px solid var(--rule)}
  .qcard{padding:18px 16px}
  .qst{font-size:14.5px}
  .er-score{font-size:44px}
  .exam-bar{position:static;gap:10px}
  .exam-q{grid-template-columns:26px minmax(0,1fr);gap:10px}
  .exam-qn{flex-direction:row;padding-top:18px;align-items:flex-start}
  .exam-qn .qtype{writing-mode:horizontal-tb;display:none}
  .sstep{grid-template-columns:1fr;gap:6px}
  .solve-card{padding:18px}
  .flash{height:270px}
  .flash-q{font-size:19px}
  .er-bar{width:56px}
  .stats-4 .stat{min-width:0}
}

/* =========================================================
   MÁY GIẢI — bố cục, thẻ chọn dạng, kết quả, hình vẽ, lời giải
========================================================= */
.calc-tabs{display:flex;gap:0;border-bottom:1px solid var(--rule-2);margin-top:22px;flex-wrap:wrap}
.calc-tab{padding:12px 18px 11px 0;margin-right:22px;text-align:left;border-bottom:2px solid transparent;color:var(--ink-3);font-size:13.5px}
.calc-tab i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;color:var(--ink-3)}
.calc-tab:hover{color:var(--ink)}
.calc-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.calc-tab.on i{color:var(--accent)}
.calc-body{display:grid;grid-template-columns:270px 1fr;gap:32px;padding-top:24px;align-items:start;min-width:0}
.calc-body>*{min-width:0}
.calc-pick{position:sticky;top:70px}
.tile-list{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:10px;min-width:0}
.tile{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;text-align:left;padding:11px 12px;background:var(--paper);cursor:grab}
.tile:hover{background:var(--card)}
.tile.on{background:var(--card-2);box-shadow:inset 3px 0 0 var(--accent)}
.tile-ic{grid-row:span 2;color:var(--ink-2);align-self:center;width:30px}
.tile-ic svg{width:30px;height:20px}
.tile-t{font-size:12.5px;line-height:1.35;color:var(--ink)}
.tile-d{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3)}
.drop-zone{margin-top:12px;border:1px dashed var(--rule-2);padding:18px 12px;text-align:center;transition:.15s;background:var(--card)}
.drop-zone.hot{border-color:var(--accent);background:var(--accent-soft)}
.calc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.calc-head h2{font-size:21px;line-height:1.3}
.calc-head p{font-size:12.5px;color:var(--ink-2);margin-top:7px;max-width:60ch;line-height:1.6}
.calc-form{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:10px 0 4px}
.cf-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:12.5px;transition:.15s}
.cf-l{color:var(--ink-2);line-height:1.4}
.cf-in{display:inline-flex;align-items:baseline;gap:6px}
.cf-in input{border:0;border-bottom:1px solid var(--rule-2);background:none;font-family:var(--mono);font-size:14px;text-align:right;width:96px;padding:2px 2px;color:var(--ink);outline:none}
.cf-in input:focus{border-bottom-color:var(--accent)}
.cf-in i{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);min-width:28px}
.cf-tiles{grid-column:1/-1;flex-wrap:wrap}
.cf-opts{display:flex;gap:6px;flex-wrap:wrap}
.cf-opt{border:1px solid var(--rule-2);padding:6px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-2);background:none}
.cf-opt:hover{border-color:var(--ink);color:var(--ink)}
.cf-opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.calc-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--rule-2);margin-top:22px}
.cr{padding:14px 14px 16px 0;border-bottom:1px solid var(--rule)}
.cr-k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.cr-v{font-family:var(--mono);font-size:22px;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.cr-v i{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:4px;font-family:var(--sans)}
.cr.txt .cr-v{font-family:inherit;font-size:15px;letter-spacing:0}
.calc-note{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--accent);padding:8px 12px;margin-top:14px;background:var(--accent-soft)}
.calc-fig{margin-top:24px;border:1px solid var(--rule);background:var(--card);padding:14px 16px 6px}
.calc-svg{width:100%;height:auto;display:block;color:var(--ink)}
.calc-steps .cs{display:grid;grid-template-columns:34px 1fr;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.cs-h{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink)}
.cs-n{font-family:var(--mono);font-size:9.5px;color:var(--accent);letter-spacing:.1em}
.cs-f{grid-column:2;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--card-2);display:inline-block;padding:3px 8px;border:1px solid var(--rule);justify-self:start;margin:3px 0}
.cs-c{grid-column:2;font-size:13.5px;color:var(--ink)}
.calc-actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
@media(max-width:900px){
  .calc-body{grid-template-columns:1fr;gap:20px}
  .calc-head{flex-direction:column;align-items:flex-start;gap:10px}
  .calc-head .btn{width:auto;align-self:flex-start}
  .calc-res{grid-template-columns:1fr 1fr}
  .calc-pick{position:static}
  .tile-list{display:grid;grid-template-columns:1fr 1fr;overflow-y:auto;gap:1px;max-width:100%;max-height:250px}
  .tile{min-width:0;grid-template-columns:24px 1fr;padding:9px 10px}
  .tile-ic{width:24px}.tile-ic svg{width:24px;height:16px}
  .tile-t{font-size:11.5px}.tile-d{font-size:9px}
  .calc-form{grid-template-columns:1fr}
}

/* ---------- câu dạng sắp xếp bước ---------- */
.ordlist{border-top:1px solid var(--rule)}
.ord-row{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.55;background:none;cursor:grab}
.ord-row:hover{background:var(--card-2)}
.ord-row.drag{opacity:.4}
.ord-row.right{border-left:2px solid var(--green);background:var(--green-soft);padding-left:10px}
.ord-row.wrong{border-left:2px solid var(--accent);background:var(--accent-soft);padding-left:10px}
.ord-n{font-family:var(--mono);font-size:11px;width:20px;color:var(--ink-3);flex:none;padding-top:2px}
.ord-row.right .ord-n{color:var(--green)}
.ord-row.wrong .ord-n{color:var(--accent)}
.ord-t{flex:1}
.ord-mv{display:flex;gap:2px;flex:none}
.ord-mv button{width:24px;height:22px;border:1px solid var(--rule);font-size:11px;color:var(--ink-2);background:var(--paper)}
.ord-mv button:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- câu dạng chọn hình ---------- */
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:4px 0 0}
.picktile{background:var(--card);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;cursor:grab}
.picktile:hover{background:var(--card-2)}
.picktile .tile-svg{width:100%;height:auto;color:var(--ink-2)}
.picktile.on{border-color:var(--ink);background:var(--card-2)}
.picktile.on .tile-svg{color:var(--ink)}
.picktile.right{border-color:var(--green);background:var(--green-soft)}
.picktile.wrong{border-color:var(--accent);background:var(--accent-soft)}
.picklbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3)}
.pickslot{margin-top:12px;border:1px dashed var(--rule-2);padding:16px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--card)}
.pickslot.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media(max-width:760px){.pickgrid{grid-template-columns:1fr 1fr}}

/* =========================================================
   PHIẾU IN — dành cho giáo viên
========================================================= */
.sheet-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:36px;margin-top:24px;align-items:start}
.sheet-ctrl{border-top:1px solid var(--rule)}
.sheet-ctrl .cf-row{padding:11px 0}
.chipset{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cf-toggle{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:12px 0;border-bottom:1px solid var(--rule)}
.sheet-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet-side{border-left:1px solid var(--rule);padding-left:28px}
.booklist{margin-top:10px;max-height:280px;overflow:auto}
.bookrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:12px}
.bookrow b{display:block;font-size:12.5px}
.bookrow span{display:block;color:var(--ink-3);font-family:var(--mono);font-size:10px;margin-top:3px;line-height:1.5}
.bookrow .x{font-size:16px;color:var(--ink-3);padding:0 4px}
.bookrow .x:hover{color:var(--accent)}
.sheet-paper{background:var(--paper);border:1px solid var(--rule);margin:30px 0 10px;padding:38px 44px 30px}
.paper-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.paper-head h1{font-size:24px;margin:6px 0 12px}
.paper-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.pq{margin-bottom:16px;font-size:13px;line-height:1.6;break-inside:avoid}
.pq-q b{margin-right:4px}
.pq-opts{margin:6px 0 0 22px;color:var(--ink-2)}
.pq-opts div{padding:2px 0}
.paper-key{border-top:1px solid var(--rule-2);margin-top:26px;padding-top:18px}
.pk{font-size:12px;line-height:1.55;margin-bottom:8px;display:grid;grid-template-columns:26px 74px 1fr;gap:8px}
.pk b{font-family:var(--mono)}
.pk i{font-style:normal;color:var(--ink-3)}
.paper-foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
@media(max-width:900px){
  .sheet-grid{grid-template-columns:1fr;gap:20px}
  .sheet-side{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:20px}
  .chipset{max-width:100%;justify-content:flex-start}
  .sheet-paper{padding:22px 18px}
}
@media print{
  #top,#rail,#backdrop,.foot,.no-print,.toast{display:none!important}
  html,body{background:#fff!important}
  #app,#main,.wrap,.wrap.wide{display:block!important;max-width:none!important;padding:0!important;margin:0!important}
  .sheet-paper{border:0;margin:0;padding:0}
  .paper-key{break-before:page}
  .pq{font-size:12pt}
  a{text-decoration:none;color:#000}
}

/* ---------- dải công cụ dùng chung lưới đều ---------- */
.toolbar{margin-top:30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--paper)}
.tool{background:var(--paper);padding:20px 18px 22px;box-shadow:0 0 0 1px var(--rule)}
.tool:hover{background:var(--card)}
.tool h3{font-size:14.5px;margin:8px 0;line-height:1.35}
.tool p{font-size:11.5px;line-height:1.55;color:var(--ink-3)}
@media(max-width:760px){.toolbar{margin-top:26px;grid-template-columns:1fr 1fr}.tool{padding:16px 12px}}

/* =========================================================
   MẠCH TỰ DỰNG — cây điện trở, thêm bớt tuỳ ý
========================================================= */
.build-grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:34px;margin-top:24px;align-items:start}
.build-left{min-width:0}
.build-tree{border:1px solid var(--rule);background:var(--card)}
.brow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;min-height:40px}
.brow:last-child{border-bottom:0}
.brow.is-r{background:var(--paper)}
.bkind{font-family:var(--mono);font-size:10px;width:18px;text-align:center;color:var(--accent);flex:none}
.bname{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.is-r .bname{color:var(--ink)}
.bval{width:64px;border:0;border-bottom:1px solid var(--rule-2);background:none;font-family:var(--mono);font-size:12.5px;text-align:right;padding:2px;color:var(--ink);outline:none}
.bval:focus{border-bottom-color:var(--accent)}
.bunit{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:14px}
.bcount{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.bbtns{display:flex;gap:2px;flex:none}
.bbtns button{width:24px;height:22px;border:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--ink-2);background:var(--paper)}
.bbtns button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.bbtns button:disabled{opacity:.3}
.bbtns button[data-del]:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.build-src{border:1px solid var(--rule);border-top:0;border-bottom:0;padding:4px 12px}
.build-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.build-right{min-width:0}

/* =========================================================
   DOCK — nhạc và pomodoro nổi ở hai góc
========================================================= */
.dock{position:fixed;bottom:16px;z-index:44}
.dock-l{left:16px}
.dock-r{right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}

/* ----- nhạc ----- */
.dock-pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--rule-2);padding:7px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);box-shadow:0 6px 18px rgba(23,21,15,.07)}
.dock-pill:hover{border-color:var(--ink);color:var(--ink)}
.mu-note{font-size:14px;color:var(--accent);line-height:1}
.mu-txt{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-r.open .dock-pill{display:none}
.mu-panel{width:322px;max-width:calc(100vw - 32px);max-height:min(74vh,600px);overflow:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--rule-2);box-shadow:0 18px 44px rgba(23,21,15,.16);padding:0 0 12px}
.mu-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.mu-x{font-size:16px;color:var(--ink-3);padding:0 4px}
.mu-x:hover{color:var(--accent)}
.mu-add{display:flex;gap:6px;padding:10px 12px 6px}
.mu-add input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--paper);padding:6px 8px;font:inherit;font-size:11.5px;outline:none}
.mu-add input:focus{border-color:var(--accent)}
.mu-list{max-height:128px;overflow:auto;padding:0 12px}
.mu-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:11.5px;cursor:pointer}
.mu-row:hover .mu-t{color:var(--accent)}
.mu-i{font-family:var(--mono);font-size:9px;color:var(--ink-3);width:12px}
.mu-row.on .mu-i{color:var(--accent)}
.mu-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.mu-row.on .mu-t{color:var(--ink);font-weight:500}
.mu-del{color:var(--ink-3);font-size:14px;padding:0 2px}
.mu-del:hover{color:var(--accent)}
.mu-empty{font-size:11.5px;color:var(--ink-3);padding:8px 0;line-height:1.5}
.mu-stage iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.mu-stage:not(:empty){margin-top:8px;border-top:1px solid var(--rule)}
.mu-ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px 2px}
.mu-ctrl button{width:30px;height:26px;border:1px solid var(--rule);font-size:12px;color:var(--ink-2);background:none}
.mu-ctrl button:hover{border-color:var(--ink);color:var(--ink)}
.mu-ctrl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mu-ctrl button:disabled{opacity:.35}
.mu-count{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:auto;letter-spacing:.08em}
.mu-adv{border-top:1px solid var(--rule);margin-top:8px;padding:8px 12px 0}
.mu-adv summary{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;padding:4px 0}
.mu-adv p{font-size:11px;line-height:1.55;color:var(--ink-2);margin:6px 0}
.mu-adv input{width:100%;border:1px solid var(--rule);background:var(--paper);padding:5px 7px;font-family:var(--mono);font-size:10.5px;outline:none}
.mu-adv-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.mu-adv-row .muted{font-size:10px}

/* ----- pomodoro ----- */
.pomo{width:104px;background:var(--card);border:1px solid var(--rule-2);box-shadow:0 6px 18px rgba(23,21,15,.07);padding:9px 8px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.2s}
.pomo:hover{box-shadow:0 12px 30px rgba(23,21,15,.13)}
.hg-box{width:44px;height:68px;transition:transform .7s cubic-bezier(.6,.05,.3,1)}
.hg-box.flip{transform:rotate(180deg)}
.hg{width:100%;height:100%;display:block}
.pomo-meta{display:flex;align-items:center;gap:6px;margin-top:1px}
.pomo-t{font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.pomo-play{width:20px;height:20px;border:1px solid var(--rule-2);border-radius:50%;font-size:8px;color:var(--ink-2);display:grid;place-items:center;background:none}
.pomo-play:hover{border-color:var(--ink);color:var(--ink)}
.pomo-ph{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pomo.rest .pomo-ph{color:var(--green)}
.pomo.running .pomo-t{color:var(--accent)}
.pomo.rest.running .pomo-t{color:var(--green)}
.pomo-modes{display:none;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.pomo:hover .pomo-modes,.pomo:focus-within .pomo-modes{display:flex}
.pomo-modes button{font-family:var(--mono);font-size:8.5px;padding:3px 4px;border:1px solid var(--rule);color:var(--ink-3);background:none}
.pomo-modes button:hover{border-color:var(--ink);color:var(--ink)}
.pomo-modes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pomo-dots{display:flex;gap:3px}
.pomo-dots i{width:4px;height:4px;background:var(--green);border-radius:50%;display:block}

@media(max-width:760px){
  .dock-r.open ~ .dock-l{display:none}
  .build-grid{grid-template-columns:1fr;gap:18px}
  .dock{bottom:10px}
  .dock-l{left:10px}
  .dock-r{right:10px}
  .pomo{width:86px}
  .hg-box{width:36px;height:56px}
  .pomo-t{font-size:11.5px}
  .mu-panel{width:calc(100vw - 24px)}
  .mu-list{max-height:96px}
}
#main code{overflow-wrap:anywhere;white-space:pre-wrap}
#main .qa-a,#main .qa-q{overflow-wrap:anywhere}
.mynote textarea{min-height:112px}

/* =========================================================
   NGÂN HÀNG ĐỀ — lọc, thẻ, kho tải
========================================================= */
.pstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:24px 0 20px}
.pstat{padding:14px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.pstat:last-child{border-right:0}
.pstat b{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}
.pstat span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pfilter{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:6px 11px;border:1px solid var(--rule);color:var(--ink-2);background:var(--card)}
.pchips button:hover{border-color:var(--ink);color:var(--ink)}
.pchips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prow select,.prow .pq{border:1px solid var(--rule);background:var(--card);font:inherit;font-size:12px;padding:7px 9px;color:var(--ink);outline:none;min-width:0}
.prow select:focus,.prow .pq:focus{border-color:var(--accent)}
.prow .pq{flex:1;min-width:180px;max-width:320px}
.pstar{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:6px;border:1px solid var(--rule);padding:7px 10px;background:var(--card)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.pcard{background:var(--card);padding:15px 16px 12px;display:flex;flex-direction:column;gap:7px;position:relative;min-width:0}
.pcard.star{background:linear-gradient(0deg,var(--card),var(--card)) padding-box,linear-gradient(180deg,#e7d9c6,#f7f2e6) border-box}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pc-y{font-family:var(--mono);font-size:10px;color:var(--accent)}
.pcard h4{margin:0;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.pc-note{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5;word-spacing:.04em}
.pc-note .st{color:var(--accent);font-weight:500;font-size:10.5px;font-family:var(--mono);letter-spacing:.03em}
.pc-tags{display:flex;flex-wrap:wrap;gap:4px}
.pc-tags span{font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;color:var(--ink-2);border:1px solid var(--rule);padding:2px 5px;background:var(--paper)}
.pc-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.pc-b{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 8px}
.pc-b:hover{background:var(--accent);border-color:var(--accent)}
.pc-b.ghost{background:none;color:var(--ink-2);border-color:var(--rule-2)}
.pc-b.ghost:hover{color:var(--ink);border-color:var(--ink);background:none}
.pc-src{font-family:var(--mono);font-size:8px;letter-spacing:.03em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pempty{padding:32px 0;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:12px}
.phubs{margin-top:34px;border-top:1px solid var(--rule);padding-top:16px}
.ph-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.ph-h h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
.ph-h span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.phub{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.phub:hover{background:var(--card-2)}
.ph-src{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.phub b{font-weight:500;font-size:13px}
.ph-d{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:right}
@media(max-width:900px){
  .pstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pstat:nth-child(3){border-right:0}
  .pstat:nth-child(n+4){border-top:1px solid var(--rule)}
  .prow .pq{max-width:none;flex:1 1 100%}
  .pcards{grid-template-columns:1fr}
  .phub{grid-template-columns:1fr;gap:2px}
  .ph-d{text-align:left}
}

/* =========================================================
   PHÒNG THÍ NGHIỆM
========================================================= */
.lab-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);margin:22px 0 18px;background:var(--rule);gap:1px}
.lab-tabs button{background:var(--card);text-align:left;padding:11px 13px;display:flex;flex-direction:column;gap:1px;min-width:0}
.lab-tabs button:hover{background:var(--card-2)}
.lab-tabs button.on{background:var(--ink);color:var(--paper)}
.lab-tabs b{font-family:var(--serif);font-size:15px;font-weight:600}
.lab-tabs span{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
.lab-stage{min-width:0;border:1px solid var(--rule);background:var(--card);padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.lab-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lab-modes{display:flex;gap:4px;flex-wrap:wrap}
.lab-modes button{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;border:1px solid var(--rule);padding:4px 8px;color:var(--ink-2)}
.lab-modes button:hover{border-color:var(--ink);color:var(--ink)}
.lab-modes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lab-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lab-svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--rule-2);touch-action:none}
.lab-svg *{user-select:none}
.lab-hint{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.lab-hint b{color:var(--ink-2);font-weight:500}
.lab-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.lab-panel{border:1px solid var(--rule);background:var(--card);padding:12px 13px;min-width:0}
.lab-read{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 10px}
.lab-read div{display:flex;flex-direction:column;gap:1px;min-width:0}
.lab-read b{font-family:var(--mono);font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab-read span{font-family:var(--mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.lab-note{font-size:11.5px;line-height:1.55;color:var(--ink-2)}
.lab-formula{font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--ink-2);border-left:2px solid var(--accent);padding:2px 0 2px 9px;margin-top:8px;overflow-wrap:anywhere}
.lab-fit{font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.lab-fit b{font-family:var(--mono);font-size:14px;color:var(--accent)}
.lab-tbl{width:100%;border-collapse:collapse;margin-top:6px;font-family:var(--mono);font-size:10.5px}
.lab-tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--rule);padding:4px 3px}
.lab-tbl td{padding:4px 3px;border-bottom:1px solid var(--rule);color:var(--ink-2)}
.lab-tbl td.dim{color:var(--ink-3);font-family:var(--sans);font-size:11px}
.lab-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border:1px solid var(--rule);border-top:0;background:var(--card-2);padding:10px 13px;margin-top:0}
.lab-ctl-h{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-right:8px;border-right:1px solid var(--rule);height:20px;display:flex;align-items:center}
.lab-ctl label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-2)}
.lab-ctl input[type=range]{width:112px;accent-color:var(--accent);height:16px}
.lab-ctl span{font-family:var(--mono);font-size:10px;color:var(--ink);min-width:52px}
.lab-ctl select{font:inherit;font-size:10.5px;border:1px solid var(--rule);background:var(--card);padding:3px 5px}
.lab-wide{margin-top:16px}
.lab-sheet{border-top:1px solid var(--rule);margin-top:12px;padding-top:8px}
.lab-sheet summary{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;padding:3px 0}
.lab-sheet summary:hover{color:var(--accent)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.sheet-grid p{font-size:11.5px;line-height:1.5;margin:2px 0 0;color:var(--ink-2)}
.sheet-steps{font-size:11.5px;line-height:1.6;color:var(--ink-2);margin:6px 0;padding-left:18px}
.sheet-steps li{margin-bottom:3px}
.sheet-ask{font-size:11.5px;line-height:1.55;color:var(--accent);border-top:1px dashed var(--rule-2);padding-top:7px;margin:6px 0 0}
.lab-graph{width:100%;height:auto;display:block;margin-top:4px}
@media(max-width:1080px){
  .lab-grid{grid-template-columns:1fr}
  .lab-tabs{grid-template-columns:1fr 1fr}
  .sheet-grid{grid-template-columns:1fr}
  .lab-ctl{gap:10px}
  .lab-ctl input[type=range]{width:88px}
}
@media(max-width:560px){
  .lab-read b{font-size:15px}
  .lab-ctl label{font-size:9px}
  .lab-ctl input[type=range]{width:72px}
}
.lab-graph{max-width:760px}
.lab-wide{padding-bottom:14px}


/* =========================================================
   LEARNING ENGINE — hôm nay, kế hoạch, hộp ôn
========================================================= */
.today{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;
  border:1px solid var(--rule);border-left:2px solid var(--accent);background:var(--card);
  padding:14px 18px;margin:18px 0 4px}
.today-ring{position:relative;width:52px;height:52px;display:grid;place-items:center}
.today-ring svg{position:absolute;inset:0;width:52px;height:52px}
.today-ring b{font-family:var(--mono);font-size:15px;font-weight:500}
.today-txt h3{margin:4px 0 3px;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
.today-txt p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
.today-txt p b{color:var(--accent);font-weight:600}
.today-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.today-streak{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
@media(max-width:820px){
  .today{grid-template-columns:52px 1fr;gap:12px}
  .today-act{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .today-txt h3{font-size:15.5px}
}

.plan{border:1px solid var(--rule);background:var(--card);padding:16px 18px;margin:22px 0 6px}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.plan-h .muted{font-family:var(--mono);font-size:9px;letter-spacing:.06em}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.plan-col h4{margin:0 0 8px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.plan-row{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.plan-row:last-child{border-bottom:0}
.plan-n{font-family:var(--mono);font-size:9px;color:var(--accent);border:1px solid var(--rule);width:20px;height:20px;display:grid;place-items:center}
.plan-row b{display:block;font-size:12.5px;font-weight:500;line-height:1.35}
.plan-row .muted{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.plan-a{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);white-space:nowrap}
.plan-a:hover{color:var(--accent);border-color:var(--accent)}
.srs-bars{display:flex;flex-direction:column;gap:6px}
.srs-row{display:grid;grid-template-columns:104px 1fr 26px;gap:8px;align-items:center}
.srs-k{font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;color:var(--ink-3)}
.srs-bar{height:7px;background:var(--card-2);border:1px solid var(--rule);display:block;position:relative}
.srs-bar i{display:block;height:100%;background:var(--green)}
.srs-v{font-family:var(--mono);font-size:10px;text-align:right;color:var(--ink-2)}
@media(max-width:820px){.plan-grid{grid-template-columns:1fr;gap:18px}}

.srs-strip{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px}
.srs-strip span{font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--ink-2);
  border:1px solid var(--rule);padding:5px 9px;background:var(--card)}
.srs-strip span b{color:var(--ink);font-size:11px;margin-right:3px}
.srs-strip span.dim{color:var(--ink-3);opacity:.55}

.exam-resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--rule);
  border-left:2px solid var(--green);background:var(--green-soft);padding:10px 14px;margin-bottom:16px}
.exam-resume .kicker{color:var(--green)}
.exam-resume b{flex:1;font-size:12.5px;font-weight:500}
.ov-row.on{background:var(--card-2)}
.ov-row .d{margin-left:auto}

/* =========================================================
   EXAM COCKPIT — lưới nhảy câu, cờ, phím tắt
========================================================= */
.exam-map{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 22px;padding:9px 11px;
  border:1px solid var(--rule);background:var(--card)}
.em{width:25px;height:25px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink-3);cursor:pointer;transition:.12s}
.em:hover{border-color:var(--rule-2);color:var(--ink)}
.em.done{background:var(--green-soft);border-color:#a9c2ae;color:var(--green);font-weight:600}
.em.flag{box-shadow:inset 0 -2px 0 var(--accent)}
.em.cur{outline:1.5px solid var(--ink);outline-offset:1px;color:var(--ink)}
.em-l{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--ink-3);padding-left:8px}
.exam-keys{margin:-14px 0 24px;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3);line-height:1.7}
.exam-keys b{color:var(--ink-2);font-weight:500;border:1px solid var(--rule);padding:1px 4px;background:var(--card)}
.exam-q{scroll-margin-top:120px;transition:box-shadow .18s}
.exam-q.cur{box-shadow:inset 2px 0 0 var(--accent)}
.exam-q .qcard:focus{outline:none}
.exam-q .opt:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.er-weak{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
.er-weak .kicker{margin-right:4px}
.chip-btn{font-family:var(--sans);font-size:11.5px;border:1px solid var(--rule);background:var(--paper);
  color:var(--ink-2);padding:5px 10px;cursor:pointer;border-radius:0}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.em-l{white-space:nowrap}
@media(max-width:640px){.exam-map{gap:3px}.em{width:23px;height:23px;font-size:9.5px}.em-l{width:100%;margin:4px 0 0}}

/* ô điền số: nhận cả đơn vị, cảnh báo sai đơn vị, hiện dung sai */
.uunit{display:none;margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--accent);
  border-left:2px solid var(--accent);padding:4px 9px;background:var(--card-2)}
.numbox input{width:132px}
.exp .tol{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-style:normal}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:shk .38s ease}

/* QA: nhóm chủ đề gập lại, mở dần */
.qa-glist{display:flex;flex-direction:column;gap:0}
.qa-more{width:100%;margin:10px 0 0;padding:9px;border:1px dashed var(--rule-2);background:transparent;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.qa-more:hover{color:var(--accent);border-color:var(--accent);background:var(--card)}

/* =========================================================
   LAB — cảnh báo, cân, sổ ghi chép, thanh Q
========================================================= */
.lab-alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.lab-alert{font-size:11.5px;line-height:1.5;padding:8px 11px;border:1px solid var(--rule);border-left:2px solid var(--accent);background:var(--card)}
.lab-alert b{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.lab-alert.nóng{border-left-color:#b06a22}
.lab-alert.quá{border-left-color:var(--accent)}
.lab-ok{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--green);
  border:1px solid #b9cdbd;background:var(--green-soft);padding:7px 10px;margin-bottom:12px}
.lab-read-2{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.lab-book{margin-top:18px}
.lab-book-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lab-book-acts{display:flex;gap:6px}
.lab-book-t td.mono{font-size:10.5px}
.log-del{width:18px;height:18px;border:1px solid var(--rule);background:none;color:var(--ink-3);font-size:12px;line-height:1;cursor:pointer}
.log-del:hover{border-color:var(--accent);color:var(--accent)}
.qbars{display:flex;flex-direction:column;gap:5px;margin:10px 0 12px}
.qbar{display:grid;grid-template-columns:118px 1fr 56px;gap:8px;align-items:center}
.qbar span{font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;color:var(--ink-3);line-height:1.3}
.qbar i{display:block;height:9px;background:var(--accent);opacity:.8}
.qbar.thu i{background:var(--green)}
.qbar b{font-family:var(--mono);font-size:10px;text-align:right;color:var(--ink-2);font-weight:500}
.qnote{margin:4px 0 0;font-size:11px;color:var(--ink-3);line-height:1.5}
@media(max-width:560px){.qbar{grid-template-columns:88px 1fr 48px}}

/* =========================================================
   A11Y — bàn phím, skip link, giảm chuyển động
