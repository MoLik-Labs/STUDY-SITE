name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` chạy hook prepare → dựng lại dist/ từ site/ và src/ (Vật lí).
      - name: Cài đặt và dựng dist/
        run: npm ci --no-audit --no-fund

      - name: Bản dist/ phải khớp với bản đã commit
        run: git diff --exit-code -- dist/

      - name: Kiểm thử (dữ liệu, logic, giao diện, build, Worker, CSP, sw.js)
        run: npm test

      - name: Cloudflare — cấu hình Worker hợp lệ (dry-run, không deploy)
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wrangler-dry
