# Cloudflare Pages — cấu hình để deploy bằng Wrangler (tuỳ chọn).
#
# Cách 1 (khuyên dùng, không cần tệp này): nối repo trên Cloudflare Dashboard
#   Workers & Pages → Create → Pages → Connect to Git
#   Build command : python3 src/build.py --dist
#   Output         : dist
#
# Cách 2: deploy từ máy
#   npx wrangler pages deploy dist
#
# Pages Functions nằm ở thư mục functions/ ở gốc repo. Khi dùng "Cách 1",
# Cloudflare tự tìm thấy; khi dùng "Cách 2", Wrangler cũng đọc functions/ từ
# thư mục làm việc hiện tại.

name = "vat-li-9-study-os"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Không dùng binding nào: trang không cần D1, KV, R2 hay biến bí mật.
# Nếu sau này thêm, khai ở đây và trong Dashboard (Settings → Functions).
