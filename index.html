      const label = isR ? 'Điện trở' : (n.type === 'series' ? 'Nối tiếp' : 'Song song');
      const lim = depth >= 5;
      return `<div class="brow${isR ? ' is-r' : ''}" style="padding-left:${depth * 22}px" data-p="${p}">
        <span class="bkind">${kind}</span>
        <span class="bname">${label}</span>
        ${isR ? `<input class="bval" type="number" step="any" min="0" value="${n.v}" data-v="${p}"><span class="bunit">Ω</span>` : `<span class="bcount">${n.children.length} phần tử</span>`}
        <span class="bbtns">
          ${isR ? '' : `<button data-add-r="${p}" title="Thêm điện trở">+R</button>
          <button data-add-s="${p}" title="Thêm nhóm nối tiếp" ${lim ? 'disabled' : ''}>+—</button>
          <button data-add-p="${p}" title="Thêm nhóm song song" ${lim ? 'disabled' : ''}>+∥</button>`}
          <button data-up="${p}" title="Lên" ${path.length && path[path.length - 1] > 0 ? '' : 'disabled'}>↑</button>
          <button data-dn="${p}" title="Xuống">↓</button>
          <button data-del="${p}" title="Xoá" ${path.length ? '' : 'disabled'}>×</button>
        </span>
      </div>`;
    }).join('');
    wireTree();
  };

  const refresh = () => { save(); renderBuild(); };

  const wireTree = () => {
    $$('#buildTree [data-v]').forEach(inp => inp.onchange = () => {
      const n = nodeAt(cfg.root, inp.dataset.v.split('.').map(Number));
      n.v = Math.max(0, parseFloat(inp.value.replace(',', '.')) || 0);
      refresh();
    });
    $$('#buildTree [data-add-r]').forEach(b => b.onclick = () => {
      const path = b.dataset.addR === '' ? [] : b.dataset.addR.split('.').map(Number);
      nodeAt(cfg.root, path).children.push({ id: uid(), type: 'R', v: 10 });
      refresh();
    });
    $$('#buildTree [data-add-s]').forEach(b => b.onclick = () => {
      const path = b.dataset.addS === '' ? [] : b.dataset.addS.split('.').map(Number);
      nodeAt(cfg.root, path).children.push({ id: uid(), type: 'series', children: [{ id: uid(), type: 'R', v: 10 }, { id: uid(), type: 'R', v: 10 }] });
      refresh();
    });
    $$('#buildTree [data-add-p]').forEach(b => b.onclick = () => {
      const path = b.dataset.addP === '' ? [] : b.dataset.addP.split('.').map(Number);
      nodeAt(cfg.root, path).children.push({ id: uid(), type: 'parallel', children: [{ id: uid(), type: 'R', v: 10 }, { id: uid(), type: 'R', v: 10 }] });
      refresh();
    });
    $$('#buildTree [data-del]').forEach(b => b.onclick = () => {
      const path = b.dataset.del === '' ? [] : b.dataset.del.split('.').map(Number);
      if (!path.length) return;
      const par = parentAt(cfg.root, path);
      par.children.splice(path[path.length - 1], 1);
      if (!par.children.length) {
        // keep the structure valid
        const pp = path.slice(0, -1);
        if (!pp.length) { par.children.push({ id: uid(), type: 'R', v: 10 }); }
      }
      refresh();
    });
    $$('#buildTree [data-up]').forEach(b => b.onclick = () => {
      const path = b.dataset.up.split('.').map(Number);
      const i = path[path.length - 1];
      if (i <= 0) return;
      const par = parentAt(cfg.root, path);
      [par.children[i - 1], par.children[i]] = [par.children[i], par.children[i - 1]];
      refresh();
    });
    $$('#buildTree [data-dn]').forEach(b => b.onclick = () => {
      const path = b.dataset.dn.split('.').map(Number);
      const i = path[path.length - 1];
      const par = parentAt(cfg.root, path);
      if (i >= par.children.length - 1) return;
      [par.children[i + 1], par.children[i]] = [par.children[i], par.children[i + 1]];
      refresh();
    });
  };
  drawTree();

  $$('[data-src]').forEach(inp => inp.oninput = () => {
    cfg[inp.dataset.src] = Math.max(0, parseFloat(inp.value.replace(',', '.')) || 0);
    save(); update();
  });

  const update = () => {
    const s = buildSolve(cfg);
    $('#buildRes').innerHTML = [
      { l: 'R tương đương', v: s.Req, u: 'Ω' },
      { l: 'I toàn mạch', v: s.I, u: 'A' },
      { l: 'U hai đầu mạch', v: s.Uext, u: 'V' },
      { l: 'Công suất tiêu thụ', v: s.Pload, u: 'W' }
    ].map(o => `<div class="cr"><span class="cr-k">${o.l}</span><span class="cr-v">${f2(o.v)}<i>${o.u}</i></span></div>`).join('');
    $('#buildFig').innerHTML = `<div class="kicker">Hình vẽ tự động</div>${svgBuild(cfg, Object.assign({}, s, { nodes: nodesInOrder(cfg.root) }))}`;
    $('#buildTab').innerHTML = `<thead><tr><th>Điện trở</th><th>R (Ω)</th><th>I (A)</th><th>U (V)</th><th>P (W)</th></tr></thead>
      <tbody>${s.rows.map(r => `<tr><td>${r.n}</td><td class="mono">${f2(r.R)}</td><td class="mono">${f3(r.I)}</td><td class="mono">${f2(r.U)}</td><td class="mono">${f2(r.P)}</td></tr>`).join('')}</tbody>`;
  };
  update();

  const load = (obj) => { state.build = obj; save(); renderBuild(); };
  $('#bSample1').onclick = () => load({
    root: { id: uid(), type: 'series', children: [
      { id: uid(), type: 'R', v: 6 },
      { id: uid(), type: 'parallel', children: [{ id: uid(), type: 'R', v: 12 }, { id: uid(), type: 'R', v: 12 }] }
    ] }, U: 12, r: 0
  });
  $('#bSample2').onclick = () => load({
    root: { id: uid(), type: 'parallel', children: [
      { id: uid(), type: 'R', v: 6 },
      { id: uid(), type: 'series', children: [{ id: uid(), type: 'R', v: 4 }, { id: uid(), type: 'R', v: 8 }] },
      { id: uid(), type: 'R', v: 12 }
    ] }, U: 24, r: 1
  });
  $('#bSample3').onclick = () => load({
    root: { id: uid(), type: 'series', children: [
      { id: uid(), type: 'R', v: 10 },
      { id: uid(), type: 'parallel', children: [
        { id: uid(), type: 'series', children: [{ id: uid(), type: 'R', v: 20 }, { id: uid(), type: 'R', v: 30 }] },
        { id: uid(), type: 'series', children: [{ id: uid(), type: 'R', v: 30 }, { id: uid(), type: 'R', v: 20 }] }
      ] }
    ] }, U: 12, r: 0
  });
  $('#bClear').onclick = () => load({ root: { id: uid(), type: 'series', children: [{ id: uid(), type: 'R', v: 10 }] }, U: cfg.U, r: cfg.r });
  $('#buildSave').onclick = () => {
    const s = buildSolve(cfg);
    state.book = state.book || [];
    state.book.unshift({
      id: 'build', name: 'Mạch tự dựng (' + s.rows.length + ' điện trở)',
      vals: { U: cfg.U, r: cfg.r, R: s.Req },
      out: `R_tđ = ${f2(s.Req)} Ω · I = ${f3(s.I)} A · U = ${f2(cfg.U)} V`, at: Date.now()
    });
    state.book = state.book.slice(0, 30);
    save(); toast('Đã lưu vào phiếu của tôi');
  };
}

/* nodes in drawing order (for labels) */
function nodesInOrder(n, out) {
  out = out || [];
  if (n.type === 'R') { out.push(n.id); return out; }
  n.children.forEach(c => nodesInOrder(c, out));
  return out;
}

/* =========================================================
   BĂNG THÍ NGHIỆM — 3 bàn tương tác kiểu PhET, tự căn hình
   refr  : khúc xạ · phản xạ toàn phần
   shadow: bóng tối · bóng nửa tối
   energy: động năng · thế năng · ma sát
   Code in English, UI in Vietnamese.
   ========================================================= */

const SIM_DEF = { st: 'refr', th1: 42, n1: 1.0, n2: 1.33, rs: 22, xo: 330, ho: 62, h0: 1.6, m: 0.5, mu: 0.25, run: false, _s: 0 };
function simState() {
  if (!state.sim) state.sim = JSON.parse(JSON.stringify(SIM_DEF));
  const s = state.sim;
  Object.keys(SIM_DEF).forEach(k => { if (s[k] === undefined) s[k] = SIM_DEF[k]; });
  return s;
}
const SIM_TABS = [
  ['refr', 'Khúc xạ', 'Tia sáng đổi hướng khi qua mặt nước'],
  ['shadow', 'Bóng tối', 'Nguồn sáng · vật cản · màn'],
  ['energy', 'Động năng', 'Dốc nghiêng · ma sát · năng lượng']
];
const SIM_MED = [['Không khí', 1.0], ['Nước', 1.33], ['Thuỷ tinh', 1.5], ['Kim cương', 2.42]];

const simNum = (x, n) => {
  if (!isFinite(x)) return '—';
  const k = n === undefined ? 2 : n;
  let t = (+x).toFixed(k);
  if (t.indexOf('.') >= 0) t = t.replace(/0+$/, '').replace(/\.$/, '');
  return t === '-0' ? '0' : t.replace('.', ',');
};

/* =========================================================
   A · KHÚC XẠ
   ========================================================= */
function simRefrBody(S) {
  const W = 720, H = 430, cy = 210, cx = 372;
  const d2r = Math.PI / 180;
  const th1 = Math.max(0, Math.min(89, +S.th1));
  const n1 = Math.max(1, Math.min(2.5, +S.n1)), n2 = Math.max(1, Math.min(2.5, +S.n2));
  const sin2 = n1 * Math.sin(th1 * d2r) / n2;
  const tir = sin2 > 1;
  const th2 = tir ? NaN : Math.asin(Math.min(1, sin2)) / d2r;
  const L = 175;
  const R = (a, side) => ({
    x: cx + side * Math.sin(a * d2r) * L,
    y: cy - Math.cos(a * d2r) * L
  });
  const R2 = (a, side) => ({
    x: cx + side * Math.sin(a * d2r) * L,
    y: cy + Math.cos(a * d2r) * L
  });
  const inc = R(th1, -1);              /* tia tới đi từ trên-trái xuống */
  const ref = R(th1, 1);               /* phản xạ lên trên-phải */
  const refr = tir ? null : R2(th2, 1);
  const nm = a => simNum(a, 0);
  const fmt = v => (+v).toFixed(2).replace('.', ',');
  const nameOf = n => Math.abs(n - 1) < 0.02 ? 'không khí' : n < 1.4 ? 'nước' : n < 1.8 ? 'thuỷ tinh' : 'kim cương';
  const crit = n1 > n2 ? Math.asin(n2 / n1) / d2r : null;
  const arc = (a, side, up, col) => {
    const r = 62, t = a * d2r;
    const ex = cx + side * Math.sin(t) * r, ey = cy - (up ? 1 : -1) * Math.cos(t) * r;
    return `<path d="M${cx} ${cy - (up ? r : -r)} A${r} ${r} 0 0 ${side > 0 ? (up ? 1 : 0) : (up ? 0 : 1)} ${ex} ${ey}" fill="none" stroke="${col}" stroke-width="1.1" opacity=".65"/>`;
  };
  const lbl = (a, side, up, text, cls) => {
    /* như hình trong sách: nhãn nằm sát pháp tuyến, hai bên trục */
    const r = 86, t = Math.min(60, a / 2) * d2r;
    const y = cy + (up ? -1 : 1) * Math.max(34, Math.cos(t) * r);
    const x = cx + (side < 0 ? -40 : 40);
    return `<text x="${x}" y="${y}" text-anchor="${side < 0 ? 'end' : 'start'}" class="${cls}">${text}</text>`;
  };

  return `<div class="sim-stage">
    <svg viewBox="0 0 ${W} ${H}" class="sim-svg" id="simSvg" role="img" aria-label="Khúc xạ ánh sáng">
      <defs>
        <linearGradient id="simWaterG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4b93b6" stop-opacity=".20"/>
          <stop offset="1" stop-color="#4b93b6" stop-opacity=".07"/>
        </linearGradient>
        <marker id="mkInk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker>
        <marker id="mkAcc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
        <marker id="mkDim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="var(--ink-3)"/></marker>
      </defs>
      <rect width="${W}" height="${H}" fill="var(--paper)"/>
      <rect x="0" y="${cy}" width="${W}" height="${H - cy}" fill="url(#simWaterG)"/>
      <line x1="0" y1="${cy}" x2="${W}" y2="${cy}" stroke="var(--ink)" stroke-width="1.6"/>
      <text x="18" y="${cy - 14}" class="sim-lab">${nameOf(n1).toUpperCase()} · n₁ = ${fmt(n1)}</text>
      <text x="18" y="${cy + 22}" class="sim-lab">${nameOf(n2).toUpperCase()} · n₂ = ${fmt(n2)}</text>
      <line x1="${cx}" y1="${cy - 168}" x2="${cx}" y2="${cy + 168}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="6 5" opacity=".8"/>
      <text x="${cx + 7}" y="${cy - 160}" class="sim-lab">pháp tuyến</text>

      ${arc(th1, -1, true, 'var(--ink-2)')}
      ${tir ? '' : arc(th2, 1, false, 'var(--accent)')}
      ${th1 > 4 ? arc(th1, 1, true, 'var(--ink-3)') : ''}
      ${lbl(th1, -1, true, 'i = ' + nm(th1) + '°', 'sim-val')}
      ${tir ? '' : lbl(th2, 1, false, 'r = ' + simNum(th2, 1) + '°', 'sim-val acc')}

      <line x1="${inc.x}" y1="${inc.y}" x2="${cx}" y2="${cy}" stroke="var(--ink)" stroke-width="2" marker-end="url(#mkInk)"/>
      <text x="${inc.x + 4}" y="${inc.y - 8}" class="sim-tag">tia tới</text>

      <line x1="${cx}" y1="${cy}" x2="${ref.x}" y2="${ref.y}" stroke="var(--ink-2)" stroke-width="1.6"
        stroke-dasharray="${tir ? '0' : '6 4'}" marker-end="url(#mkDim)"/>
      <text x="${ref.x + 6}" y="${ref.y - 6}" class="sim-tag dim">tia phản xạ${tir ? ' toàn phần' : ''}</text>

      ${tir ? '' : `<line x1="${cx}" y1="${cy}" x2="${refr.x}" y2="${refr.y}" stroke="var(--accent)" stroke-width="2" marker-end="url(#mkAcc)"/>
      <text x="${refr.x + 8}" y="${refr.y + 4}" class="sim-tag acc">tia khúc xạ</text>`}

      <circle cx="${cx}" cy="${cy}" r="4.2" fill="var(--ink)"/>
      <circle cx="${cx}" cy="${cy}" r="8" fill="none" stroke="var(--ink)" stroke-width=".8" opacity=".35"/>
      ${tir ? `<text x="${W / 2}" y="${H - 18}" text-anchor="middle" class="sim-warn">i &gt; góc giới hạn ${simNum(crit, 1)}° ⇒ phản xạ toàn phần, không có tia khúc xạ</text>`
      : crit !== null ? `<text x="${W - 18}" y="${H - 18}" text-anchor="end" class="sim-lab">góc giới hạn ≈ ${simNum(crit, 1)}°</text>` : ''}
    </svg>
  </div>`;
}

function simRefrCtl(S) {
  return `<div class="sim-panel">
    <span class="kicker">Thay đổi</span>
    <label class="sim-row"><span>Góc tới i</span><input type="range" id="sTh1" min="0" max="89" step="1" value="${S.th1}"><b id="sTh1V">${S.th1}°</b></label>
    <div class="kicker" style="margin-top:14px">Môi trường trên (tia tới đi ra từ đây)</div>
    <div class="sim-chips">${SIM_MED.map(([n, v]) => `<button data-n1="${v}" class="${Math.abs(S.n1 - v) < 0.01 ? 'on' : ''}">${n} · ${simNum(v, 2)}</button>`).join('')}</div>
    <div class="kicker" style="margin-top:14px">Môi trường dưới</div>
    <div class="sim-chips">${SIM_MED.map(([n, v]) => `<button data-n2="${v}" class="${Math.abs(S.n2 - v) < 0.01 ? 'on' : ''}">${n} · ${simNum(v, 2)}</button>`).join('')}</div>
    <div class="sim-btns"><button class="btn ghost sm" id="sRec">Ghi vào sổ thí nghiệm</button></div>
    <div class="sim-note" id="simNote"></div>
  </div>`;
}

/* =========================================================
   B · BÓNG TỐI
   ========================================================= */
function shadowGeom(S) {
  const W = 720, H = 420, cy = 196, xs = 96, xScr = 652;
  const rs = Math.max(1, +S.rs), xo = Math.max(180, Math.min(560, +S.xo)), ho = Math.max(12, +S.ho);
  const at = (ya, yb) => {                       /* nối (xs, ya) qua (xo, yb) tới màn */
    const t = (xScr - xs) / (xo - xs);
    return ya + (yb - ya) * t;
  };
  /* bóng tối: tia từ mép XA của nguồn qua mép vật. nửa tối: tia từ mép gần. */
  const umT = at(cy - rs, cy - ho), umB = at(cy + rs, cy + ho);
  const penT = at(cy + rs, cy - ho), penB = at(cy - rs, cy + ho);
  const hasUmBra = umT < umB;
  return { W, H, cy, xs, xScr, rs, xo, ho, penT, penB, umT, umB, hasUmBra, scale: 0.4 };
}

function simShadowBody(S) {
  const g = shadowGeom(S);
  const rays = [];
  const pts = [[g.cy - g.rs, g.cy - g.ho], [g.cy + g.rs, g.cy + g.ho], [g.cy + g.rs, g.cy - g.ho], [g.cy - g.rs, g.cy + g.ho]];
  pts.forEach(([a, b], i) => {
    const t = (g.xScr - g.xs) / (g.xo - g.xs);
    const yEnd = a + (b - a) * t;
    rays.push(`<line x1="${g.xs}" y1="${a}" x2="${g.xScr}" y2="${yEnd}" stroke="var(--accent)" stroke-width=".9" opacity="${i === 2 ? .55 : .38}"/>`);
  });
  const clipped = (v) => Math.max(40, Math.min(g.H - 40, v));
  return `<div class="sim-stage">
    <svg viewBox="0 0 ${g.W} ${g.H}" class="sim-svg" id="simSvg" role="img" aria-label="Bóng tối và bóng nửa tối">
      <rect width="${g.W}" height="${g.H}" fill="var(--paper)"/>
      <rect x="${g.xScr}" y="26" width="16" height="${g.H - 52}" fill="var(--card)" stroke="var(--ink-2)" stroke-width="1.3"/>
      <text x="${g.xScr + 8}" y="20" text-anchor="middle" class="sim-lab">màn</text>
      ${rays.join('')}
      ${g.hasUmBra ? `<rect x="${g.xScr + 1}" y="${clipped(g.penT)}" width="14" height="${Math.max(2, clipped(g.penB) - clipped(g.penT))}" fill="var(--ink)" opacity=".16"/>` : ''}
      ${g.hasUmBra ? `<rect x="${g.xScr + 1}" y="${clipped(g.umT)}" width="14" height="${Math.max(2, clipped(g.umB) - clipped(g.umT))}" fill="var(--ink)" opacity=".85"/>` : `<rect x="${g.xScr + 1}" y="${clipped(g.penT)}" width="14" height="${Math.max(2, clipped(g.penB) - clipped(g.penT))}" fill="var(--ink)" opacity=".85"/>`}
      <g id="simLamp">
        <circle cx="${g.xs}" cy="${g.cy}" r="${g.rs + 7}" fill="url(#simLampG)"/>
        <line x1="${g.xs}" y1="${g.cy - g.rs}" x2="${g.xs}" y2="${g.cy + g.rs}" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
        <text x="${g.xs}" y="${g.cy - g.rs - 14}" text-anchor="middle" class="sim-lab">nguồn sáng</text>
      </g>
      <defs><radialGradient id="simLampG"><stop offset="0" stop-color="#ffd88a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient></defs>
      <g id="simBlocker" style="cursor:grab">
        <rect x="${g.xo - 5}" y="${g.cy - g.ho}" width="10" height="${g.ho * 2}" fill="var(--ink)" stroke="var(--accent)" stroke-width="1.4"/>
        <rect x="${g.xo - 22}" y="${g.cy - g.ho - 10}" width="44" height="${g.ho * 2 + 20}" fill="transparent"/>
        <text x="${g.xo}" y="${g.cy + g.ho + 22}" text-anchor="middle" class="sim-tag">vật cản · kéo ngang</text>
      </g>
      <line x1="${g.xScr - 12}" y1="${clipped(g.umT)}" x2="${g.xScr - 12}" y2="${clipped(g.umB)}" stroke="var(--ink)" stroke-width="1"/>
      <text x="${g.xScr - 20}" y="${(clipped(g.umT) + clipped(g.umB)) / 2 + 3}" text-anchor="end" class="sim-tag">${simNum((g.umB - g.umT) * g.scale, 1)} cm</text>
      <line x1="${g.xScr - 12}" y1="${clipped(g.penT)}" x2="${g.xScr - 12}" y2="${clipped(g.umT)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${g.xScr - 20}" y="${clipped(g.penT) - 5}" text-anchor="end" class="sim-lab">bóng nửa tối</text>
    </svg>
  </div>`;
}

function simShadowCtl(S) {
  const g = shadowGeom(S);
  return `<div class="sim-panel">
    <span class="kicker">Thay đổi</span>
    <label class="sim-row"><span>Bề rộng nguồn</span><input type="range" id="sRs" min="1" max="60" step="1" value="${S.rs}"><b id="sRsV">${S.rs} px</b></label>
    <label class="sim-row"><span>Cao vật cản</span><input type="range" id="sHo" min="12" max="110" step="1" value="${S.ho}"><b id="sHoV">${S.ho} px</b></label>
    <label class="sim-row"><span>Vị trí vật</span><input type="range" id="sXo" min="180" max="560" step="1" value="${S.xo}"><b id="sXoV">${S.xo}</b></label>
    <div class="sim-stats">
      <div><b>${g.hasUmBra ? simNum((g.umB - g.umT) * g.scale, 1) : '0'}</b><span>cm · bóng tối</span></div>
      <div><b>${simNum((g.penB - g.penT) * g.scale, 1)}</b><span>cm · bóng nửa tối</span></div>
    </div>
    <div class="sim-btns"><button class="btn ghost sm" id="sRec">Ghi vào sổ thí nghiệm</button></div>
    <div class="sim-note">Nguồn càng rộng hoặc vật càng gần màn thì <b>bóng tối nhỏ lại</b> và vùng nửa tối loe ra. Kéo nguồn về 1 px là có nguồn điểm — lúc đó chỉ còn bóng tối sắc cạnh.</div>
  </div>`;
}

/* =========================================================
   C · ĐỘNG NĂNG
   ========================================================= */
const SIM_EN = { g: 9.8, px: 85, run: 4.0, flat: 5.2, x0: 84, y1: 292 };

function simEnergySolve(S) {
  const g = SIM_EN.g;
  const h0 = Math.max(0.2, +S.h0);
  const m = Math.max(0.05, +S.m);
  const mu = Math.max(0, +S.mu);
  const d1 = SIM_EN.run;                      /* chạy ngang trên dốc (m) */
  const L1 = Math.sqrt(d1 * d1 + h0 * h0);    /* chiều dài mặt dốc (m) */
  const sinA = h0 / L1, cosA = d1 / L1;
  const L2 = SIM_EN.flat;

  const stateAt = s => {
    const onSlope = s <= L1;
    const wf = mu * m * g * (cosA * Math.min(s, L1) + Math.max(0, s - L1));
    const hh = onSlope ? h0 * (1 - s / L1) : 0;
    const ek = Math.max(0, m * g * h0 - m * g * hh - wf);
    return { s, onSlope, wf, h: hh, v: Math.sqrt(2 * ek / m), ek, et: m * g * hh };
  };
  const total = L1 + L2;
  let sStop = total, started = false;
  for (let s = 0.02; s <= total; s += 0.01) {
    const e = stateAt(s).ek;
    if (e > 0.001) started = true;
    else if (started) { sStop = s; break; }
  }
  if (!started) sStop = 0;
  if (mu === 0) sStop = total;
  return { L1, L2, d1, h0, m, mu, sinA, cosA, stateAt, sStop, E0: m * g * h0, offEnd: sStop >= total - 0.02 };
}

function simEnergyBody(S) {
  const p = simEnergySolve(S);
  const B = SIM_EN;
  const s = Math.max(0, Math.min(S._s || 0, p.sStop));
  const st = p.stateAt(s);
  const x0 = B.x0, y1 = B.y1, y0 = y1 - p.h0 * B.px;
  const x1 = x0 + p.d1 * B.px, x2 = x1 + p.L2 * B.px;
  const W = Math.round(x2 + 44), H = 420;

  const pt = (() => {
    if (s <= p.L1) { const k = s / p.L1; return { x: x0 + (x1 - x0) * k, y: y0 + (y1 - y0) * k }; }
    return { x: x1 + (s - p.L1) * B.px, y: y1 };
  })();

  const bx = 56, by = 30, barW = Math.round(Math.min(430, W - 150));
  const tot = Math.max(0.001, p.E0);
  const w1 = Math.max(0, st.ek / tot) * barW, w2 = Math.max(0, st.et / tot) * barW, w3 = Math.max(0, st.wf / tot) * barW;
  const ang = Math.atan2(p.h0, p.d1) * 180 / Math.PI;

  return `<div class="sim-stage">
    <svg viewBox="0 0 ${W} ${H}" class="sim-svg" id="simSvg" role="img" aria-label="Động năng và thế năng trên dốc">
      <rect width="${W}" height="${H}" fill="var(--paper)"/>
      <path d="M${x0} ${y0}L${x1} ${y1}H${x2}V${y1 + 34}H${x0}Z" fill="var(--rule)" opacity=".38"/>
      <path d="M${x0} ${y0}L${x1} ${y1}H${x2}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${x0 - 10}" y="${(y0 + y1) / 2}" text-anchor="end" class="sim-tag">h₀ = ${simNum(p.h0, 1)} m</text>
      <text x="${(x0 + x1) / 2 - 34}" y="${(y0 + y1) / 2 - 12}" class="sim-lab">dốc ${simNum(ang, 0)}°</text>
      <line x1="${x1}" y1="${y1 + 12}" x2="${x2}" y2="${y1 + 12}" stroke="var(--rule-2)" stroke-width="1"/>
      <text x="${(x1 + x2) / 2}" y="${y1 + 26}" text-anchor="middle" class="sim-lab">mặt ngang ${simNum(p.L2, 1)} m</text>

      <line x1="${pt.x}" y1="${pt.y}" x2="${pt.x}" y2="${y1 + 44}" stroke="var(--rule-2)" stroke-width="1" stroke-dasharray="3 3"/>
      <g id="simBall">
        <ellipse cx="${pt.x}" cy="${pt.y - 2}" rx="12" ry="3" fill="var(--ink)" opacity=".12"/>
        <circle cx="${pt.x}" cy="${pt.y - 13}" r="13" fill="var(--accent)" opacity=".94"/>
        <circle cx="${pt.x - 4}" cy="${pt.y - 17}" r="4" fill="#fff" opacity=".32"/>
      </g>
      <text x="${pt.x}" y="${y1 + 58}" text-anchor="middle" class="sim-tag">${simNum(s, 2)} m</text>

      <text x="${bx}" y="${by}" class="sim-lab">NĂNG LƯỢNG · cơ năng ban đầu ${simNum(p.E0, 1)} J</text>
      <rect x="${bx}" y="${by + 8}" width="${barW}" height="18" fill="var(--rule)"/>
      <rect x="${bx}" y="${by + 8}" width="${w1}" height="18" fill="var(--accent)"/>
      <rect x="${bx + w1}" y="${by + 8}" width="${w2}" height="18" fill="var(--green)"/>
      <rect x="${bx + w1 + w2}" y="${by + 8}" width="${w3}" height="18" fill="var(--ink-3)" opacity=".55"/>
      <g>
        <text x="${bx}" y="${by + 40}" class="sim-tag acc">■ động năng ${simNum(st.ek, 1)} J</text>
        <text x="${bx + 196}" y="${by + 40}" class="sim-tag" fill="var(--green)">■ thế năng ${simNum(st.et, 1)} J</text>
        <text x="${bx}" y="${by + 57}" class="sim-tag dim">■ mất do ma sát ${simNum(st.wf, 1)} J</text>
        <text x="${bx + 196}" y="${by + 57}" class="sim-tag">v = ${simNum(st.v, 2)} m/s</text>
      </g>
      ${p.offEnd ? `<text x="${W - 16}" y="${H - 14}" text-anchor="end" class="sim-warn">ma sát nhỏ quá — bóng chạy hết băng</text>` : ''}
    </svg>
  </div>`;
}

function simEnergyCtl(S) {
  const p = simEnergySolve(S);
  return `<div class="sim-panel">
    <span class="kicker">Thay đổi</span>
    <label class="sim-row"><span>Khối lượng m</span><input type="range" id="sM" min="0.1" max="2" step="0.05" value="${S.m}"><b id="sMV">${simNum(S.m, 2)} kg</b></label>
    <label class="sim-row"><span>Độ cao h₀</span><input type="range" id="sH0" min="0.4" max="2" step="0.05" value="${S.h0}"><b id="sH0V">${simNum(S.h0, 2)} m</b></label>
    <label class="sim-row"><span>Ma sát μ</span><input type="range" id="sMu" min="0" max="0.6" step="0.01" value="${S.mu}"><b id="sMuV">${simNum(S.mu, 2)}</b></label>
    <div class="sim-btns">
      <button class="btn sm" id="sRun">${S.run ? '❚❚ Dừng' : '▶ Thả bóng'}</button>
      <button class="btn ghost sm" id="sReset">Về đỉnh dốc</button>
    </div>
    <div class="sim-stats">
      <div><b>${simNum(p.E0, 1)}</b><span>J · năng lượng ban đầu</span></div>
      <div><b>${simNum(p.sStop - p.L1, 1)}</b><span>m · quãng đường trên mặt ngang</span></div>
    </div>
    <div class="sim-btns"><button class="btn ghost sm" id="sRec">Ghi vào sổ thí nghiệm</button></div>
    <div class="sim-note">Thả bóng: thế năng đổi dần thành động năng, nên <b>v lớn nhất ở chân dốc</b>. Phần bị ma sát “lấy đi” hiện màu xám — bật μ = 0 thì bóng chạy mãi.</div>
  </div>`;
}

/* =========================================================
   PAGE + BIND
   ========================================================= */
const SIM_BODY = { refr: simRefrBody, shadow: simShadowBody, energy: simEnergyBody };
const SIM_CTL = { refr: simRefrCtl, shadow: simShadowCtl, energy: simEnergyCtl };

function renderSim() {
  const S = simState();
  if (S.run && S.st !== 'energy') S.run = false;
  $('#main').innerHTML = `<section class="wrap wide sim-page">
    ${pageHead('Băng thí nghiệm · ánh sáng và chuyển động', 'Kéo là thấy, số đo hiện ngay',
    'Ba bàn tương tác như phòng thí nghiệm ảo: khúc xạ qua mặt nước, bóng tối – bóng nửa tối, và bóng lăn trên dốc với động năng – thế năng. Mọi hình đều tự căn lại theo số liệu bạn đặt.')}
    <div class="lab-tabs sim-tabs">${SIM_TABS.map(([k, t, s]) => `
      <button data-sim="${k}" class="${S.st === k ? 'on' : ''}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>
    <div class="sim-grid">
      <div id="simStageHost">${SIM_BODY[S.st](S)}</div>
      <div id="simCtlHost">${SIM_CTL[S.st](S)}</div>
    </div>
  </section>`;
  simBind();
}

function simPaint() {
  const S = simState();
  const host = $('#simStageHost');
  if (host) host.innerHTML = SIM_BODY[S.st](S);
  const ctl = $('#simCtlHost');
  if (ctl) ctl.innerHTML = SIM_CTL[S.st](S);
  simBind();
}

let simTimer = null;
function simStopLoop() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

function simBind() {
  const S = simState();
  simStopLoop();

  $$('.sim-tabs [data-sim]').forEach(b => b.onclick = () => {
    simStopLoop();
    S.st = b.dataset.sim; S.run = false; S._s = 0;
    save(); renderSim();
  });

  const rec = $('#sRec');
  if (rec) rec.onclick = () => {
    const L = (typeof LAB_ST === 'function') ? LAB_ST() : null;
    if (!L) { toast('Chưa mở được sổ thí nghiệm'); return; }
    let cells = [];
    if (S.st === 'refr') {
      const n1 = +S.n1, n2 = +S.n2, th = +S.th1;
      const s2 = n1 * Math.sin(th * Math.PI / 180) / n2;
      cells = ['khúc xạ · n₁=' + simNum(n1, 2) + ' · n₂=' + simNum(n2, 2),
        'i=' + simNum(th, 0) + '°', s2 <= 1 ? 'r=' + simNum(Math.asin(s2) * 180 / Math.PI, 1) + '°' : 'phản xạ toàn phần'];
    } else if (S.st === 'shadow') {
      const g = shadowGeom(S);
      cells = ['bóng · nguồn ' + simNum(S.rs, 0) + ' px', 'vật ở ' + simNum(S.xo, 0),
        'bóng tối=' + simNum((g.umB - g.umT) * g.scale, 1) + ' cm', 'nửa tối=' + simNum((g.penB - g.penT) * g.scale, 1) + ' cm'];
    } else {
      const p = simEnergySolve(S), st = p.stateAt(Math.min(S._s || 0, p.sStop));
      cells = ['dốc · m=' + simNum(S.m, 2) + ' kg', 'h₀=' + simNum(S.h0, 1) + ' m', 'μ=' + simNum(S.mu, 2),
        'Eđ=' + simNum(st.ek, 1) + ' J', 'v=' + simNum(st.v, 2) + ' m/s'];
    }
    cells.unshift('băng thí nghiệm · ' + (S.st === 'refr' ? 'khúc xạ' : S.st === 'shadow' ? 'bóng tối' : 'động năng'));
    if (typeof labAddLog === 'function') labAddLog(L, cells);
    save(); toast('Đã ghi vào sổ thí nghiệm');
  };

  const slider = (id, key, fmt) => {
    const el = $('#' + id);
    if (!el) return;
    el.oninput = () => {
      S[key] = +el.value;
      const lab = $('#' + id + 'V');
      if (lab) lab.textContent = fmt(+el.value);
      save(); simPaint();
    };
  };

  if (S.st === 'refr') {
    slider('sTh1', 'th1', v => v + '°');
    $$('[data-n1]').forEach(b => b.onclick = () => { S.n1 = +b.dataset.n1; save(); simPaint(); });
    $$('[data-n2]').forEach(b => b.onclick = () => { S.n2 = +b.dataset.n2; save(); simPaint(); });
  }

  if (S.st === 'shadow') {
    slider('sRs', 'rs', v => v + ' px');
    slider('sHo', 'ho', v => v + ' px');
    slider('sXo', 'xo', v => String(v));
    /* kéo vật cản trên hình */
    const bl = $('#simBlocker');
    if (bl) {
      bl.onpointerdown = e => {
        e.preventDefault();
        const svg = $('#simSvg');
        const move = ev => {
          const box = svg.getBoundingClientRect();
          const x = (ev.clientX - box.left) * (720 / box.width);
          S.xo = Math.max(180, Math.min(560, Math.round(x)));
          const sl = $('#sXo'); if (sl) sl.value = S.xo;
          const lb = $('#sXoV'); if (lb) lb.textContent = String(S.xo);
          simPaint();
        };
        const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); save(); };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
      };
    }
  }

  if (S.st === 'energy') {
    slider('sM', 'm', v => simNum(v, 2) + ' kg');
    slider('sH0', 'h0', v => simNum(v, 2) + ' m');
    slider('sMu', 'mu', v => simNum(v, 2));
    const run = $('#sRun'), reset = $('#sReset');
    if (reset) reset.onclick = () => { S._s = 0; S.run = false; save(); simPaint(); };
    if (run) run.onclick = () => {
      S.run = !S.run;
      if (!S.run) { save(); simPaint(); return; }
      if ((S._s || 0) >= simEnergySolve(S).sStop - 0.01) S._s = 0;
      save(); simPaint();
      const p = simEnergySolve(S);
      simTimer = setInterval(() => {
        if (!document.querySelector('#simSvg')) { simStopLoop(); return; }
        const st = simState();
        const vNow = p.stateAt(Math.max(0, Math.min(st._s || 0, p.sStop))).v;
        let s = (st._s || 0) + Math.max(0.02, vNow * 0.055);
        if (s >= p.sStop) { s = p.sStop; st.run = false; simStopLoop(); }
        st._s = s;
        const host = $('#simStageHost');
        if (host) host.innerHTML = SIM_BODY.energy(st);
        const bar = $('#sRun');
        if (bar && !st.run) bar.textContent = '▶ Thả lại';
      }, 40);
    };
  }
}

function seedLessons() {
  const out = {};
  SEED.forEach((L, i) => {
    const key = L.g + '|' + L.s;
    out[key] = out[key] || [];
    out[key].push({
      id: 'seed' + i, g: L.g, s: L.s, t: L.t, aim: L.aim, tag: L.tag,
      blocks: L.blocks, at: 0, seed: true
    });
  });
  return out;
}

/* ---------------- 3 · state ---------------- */
function schoolState() {
  if (!state.school) state.school = { grade: 9, subj: 'vatli', lessons: {}, soft: {} };
  const S = state.school;
  if (!S.lessons) S.lessons = {};
  if (!S.soft) S.soft = {};
  if (!S.grade) S.grade = 9;
  if (!S.subj) S.subj = 'vatli';
  return S;
}
function lessonList(g, s) {
  const S = schoolState();
  const seed = seedLessons()[g + '|' + s] || [];
  const mine = (S.lessons[g + '|' + s] || []);
  return seed.concat(mine);
}
function lessonById(id) {
  const S = schoolState();
  for (const k in S.lessons) {
    const hit = S.lessons[k].find(l => l.id === id);
    if (hit) return hit;
  }
  const all = seedLessons();
  for (const k in all) {
    const hit = all[k].find(l => l.id === id);
    if (hit) return hit;
  }
  return null;
}
function allLessons() {
  const S = schoolState();
  const out = [];
  const seeds = seedLessons();
  Object.keys(seeds).forEach(k => seeds[k].forEach(l => out.push(l)));
  Object.keys(S.lessons).forEach(k => S.lessons[k].forEach(l => out.push(l)));
  return out;
}

/* ---------------- 4 · kho tệp (IndexedDB) ---------------- */
const FileStore = (() => {
  let db = null, ready = null;
  const NAME = 'vnl9files', STORE = 'files';
  function open() {
    if (ready) return ready;
    ready = new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      let req;
      try { req = indexedDB.open(NAME, 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => { db = req.result; res(db); };
      req.onerror = () => res(null);
    });
    return ready;
  }
  async function put(file) {
    const d = await open();
    const rec = {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: file.name, type: file.type || 'application/octet-stream',
      size: file.size, at: Date.now(),
      buf: await file.arrayBuffer()
    };
    if (!d) return { ...rec, buf: null, fail: true };
    await new Promise(res => {
      const tx = d.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = res;
      tx.onerror = res;
      tx.onabort = res;
    });
    return rec;
  }
  async function get(id) {
    const d = await open();
    if (!d) return null;
    return new Promise(res => {
      const tx = d.transaction(STORE, 'readonly');
      const rq = tx.objectStore(STORE).get(id);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  }
  async function all() {
    const d = await open();
    if (!d) return [];
    return new Promise(res => {
      const tx = d.transaction(STORE, 'readonly');
      const rq = tx.objectStore(STORE).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    });
  }
  async function del(id) {
    const d = await open();
    if (!d) return;
    return new Promise(res => {
      const tx = d.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = res; tx.onerror = res;
    });
  }
  return { put, get, all, del };
})();

const fileSize = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB'
  : n > 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
const fileIcon = t => /^image\//.test(t) ? 'ẢNH' : /pdf/.test(t) ? 'PDF' : /word|officedocument\.word/.test(t) ? 'DOC'
  : /sheet|excel|csv/.test(t) ? 'BẢNG' : /video/.test(t) ? 'VIDEO' : /audio/.test(t) ? 'ÂM' : 'TỆP';

async function filePreview(id) {
  const rec = await FileStore.get(id);
  if (!rec) { toast('Không tìm thấy tệp'); return; }
  const blob = new Blob([rec.buf], { type: rec.type });
  const url = URL.createObjectURL(blob);
  const isImg = /^image\//.test(rec.type), isPdf = /pdf/.test(rec.type);
  const m = document.createElement('div');
  m.className = 'overlay file-ov';
  m.innerHTML = `<div class="ov-panel" style="max-width:min(980px,94vw);height:86vh">
    <div class="file-h"><b>${rec.name}</b><span>${fileSize(rec.size)} · ${rec.type || 'tệp'}</span>
      <a class="btn ghost sm" href="${url}" download="${rec.name}">Tải về</a>
      <button class="bd-x" aria-label="Đóng">×</button></div>
    <div class="file-body">${isImg ? `<img src="${url}" alt="${rec.name}">`
      : isPdf ? `<iframe src="${url}" title="${rec.name}"></iframe>`
        : `<div class="file-none"><p>Tệp này không xem trực tiếp trong trang được.</p>
           <a class="btn" href="${url}" download="${rec.name}">Tải về để mở</a></div>`}</div>
  </div>`;
  document.body.appendChild(m);
  const close = () => { URL.revokeObjectURL(url); m.remove(); };
  m.querySelector('.bd-x').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
}

const FILE_MAX = 40 * 1024 * 1024;   /* 40 MB mỗi tệp — quá lớn thì trình duyệt dễ từ chối */
async function upFiles(list) {
  if (!list || !list.length) return { ok: 0, fail: 0 };
  let ok = 0, fail = 0, big = 0;
  for (const f of list) {
    if (f.size > FILE_MAX) { big++; fail++; continue; }
    try { const rec = await FileStore.put(f); rec && rec.fail ? fail++ : ok++; } catch (e) { fail++; }
  }
  if (!ok && fail) toast(big ? 'Tệp quá 40 MB — chọn tệp nhỏ hơn' : 'Không lưu được tệp (bộ nhớ trình duyệt đầy?)');
  else if (fail) toast('Đã nhận ' + ok + '/' + list.length + ' tệp · ' + fail + ' tệp lỗi');
  else toast('Đã nhận ' + ok + ' tệp');
  return { ok, fail };
}

    qs.forEach(b => { if (syAddCard({ front: b.v, back: b.a || '(tự trả lời)', g: l.g, s: l.s, lesson: l.id })) n++; });
    toast('Đã tạo ' + n + ' thẻ từ bài này');
  };
  /* thanh tiến độ đọc */
  if (readProgOff) readProgOff();
  const bar = document.createElement('div');
  bar.className = 'read-prog'; bar.innerHTML = '<i></i>';
  document.body.appendChild(bar);
  const onScroll = () => {
    const art = $('.read-article');
    if (!art) return;
    const r = art.getBoundingClientRect();
    const total = r.height - window.innerHeight * .6;
    const done = Math.min(1, Math.max(0, (-r.top + window.innerHeight * .3) / Math.max(1, total)));
    bar.firstChild.style.width = (done * 100) + '%';
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  setTimeout(onScroll, 60);
  const onKey = e => {
    const t = e.target;
    if (t && /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' && next) { location.hash = '#/read/' + next.id; }
    else if (e.key === 'ArrowLeft' && prev) { location.hash = '#/read/' + prev.id; }
  };

    document.removeEventListener('keydown', onKey);
    window.removeEventListener('scroll', onScroll);
    const b = document.querySelector('.read-prog'); if (b) b.remove();
    readProgOff = null;
  };
  const mk = $('#readMark');
  if (mk) mk.onclick = () => {

  };
  const ed = $('#readEdit');
  if (ed) ed.onclick = () => { location.hash = '#/studio/' + l.id; };
  const dl = $('#readDel');
  if (dl) dl.onclick = () => {
    uiConfirm('Xoá bài học', `Xoá <b>${esc(l.t)}</b>? Không hoàn tác được.`, () => {
      const S = schoolState();
      Object.keys(S.lessons).forEach(k => { S.lessons[k] = S.lessons[k].filter(x => x.id !== l.id); });
      save(); toast('Đã xoá bài'); location.hash = '#/subject/' + l.g + '/' + l.s;
    }, { danger: true, okText: 'Xoá bài' });
  };
  if (typeof syncScope === 'function') syncScope();
}

let readProgOff = null;
function renderBlock(b, l) {
  if (!b || !b.v) return '';
  if (b.k === 'p') return `<p>${b.v}</p>`;
  if (b.k === 'f') return `<div class="read-formula">${b.v}</div>`;
  if (b.k === 'note') return `<div class="read-note">${b.v}</div>`;
  if (b.k === 'ul') return `<ul>${(Array.isArray(b.v) ? b.v : [b.v]).map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (b.k === 'img') return `<figure class="read-fig"><button class="file-chip" data-f="${b.v}"><i>ẢNH</i><span>Mở ảnh đính kèm</span></button></figure>`;
  if (b.k === 'q') return `<details class="read-q"><summary>${b.v}</summary><p><b>Trả lời:</b> ${b.a || '—'}</p></details>`;
  return `<p>${b.v}</p>`;
}

      draft.blocks.splice(i, 1);
      if (!draft.blocks.length) draft.blocks.push({ k: 'p', v: '' });

    });
    $$('#bkList [data-up]').forEach(b => b.onclick = () => {
      const i = +b.dataset.up;
      if (i <= 0) return;
      [draft.blocks[i - 1], draft.blocks[i]] = [draft.blocks[i], draft.blocks[i - 1]];
      syncFromForm(); paintBlocks();
    });
    $$('#bkList [data-dn]').forEach(b => b.onclick = () => {
      const i = +b.dataset.dn;
      if (i >= draft.blocks.length - 1) return;
      [draft.blocks[i + 1], draft.blocks[i]] = [draft.blocks[i], draft.blocks[i + 1]];
      syncFromForm(); paintBlocks();
    });
  };

  const TPL = {
    lecture: [
      { k: 'p', v: 'Mở bài: vì sao phần này quan trọng, nó nối vào bài trước thế nào.' },
      { k: 'f', v: 'Công thức chính: …' },
      { k: 'ul', v: ['Ý 1: định nghĩa / điều kiện áp dụng', 'Ý 2: cách biến đổi khi làm bài', 'Ý 3: đơn vị và kiểm tra kết quả'] },
      { k: 'note', v: 'Lỗi hay gặp: … (ghi đúng chỗ học sinh trong lớp mình hay sai).' },
      { k: 'q', v: 'Câu hỏi kiểm tra: phát biểu lại định luật bằng lời của em.', a: 'Gợi ý trả lời…' }
    ],
    summary: [
      { k: 'ul', v: ['Công thức 1 — dùng khi nào', 'Công thức 2 — dùng khi nào'] },
      { k: 'f', v: 'Công thức gộp / hệ quả: …' },
      { k: 'note', v: 'Sai đơn vị là lỗi mất điểm nhiều nhất — đổi hết về SI trước khi tính.' }
    ],
    drill: [
      { k: 'p', v: 'Đề: (tóm tắt dữ kiện và yêu cầu cần tìm).' },
      { k: 'q', v: 'Câu 1 (nhận biết): …', a: 'Đáp án / lời giải ngắn' },
      { k: 'q', v: 'Câu 2 (vận dụng): …', a: 'Đáp án / lời giải ngắn' },
      { k: 'q', v: 'Câu 3 (vận dụng cao): …', a: 'Đáp án / lời giải ngắn' }
    ],
    lab: [
      { k: 'p', v: 'Mục đích: đo / kiểm chứng …' },
      { k: 'ul', v: ['Dụng cụ: …', 'Bố trí: …', 'An toàn: …'] },
      { k: 'ul', v: ['Bước 1: …', 'Bước 2: …', 'Bước 3: ghi số liệu vào bảng'] },
      { k: 'note', v: 'Kết quả mong đợi: … — sai số chấp nhận …' }
    ]
  };
  $$('.st-tpl [data-tpl]').forEach(b => b.onclick = () => {
    const onlyEmpty = draft.blocks.every(x => !x.v || (Array.isArray(x.v) && !x.v.length));
    const useTpl = () => {
      draft.blocks = JSON.parse(JSON.stringify(TPL[b.dataset.tpl] || []));
      paintBlocks();
      toast('Đã chèn mẫu — sửa lại theo ý bạn');
    };
    if (onlyEmpty) return useTpl();
    uiConfirm('Chèn mẫu', 'Bài đang soạn đã có nội dung. Thay bằng mẫu này?', useTpl, { okText: 'Thay bằng mẫu' });
  });

  $('#bkAdd').onclick = () => { syncFromForm(); draft.blocks.push({ k: 'p', v: '' }); paintBlocks();
    const last = $('#bkList').lastElementChild; if (last) { last.scrollIntoView({ block: 'center', behavior: 'smooth' }); last.querySelector('.bk-val').focus(); } };
  ['#stT', '#stAim', '#stTag'].forEach(sel => { const el = $(sel); if (el) el.oninput = () => { syncFromForm(); paintPreview(); }; });

  $('#stG').onchange = e => {
    g = +e.target.value;
    const list = subjectsFor(g);
    const cur = $('#stS').value;
    $('#stS').innerHTML = list.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    if (list.some(s => s.id === cur)) $('#stS').value = cur; else sj = list[0].id;
    paintPreview();
    $('#stS').onchange({ target: $('#stS') });
  };
  $('#stS').onchange = e => { sj = e.target.value; paintPreview(); };

  const paintFiles = () => {
    const host = $('#stFiles');
    host.innerHTML = draft.files.length ? draft.files.map(f => `
      <div class="file-chip ro"><i>${fileIcon(f.type)}</i><span>${f.name}</span><em>${fileSize(f.size)}</em>
        <button data-un="${f.id}" title="Bỏ khỏi bài">×</button></div>`).join('') : '<p class="muted" style="font-size:11px">Chưa gắn tệp.</p>';
    $$('#stFiles [data-un]').forEach(b => b.onclick = () => {
      draft.files = draft.files.filter(x => x.id !== b.dataset.un);
      paintFiles(); paintPreview();
    });
  };
  paintFiles();

  const addFiles = async files => {
    for (const f of files) {
      const rec = await FileStore.put(f);
      draft.files.push({ id: rec.id, name: rec.name, type: rec.type, size: rec.size });
    }
    paintFiles(); paintPreview();
    toast('Đã gắn ' + files.length + ' tệp');
  };
  $('#stFile').onchange = async e => { await addFiles(e.target.files); e.target.value = ''; };
  const drop = $('#stDrop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
  drop.addEventListener('drop', async e => { if (e.dataTransfer.files) await addFiles(e.dataTransfer.files); });

  $('#stSave').onclick = () => {
    syncFromForm();
    if (!draft.t) { toast('Chưa đặt tiêu đề bài'); $('#stT').focus(); return; }
    const S2 = schoolState();
    const key = g + '|' + sj;
    S2.lessons[key] = S2.lessons[key] || [];
    if (editing && !editing.seed) {
      const idx = S2.lessons[key].findIndex(x => x.id === editing.id);
      const rec = Object.assign({}, editing, { g, s: sj, t: draft.t, aim: draft.aim, tag: draft.tag, blocks: draft.blocks, files: draft.files, at: Date.now() });
      if (idx >= 0) S2.lessons[key][idx] = rec;
      else {
        const oldKey = editing.g + '|' + editing.s;
        S2.lessons[oldKey] = (S2.lessons[oldKey] || []).filter(x => x.id !== editing.id);
        S2.lessons[key].push(rec);
      }
      save(); toast('Đã lưu thay đổi'); location.hash = '#/read/' + editing.id;
    } else {
      const rec = {
        id: 'my' + Date.now().toString(36), g, s: sj, t: draft.t, aim: draft.aim, tag: draft.tag,
        blocks: draft.blocks, files: draft.files, at: Date.now()
      };
      S2.lessons[key].push(rec);
      save(); toast('Đã xuất bản bài mới');
      location.hash = '#/read/' + rec.id;
    }
  };

  $('#stExport').onclick = () => {
    syncFromForm();
    const pack = { app: 'vat-li-9', kind: 'lesson', v: 1, lesson: { g, s: sj, t: draft.t, aim: draft.aim, tag: draft.tag, blocks: draft.blocks } };
    const blob = new Blob([JSON.stringify(pack, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bai-hoc-' + (draft.t || 'moi').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 40) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('Đã xuất bài ra tệp .json');
  };
  if (typeof syncScope === 'function') syncScope();
  $('#stImport').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      const pack = JSON.parse(txt);
      const L = pack.lesson || pack;
      if (!L.t) throw new Error('thiếu tiêu đề');
      draft.t = L.t; draft.aim = L.aim || ''; draft.tag = L.tag || '';
      draft.blocks = (L.blocks || []).map(b => ({ k: b.k || 'p', v: b.v, a: b.a }));
      if (L.g) g = L.g; if (L.s) sj = L.s;
      $('#stT').value = draft.t; $('#stAim').value = draft.aim; $('#stTag').value = draft.tag;
      paintBlocks();
      toast('Đã nạp bài — kiểm tra rồi bấm Xuất bản');
    } catch (err) {
      toast('Tệp không đúng định dạng bài học');
    }
    e.target.value = '';
  };
}

const FILE_KINDS = [
  { id: 'all', t: 'Tất cả' }, { id: 'img', t: 'Ảnh', re: /^image\// },
  { id: 'pdf', t: 'PDF', re: /pdf/ }, { id: 'doc', t: 'Word', re: /word|opendocument\.text/ },
  { id: 'sheet', t: 'Bảng tính', re: /sheet|excel|csv/ },
  { id: 'other', t: 'Khác', re: null }
];
const fileKindOf = t => {
  for (const k of FILE_KINDS) { if (k.re && k.re.test(t || '')) return k.id; }
  return 'other';
};
const fileDate = n => {
  const d = new Date(n);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
};
const fileSizeCached = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB'
  : n > 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
if (typeof FileStore !== 'undefined' && FileStore.all) {
  FileStore.all().then(list => {
    window.__filesCache = (list || []).map(f => ({ id: f.id, name: f.name, size: f.size }));
    if (typeof PAL_INDEX_CACHE !== 'undefined') PAL_INDEX_CACHE = null;
  }).catch(() => { });
}
let _thumbUrls = [];
const _revokeThumbs = () => { _thumbUrls.forEach(u => URL.revokeObjectURL(u)); _thumbUrls = []; };

async function renderFiles() {
  _revokeThumbs();
  const files = (await FileStore.all()).sort((a, b) => b.at - a.at);
  window.__filesCache = files.map(f => ({ id: f.id, name: f.name, size: f.size }));
  if (typeof PAL_INDEX_CACHE !== 'undefined') PAL_INDEX_CACHE = null;
  const S = (schoolState().soft = schoolState().soft || {});

  const thumb = {};
  for (const f of files) {
    if (fileKindOf(f.type) === 'img' && f.buf) {
      const u = URL.createObjectURL(new Blob([f.buf], { type: f.type }));
      _thumbUrls.push(u); thumb[f.id] = u;
    }
  }
  let quota = null;
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const q = await navigator.storage.estimate();
      quota = { used: q.usage || 0, all: q.quota || 0 };
    }
  } catch (e) { }

  const totalSize = files.reduce((a, f) => a + f.size, 0);
  const counts = {}; files.forEach(f => { const k = fileKindOf(f.type); counts[k] = (counts[k] || 0) + 1; });
  const filter = S.fileFilter || 'all';

  $('#main').innerHTML = `<section class="wrap wide files-page">
    ${pageHead('Kho tệp của bạn', files.length + ' tệp · ' + fileSize(totalSize) + ' · nằm trong máy này',
    'Kéo ảnh đề bài, PDF sách, Word, bảng tính vào ô bên dưới — tệp ở lại trong trình duyệt, không đi đâu cả. Mở xem ngay, gắn vào bài học, hoặc tải về bất cứ lúc nào.')}

    <div class="fz" id="fz" tabindex="0" role="button" aria-label="Tải tệp lên">
      <div class="fz-in">
        <svg viewBox="0 0 24 24" class="fz-ic" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <b>Kéo tệp vào đây</b>
        <span>hoặc <u>bấm để chọn</u> · ảnh, PDF, Word, Excel, PowerPoint, video, âm thanh</span>
      </div>
      <input type="file" id="filesUp" multiple hidden>
    </div>

    ${quota ? `<div class="store-line">
      <span class="kicker">Đã dùng ${fileSize(quota.used)}${quota.all ? ' / ' + fileSize(quota.all) : ''}</span>
      <div class="store-bar"><i style="width:${quota.all ? Math.min(100, quota.used / quota.all * 100) : 0}%"></i></div>
    </div>` : ''}

    ${files.length ? `<div class="file-bar">
      ${FILE_KINDS.filter(k => k.id === 'all' || counts[k.id]).map(k =>
    `<button class="fchip${filter === k.id ? ' on' : ''}" data-fk="${k.id}">${k.t}<i>${k.id === 'all' ? files.length : counts[k.id]}</i></button>`).join('')}
      <span class="grow"></span>
      <span class="kicker">mới nhất trước</span>
    </div>

    <div class="file-grid">
      ${files.filter(f => filter === 'all' || fileKindOf(f.type) === filter).map(f => `<div class="file-card" data-f="${f.id}">
        <div class="fc-thumb">${thumb[f.id]
      ? `<img src="${thumb[f.id]}" alt="${f.name}" loading="lazy">`
      : `<span class="fc-mono">${fileIcon(f.type)}</span>`}</div>
        <b title="${f.name}">${f.name}</b>
        <i>${fileSize(f.size)} · ${fileDate(f.at)}</i>
        <span class="fc-btns">
          <button data-open="${f.id}" class="bkbtn">Mở</button>
          <a class="bkbtn" href="#" data-dl="${f.id}" download="${f.name}">Tải</a>
          <button data-del="${f.id}" class="bkbtn del">Xoá</button>
        </span>
      </div>`).join('') || '<p class="muted" style="grid-column:1/-1;padding:22px">Không có tệp loại này.</p>'}
    </div>` : `<div class="files-empty">
      <b>Chưa có tệp nào</b>
      <p>Đề thi scan, ảnh chụp bảng, file Word bài giảng, bảng điểm Excel — kéo vào ô phía trên là xong. Tệp sẽ hiện ở đây và gắn được vào bất cứ bài học nào.</p>
    </div>`}
  </section>`;

  const up = $('#filesUp'), fz = $('#fz');
  const take = async list => {
    if (!list || !list.length) return;
    toast('Đang lưu ' + list.length + ' tệp…');
    await upFiles(list);
    renderFiles();
  };
  if (up) up.onchange = e => take(e.target.files);
  if (fz) {
    fz.onclick = () => up && up.click();
    fz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); up && up.click(); } };
    ['dragenter', 'dragover'].forEach(ev => fz.addEventListener(ev, e => { e.preventDefault(); fz.classList.add('hot'); }));
    ['dragleave', 'drop'].forEach(ev => fz.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === fz) fz.classList.remove('hot'); }));
    fz.addEventListener('drop', e => take(e.dataTransfer.files));
  }
  const main = $('#main');
  main.ondragover = e => { e.preventDefault(); if (fz) fz.classList.add('hot'); };
  main.ondragleave = e => { if (!main.contains(e.relatedTarget) && fz) fz.classList.remove('hot'); };
  main.ondrop = e => { e.preventDefault(); if (fz) fz.classList.remove('hot'); take(e.dataTransfer.files); };

  $$('[data-fk]').forEach(b => b.onclick = () => {
    schoolState().soft.fileFilter = b.dataset.fk; save(); renderFiles();
  });
  $$('[data-open]').forEach(b => b.onclick = () => filePreview(b.dataset.open));
  $$('[data-dl]').forEach(a => a.onclick = async e => {
    e.preventDefault();
    const rec = await FileStore.get(a.dataset.dl);
    if (!rec) return;
    const u = URL.createObjectURL(new Blob([rec.buf], { type: rec.type }));
    const t = document.createElement('a'); t.href = u; t.download = rec.name; t.click();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  });
  /* mở thẳng một tệp: #/files?f=<id> */
  const qf = (location.hash.match(/[?&]f=([^&]+)/) || [])[1];
  if (qf) setTimeout(() => filePreview(decodeURIComponent(qf)), 150);
  $$('[data-del]').forEach(b => b.onclick = () => {
    uiConfirm('Xoá tệp', 'Tệp này sẽ bị xoá khỏi kho lưu trong máy. Không hoàn tác được.', async () => {
      await FileStore.del(b.dataset.del);
      renderFiles();
    }, { danger: true, okText: 'Xoá tệp' });
  });
}

/* =========================================================
   STUDY OS — trung tâm tự học
   · Dashboard "Học hôm nay"
   · Flashcards lặp lại cách quãng (mọi lớp, mọi môn)
   · Tự tạo đề luyện từ câu hỏi của bài học
   · Kế hoạch học tới ngày thi
   · Đồng hồ tập trung + nhật ký phút học
   · Ghi chú & giảng lại (Feynman) trong từng bài
   ========================================================= */

const SY_DAY = 86400000;
const SY_INTERVALS = [10 / 1440, 1, 2, 4, 8, 16, 32];   /* hộp 0..6 (ngày) */
const SY_BOX_LABEL = ['10 phút', '1 ngày', '2 ngày', '4 ngày', '8 ngày', '16 ngày', '32 ngày'];

const syDayKey = (ts) => {
  const d = new Date(ts === undefined ? Date.now() : ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const syTime = ts => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
};
const syDateVN = ts => {
  const d = new Date(ts);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
};
const syNum = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function studyState() {
  if (!state.study) state.study = {};
  const S = state.study;
  if (!Array.isArray(S.cards)) S.cards = [];
  if (!Array.isArray(S.sessions)) S.sessions = [];
  if (!Array.isArray(S.results)) S.results = [];
  if (!S.notes || typeof S.notes !== 'object') S.notes = {};
  if (!S.goal) S.goal = { min: 60, cards: 20 };
  if (!isFinite(S.goal.min)) S.goal.min = 60;
  if (!isFinite(S.goal.cards)) S.goal.cards = 20;
  if (S.plan === undefined) S.plan = null;
  if (!S.focus || typeof S.focus !== 'object') S.focus = { mode: 25, left: 25 * 60, endAt: 0, running: false };
  return S;
}
const sySid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let syKeyOff = null;
function syCleanup() { if (syKeyOff) { try { syKeyOff(); } catch (e) { } syKeyOff = null; } }
function syBindKeys(fn) {
  syCleanup();
  const h = e => { syKeyOff && fn(e); };
  document.addEventListener('keydown', h);
  syKeyOff = () => document.removeEventListener('keydown', h);
}

/* ---------------- thẻ ghi nhớ ---------------- */
function syDue(now) {
  const t = now || Date.now();
  return studyState().cards.filter(c => (c.due || 0) <= t);
}
function syNewCards() { return studyState().cards.filter(c => !c.reps); }

function syAddCard(o) {
  const S = studyState();
  const c = {
    id: sySid(), g: +o.g || 9, s: o.s || 'vatli',
    front: String(o.front || '').trim(), back: String(o.back || '').trim(),
    lesson: o.lesson || null, box: 0, due: Date.now(), at: Date.now(), reps: 0, lapses: 0
  };
  if (!c.front) return null;
  S.cards.push(c); save();
  return c;
}
function syGrade(card, g) {
  const S = studyState();
  const c = S.cards.find(x => x.id === card.id);
  if (!c) return;
  let box = c.box || 0;
  if (g === 0) { box = 0; c.lapses = (c.lapses || 0) + 1; }
  else if (g === 1) { box = Math.max(1, box); }
  else if (g === 2) { box = Math.min(6, box + 1); }
  else { box = Math.min(6, box + 2); }
  c.box = box;
  c.reps = (c.reps || 0) + 1;
  c.at = Date.now();
  c.due = Date.now() + SY_INTERVALS[box] * SY_DAY;
  save();
}

/* ---------------- câu hỏi lấy từ bài học ---------------- */
function syLessonQuestions(scope) {
  const out = [];
  (typeof allLessons === 'function' ? allLessons() : []).forEach(l => {
    if (!l || !Array.isArray(l.blocks)) return;
    if (scope && scope.g && l.g !== scope.g) return;
    if (scope && scope.s && l.s !== scope.s) return;
    l.blocks.forEach((b, i) => {
      if (b && b.k === 'q' && b.v) {
        out.push({
          id: 'q' + l.id + '_' + i, q: b.v, a: b.a || '',
          g: l.g, s: l.s, lesson: l.id, topic: l.t, tag: l.tag || ''
        });
      }
    });
  });
  return out;
}

/* ---------------- nhật ký học ---------------- */
function syLog(min, label, kind) {
  const S = studyState();
  S.sessions.push({ at: Date.now(), min: Math.max(1, Math.round(min)), label: label || '', kind: kind || 'focus' });
  if (S.sessions.length > 800) S.sessions = S.sessions.slice(-800);
  save();
}
function syMinutesOn(key) {
  return studyState().sessions.filter(s => syDayKey(s.at) === key).reduce((a, s) => a + (s.min || 0), 0);
}
function syToday() {
  const k = syDayKey();
  const S = studyState();
  return {
    key: k,
    min: syMinutesOn(k),
    cards: S.cards.filter(c => c.at && syDayKey(c.at) === k && c.reps).length,
    practice: S.results.filter(r => syDayKey(r.at) === k).length
  };
}
function syStreak() {
  const S = studyState();
  const days = new Set();
  S.sessions.forEach(s => days.add(syDayKey(s.at)));
  S.results.forEach(r => days.add(syDayKey(r.at)));
  S.cards.forEach(c => { if (c.reps) days.add(syDayKey(c.at)); });
  Object.keys(state.ans || {}).forEach(id => { const a = state.ans[id]; if (a && a.at) days.add(syDayKey(a.at)); });
  let n = 0;
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < 400; i++) {
    const k = syDayKey(d.getTime());
    if (days.has(k)) n++;
    else if (i > 0) break;          /* hôm nay chưa học vẫn giữ chuỗi của hôm qua */
    d.setTime(d.getTime() - SY_DAY);
  }
  return n;
}

/* ---------------- bản đồ nhiệt 12 tuần ---------------- */
function syHeat() {
  const S = studyState();
  const count = {};
  const bump = (ts, n) => { const k = syDayKey(ts); count[k] = (count[k] || 0) + (n || 1); };
  S.sessions.forEach(s => bump(s.at, Math.min(6, Math.max(1, Math.round((s.min || 10) / 15)))));
  S.results.forEach(r => bump(r.at, 2));
  S.cards.forEach(c => { if (c.reps) bump(c.at, 1); });
  Object.keys(state.ans || {}).forEach(id => { const a = state.ans[id]; if (a && a.at) bump(a.at, 1); });
  const cells = [];
  const end = new Date(); end.setHours(12, 0, 0, 0);
  const start = new Date(end.getTime() - 83 * SY_DAY);
  start.setTime(start.getTime() - ((start.getDay() + 6) % 7) * SY_DAY);   /* về thứ hai */
  for (let t = start.getTime(); t <= end.getTime() + 6 * SY_DAY; t += SY_DAY) {
    const k = syDayKey(t), n = count[k] || 0;
    cells.push({ t, k, n, lv: n === 0 ? 0 : n < 2 ? 1 : n < 4 ? 2 : n < 7 ? 3 : 4, future: t > end.getTime() });
  }
  return cells;
}

function syNextLesson() {
  const S = schoolState();
  const g = S.grade || 9, s = S.subj || 'vatli';
  const has = l => (l.blocks || []).some(b => b && b.k === 'q');
  const unread = l => !(state.note && state.note['read:' + l.id]);
  const inScope = (lessonList(g, s) || []);
  return inScope.find(l => unread(l) && has(l)) || inScope.find(unread) || inScope[0]
    || allLessons().find(l => unread(l) && has(l)) || allLessons()[0] || null;
}
function syScopeName(g, s) {
  const sub = (typeof SUBJECTS !== 'undefined' ? SUBJECTS.find(x => x.id === s) : null) || { name: s };
  return sub.name;
}

function renderCards(filter) {

    ${pageHead('Thẻ ghi nhớ', cards.length + ' thẻ · ' + totalDue + ' đến hạn hôm nay',

      <span class="grow"></span>
      <span class="kicker">Chuỗi thẻ: ${Array.from(SY_INTERVALS).map((d, i) => byBox[i] ? `<b>${byBox[i]}</b>·${SY_BOX_LABEL[i]}` : '').filter(Boolean).join('  ') || '—'}</span>
    </div>

    <div id="cdBody"></div>

    <div class="cd-list-h"><span class="kicker">Tất cả thẻ · ${list.length}</span></div>

      ${list.length ? list.map(c => `<div class="cd-row" data-id="${c.id}">
        <span class="cd-row-f">${esc(c.front)}</span>
        <span class="cd-row-b">${esc(c.back)}</span>
        <span class="cd-row-m">Lớp ${c.g} · ${syScopeName(c.g, c.s)} · hộp ${(c.box || 0) + 1}</span>
        <span class="cd-row-x"><button class="bkbtn del" data-del="${c.id}" title="Xoá thẻ">×</button></span>
      </div>`).join('') : `<div class="files-empty"><b>Chưa có thẻ nào</b>

    </div>
  </section>`;

  $$('[data-del]').forEach(b => b.onclick = () => {
    const S2 = studyState();
    S2.cards = S2.cards.filter(c => c.id !== b.dataset.del); save(); renderCards();
  });

  const fromLesson = () => {
    const l = syNextLesson();
    if (!l) return toast('Chưa có bài nào');
    const qs = syLessonQuestions({ g: l.g, s: l.s }).filter(q => q.lesson === l.id);
    if (!qs.length) return toast('Bài này chưa có câu hỏi — thêm khối “Câu hỏi” trong studio');
    let n = 0;
    qs.forEach(q => { if (syAddCard({ front: q.q, back: q.a || '(tự trả lời)', g: q.g, s: q.s, lesson: q.lesson })) n++; });
    toast('Đã tạo ' + n + ' thẻ từ “' + l.t.slice(0, 30) + '”'); renderCards();
  };
  const cdFromLesson = $('#cdFromLesson'); if (cdFromLesson) cdFromLesson.onclick = fromLesson;
  const cdNew = $('#cdNew'); if (cdNew) cdNew.onclick = () => uiCardForm();

function syStartReview() {
  const queue = syDue();
  const body = $('#cdBody');
  if (!queue.length) { toast('Không còn thẻ đến hạn'); return; }
  let i = 0, shown = false;
  const stat = { again: 0, hard: 0, good: 0, easy: 0 };
  const total = queue.length;

  const done = () => {
    body.innerHTML = `<div class="cd-done">
      <span class="kicker">Xong lượt ôn</span>
      <h3>Đã ôn ${total} thẻ</h3>
      <div class="cd-done-grid">
        <div><b>${stat.again}</b><span>quên</span></div>
        <div><b>${stat.hard}</b><span>khó</span></div>
        <div><b>${stat.good}</b><span>được</span></div>
        <div><b>${stat.easy}</b><span>dễ</span></div>
      </div>
      <div class="cd-done-btns">
        <button class="btn sm" id="cdAgain">${syDue().length ? 'Ôn tiếp ' + syDue().length + ' thẻ quên' : 'Ôn lại toàn bộ'}</button>
        <a class="btn ghost sm" href="#/study">Về Học hôm nay</a>
      </div>
    </div>`;
    syCleanup();
    syLog(Math.max(1, Math.round(total * 0.3)), 'Ôn ' + total + ' thẻ', 'cards');
    const ag = $('#cdAgain');
    if (ag) ag.onclick = () => { ag.textContent = 'Đang tải…'; syStartReview(); };
    renderCards.stats = null;
  };

  const draw = () => {
    const c = queue[i];
    if (!c) return done();
    const box = c.box || 0;
    body.innerHTML = `<div class="cd-card" id="cdCard">
      <div class="cd-prog"><span class="kicker">${i + 1} / ${total}</span><div class="cd-bar"><i style="width:${Math.round(i / total * 100)}%"></i></div>
        <span class="cd-box">hộp ${box + 1} · ${SY_BOX_LABEL[box]}</span></div>
      <div class="cd-face">
        <span class="kicker">Mặt trước</span>
        <div class="cd-q">${esc(c.front)}</div>
        ${shown ? `<div class="cd-div"></div><span class="kicker">Mặt sau</span><div class="cd-a">${esc(c.back)}</div>` : `<button class="cd-show" id="cdShow">Hiện đáp án <kbd>Space</kbd></button>`}
      </div>
      ${shown ? `<div class="cd-grades">
        <button class="cd-g g0" data-g="0">Quên<kbd>1</kbd></button>
        <button class="cd-g g1" data-g="1">Khó<kbd>2</kbd></button>
        <button class="cd-g g2" data-g="2">Được<kbd>3</kbd></button>
        <button class="cd-g g3" data-g="3">Dễ<kbd>4</kbd></button>
      </div>` : ''}
    </div>`;

    const show = () => { shown = true; draw(); };
    const sh = $('#cdShow'); if (sh) sh.onclick = show;
    const card = $('#cdCard'); if (card) card.onclick = e => { if (e.target === card) show(); };
    $$('.cd-g').forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      syGrade(queue[i], g);
      stat[['again', 'hard', 'good', 'easy'][g]]++;
      i++; shown = false; draw();
    });
    syBindKeys(e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!shown) show(); }
      else if (shown && /^[1-4]$/.test(e.key)) { const b = $(`.cd-g[data-g="${+e.key - 1}"]`); if (b) b.click(); }
    });
  };
  draw();
}

  const S = studyState();
