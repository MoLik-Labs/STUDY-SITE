========================================================= */
function renderLesson(dn,sn,pane){
  const d=DAYS.find(x=>x.n===+dn), s=d&&d.sessions.find(x=>x.n===+sn);
  if(!d||!s){go('#/');return;}
  state.last={d:d.n,s:s.n}; save();
  const P=pane||state.pane||'learn';
  const done=!!state.done[sid(d.n,s.n)];
  const qs=quizFor(d.n,s.n,d);
  const qaList=qaOfTopic(TOPIC_OF_DAY(d));
  const answerdCount=qs.filter(x=>state.ans[x.id]&&state.ans[x.id].ok).length;

  $('#main').innerHTML=`
    <section class="wrap">
      <div class="lesson-head">
        <div class="crumb">
          <a href="#/">Lộ trình</a><span>/</span>
          <a href="#/day/${d.n}">Ngày ${String(d.n).padStart(2,'0')}</a><span>/</span>
          <span>Ca ${s.n}</span>
        </div>
        <h1>${s.title}</h1>
        <div class="lesson-meta">
          <span>${s.label} · ${s.time} · ${d.title} · ${s.v.length} bài giảng</span>
          ${done?'<span class="tag" style="border-color:#a9c1ad;color:var(--green)">đã học</span>':''}
        </div>
        <div class="seg" role="tablist">
          <button role="tab" data-pane="learn" aria-selected="${P==='learn'}">Bài giảng</button>
          <button role="tab" data-pane="quiz" aria-selected="${P==='quiz'}">Trắc nghiệm<span class="cnt">${qs.length}</span></button>
          <button role="tab" data-pane="qa" aria-selected="${P==='qa'}">Hỏi đáp<span class="cnt">${qaList.length}</span></button>
        </div>
      </div>
      <div class="pane" id="pane"></div>
      <div class="lesson-nav" id="lnav"></div>
    </section>`;

  // ca trước / ca sau trong toàn lộ trình
  const flat=[];
  DAYS.forEach(dd=>dd.sessions.forEach(ss=>flat.push({d:dd.n,s:ss.n,done:!!state.done[sid(dd.n,ss.n)],title:ss.title})));
  const idx=flat.findIndex(x=>x.d===d.n&&x.s===s.n);
  const prev=flat[idx-1], next=flat[idx+1];
  $('#lnav').innerHTML=`
    ${prev?`<a class="lnav-btn" href="#/lesson/${prev.d}/${prev.s}"><span class="kicker">← Ca trước</span><span>${prev.title}</span></a>`:'<span></span>'}
    ${next?`<a class="lnav-btn r" href="#/lesson/${next.d}/${next.s}"><span class="kicker">Ca tiếp →</span><span>${next.title}</span></a>`:''}`;

  $$('.seg button').forEach(b=>b.onclick=()=>{state.pane=b.dataset.pane;save();renderLesson(d.n,s.n,b.dataset.pane);});
  const host=$('#pane');
  if(P==='quiz') renderQuizPane(host,d,s,qs);
  else if(P==='qa') renderQAPane(host,d,s,qaList);
  else renderLearnPane(host,d,s);
}

/* ---------- mô phỏng thấu kính ---------- */
function mountLensSim(host){
  if(!host) return;
  host.innerHTML=`
    <section class="sim">
      <div class="sim-h">
        <span class="kicker">Mô phỏng tương tác</span>
        <h3>Dựng ảnh qua thấu kính hội tụ</h3>
        <p>Kéo hai thanh trượt để đổi tiêu cự và vị trí vật. Ảnh, chiều và độ lớn cập nhật ngay.</p>
      </div>
      <div class="sim-grid">
        <div class="sim-canvas"><svg id="lensSvg" viewBox="0 0 640 250" role="img" aria-label="Sơ đồ dựng ảnh qua thấu kính hội tụ"></svg></div>
        <div class="sim-ctrl">
          <label class="sim-row"><span>Tiêu cự f</span><b id="fVal">10 cm</b>
            <input type="range" id="fRange" min="5" max="25" step="1" value="10"></label>
          <label class="sim-row"><span>Khoảng cách d</span><b id="dVal">30 cm</b>
            <input type="range" id="dRange" min="4" max="70" step="1" value="30"></label>
          <div class="sim-out" id="lensOut"></div>
          <div class="sim-legend">
            <span><i style="background:var(--accent)"></i>vật</span>
            <span><i style="background:var(--ink)"></i>ảnh thật</span>
            <span><i style="background:var(--ink-3)"></i>ảnh ảo (nét đứt)</span>
          </div>
        </div>
      </div>
    </section>`;
  const draw=()=>{
    const f=+$('#fRange').value, d=+$('#dRange').value;
    $('#fVal').textContent=f+' cm'; $('#dVal').textContent=d+' cm';
    const S=3.1, AX=132, LX=320, H=44;
    const xO=LX-d*S;
    const atFocus=Math.abs(d-f)<0.4;
    const dp=atFocus?null:d*f/(d-f);
    const real=dp!==null&&dp>0;
    const xi=dp===null?null:LX+dp*S;
    // ảnh thật thì ngược chiều (nằm dưới trục), ảnh ảo thì cùng chiều (nằm trên)
    const hiRaw=dp===null?0:-(H*dp/d);
    const hi=Math.max(-104,Math.min(104,hiRaw));
    const inFrame=xi!==null&&xi>8&&xi<632;
    const cx=xi===null?null:Math.max(16,Math.min(624,xi));
    const yTip=dp===null?null:AX-hi;
    const F1=LX-f*S, F2=LX+f*S;

    let rays='';
    // tia tới song song trục chính
    rays+=`<path d="M${xO} ${AX-H} H${LX}" class="ray"/>`;
    // tia tới qua quang tâm
    rays+=`<path d="M${xO} ${AX-H} L${LX} ${AX}" class="ray"/>`;

    if(dp!==null){
      if(real){
        rays+=`<path d="M${LX} ${AX-H} L${cx} ${yTip}" class="ray"/>`;
        rays+=`<path d="M${LX} ${AX} L${cx} ${yTip}" class="ray"/>`;
        // kéo dài qua ảnh một đoạn ngắn
        const dx=cx-LX, dy=yTip-(AX-H);
        rays+=`<path d="M${cx} ${yTip} L${Math.min(628,cx+26)} ${yTip+dy*26/Math.max(dx,1)}" class="ray" opacity=".45"/>`;
      }else{
        const m1=H/(f*S);
        rays+=`<path d="M${LX} ${AX-H} L${628} ${(AX-H)+m1*(628-LX)}" class="ray"/>`;
        const m2=H/(d*S);
        rays+=`<path d="M${LX} ${AX} L${628} ${AX+m2*(628-LX)}" class="ray"/>`;
        rays+=`<path d="M${LX} ${AX-H} L${cx} ${yTip}" class="ray dash"/>`;
        rays+=`<path d="M${LX} ${AX} L${cx} ${yTip}" class="ray dash"/>`;
      }
    }else{
      // vật tại tiêu điểm: tia ló song song
      rays+=`<path d="M${LX} ${AX-H} L${628} ${AX-H}" class="ray"/>`;
      rays+=`<path d="M${LX} ${AX} L${628} ${AX-(AX-H)/Math.max(1,(LX-xO))*(628-LX)}" class="ray" opacity=".5"/>`;
    }

    $('#lensSvg').innerHTML=`
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#8b2e22"/>
        </marker>
        <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#17150f"/>
        </marker>
      </defs>
      <line x1="12" y1="${AX}" x2="628" y2="${AX}" class="axis"/>
      <line x1="${LX}" y1="18" x2="${LX}" y2="246" class="lens"/>
      <path d="M${LX-7} 30 L${LX} 18 L${LX+7} 30" class="lenscap"/>
      <path d="M${LX-7} 234 L${LX} 246 L${LX+7} 234" class="lenscap"/>
      <circle cx="${F1}" cy="${AX}" r="2.6" class="fdot"/><circle cx="${F2}" cy="${AX}" r="2.6" class="fdot"/>
      <text x="${F1-4}" y="${AX+18}" class="flab">F</text>
      <text x="${F2-4}" y="${AX+18}" class="flab">F′</text>
      <text x="${LX+8}" y="${AX-9}" class="flab">O</text>
      <line x1="${xO}" y1="${AX}" x2="${xO}" y2="${AX-H}" class="obj" marker-end="url(#ar)"/>
      <text x="${xO-4}" y="${AX-H-8}" class="oblab">AB</text>
      ${rays}
      ${dp!==null&&inFrame?`<line x1="${cx}" y1="${AX}" x2="${cx}" y2="${yTip}" class="${real?'img':'img virt'}" marker-end="url(#ab)"/>
      <text x="${cx-8}" y="${yTip+(yTip<AX?-8:16)}" class="oblab">A′B′</text>`:''}
      <text x="16" y="242" class="small">d = ${d} cm · f = ${f} cm</text>
      <text x="466" y="242" class="small">${dp===null?'d = f → chùm ló song song':`d′ = ${dp.toFixed(1)} cm`}</text>`;

    const out=$('#lensOut');
    if(dp===null){ out.innerHTML='<b>Vật đặt đúng tiêu điểm.</b> Các tia ló song song với nhau, không tạo ảnh rõ trên màn.'; return; }
    const k=Math.abs(dp/d);
    const kind=real?'Ảnh thật, ngược chiều':'Ảnh ảo, cùng chiều';
    const size=k>1.02?'lớn hơn vật':(k<0.98?'nhỏ hơn vật':'bằng vật');
    const zone=real&&d>2*f?'Vật ngoài 2F ⇒ ảnh trong khoảng F′–2F′.':(real&&d<2*f?'Vật trong khoảng F–2F ⇒ ảnh ngoài 2F′.':'');
    out.innerHTML=`<b>${kind}, ${size}.</b> d′ = ${dp.toFixed(1)} cm · |k| = ${k.toFixed(2)}.
      <span style="display:block;color:var(--ink-3);margin-top:4px">${real?'Hứng được trên màn, khác phía vật.':'Không hứng được trên màn, cùng phía với vật.'} ${zone}</span>`;
  };
  $('#fRange').oninput=draw; $('#dRange').oninput=draw; draw();
}

/* ---------- question engine ---------- */
const QS=QUIZ.map((q,i)=>Object.assign({id:i},q));
const qType=q=>q.type||'mcq';

/* ---------- chấm câu điền số: dung sai tương đối + kiểm tra đơn vị ---------- */
const UNIT_ALIAS={'ω':'Ω','ohm':'Ω','ôôm':'Ω','vôn':'V','ampe':'A','watt':'W','jun':'J','niuton':'N',
  'gam':'g','kilogam':'kg','giây':'s','phút':'min','giờ':'h','độ':'°C','do':'°C','c':'°C','oc':'°C'};
const unitNorm=u=>{
  let x=norm(u).replace(/\s+/g,'');
  x=x.replace(/m3/g,'m³').replace(/cm3/g,'cm³').replace(/dm3/g,'dm³').replace(/mm2/g,'mm²').replace(/cm2/g,'cm²');
  return UNIT_ALIAS[x]||x;
};
const unitOf=q=>unitNorm(q.unit||'');
function parseNum(str){
  const raw=String(str||'').replace(',','.').replace(/−/g,'-').trim();
  const m=raw.match(/^([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s*([^\d.\s].*)?$/);
  if(!m) return {v:NaN,unit:''};
  return {v:parseFloat(m[1]),unit:m[2]||''};
}
const numTol=q=>Math.max(q.tol||0,Math.abs(q.a)*0.005);
const numOK=(q,p)=>{
  if(typeof p!=='number'||!isFinite(p)) return false;
  const d=Math.abs(p-q.a);
  if(d<=numTol(q)) return true;
  /* chấp nhận làm tròn khác số chữ số có nghĩa: so ở mức 3 chữ số */
  const sig=v=>{const s=Math.abs(v).toPrecision(3);return parseFloat(s);};
  return sig(p)===sig(q.a)&&Math.abs(q.a)>0;
};
const MULTI={};

function isCorrect(q,p){
  const t=qType(q);
  if(t==='multi') return Array.isArray(p)&&p.length===q.a.length&&q.a.every(x=>p.includes(x));
  if(t==='tf') return p===q.a;
  if(t==='num') return numOK(q,p);
  if(t==='order') return Array.isArray(p)&&p.length===q.s.length&&p.every((v,i)=>v===i);
  return p===q.a;
}
function recordAns(id,ok,p){
  if(typeof srsRecord==='function') return srsRecord(id,ok,p);
  state.ans[id]={ok:ok,p:p,at:Date.now()};
  activity(1); save();
}
function quizFor(dn,sn,d){
  const t=TOPIC_OF_DAY(d);
  const bank=QS.filter(q=>q.t===t);
  if(!bank.length) return [];
  const start=(dn*3+sn)%bank.length;
  const out=[];
  for(let i=0;i<Math.min(3,bank.length);i++) out.push(bank[(start+i)%bank.length]);
  return out;
}
const TYPE_LABEL={mcq:'Trắc nghiệm',multi:'Nhiều đáp án',tf:'Đúng / Sai',num:'Điền số',order:'Sắp xếp bước',pick:'Chọn hình'};
const ORD={},PICK={},ordSeen={};

function renderQuestion(host,q,opt){
  opt=opt||{};
  const t=qType(q);
  const exam=!!opt.exam;
  const revealed=!exam&&!!opt.revealed;
  const picked=exam?(opt.picks?opt.picks[q.id]:opt.picked):opt.picked;
  const ok=revealed?isCorrect(q,picked):null;
  let body='';

  if(t==='mcq'||t==='multi'){
    const sel=t==='multi'?(Array.isArray(picked)?picked:(MULTI[q.id]||[])):picked;
    body='<div class="opts">'+q.o.map((o,i)=>{
      const on=t==='multi'?sel.includes(i):sel===i;
      let cls='opt'+(on?' pick':'');
      if(revealed){
        const isAns=t==='multi'?q.a.includes(i):i===q.a;
        if(isAns) cls+=' right';
        if(on&&!isAns) cls+=' wrong';
      }
      return `<button class="${cls}" data-o="${i}" ${revealed?'disabled':''}>
        <span class="oi">${t==='multi'?'<span class="mbox'+(on?' on':'')+'"></span>':'ABCD'[i]}</span>
        <span class="ot">${o}</span></button>`;
    }).join('')+'</div>';
    if(t==='multi'&&!revealed&&!exam){
      body+=`<div class="qfoot"><span class="qscore">Chọn tất cả đáp án đúng rồi bấm kiểm tra</span><button class="btn sm" data-check="1">Kiểm tra</button></div>`;
    }
  }else if(t==='tf'){
    const cls=(v)=>{let c='opt tfb';if(revealed){ if(q.a===v)c+=' right'; else if(picked===v)c+=' wrong'; }else if(picked===v)c+=' pick';return c;};
    body=`<div class="tfrow">
      <button class="${cls(true)}" data-tf="1" ${revealed?'disabled':''}>Đúng</button>
      <button class="${cls(false)}" data-tf="0" ${revealed?'disabled':''}>Sai</button>
    </div>`;
  }else if(t==='order'){
    if(!ORD[q.id]) ORD[q.id]=shuffleIdx(q.s.map((_,i)=>i));
    const cur=picked&&Array.isArray(picked)?picked.slice():ORD[q.id].slice();
    body=`<div class="ordlist">`+cur.map((oi,pos)=>{
      let cls='ord-row';
      if(revealed) cls+=oi===pos?' right':' wrong';
      return `<div class="${cls}" draggable="${revealed?'false':'true'}" data-pos="${pos}">
        <span class="ord-n">${pos+1}</span><span class="ord-t">${q.s[oi]}</span>
        ${revealed?'':`<span class="ord-mv"><button data-up="${pos}" aria-label="Lên">↑</button><button data-dn="${pos}" aria-label="Xuống">↓</button></span>`}
      </div>`;
    }).join('')+`</div>`;
    if(!revealed) body+=`<div class="qfoot"><span class="qscore">Kéo thả hoặc dùng mũi tên để xếp đúng thứ tự</span><button class="btn sm" data-check="1">Kiểm tra</button></div>`;
  }else if(t==='pick'){
    if(PICK[q.id]===undefined&&!picked) PICK[q.id]=null;
    const sel=(picked!==undefined&&picked!==null)?picked:PICK[q.id];
    body=`<div class="pickgrid">`+q.tiles.map((svg,i)=>{
      let cls='picktile'+(sel===i?' on':'');
      if(revealed) cls+=i===q.a?' right':(sel===i?' wrong':'');
      return `<button class="${cls}" data-i="${i}" draggable="${revealed?'false':'true'}" aria-pressed="${sel===i}">${svg}<span class="picklbl">${'ABCD'[i]}</span></button>`;
    }).join('')+`</div>`;
    if(!revealed) body+=`<div class="qfoot"><span class="qscore">Chọn hoặc kéo hình đúng vào khung bên dưới</span><button class="btn sm" data-check="1">Kiểm tra</button></div><div class="pickslot" id="pickSlot">Kéo hình đúng vào đây</div>`;
  }else{
    body=`<div class="numrow">
      <span class="numbox"><input class="numin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Nhập số" title="Gõ số, hoặc số kèm đơn vị (ví dụ 12${q.unit?' '+q.unit:''})" value="${picked===undefined||picked===null?'':picked}" ${revealed?'disabled':''}><span class="unit">${q.unit||''}</span></span>
      ${revealed?'':'<button class="btn sm" data-check="1">Kiểm tra</button>'}
    </div><div class="uunit"></div>`;
  }

  let fb='';
  if(revealed){
    const right=t==='multi'?q.a.map(i=>'ABCD'[i]).join(', '):(t==='num'?q.a+(q.unit?' '+q.unit:'')+(numTol(q)>0?` <span class="tol">(nhận sai số ±${Math.round(numTol(q)*1000)/1000}${q.unit?' '+q.unit:''})</span>`:''):(t==='tf'?(q.a?'Đúng':'Sai'):(t==='pick'?'Hình '+'ABCD'[q.a]:(t==='order'?'Thứ tự đúng là các bước 1 → '+q.s.length:'ABCD'[q.a]))));
    fb=`<div class="exp${ok?'':' bad'}"><b>${ok?'Đúng.':'Chưa đúng — đáp án '+right+'.'}</b> ${q.e||''}</div>`;
  }

  host.innerHTML=`<div class="qcard">
    <div class="qtop"><span class="qtype">${TYPE_LABEL[t]}</span><span class="qtopic">${topicName(q.t)}</span></div>
    <div class="qst">${q.q}</div>
    ${body}${fb}
  </div>`;

  const finish=(p)=>{
    if(exam){ opt.picks[q.id]=p; if(opt.onPick) opt.onPick(q.id,p); renderQuestion(host,q,opt); return; }
    const good=isCorrect(q,p);
    recordAns(q.id,good,p);
    opt.picked=p; opt.revealed=true;
    renderQuestion(host,q,opt);
    if(opt.onAnswer) opt.onAnswer(good);
  };

  if(t==='multi'&&!revealed&&!exam){
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o; const cur=MULTI[q.id]||[];
      MULTI[q.id]=cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i);
      renderQuestion(host,q,opt);
    });
    const c=$('[data-check]',host); if(c) c.onclick=()=>finish(MULTI[q.id]||[]);
  }else if(t==='multi'&&exam){
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o; const cur=(opt.picks[q.id]||[]);
      finish(cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i));
    });
  }else if(t==='mcq'){
    $$('.opt',host).forEach(b=>b.onclick=()=>finish(+b.dataset.o));
  }else if(t==='tf'){
    $$('[data-tf]',host).forEach(b=>b.onclick=()=>finish(b.dataset.tf==='1'));
  }else if(t==='order'){
    const cur=(picked&&Array.isArray(picked)?picked.slice():ORD[q.id].slice());
    const move=(from,to)=>{
      if(to<0||to>=cur.length) return;
      const a=cur.slice(); const [x]=a.splice(from,1); a.splice(to,0,x);
      ORD[q.id]=a; renderQuestion(host,q,Object.assign({},opt,{picked:undefined,revealed:false}));
    };
    $$('.ord-row',host).forEach(r=>{
      r.ondragstart=e=>{ e.dataTransfer.setData('text/plain',r.dataset.pos); r.classList.add('drag'); };
      r.ondragend=()=>r.classList.remove('drag');
      r.ondragover=e=>e.preventDefault();
      r.ondrop=e=>{ e.preventDefault(); const from=+e.dataTransfer.getData('text/plain'); move(from,+r.dataset.pos); };
    });
    $$('.ord-mv button',host).forEach(b=>b.onclick=()=>{
      const p=+ (b.dataset.up!==undefined?b.dataset.up:b.dataset.dn);
      move(p, b.dataset.up!==undefined?p-1:p+1);
    });
    const c=$('[data-check]',host); if(c) c.onclick=()=>finish(cur);
  }else if(t==='pick'){
    const choose=i=>{ PICK[q.id]=i; renderQuestion(host,q,Object.assign({},opt,{picked:undefined,revealed:false})); };
    $$('.picktile',host).forEach(b=>{
      b.onclick=()=>{ if(exam){ finish(+b.dataset.i); } else choose(+b.dataset.i); };
      b.ondragstart=e=>{ e.dataTransfer.setData('text/plain','pick:'+b.dataset.i); };
    });
    const ps=$('#pickSlot',host);
    if(ps){
      ps.ondragover=e=>{ e.preventDefault(); ps.classList.add('hot'); };
      ps.ondragleave=()=>ps.classList.remove('hot');
      ps.ondrop=e=>{
        e.preventDefault(); ps.classList.remove('hot');
        const raw=e.dataTransfer.getData('text/plain')||'';
        const i=+raw.replace('pick:','');
        if(!isNaN(i)){ PICK[q.id]=i; const c2=$('[data-check]',host); c2&&c2.click(); }
      };
    }
    const c=$('[data-check]',host); if(c) c.onclick=()=>{ if(PICK[q.id]===null||PICK[q.id]===undefined) return; finish(PICK[q.id]); };
  }else if(t==='num'){
    const inp=$('.numin',host);
    const read=()=>{
      const {v,unit}=parseNum(inp.value);
      if(!isFinite(v)) return {v:NaN,unit};
      if(unit&&q.unit&&unitNorm(unit)!==unitOf(q)) return {v,unit,mismatch:true};
      if(unit&&!q.unit) return {v,unit};
      return {v,unit};
    };
    const warn=(msg)=>{
      inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400);
      const w=$('.uunit',host); if(w){ w.textContent=msg; w.style.display='block'; }
      toast(msg); inp.focus();
    };
    if(inp){
      inp.onchange=()=>{
        if(!exam) return;
        const r=read();
        if(r.mismatch){ warn('Sai đơn vị — đáp án cần '+q.unit); return; }
        finish(isFinite(r.v)?r.v:null);
      };
      inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();const b=$('[data-check]',host);b&&b.click();} };
      inp.oninput=()=>{ const w=$('.uunit',host); if(w) w.style.display='none'; };
    }
    const c=$('[data-check]',host);
    if(c) c.onclick=()=>{
      const r=read();
      if(!isFinite(r.v)){ warn('Chưa có số. Gõ ví dụ: 12 hoặc 12 '+(q.unit||'')); return; }
      if(r.mismatch){ warn('Số đúng hướng rồi, nhưng đơn vị phải là '+q.unit+'.'); return; }
      finish(r.v);
    };
  }
}

const topicName=id=>{const t=TOPICS.find(x=>x.id===id);return t?'Chủ đề '+t.id:'Tổng hợp';};
function shuffleIdx(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderQuizPane(host,d,s,qs){
  if(!qs.length){host.innerHTML='<p style="color:var(--ink-3)">Chưa có câu hỏi cho chủ đề này.</p>';return;}
  let idx=0;
  const draw=()=>{
    const q=qs[idx];
    const a=state.ans[q.id];
    host.innerHTML=`
      <div class="quiz">
        <div class="qmeta">
          <span class="kicker">Câu ${idx+1} / ${qs.length}</span>
          <span class="qdots">${qs.map((x,i)=>{
            const p=state.ans[x.id];
            const c=i===idx?'cur':(p?(p.ok?'ok':'no'):'');
            return `<i class="${c}"></i>`;
          }).join('')}</span>
        </div>
        <div id="qslot"></div>
        <div class="qfoot">
          <span class="qscore">${qs.filter(x=>state.ans[x.id]).length} / ${qs.length} câu đã trả lời · đúng ${qs.filter(x=>state.ans[x.id]&&state.ans[x.id].ok).length}</span>
          <span style="display:flex;gap:8px">
            ${idx>0?'<button class="btn ghost sm" id="prevQ">← Câu trước</button>':''}
            ${idx<qs.length-1?'<button class="btn ghost sm" id="nextQ">Câu tiếp →</button>':''}
            <button class="btn sm" id="againQ">Làm lại</button>
          </span>
        </div>
      </div>`;
    renderQuestion($('#qslot'),q,{picked:a?a.p:undefined,revealed:!!a,onAnswer:()=>{draw();}});
    const n=$('#nextQ'),p=$('#prevQ'),ag=$('#againQ');
    if(n) n.onclick=()=>{idx=Math.min(qs.length-1,idx+1);draw();};
    if(p) p.onclick=()=>{idx=Math.max(0,idx-1);draw();};
    if(ag) ag.onclick=()=>{qs.forEach(x=>delete state.ans[x.id]);save();idx=0;draw();};
  };
  draw();
}

              :TOPICS.map(t=>{
                const list=qaOfTopic(t.id); if(!list.length) return '';
                const K=3;
                return `<div class="qa-group" data-topic="${t.id}" style="margin-top:26px" data-total="${list.length}" data-shown="${Math.min(K,list.length)}">
                  <div class="lib-head"><span class="n">${t.n}</span><h3>${t.name}</h3>
                    <span class="c">${list.length} câu</span></div>
                  <div class="qa-glist">${list.slice(0,K).map(x=>qaItemHTML(x,t.id)).join('')}</div>
                  ${list.length>K?`<button class="qa-more" data-more="${t.id}">Xem thêm ${list.length-K} câu về chủ đề ${t.id} ↓</button>`:''}
                </div>`;
              }).join('')}
          </div>
        </div>
      </div>
    </section>`;
  $('#qaPageForm').onsubmit=e=>{e.preventDefault();go('#/qa?q='+encodeURIComponent($('#qaPageInput').value));};
  $$('.qa-chip[data-q]').forEach(c=>c.onclick=()=>{if(c.dataset.q)go('#/qa?q='+encodeURIComponent(c.dataset.q));});
  if($('#qaAll')) $('#qaAll').onclick=()=>go('#/qa');
  $$('[data-more]').forEach(b=>b.onclick=()=>{
    const g=b.closest('.qa-group'); const tid=+b.dataset.more;
    const list=qaOfTopic(tid); const shown=+g.dataset.shown;
    const next=Math.min(list.length,shown+6);
    g.querySelector('.qa-glist').insertAdjacentHTML('beforeend',list.slice(shown,next).map(x=>qaItemHTML(x,tid)).join(''));
    g.dataset.shown=next;
    if(next>=list.length) b.remove();
    else b.textContent=`Xem thêm ${list.length-next} câu về chủ đề ${tid} ↓`;
  });
  if(q) window.scrollTo({top:0});
}

let libFilter={scope:'all',teacher:'all',q:''};
function renderLibrary(){
  const q=libFilter.q;
  const counts={};
  Object.values(LIB).forEach(v=>counts[v.topic]=(counts[v.topic]||0)+1);
  $('#main').innerHTML=`
    <section class="wrap wide">
      <div class="page-head">
        <span class="kicker">Thư viện · ${VID_COUNT} bài giảng đã kiểm chứng</span>
        <h1 style="margin-top:8px">Toàn bộ bài giảng</h1>
        <p>Bấm vào một dòng để phát ngay trong trang. Bài đánh dấu <b>chọn</b> là bài nên xem trước.</p>
      </div>
      <div class="filters">
        <button class="chip" data-scope="all" aria-pressed="${libFilter.scope==='all'}">Tất cả</button>
        <button class="chip" data-scope="pick" aria-pressed="${libFilter.scope==='pick'}">Bài chọn</button>
        <button class="chip" data-scope="vna" aria-pressed="${libFilter.scope==='vna'}">Thầy VNA</button>
        <button class="chip" data-scope="seen" aria-pressed="${libFilter.scope==='seen'}">Đã xem</button>
        <span class="sep"></span>
        <input id="libq" value="${esc(q)}" placeholder="Tìm bài giảng…" style="border:1px solid var(--rule);background:var(--card);padding:6px 10px;font:inherit;font-size:12.5px;min-width:200px" autocomplete="off">
        <span class="count" id="libcount"></span>
      </div>
      <div id="libgroups"></div>
    </section>`;
  const draw=()=>{
    const normq=norm(q); const out=$('#libgroups'); let total=0; out.innerHTML='';
    TOPICS.forEach(tp=>{
      const rows=Object.entries(LIB).filter(([id,v])=>{
        if(v.topic!==tp.id) return false;
        if(libFilter.scope==='pick'&&!v.pick) return false;
        if(libFilter.scope==='vna'&&v.who!=='VNA') return false;
        if(libFilter.scope==='seen'&&!state.watched[id]) return false;
        if(normq && !norm(v.t+' '+id+' '+(WHO[v.who]||'')).includes(normq)) return false;
        return true;
      });
      if(!rows.length) return;
      total+=rows.length;
      rows.sort((a,b)=>(b[1].pick?1:0)-(a[1].pick?1:0));
      const g=document.createElement('div');
      g.className='lib-group';
      const K=normq?rows.length:4;        /* có từ khoá thì mở hết */
      const rowHTML=([id,v],i)=>`<button class="lib-row${state.watched[id]?' seen':''}" data-vid="${id}">
          <span class="i">${String(i+1).padStart(2,'0')}</span>
          <span class="t">${v.pick?'<em>chọn</em>':''}${v.t}</span>
          <span class="w">${shortWho(v.who)}</span>
          <span class="d">${v.d||'—'}</span>
        </button>`;
      g.innerHTML=`<div class="lib-head"><span class="n">${tp.n}</span><h3>${tp.name}</h3><span class="c">${rows.length} bài</span></div>
        <div class="lib-rows">${rows.slice(0,K).map(rowHTML).join('')}</div>
        ${rows.length>K?`<button class="lib-more" data-left="${rows.length-K}">+ ${rows.length-K} bài nữa của chủ đề ${tp.n}</button>`:''}`;
      const more=g.querySelector('.lib-more');
      if(more) more.onclick=()=>{
        g.querySelector('.lib-rows').insertAdjacentHTML('beforeend',rows.slice(K).map(rowHTML).join(''));
        more.remove();
        $$('.lib-row',g).forEach(r=>r.onclick=()=>openVideoModal(r.dataset.vid));
      };
      out.appendChild(g);
    });
    $('#libcount').textContent=`${total} / ${VID_COUNT} bài`;
    $$('.lib-row').forEach(r=>r.onclick=()=>openVideoModal(r.dataset.vid));
  };
  draw();
  $$('.chip[data-scope]').forEach(b=>b.onclick=()=>{
    libFilter.scope=b.dataset.scope;
    $$('.chip[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.scope===libFilter.scope));
    draw();
  });
  $('#libq').oninput=e=>{q=e.target.value;draw();};
}

function openVideoModal(id){
  const v=LIB[id];
  const title=v?v.t:'Video chữa đề';
  const meta=v?(v.d||''):'';
  const m=document.createElement('div');
  m.className='modal';
  m.innerHTML=`<div class="modal-in" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><span class="kicker">${esc(title)}${meta?' · '+meta:''}</span><button class="x" aria-label="Đóng">✕ Đóng</button></div>
      <div class="modal-b"><div style="position:relative;aspect-ratio:16/9">
        <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(title)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>
      </div></div>
      <div class="modal-f"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Mở trên YouTube ↗</a>
        <span>Khung phát có thể bị chặn khi xem offline — mở trực tiếp nếu không thấy hình.</span></div>
    </div>`;
  document.body.appendChild(m);
  state.watched[id]=1; save();
  if(typeof musicDuck==='function') musicDuck(true);
  const close=()=>{ m.remove(); if(typeof musicDuck==='function') musicDuck(false); };
  $('.x',m).onclick=close;
  m.onclick=e=>{if(e.target===m)close();};
  document.addEventListener('keydown',function esc2(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc2);}});
}

function render(){

  const openModal=document.querySelector('.modal');
  if(openModal && typeof musicDuck==='function') musicDuck(false);
  if(openModal && !/^#\/vid/.test(location.hash)) openModal.remove();
  /* dọn listener của phiên thi cũ để phím tắt không đè lên trang mới */
  if (typeof EXAM !== 'undefined' && EXAM && typeof EXAM._cleanup === 'function' && !/^#\/exam/.test(location.hash||'')) {
    try { EXAM._cleanup(); } catch (e) {}
    if (EXAM.done) EXAM = null;
  }
  /* dọn thanh tiến độ đọc của trang bài học cũ */
  if (typeof readProgOff === 'function') { try { readProgOff(); } catch (e) {} }
  if (typeof syCleanup === 'function') { try { syCleanup(); } catch (e) {} }
  if (typeof mountDocks === 'function') mountDocks();
  const h=location.hash||'#/';
  renderTop(); renderRail();
  const [path,query]=h.replace(/^#/,'').split('?');
  const p=path.split('/').filter(Boolean);
  const qp=new URLSearchParams(query||'');
  window.scrollTo(0,0);
  const mainEl=$('#main');
  if(mainEl&&document.activeElement&&document.activeElement!==document.body&&!mainEl.contains(document.activeElement)){
    mainEl.setAttribute('tabindex','-1'); try{mainEl.focus({preventScroll:true});}catch(e){}
  }
  if(p[0]==='lesson'&&p[1]&&p[2]) return renderLesson(p[1],p[2],qp.get('pane')||state.pane);
  if(p[0]==='day'&&p[1]) return renderDay(p[1]);

  if(p[0]==='review') return renderReview();
  if(p[0]==='solve') return renderSolve(p[1]===undefined?undefined:+p[1]);
  if(p[0]==='flash') return renderFlash();
  if(p[0]==='stats') return renderStats();
  if(p[0]==='calc') return renderCalc();
  if(p[0]==='build') return renderBoard();
  if(p[0]==='builder') return renderBuild();
  if(p[0]==='sim') return renderSim();
  if(p[0]==='subjects') return renderShelf();
  if(p[0]==='subject'&&p[1]&&p[2]) return renderSubject(+p[1],p[2]);
  if(p[0]==='read'&&p[1]) return renderRead(p[1]);
  if(p[0]==='studio') return renderStudio(p[1]||null);
  if(p[0]==='mine') return renderMine();
  if(p[0]==='files') return renderFiles();
  if(p[0]==='study') return renderStudy();
  if(p[0]==='cards') return renderCards();
  if(p[0]==='practice') return renderPractice();
  if(p[0]==='plan') return renderPlan();
  if(p[0]==='focus') return renderFocus();
  if(p[0]==='progress') return renderProgress();
  if(p[0]==='timetable') return renderTimetable();
  if(p[0]==='calendar') return renderCalendar();
  if(p[0]==='about') return renderAbout();
  if(p[0]==='lab') return renderLab();

  if(p[0]==='settings') return renderSettings();
  if(p[0]==='vid'&&p[1]){ renderHome(); setTimeout(()=>openVideoModal(p[1]),60); return; }
  return renderHome();
}

/* =========================================================
   FOCUS TRAP — giữ phím Tab trong hộp thoại đang mở
   Mọi overlay (lịch, thời khoá biểu, uiPrompt, xoá dữ liệu) đều dựa vào
   phần tử .ov-panel[role=dialog|alertdialog]. Không có bẫy này thì Tab
   sẽ chạy ra sau lớp phủ và người dùng bàn phím bị lạc.
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const panels = [...document.querySelectorAll('.ov-panel[role="dialog"],.ov-panel[role="alertdialog"]')];
  const panel = panels[panels.length - 1];
  if (!panel) return;
  const items = [...panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && (document.activeElement === last || !panel.contains(document.activeElement))) {
    e.preventDefault(); first.focus();
  }
}, true);

/* ---------- helpers ---------- */
const ALLQ=QS;
const wrongList=()=>ALLQ.filter(q=>state.ans[q.id]&&!state.ans[q.id].ok);
const reviewList=()=>typeof dueList==='function'?dueList():wrongList();
const answerStats=()=>{
  const a=Object.values(state.ans);
  return {n:a.length, ok:a.filter(x=>x.ok).length};
};
function pageHead(kicker,h1,p){
  return `<div class="page-head"><span class="kicker">${kicker}</span>
    <h1 style="margin-top:8px">${h1}</h1><p>${p||''}</p></div>`;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* =========================================================
   1 · EXAM — 15 câu ngẫu nhiên, 20 phút, bảng điểm theo chủ đề
========================================================= */
const EXAM_N=15, EXAM_SEC=20*60;
let EXAM=null;

function pickExam(n){
  const byTopic={};
  ALLQ.forEach(q=>{(byTopic[q.t]=byTopic[q.t]||[]).push(q);});
  const keys=Object.keys(byTopic);
  const out=[];
  // vòng 1: mỗi chủ đề một câu
  shuffle(keys).forEach(k=>{ if(out.length<n) out.push(shuffle(byTopic[k])[0]); });
  // vòng 2: lấp đầy từ pool còn lại
  const rest=shuffle(ALLQ.filter(q=>!out.includes(q)));
  while(out.length<n&&rest.length) out.push(rest.pop());
  return shuffle(out);
}

function drillExam(tags,n,label){
  const pool=ALLQ.filter(q=>tags.includes(q.t));
  if(!pool.length){ toast('Chưa có câu cho chủ đề này'); return; }
  const byT={};
  pool.forEach(q=>{(byT[q.t]=byT[q.t]||[]).push(q);});
  const out=[];
  Object.keys(byT).forEach(k=>out.push(shuffle(byT[k])[0]));
  const rest=shuffle(pool.filter(q=>!out.includes(q)));
  while(out.length<(n||12)&&rest.length) out.push(rest.pop());
  EXAM={qs:shuffle(out),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,
        label:'Luyện phổ đề · '+(label||'đề đã chọn')};
  location.hash='#/exam';
  if(location.hash==='#/exam') renderExam();
}
function drillQuestions(list,label){
  if(!list||!list.length){ toast('Không có câu nào'); return; }
  EXAM={qs:list.slice(),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,
        label:'Luyện lại · '+(label||list.length+' câu')};
  location.hash='#/exam';
  if(location.hash==='#/exam') renderExam();
}

let __examUnbind=null;   /* gỡ listener + đồng hồ của lượt thi trước (kể cả khi đã bốc đề mới) */
function renderExam(){
  if(!EXAM){
    const r=typeof examRestore==='function'?examRestore():null;
    if(r){ EXAM=r; setTimeout(()=>toast('Đã khôi phục đề đang làm'),60); }
    else EXAM={qs:pickExam(EXAM_N),picks:{},left:EXAM_SEC,t0:Date.now(),done:false,report:null,label:''};
  }
  /* dọn listener + đồng hồ của lượt vẽ trước, tránh gắn trùng (bấm F sẽ đảo 2 lần) */
  if(__examUnbind){ try{ __examUnbind(); }catch(e){} __examUnbind=null; }
  if(typeof EXAM._cleanup==='function'){ try{ EXAM._cleanup(); }catch(e){} delete EXAM._cleanup; }
  const EH=EXAM.label||'Thi thử · 15 câu · 20 phút';
  const ES=EXAM.label
    ? 'Đề luyện riêng · '+EXAM.qs.length+' câu · chấm xong có bảng theo chủ đề'
    : 'Đề ngẫu nhiên toàn chương trình · '+EXAM.qs.length+' câu';
  $('#main').innerHTML=`<section class="wrap wide">
    ${pageHead(EH,ES,'Mỗi lượt bốc lại câu mới từ 12 chủ đề. Không xem lời giải trong lúc làm; nộp bài mới có bảng điểm theo chủ đề.')}
    <div class="exam-bar" id="examBar">
      <span class="exam-clock" id="clock">20:00</span>
      <div class="exam-prog"><i id="examProg"></i></div>
      <span class="exam-cnt" id="examCnt">0 / 15</span>
      <button class="btn sm" id="examSubmit">Nộp bài</button>
      <button class="btn ghost sm" id="examReset">Đề mới</button>
    </div>
    <div class="exam-map" id="examMap"></div>
    <div id="examBody"></div>
    <p class="exam-keys">Phím: <b>1–4 / A–D</b> chọn đáp án · <b>↑ ↓</b> chuyển câu · <b>F</b> cắm cờ xem lại · <b>Enter</b> sang câu trống kế tiếp</p>
  </section>`;
  const body=$('#examBody');
  if(EXAM.done&&EXAM.report){
    const bar=$('#examBar'); if(bar) bar.style.display='none';
    showReport(EXAM.report.rows,EXAM.report.rep,EXAM.report.auto);
    return;
  }
  startClock();

  const drawList=()=>{
    body.innerHTML=EXAM.qs.map((q,i)=>`<div class="exam-q" id="eq${i}">
      <div class="exam-qn"><span class="num">${i+1}</span><span class="qtype">${TYPE_LABEL[qType(q)]}</span></div>
      <div id="eqslot${i}"></div>
    </div>`).join('');
    EXAM.qs.forEach((q,i)=>{
      renderQuestion($('#eqslot'+i),q,{exam:true,picks:EXAM.picks,onPick:updateBar});
    });
    updateBar();
  };
  const updateBar=()=>{
    const n=Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined&&EXAM.picks[k]!==null&&!(Array.isArray(EXAM.picks[k])&&!EXAM.picks[k].length)).length;
    $('#examCnt').textContent=`${n} / ${EXAM.qs.length}`;
    $('#examProg').style.width=(n/EXAM.qs.length*100)+'%';
    if(typeof examPersist==='function') examPersist(EXAM);
    paintMap(n);
  };
  let CUR=0;
  const isAnswered=i=>{const v=EXAM.picks[EXAM.qs[i].id];return v!==undefined&&v!==null&&!(Array.isArray(v)&&!v.length);};
  const paintMap=(n)=>{
    const m=$('#examMap'); if(!m) return;
    m.innerHTML=EXAM.qs.map((q,i)=>`<button class="em${isAnswered(i)?' done':''}${EXAM.flags&&EXAM.flags[q.id]?' flag':''}${i===CUR?' cur':''}"
      data-j="${i}" aria-label="Câu ${i+1}${isAnswered(i)?' đã làm':''}">${i+1}</button>`).join('')
      +`<span class="em-l">${n}/${EXAM.qs.length} đã làm · ${EXAM.flags?Object.keys(EXAM.flags).filter(k=>EXAM.flags[k]).length:0} cờ</span>`;
    $$('.em',m).forEach(b=>b.onclick=()=>jumpTo(+b.dataset.j));
  };
  const jumpTo=i=>{
    i=Math.max(0,Math.min(EXAM.qs.length-1,i)); CUR=i;
    const el=$('#eq'+i); if(!el) return;
    el.scrollIntoView({block:'center',behavior:'smooth'});
    $$('.exam-q').forEach(x=>x.classList.remove('cur'));
    el.classList.add('cur');
    paintMap(Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined).length);
    const f=el.querySelector('.opt:not([disabled])'); if(f) setTimeout(()=>f.focus({preventScroll:true}),220);
  };
  const currentFromScroll=()=>{
    const bar=$('#examBar'); const top=(bar?bar.getBoundingClientRect().bottom:0)+70;
    let best=0,bd=1e9;
    $$('.exam-q').forEach((el,i)=>{const d=Math.abs(el.getBoundingClientRect().top-top); if(d<bd){bd=d;best=i;}});
    return best;
  };
  const pickNth=n=>{
    const i=CUR, q=EXAM.qs[i], slot=$('#eqslot'+i); if(!slot) return;
    const t=qType(q);
    if(t==='mcq'){const b=slot.querySelectorAll('.opt')[n]; if(b) b.click();}
    else if(t==='multi'){const b=slot.querySelectorAll('.opt')[n]; if(b) b.click();}
    else if(t==='tf'){const b=slot.querySelector('[data-tf="'+(n===0?'1':'0')+'"]'); if(b) b.click();}
    else if(t==='num'){
      const inp=slot.querySelector('.numin');
      if(inp){ inp.focus(); inp.select&&inp.select(); toast('Câu này điền số — gõ đáp án rồi Enter'); }
    }
    else {const b=slot.querySelectorAll('.picktile')[n]; if(b) b.click();}
  };
  const onKey=e=>{
    if(!EXAM||EXAM.done) return;
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k=e.key;
    if(/^[1-4]$/.test(k)){e.preventDefault(); pickNth(+k-1);}
    else if(/^[a-dA-D]$/.test(k)){e.preventDefault(); pickNth('abcd'.indexOf(k.toLowerCase()));}
    else if(k==='ArrowDown'||k==='j'){e.preventDefault(); jumpTo(CUR+1);}
    else if(k==='ArrowUp'||k==='k'){e.preventDefault(); jumpTo(CUR-1);}
    else if(k==='f'||k==='F'){
      e.preventDefault(); EXAM.flags=EXAM.flags||{};
      const id=EXAM.qs[CUR].id; EXAM.flags[id]=!EXAM.flags[id];
      if(typeof examPersist==='function') examPersist(EXAM);
      paintMap(Object.keys(EXAM.picks).filter(x=>EXAM.picks[x]!==undefined).length);
      toast(EXAM.flags[id]?'Đã cắm cờ câu '+(CUR+1):'Bỏ cờ câu '+(CUR+1));
    }
    else if(k==='Enter'){
      e.preventDefault();
      let next=-1;
      for(let d=1;d<=EXAM.qs.length;d++){const i=(CUR+d)%EXAM.qs.length; if(!isAnswered(i)){next=i;break;}}
      jumpTo(next<0?CUR:next);
    }
  };
  document.addEventListener('keydown',onKey);
  const scroller=()=>{if(!EXAM||EXAM.done)return; CUR=currentFromScroll(); paintMap(Object.keys(EXAM.picks).filter(k=>EXAM.picks[k]!==undefined).length);};
  window.addEventListener('scroll',scroller,{passive:true});
  drawList();

  EXAM._cleanup=()=>{ document.removeEventListener('keydown',onKey); window.removeEventListener('scroll',scroller); clearInterval(EXAM.timer); };
  __examUnbind=EXAM._cleanup;
  function startClock(){
    const tick=()=>{
      if(!EXAM||EXAM.done) return;
      const left=EXAM_SEC-Math.floor((Date.now()-EXAM.t0)/1000);
      EXAM.left=Math.max(0,left);
      const m=String(Math.floor(EXAM.left/60)).padStart(2,'0'), s=String(EXAM.left%60).padStart(2,'0');
      const c=$('#clock'); if(!c) return;
      c.textContent=`${m}:${s}`;
      c.classList.toggle('warn',EXAM.left<=120);
      EXAM._tk=(EXAM._tk||0)+1;
      if(typeof examPersist==='function'&&EXAM._tk%5===0) examPersist(EXAM);
      if(EXAM.left<=0){ clearInterval(EXAM.timer); submit(true); }
    };
    clearInterval(EXAM.timer); EXAM.timer=setInterval(tick,1000); tick();
    return ()=>clearInterval(EXAM.timer);
  }

  function submit(auto){
    if(EXAM.done) return;
    EXAM.done=true; clearInterval(EXAM.timer);
    if(typeof examClear==='function') examClear();
    const bar=$('#examBar'); if(bar) bar.style.display='none';
    const rows=EXAM.qs.map(q=>{
      const p=EXAM.picks[q.id];
      const ok=isCorrect(q,p);
      if(typeof srsRecord==='function') srsRecord(q.id,ok,p);
      else state.ans[q.id]={ok:ok,p:p,at:Date.now()};
      return {q,ok,p};
    });
    const score=rows.filter(r=>r.ok).length;
    const byT={};
    rows.forEach(r=>{ const k=r.q.t; byT[k]=byT[k]||{n:0,ok:0}; byT[k].n++; if(r.ok) byT[k].ok++; });
    if(auto){
      try{ if(typeof chime==='function') chime(true); }catch(e){}
      toast('Hết giờ — đã tự nộp bài');
    }
    const rep={score,n:rows.length,byT,at:Date.now(),sec:EXAM_SEC-EXAM.left};
    state.runs=(state.runs||[]).concat(rep).slice(-20); save(); activity(3);
    EXAM.report={rows,rep,auto};
    showReport(rows,rep,auto);
  }

  function showReport(rows,rep,auto){
    const score=rep.score, byT=rep.byT;
    const pass=score>=rows.length*0.6;
    body.innerHTML=`
      <div class="exam-report">
        <div class="er-top">
          <div><span class="kicker">Kết quả</span><div class="er-score">${score}<span>/${rows.length}</span></div></div>
          <div class="er-verdict${pass?' ok':''}">${auto?'Hết giờ — tự nộp bài. ':''}${pass?'Đạt ngưỡng 60% · giữ nhịp này':'Dưới 60% · xem lại bảng chủ đề bên dưới'}</div>
        </div>
        <table class="er-tab"><thead><tr><th>Chủ đề</th><th>Đúng</th><th></th></tr></thead><tbody>
          ${Object.keys(byT).sort((a,b)=>a-b).map(k=>{
            const v=byT[k]; const pc=Math.round(v.ok/v.n*100);
            return `<tr><td>${topicName(+k)} · ${TOPICS.find(t=>t.id===+k)?TOPICS.find(t=>t.id===+k).name.replace(/<[^>]+>/g,''):''}</td>
              <td class="mono">${v.ok}/${v.n}</td>
              <td><span class="er-bar"><i style="width:${pc}%;background:${pc>=60?'var(--green)':'var(--accent)'}"></i></span></td></tr>`;
          }).join('')}
        </tbody></table>
        <div class="er-acts">
          <button class="btn" id="examAgain">Thi đề mới</button>
          <button class="btn ghost" id="examWrong">Luyện lại ${rows.filter(r=>!r.ok).length} câu sai</button>
          <a class="btn ghost" href="#/review">Vào hộp ôn cách quãng</a>
          <a class="btn ghost" href="#/stats">Xem toàn bộ tiến độ</a>
        </div>
        ${Object.keys(byT).filter(k=>byT[k].ok/byT[k].n<0.6).length?`<div class="er-weak">
          <span class="kicker">Chủ đề dưới 60% — luyện ngay</span>
          ${Object.keys(byT).filter(k=>byT[k].ok/byT[k].n<0.6).sort((a,b)=>byT[a].ok/byT[a].n-byT[b].ok/byT[b].n)
            .map(k=>`<button class="chip-btn" data-weak="${k}">${topicName(+k)} · ${Math.round(byT[k].ok/byT[k].n*100)}%</button>`).join('')}
        </div>`:''}
        <h3 class="er-h">Chữa từng câu</h3>
        ${rows.map((r,i)=>`<div class="exam-q${r.ok?' good':' bad'}">
          <div class="exam-qn"><span class="num">${i+1}</span><span class="qtype">${r.ok?'đúng':'sai'}</span></div>
          <div id="erslot${i}"></div></div>`).join('')}
      </div>`;
    rows.forEach((r,i)=>renderQuestion($('#erslot'+i),r.q,{picked:r.p,revealed:true}));
    $('#examAgain').onclick=()=>{ EXAM=null; if(typeof examClear==='function') examClear(); renderExam(); };
    const wb=$('#examWrong');
    if(wb) wb.onclick=()=>{ const bad=rows.filter(r=>!r.ok).map(r=>r.q); EXAM=null;
      if(typeof examClear==='function') examClear();
      drillQuestions(bad,'câu sai vừa làm'); };
    $$('[data-weak]').forEach(b=>b.onclick=()=>{ EXAM=null;
      if(typeof examClear==='function') examClear();
      drillExam([+b.dataset.weak],10,'chủ đề '+b.dataset.weak); });
    window.scrollTo({top:0,behavior:'smooth'});
  }

  $('#examSubmit').onclick=()=>{
    const n=Object.values(EXAM.picks).filter(v=>v!==undefined&&v!==null).length;
    if(!n) toast('Chưa chọn đáp án nào');
    submit(false);
  };
  $('#examReset').onclick=()=>{
    const answered=Object.keys(EXAM.picks||{}).length;
    const fresh=()=>{ EXAM=null; if(typeof examClear==='function') examClear(); renderExam(); toast('Đã bốc đề mới'); };
    if(!answered) return fresh();
    uiConfirm('Bốc đề mới', 'Đang làm dở <b>'+answered+' câu</b>. Bốc đề mới sẽ bỏ hết đáp án đã chọn.',
      fresh, { okText: 'Bốc đề mới' });
  };
}

/* =========================================================
   2 · REVIEW — luyện lại đúng những câu từng sai
========================================================= */
function renderReview(){
  const list=reviewList();
  const bx=typeof srsBoxes==='function'?srsBoxes():null;
  $('#main').innerHTML=`<section class="wrap">
    ${pageHead('Ôn cách quãng · hộp Leitner','Câu đến hạn được hỏi lại đúng lúc bạn sắp quên',

/* =========================================================
   LEARNING ENGINE v2
   · Ôn cách quãng 5 hộp (Leitner): 0 · 1 · 3 · 7 · 21 ngày
   · Mục tiêu ngày + chuỗi ngày học
   · Chẩn đoán chủ đề yếu, gợi ý việc học tiếp theo
   · Lưu và khôi phục bài thi đang làm
   ========================================================= */

const SRS_DAYS = [0, 1, 3, 7, 21];
const DAY_MS = 86400000;

/* ---------- ghi nhận một câu trả lời, cập nhật hộp ---------- */
function srsRecord(id, ok, p) {
  const prev = state.ans[id] || {};
  const box = ok ? Math.min(SRS_DAYS.length - 1, (prev.box || 0) + 1) : 0;
  const due = ok ? Date.now() + SRS_DAYS[box] * DAY_MS : Date.now();
  state.ans[id] = { ok, p, at: Date.now(), box, due, tries: (prev.tries || 0) + 1 };
  activity(ok ? 2 : 1);
  save();
}

/* ---------- danh sách đến hạn ôn ---------- */
function dueList() {
  const now = Date.now();
  return ALLQ.filter(q => {
    const a = state.ans[q.id];
    if (!a) return false;
    if (a.due === undefined) return !a.ok;       /* dữ liệu cũ: chỉ câu sai */
    return a.due <= now;
  });
}
function srsBoxes() {
  const c = [0, 0, 0, 0, 0];
  ALLQ.forEach(q => {
    const a = state.ans[q.id];
    if (!a) return;
    c[Math.min(4, a.box || 0)]++;
  });
  return c;
}

/* ---------- thống kê hôm nay ---------- */
function todayStats() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const from = t0.getTime();
  let n = 0, ok = 0;
  Object.values(state.ans).forEach(a => { if (a.at >= from) { n++; if (a.ok) ok++; } });
  const goal = state.goal || 20;
  return { n, ok, goal, pct: Math.min(100, Math.round(n / goal * 100)), streak: streak(), due: dueList().length };
}

/* ---------- chẩn đoán chủ đề ---------- */
function topicStats() {
  const rows = TOPICS.map(t => ({ id: t.id, name: t.name.replace(/&amp;/g, '&'), n: 0, ok: 0 }));
  const byId = {};
  rows.forEach(r => byId[r.id] = r);
  ALLQ.forEach(q => {
    const a = state.ans[q.id];
    if (!a) return;
    const r = byId[q.t]; if (!r) return;
    r.n++; if (a.ok) r.ok++;
  });
  rows.forEach(r => r.acc = r.n ? r.ok / r.n : null);
  return rows;
}
function weakTopics(k = 3) {
  const rows = topicStats().filter(r => r.n >= 2 && r.acc < 0.75);
  rows.sort((a, b) => a.acc - b.acc || b.n - a.n);
  const untouched = topicStats().filter(r => r.n === 0).slice(0, 2);
  return rows.slice(0, k).concat(rows.length < k ? untouched.slice(0, k - rows.length) : []);
}
function firstSessionOfTopic(tid) {
  for (const d of DAYS) for (const s of d.sessions) {
    if (TOPIC_OF_DAY(d) === tid) return { d, s };
  }
  return null;
}

/* ---------- dải "hôm nay" trên trang chủ ---------- */
function todayStrip() {
  const t = todayStats();
  const weak = weakTopics(1)[0];
  const ring = 2 * Math.PI * 15;
  const out = `<div class="today">
    <div class="today-ring">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--rule)" stroke-width="2.4"/>
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="2.4"
          stroke-dasharray="${(ring * t.pct / 100).toFixed(1)} ${ring}" stroke-linecap="round"
          transform="rotate(-90 18 18)"/>
      </svg>
      <b>${t.n}</b>
    </div>
    <div class="today-txt">
      <span class="kicker">Hôm nay · mục tiêu ${t.goal} câu</span>
      <h3>${t.n === 0 ? 'Chưa làm câu nào hôm nay' : `${t.n} câu, đúng ${t.ok} · ${Math.round(t.ok / t.n * 100)}%`}</h3>
      <p>${t.due ? `<b>${t.due}</b> câu đến hạn ôn cách quãng.` : 'Không còn câu nào đến hạn — làm đề mới để mở rộng.'}
        ${weak ? ` Chủ đề yếu nhất: <b>${weak.name}</b>${weak.acc !== null ? ` (${Math.round(weak.acc * 100)}%)` : ''}.` : ''}</p>
    </div>
    <div class="today-act">
      <a class="btn sm" href="#/review">${t.due ? `Ôn ${t.due} câu →` : 'Ôn cách quãng →'}</a>
      ${weak ? `<a class="btn ghost sm" href="#/exam" data-drill-topic="${weak.id}">Luyện chủ đề ${weak.id} →</a>` : ''}
      <span class="today-streak">${t.streak ? `Chuỗi ${t.streak} ngày` : 'Bắt đầu chuỗi hôm nay'}</span>
    </div>
  </div>`;
  /* todayStrip() trả về chuỗi HTML, nên phải gắn hành động sau khi đã chèn vào DOM */
  setTimeout(() => mountTopicDrills(), 0);
  return out;
}

/* ---------- ước lượng thời gian còn lại theo nhịp thực tế ---------- */
function etaText() {
  const done = Object.keys(state.done || {}).filter(k => state.done[k]).length;
  const left = TOTAL_SESS - done;
  if (left <= 0) return 'Đã học hết 52 ca — quay lại ôn cách quãng để giữ kiến thức.';
  const days = Object.keys(state.days || {}).filter(d => (state.days[d] || 0) > 0).length;
  if (days < 2) return `Còn ${left} ca. Học đều 4 ca/ngày là xong trong ${Math.ceil(left / 4)} ngày.`;
  const perDay = done / days;
  if (perDay <= 0.01) return `Còn ${left} ca — bắt đầu hôm nay để máy tính được nhịp của bạn.`;
  const daysLeft = Math.ceil(left / perDay);
  return `Còn ${left} ca · nhịp hiện tại ${perDay.toFixed(1)} ca/ngày ⇒ khoảng ${daysLeft} ngày nữa.`;
}

/* ---------- lịch 14 ngày ---------- */
function heatStrip(days = 14) {
  const out = [];
  const t = new Date(); t.setHours(0, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(t.getTime() - i * DAY_MS);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const n = state.days[k] || 0;
    const lv = n === 0 ? 0 : n < 4 ? 1 : n < 10 ? 2 : n < 20 ? 3 : 4;
    const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()];
    out.push({ wd, n, lv, d: d.getDate(), today: i === 0 });
  }
  const max = Math.max(1, ...out.map(o => o.n));
  return `<div class="heat">
    <div class="heat-h"><span class="kicker">Nhịp học ${days} ngày</span>
      <span class="muted">Đỉnh ${max} hoạt động/ngày · ${out.filter(o => o.n).length}/${days} ngày có học</span></div>
    <div class="heat-cells">${out.map(o => `<div class="hc l${o.lv}${o.today ? ' now' : ''}" title="${o.d}: ${o.n} hoạt động">
      <b>${o.n || ''}</b><span>${o.today ? 'nay' : o.wd}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:11px;margin:6px 0 0">Mỗi ô là một ngày: số trong ô là số hoạt động (câu trả lời, ca học, lượt thi). Ô đậm = ngày học dày.</p>
  </div>`;
}

/* ---------- phiên học hôm nay: 3 việc, đo được ---------- */
function nextSessionLink() {

function routineState() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);

  const ansN = Object.values(state.ans).filter(a => a.at >= from).length;
  const lesN = Object.keys(state.doneAt || {}).filter(k => state.doneAt[k] >= from).length;
  const runN = (state.runs || []).filter(r => r.at >= from).length;
  const goal = state.goal || 20;
  return [
    { k: 'Ôn tập', need: Math.min(10, goal), have: ansN, href: '#/review', unit: 'câu' },
    { k: 'Học một ca', need: 1, have: lesN, href: nextSessionLink(), unit: 'ca' },

}
function routineCard() {

  const done = rows.filter(r => r.have >= r.need).length;

function examSnapshot(EX) {
  if (!EX) return null;
  return { ids: EX.qs.map(q => q.id), picks: EX.picks, t0: EX.t0, left: EX.left, done: EX.done, label: EX.label || '' };
}
function examPersist(EX) {
  state.exam = examSnapshot(EX);
  save();
}
function examRestore() {
  const s = state.exam;
  if (!s || s.done || !s.ids) return null;
  const qs = s.ids.map(id => ALLQ.find(q => q.id === id)).filter(Boolean);
  if (qs.length < 3) return null;
  const left = s.left || 0;
  if (left <= 0) return null;
  return { qs, picks: s.picks || {}, left, t0: Date.now() - (EXAM_SEC - left) * 1000, done: false, report: null, label: s.label || '' };
}
function examClear() { delete state.exam; save(); }

  const d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = `<div class="ov-panel" role="dialog" aria-label="Bảng lệnh">
    <div class="ov-in">
      <svg viewBox="0 0 16 16" style="width:15px;height:15px;stroke:#8b8478;fill:none;stroke-width:1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>

      <span class="kicker">↑↓ · ENTER · ESC</span>
    </div>
    <div class="ov-body" id="ovbody"></div>
  </div>`;
  document.body.appendChild(d); PAL = d;
  const input = $('#ovq', d);
  input.focus();
  let sel = 0, rows = [];
  const close = () => { d.remove(); PAL = null; };
  d.onclick = e => { if (e.target === d) close(); };
  const render = () => {
    const q = input.value.trim();
    const k = toks(q);
    if (!k.length) {
      rows = idx.filter(o => o.g === 'Công cụ').slice(0, 8);
    } else {
      rows = idx.map(o => {
        let sc = 0;
        k.forEach(w => { if (o.n.includes(w)) sc += o.t.toLowerCase().includes(w) ? 3 : 1; });
        if (q && norm(o.t).includes(norm(q))) sc += 6;       /* khớp cả cụm thì lên đầu */
        if (o.act) sc -= 0.5;                          /* câu hỏi lẻ xếp sau bài học */
        return { o, sc };
      }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 16).map(x => x.o);
    }
    sel = 0;
    paint();
  };
  const paint = () => {
    $('#ovbody', d).innerHTML = rows.length
      ? `<div class="ov-sec">${input.value.trim() ? rows.length + ' kết quả' : 'Đi nhanh'}</div>` +
        rows.map((r, i) => `<div class="ov-row${i === sel ? ' on' : ''}" data-href="${r.href}"${r.act ? ` data-act="${r.act}"` : ''}>

    $$('.ov-row', d).forEach((r, i) => {
      r.onmouseenter = () => { sel = i; paint(); };
      r.onclick = () => {
        const h = r.dataset.href, qid = r.dataset.act ? +r.dataset.act : null;
        close();
        if (qid) { const q = ALLQ.find(x => x.id === qid); if (q) drillQuestions([q], 'câu đã chọn'); }
        else go(h);
      };
    });
  };
  input.oninput = render;
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(rows.length - 1, sel + 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
    else if (e.key === 'Enter') {
      const r = rows[sel]; if (!r) return;
      close();
      if (r.act) { const q = ALLQ.find(x => x.id === r.act); if (q) drillQuestions([q], 'câu đã chọn'); }
      else go(r.href);
    }
  };
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
  render();
}

  drag: '<svg viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
};

/* =========================================================
   DRAWING — circuit (600 × 250 canvas)
   ========================================================= */
function svgCircuit(topology, v, r) {
  const P = [];
  const wire = (x1, y1, x2, y2) => P.push(`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`);
  const res = (x, y, w, h, label, val) => {
    P.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>`);
    P.push(`<text x="${x + w / 2}" y="${y - 7}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${label}</text>`);
    P.push(`<text x="${x + w / 2}" y="${y + h + 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--accent)">${val}</text>`);
  };
  const battery = (x, y) => {
    P.push(`<rect x="${x - 14}" y="${y - 17}" width="28" height="34" fill="var(--paper)"/>`);
    P.push(`<path d="M${x - 10} ${y - 13}v26M${x + 10} ${y - 8}v16" stroke="var(--ink)" stroke-width="1.8"/>`);
    P.push(`<text x="${x + 20}" y="${y + 4}" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">U = ${v.U} V</text>`);
    if (+v.r > 0) P.push(`<text x="${x}" y="${y - 22}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">r = ${v.r} Ω</text>`);
  };
  const flow = (x, y) => P.push(`<path d="M${x} ${y}l-8 -4v8z" fill="var(--accent)"/>`);
  const top = 55, bot = 205, left = 110, right = 470, midY = (top + bot) / 2;
  const W = 100, H = 26;

  if (topology === 'ser') {
    const n = +v.R3 > 0 ? 3 : 2, lbl = ['R₁', 'R₂', 'R₃'], val = [v.R1, v.R2, v.R3];
    wire(left, top, right, top); wire(left, bot, right, bot);
    wire(left, top, left, bot); wire(right, top, right, bot);
    battery(left, midY);
    const gap = (right - left - n * W) / (n + 1);
    for (let i = 0; i < n; i++) {
      const x = left + gap + i * (W + gap);
      res(x, top - H / 2, W, H, lbl[i], val[i] + ' Ω');
    }
    flow(320, bot - 5);
    P.push(`<text x="300" y="${bot - 9}" font-family="var(--mono)" font-size="9" fill="var(--accent)">I</text>`);
  }
  if (topology === 'par') {
    const n = +v.R3 > 0 ? 3 : 2, lbl = ['R₁', 'R₂', 'R₃'], val = [v.R1, v.R2, v.R3];
    const ys = n === 3 ? [top - 5, midY + 5, bot + 5] : [top, bot];
    wire(left, top - 20, right, top - 20);
    wire(left, bot + 20, right, bot + 20);
    wire(left, top - 20, left, bot + 20); wire(right, top - 20, right, bot + 20);
    battery(left, midY);
    ys.forEach((y, i) => {
      wire(left, y, midY - W / 2, y);
      res(midY - W / 2, y - H / 2, W, H, lbl[i], val[i] + ' Ω');
      wire(midY + W / 2, y, right, y);
    });
  }
  if (topology === 'mixA') {
    const l2 = 120, r2 = 480;
    wire(l2, top, r2, top); wire(l2, bot, r2, bot);
    wire(l2, top, l2, bot); wire(r2, top, r2, bot);
    battery(l2, midY);
    wire(l2, top, l2 + 20, top);
    res(l2 + 20, top - H / 2, 90, H, 'R₁', v.R1 + ' Ω');
    wire(l2 + 110, top, l2 + 140, top);
    res(l2 + 140, top - H / 2, 90, H, 'R₂', v.R2 + ' Ω');
    wire(l2 + 230, top, r2, top);
    res(l2 + 60, bot - H / 2, 90, H, 'R₃', v.R3 + ' Ω');
    P.push(`<text x="${(l2 + r2) / 2}" y="${bot + 46}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">R₃ mắc song song với cả nhánh (R₁ nt R₂)</text>`);
  }
  if (topology === 'mixB') {
    const node1 = 290, node2 = 500;
    wire(left, top, right, top); wire(left, bot, right, bot);
    wire(left, top, left, bot); wire(right, top, right, bot);
    battery(left, midY);
    res(left + 20, top - H / 2, 90, H, 'R₁', v.R1 + ' Ω');
    wire(left + 110, top, node1, top);
    wire(node1, top, node1, 140);
    res(node1 + 20, top - H / 2, 100, H, 'R₂', v.R2 + ' Ω');
    wire(node1 + 120, top, node2, top);
    res(node1 + 20, 140 - H / 2, 100, H, 'R₃', v.R3 + ' Ω');
    wire(node1, 140, node1 + 20, 140); wire(node1 + 120, 140, node2, 140);
    wire(node2, top, node2, 140);
    wire(node2, top, right, top);
    P.push(`<text x="${(left + right) / 2}" y="${bot + 40}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">R₁ nối tiếp với cụm (R₂ // R₃)</text>`);
  }
  return `<svg viewBox="0 0 600 260" class="calc-svg" role="img" aria-label="Sơ đồ mạch điện">${P.join('')}</svg>`;
}

/* =========================================================
   DRAWING — lens (660 × 300)
   ========================================================= */
function svgLens(f, d, h, kind) {
  const Lx = 330, Ay = 165, W = 660, Hh = 300;
  const dp = d * f / (d - f);
  const k = -dp / d, hp = k * h;
  const real = dp > 0;
  const span = Math.max(d, Math.abs(dp), Math.abs(f) * 2, 5) * 1.2;
  const sc = (Lx - 45) / span;
  const sy = 95 / Math.max(h, Math.abs(hp) || 0.001);
  const X = cm => Lx + cm * sc, Y = cm => Ay - cm * sy;
  const out = [];
  out.push(`<path d="M12 ${Ay}H648" stroke="var(--rule-2)" stroke-width="1"/>`);
  const lh = 112;
  if (kind !== 'div') {
    out.push(`<path d="M${Lx} ${Ay - lh}c30 36 30 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
    out.push(`<path d="M${Lx} ${Ay - lh}c-30 36 -30 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
  } else {
    out.push(`<path d="M${Lx} ${Ay - lh}c-22 36 -22 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
    out.push(`<path d="M${Lx} ${Ay - lh}c22 36 22 ${2 * lh - 36} 0 ${2 * lh}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);
  }
  [[-Math.abs(f), 'F'], [Math.abs(f), "F'"]].forEach(([fv, lab]) => {
    const x = X(fv);
    if (x > 16 && x < 644) {
      out.push(`<circle cx="${x}" cy="${Ay}" r="3.2" fill="var(--accent)"/>`);
      out.push(`<text x="${x}" y="${Ay + 18}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">${lab}</text>`);
    }
  });
  out.push(`<circle cx="${Lx}" cy="${Ay}" r="3" fill="var(--ink)"/><text x="${Lx + 7}" y="${Ay - 9}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">O</text>`);
  // object
  const bx = X(-d), by = Y(h);
  out.push(`<path d="M${bx} ${Ay}V${by}" stroke="var(--ink)" stroke-width="2.6"/>`);
  out.push(`<path d="M${bx - 5} ${by + 10}l5 -10 5 10z" fill="var(--ink)"/>`);
  out.push(`<text x="${bx}" y="${Ay + 30}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink)">A</text>`);
  out.push(`<text x="${bx - 11}" y="${by + 4}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--ink)">B</text>`);
  // rays
  const far = span * 1.02;
  out.push(`<path d="M${bx} ${by}H${Lx}L${X(far)} ${Y(h - h * far / f)}" fill="none" stroke="var(--green)" stroke-width="1.1" opacity=".85"/>`);
  out.push(`<path d="M${bx} ${by}L${X(far)} ${Y(-h * far / d)}" fill="none" stroke="var(--green)" stroke-width="1.1" opacity=".85"/>`);
  if (!real) {
    out.push(`<path d="M${Lx} ${by}L${X(dp)} ${Y(hp)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".7" fill="none"/>`);
    out.push(`<path d="M${Lx} ${Ay}L${X(dp)} ${Y(hp)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".7" fill="none"/>`);
  }
  // image
  const ix = X(dp), iy = Y(hp);
  if (ix > 8 && ix < 652) {
    out.push(`<path d="M${ix} ${Ay}V${iy}" stroke="var(--accent)" stroke-width="2.2"${real ? '' : ' stroke-dasharray="6 4"'}/>`);
    out.push(`<path d="M${ix - 5} ${iy + (hp > 0 ? 10 : -10)}l5 ${hp > 0 ? -10 : 10} 5 ${hp > 0 ? 10 : -10}z" fill="var(--accent)"/>`);
    out.push(`<text x="${ix}" y="${Ay + 30}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">A'</text>`);
    out.push(`<text x="${ix + 9}" y="${iy + 4}" font-family="var(--mono)" font-size="9" fill="var(--accent)">B'</text>`);
  }
  out.push(`<text x="${(bx + Lx) / 2}" y="${Ay + 62}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">d = ${f2(d)} cm</text>`);
  if (isFinite(dp)) out.push(`<text x="${(Lx + ix) / 2}" y="${Ay + 62}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--accent)">d' = ${f2(dp)} cm</text>`);
  return `<svg viewBox="0 0 ${W} ${Hh}" class="calc-svg" role="img" aria-label="Dựng ảnh qua thấu kính">${out.join('')}</svg>`;
}

/* ---------- motion diagram ---------- */
function svgMeet(x1, x2, v1, v2, same, t, pos) {
  const W = 660, Ay = 110, left = 40, right = 620;
  const lo = Math.min(x1, x2, pos) - 5, hi = Math.max(x1, x2, pos) + 5;
  const X = m => left + (m - lo) / (hi - lo) * (right - left);
  const out = [];
  out.push(`<path d="M${left} ${Ay}H${right}" stroke="var(--rule-2)" stroke-width="1"/>`);
  [x1, x2, pos].forEach((m, i) => {
    if (!ok(m)) return;
    const x = X(m);
    out.push(`<circle cx="${x}" cy="${Ay}" r="${i === 2 ? 6 : 5}" fill="${i === 2 ? 'var(--accent)' : 'var(--ink)'}"/>`);
    out.push(`<text x="${x}" y="${Ay - 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="${i === 2 ? 'var(--accent)' : 'var(--ink-2)'}">${i === 2 ? 'gặp · ' + f2(m, 1) + ' m' : 'x' + (i + 1) + ' = ' + f2(m, 1) + ' m'}</text>`);
  });
  if (ok(pos)) out.push(`<path d="M${X(pos)} ${Ay + 8}v16" stroke="var(--accent)" stroke-width="1"/>`);
  if (!same) {
    out.push(`<path d="M${X(x1)} ${Ay + 34}h26M${X(x1) + 22} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
    out.push(`<path d="M${X(x2)} ${Ay + 34}h-26M${X(x2) - 22} ${Ay + 30}l-5 4 5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
  } else {
    out.push(`<path d="M${X(x1)} ${Ay + 34}h34M${X(x1) + 30} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
    out.push(`<path d="M${X(x2)} ${Ay + 34}h34M${X(x2) + 30} ${Ay + 30}l5 4-5 4" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`);
  }
  out.push(`<text x="${left}" y="${Ay + 66}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">v₁ = ${v1} m/s · v₂ = ${v2} m/s · gặp sau ${f2(t, 2)} s</text>`);
  return `<svg viewBox="0 0 ${W} 190" class="calc-svg" role="img" aria-label="Sơ đồ chuyển động">${out.join('')}</svg>`;
}

/* ---------- buoyancy diagram ---------- */
function svgArch(sub, state, P, FA) {
  const out = [];
  const wl = 120, bx = 235, bw = 80, bh = 80;
  out.push(`<rect x="140" y="${wl}" width="370" height="105" fill="var(--card-2)" stroke="var(--rule-2)"/>`);
  out.push(`<path d="M140 ${wl}H510" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>`);
  out.push(`<text x="146" y="${wl - 7}" font-family="var(--mono)" font-size="9" fill="var(--accent)">mặt nước</text>`);
  const yTop = wl - bh * (1 - sub);
  out.push(`<rect x="${bx}" y="${yTop}" width="${bw}" height="${bh}" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>`);
  const cx = bx + bw / 2;
  // trọng lực: mũi tên hướng xuống, đặt dưới đáy vật
  out.push(`<path d="M${cx} ${yTop + bh + 8}V${yTop + bh + 46}" stroke="var(--ink)" stroke-width="1.4"/>`);
  out.push(`<path d="M${cx - 5} ${yTop + bh + 40}l5 6 5-6z" fill="var(--ink)"/>`);
  out.push(`<text x="${cx + 10}" y="${yTop + bh + 34}" font-family="var(--mono)" font-size="10" fill="var(--ink)">P${P !== undefined ? ' = ' + f2(P) + ' N' : ''}</text>`);
  // lực đẩy: mũi tên hướng lên, đặt trên đỉnh vật
  out.push(`<path d="M${cx} ${yTop - 8}V${yTop - 46}" stroke="var(--accent)" stroke-width="1.4"/>`);
  out.push(`<path d="M${cx - 5} ${yTop - 40}l5 -6 5 6z" fill="var(--accent)"/>`);
  out.push(`<text x="${cx + 10}" y="${yTop - 30}" font-family="var(--mono)" font-size="10" fill="var(--accent)">F_A${FA !== undefined ? ' = ' + f2(FA) + ' N' : ''}</text>`);
  out.push(`<text x="522" y="${wl + 40}" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${state}</text>`);
  out.push(`<text x="146" y="${wl + 96}" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">phần chìm ${f2(sub * 100, 0)}% thể tích</text>`);
  return `<svg viewBox="0 0 660 250" class="calc-svg" role="img" aria-label="Sơ đồ lực đẩy Archimedes">${out.join('')}</svg>`;
}

/* =========================================================
   SOLVERS
   ========================================================= */
const S = {};

const push = (arr, h, f, c) => arr.push({ h, f, c });

/* ---------- 1. circuit ---------- */
S.el_circuit = {
  cat: 'el', name: 'Mạch điện: tính I, U, P', tag: 'Nối tiếp · song song · hỗn hợp',
  desc: 'Chọn sơ đồ, nhập số liệu — máy tính điện trở tương đương, dòng qua từng nhánh, công suất và vẽ lại mạch.',
  fields: [
    { k: 'topology', l: 'Sơ đồ mạch', type: 'tiles', opts: [['ser', 'Nối tiếp'], ['par', 'Song song'], ['mixA', '(R₁ nt R₂) // R₃'], ['mixB', 'R₁ nt (R₂ // R₃)']], v: 'ser' },
    { k: 'U', l: 'Hiệu điện thế nguồn', u: 'V', v: 12 },
    { k: 'r', l: 'Điện trở trong (bỏ trống = 0)', u: 'Ω', v: 0 },
    { k: 'R1', l: 'R₁', u: 'Ω', v: 6 },
    { k: 'R2', l: 'R₂', u: 'Ω', v: 6 },
    { k: 'R3', l: 'R₃ (chỉ dùng cho sơ đồ có R₃)', u: 'Ω', v: 6 }
  ],
  run(v) {
    const t = v.topology, r = +v.r || 0;
    const R1 = +v.R1, R2 = +v.R2, R3 = +v.R3;
    const out = [], st = [];
    let Rt, branches = [];
    if (t === 'ser') {
      const R = R3 > 0 ? R1 + R2 + R3 : R1 + R2;
      Rt = R + r;
      const fR = (R3 > 0 ? 'R = R₁ + R₂ + R₃' : 'R = R₁ + R₂') + (r ? ' + r' : '');
      push(st, 'Bước 1 · Điện trở tương đương', fR, `R = ${R3 > 0 ? `${R1} + ${R2} + ${R3}` : `${R1} + ${R2}`}${r ? ` + ${r}` : ''} = ${f2(Rt)} Ω`);
      const I = v.U / Rt;
      push(st, 'Bước 2 · Cường độ dòng điện', 'I = U / R', `I = ${v.U} / ${f2(Rt)} = ${f3(I)} A`);
      branches = [{ k: 'I', l: 'Dòng toàn mạch', v: I, u: 'A' }];
      const list = R3 > 0 ? [R1, R2, R3] : [R1, R2];
      list.forEach((R, i) => {
        const U = I * R;
        out.push({ l: `U${sub(i + 1)}`, v: U, u: 'V' });
        out.push({ l: `P${sub(i + 1)}`, v: I * I * R, u: 'W' });
        branches.push({ k: `U${sub(i + 1)}`, l: `Hiệu điện thế R${sub(i + 1)}`, v: U, u: 'V' });
      });
      if (r) push(st, 'Bước 3 · Độ giảm thế trên nguồn', 'U_nguồn = I·r', `${f3(I)} · ${r} = ${f3(I * r)} V · hiệu suất ${f2(I * (Rt - r) / v.U * 100, 1)}%`);
      out.unshift({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'Công suất toàn mạch', v: v.U * I, u: 'W' });
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    if (t === 'par') {
      const list = R3 > 0 ? [R1, R2, R3] : [R1, R2];
      const Rp = 1 / list.reduce((a, R) => a + 1 / R, 0);
      Rt = Rp + r;
      push(st, 'Bước 1 · Điện trở tương đương', list.length === 3 ? '1/R = 1/R₁ + 1/R₂ + 1/R₃' : '1/R = 1/R₁ + 1/R₂', `1/R = ${list.map(R => `1/${R}`).join(' + ')} ⇒ R = ${f2(Rp)} Ω`);
      const I = v.U / Rt;
      const Up = I * Rp;
      push(st, 'Bước 2 · Dòng toàn mạch', 'I = U / (R + r)', `I = ${v.U} / ${f2(Rt)} = ${f3(I)} A`);
      push(st, 'Bước 3 · Hiệu điện thế hai đầu mạch song song', 'U' + '‖' + ' = I·R', `U = ${f3(I)} · ${f2(Rp)} = ${f3(Up)} V`);
      list.forEach((R, i) => {
        out.push({ l: `I${sub(i + 1)}`, v: Up / R, u: 'A' });
        branches.push({ k: `I${sub(i + 1)}`, l: `Dòng qua R${sub(i + 1)}`, v: Up / R, u: 'A' });
      });
      out.unshift({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U hai nhánh', v: Up, u: 'V' });
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    if (t === 'mixA') { // (R1 nt R2) // R3
      const R12 = R1 + R2;
      const Rp = R12 * R3 / (R12 + R3);
      Rt = Rp + r;
      push(st, 'Bước 1 · Nhánh trên mắc nối tiếp', 'R₁₂ = R₁ + R₂', `R₁₂ = ${R1} + ${R2} = ${f2(R12)} Ω`);
      push(st, 'Bước 2 · Hai nhánh song song', 'R = R₁₂·R₃ / (R₁₂ + R₃)', `R = ${f2(R12)}·${R3} / (${f2(R12)} + ${R3}) = ${f2(Rp)} Ω`);
      const I = v.U / Rt, Up = I * Rp;
      push(st, 'Bước 3 · Dòng và hiệu điện thế', 'I = U/R_tđ ; U‖ = I·R', `I = ${f3(I)} A · U‖ = ${f3(Up)} V`);
      const I12 = Up / R12, I3 = Up / R3;
      out.push({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U hai nhánh', v: Up, u: 'V' },
        { l: 'I qua R₁ = I qua R₂', v: I12, u: 'A' }, { l: 'I qua R₃', v: I3, u: 'A' },
        { l: 'U₁', v: I12 * R1, u: 'V' }, { l: 'U₂', v: I12 * R2, u: 'V' }, { l: 'P toàn mạch', v: v.U * I, u: 'W' });
      branches = [{ k: 'I₁₂', l: 'Nhánh R₁ nt R₂', v: I12, u: 'A' }, { k: 'I₃', l: 'Nhánh R₃', v: I3, u: 'A' }];
      return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
    }
    // mixB: R1 nt (R2 // R3)
    const R23 = R2 * R3 / (R2 + R3);
    Rt = R1 + R23 + r;
    push(st, 'Bước 1 · Nhánh song song', 'R₂₃ = R₂·R₃/(R₂+R₃)', `R₂₃ = ${R2}·${R3}/(${R2}+${R3}) = ${f2(R23)} Ω`);
    push(st, 'Bước 2 · Điện trở toàn mạch', 'R = R₁ + R₂₃' + (r ? ' + r' : ''), `R = ${R1} + ${f2(R23)}${r ? ` + ${r}` : ''} = ${f2(Rt)} Ω`);
    const I = v.U / Rt, U23 = I * R23;
    push(st, 'Bước 3 · Dòng và hiệu điện thế', 'I = U/R ; U₂₃ = I·R₂₃', `I = ${f3(I)} A · U₂₃ = ${f3(U23)} V`);
    out.push({ l: 'R tương đương', v: Rt, u: 'Ω' }, { l: 'I toàn mạch', v: I, u: 'A' }, { l: 'U₁', v: I * R1, u: 'V' },
      { l: 'U₂ = U₃', v: U23, u: 'V' }, { l: 'I₂', v: U23 / R2, u: 'A' }, { l: 'I₃', v: U23 / R3, u: 'A' },
      { l: 'P toàn mạch', v: v.U * I, u: 'W' });
    branches = [{ k: 'I', l: 'Dòng chính', v: I, u: 'A' }, { k: 'I₂', l: 'Nhánh R₂', v: U23 / R2, u: 'A' }, { k: 'I₃', l: 'Nhánh R₃', v: U23 / R3, u: 'A' }];
    return { out, steps: st, draw: { type: 'circuit', topology: t }, branches };
  }
};

/* ---------- 3. lens ---------- */
S.quang_lens = {
  cat: 'quang', name: 'Thấu kính: ảnh cách bao xa, cao bao nhiêu', tag: 'd′ = df/(d − f)',
  desc: 'Chọn thấu kính, nhập f, d, chiều cao vật — máy dựng ảnh và vẽ hình theo tỉ lệ.',
  fields: [
    { k: 'type', l: 'Loại thấu kính', type: 'tiles', opts: [['conv', 'Hội tụ (f > 0)'], ['div', 'Phân kì (f < 0)']], v: 'conv' },
    { k: 'f', l: 'Tiêu cự |f|', u: 'cm', v: 12 },
    { k: 'd', l: 'Khoảng cách vật – kính d', u: 'cm', v: 30 },
    { k: 'h', l: 'Chiều cao vật', u: 'cm', v: 3 }
  ],
  run(v) {
    const f = v.type === 'div' ? -Math.abs(v.f) : Math.abs(v.f);
    const d = v.d, dp = d * f / (d - f), k = -dp / d, hp = k * v.h;
    const real = dp > 0;
    const st = [], out = [];
    push(st, 'Bước 1 · Công thức thấu kính', '1/f = 1/d + 1/d′', `1/${f2(f)} = 1/${f2(d)} + 1/d′`);
    push(st, 'Bước 2 · Giải ra d′', 'd′ = d·f/(d − f)', `d′ = ${f2(d)}·${f2(f)}/(${f2(d)} − ${f2(f)}) = ${f2(dp)} cm`);
    push(st, 'Bước 3 · Độ phóng đại', '|k| = |d′|/d', `|k| = ${f2(Math.abs(dp))}/${f2(d)} = ${f2(Math.abs(k))}`);
    push(st, 'Bước 4 · Chiều cao ảnh', 'h′ = |k|·h', `h′ = ${f2(Math.abs(k))} · ${f2(v.h)} = ${f2(Math.abs(hp))} cm`);
    push(st, 'Bước 5 · Kết luận', 'Tính chất ảnh', real ? 'Ảnh thật, ngược chiều với vật, hứng được trên màn' : (f > 0 ? 'Ảnh ảo, cùng chiều, lớn hơn vật (vật trong tiêu cự)' : 'Ảnh ảo, cùng chiều, nhỏ hơn vật'));
    out.push({ l: 'd′', v: dp, u: 'cm' }, { l: 'h′', v: Math.abs(hp), u: 'cm' }, { l: 'Độ phóng đại |k|', v: Math.abs(k), u: '×' },
      { l: 'Tính chất', v: real ? 'thật, ngược chiều' : 'ảo, cùng chiều', u: '', text: true });
    return { out, steps: st, draw: { type: 'lens', f, d, h: v.h, kind: v.type }, note: real ? 'Ảnh thật nằm cùng phía bên kia kính so với vật.' : 'Ảnh ảo cùng phía với vật — vẽ bằng nét đứt.' };
  }
};

S.quang_findf = {

S.co_meet = {
  cat: 'co', name: 'Hai vật chuyển động gặp nhau', tag: 'cùng chiều · ngược chiều',
  desc: 'Nhập vị trí xuất phát và tốc độ — máy tính thời điểm gặp, quãng đường mỗi vật, vẽ trục toạ độ.',
  fields: [
    { k: 'mode', l: 'Chiều chuyển động', type: 'tiles', opts: [['opp', 'Ngược chiều'], ['same', 'Cùng chiều (đuổi nhau)']], v: 'opp' },
    { k: 'x1', l: 'Vị trí vật 1', u: 'm', v: 0 },
    { k: 'x2', l: 'Vị trí vật 2', u: 'm', v: 120 },
    { k: 'v1', l: 'Tốc độ vật 1', u: 'm/s', v: 6 },
    { k: 'v2', l: 'Tốc độ vật 2', u: 'm/s', v: 4 }
  ],
  run(v) {
    const same = v.mode === 'same';
    const rel = same ? Math.abs(v.v2 - v.v1) : v.v1 + v.v2;
    const gap = Math.abs(v.x2 - v.x1);
    const t = rel > 0 ? gap / rel : Infinity;
    const s1 = v.v1 * t, s2 = v.v2 * t;
    const meet = same ? v.x1 + s1 : (v.x1 < v.x2 ? v.x1 + s1 : v.x1 - s1);
    const st = [];
    push(st, 'Bước 1 · Khoảng cách ban đầu', 'Δx = |x₂ − x₁|', `Δx = ${f2(gap)} m`);
    push(st, 'Bước 2 · Tốc độ tương đối', same ? 'v_rel = |v₂ − v₁|' : 'v_rel = v₁ + v₂', `v_rel = ${same ? `|${v.v2} − ${v.v1}|` : `${v.v1} + ${v.v2}`} = ${f2(rel)} m/s`);
    push(st, 'Bước 3 · Thời gian gặp', 't = Δx / v_rel', `t = ${f2(gap)} / ${f2(rel)} = ${f2(t, 2)} s${ok(t) && t > 90 ? ` ≈ ${f2(t / 60, 1)} phút` : ''}`);
    push(st, 'Bước 4 · Chỗ gặp', 'x_gặp = x₁ ± v₁·t', `x_gặp = ${f2(meet, 1)} m · vật 1 đi ${f2(s1, 1)} m, vật 2 đi ${f2(s2, 1)} m`);
    return {
      out: [{ l: 'Thời gian gặp', v: t, u: 's' }, { l: 'Chỗ gặp', v: meet, u: 'm' }, { l: 'Quãng đường vật 1', v: s1, u: 'm' }, { l: 'Quãng đường vật 2', v: s2, u: 'm' }],
      steps: st, draw: { type: 'meet', x1: v.x1, x2: v.x2, v1: v.v1, v2: v.v2, same, t, pos: meet }
    };
  }
};

  fields: [{ k: 'm', l: 'Khối lượng', u: 'kg', v: 2 }, { k: 'c', l: 'Nhiệt dung riêng', u: 'J/kg.K', v: 4200 }, { k: 't1', l: 'Nhiệt độ đầu', u: '°C', v: 25 }, { k: 't2', l: 'Nhiệt độ cuối', u: '°C', v: 100 }],
  run(v) {
    const dt = v.t2 - v.t1, Q = v.m * v.c * dt;
    return {
      out: [{ l: 'Δt', v: dt, u: 'K' }, { l: 'Nhiệt lượng |Q|', v: Math.abs(Q), u: 'J' }, { l: 'Đổi ra', v: Math.abs(Q) / 1000, u: 'kJ' }],
      steps: [
        { h: 'Bước 1 · Độ biến thiên nhiệt độ', f: 'Δt = t₂ − t₁', c: `Δt = ${v.t2} − ${v.t1} = ${f2(dt)} K` },
        { h: 'Bước 2 · Nhiệt lượng', f: 'Q = m·c·Δt', c: `Q = ${v.m}·${v.c}·${f2(dt)} = ${f2(Math.abs(Q))} J` },
        { h: 'Bước 3 · Kết luận', f: 'Thu hay toả', c: Q > 0 ? 'Vật thu nhiệt (nóng lên)' : 'Vật toả nhiệt (nguội đi)' }
      ]
    };
  }
};

S.nhiet_mix = {
  cat: 'nhiet', name: 'Cân bằng nhiệt hai chất', tag: 'm₁c₁Δt₁ = m₂c₂Δt₂',
  desc: 'Trộn hai lượng nước (hoặc hai chất) — máy giải phương trình cân bằng nhiệt.',
  fields: [{ k: 'm1', l: 'Khối lượng 1', u: 'kg', v: 0.5 }, { k: 't1', l: 'Nhiệt độ 1', u: '°C', v: 100 }, { k: 'c1', l: 'Nhiệt dung riêng 1', u: 'J/kg.K', v: 4200 }, { k: 'm2', l: 'Khối lượng 2', u: 'kg', v: 1 }, { k: 't2', l: 'Nhiệt độ 2', u: '°C', v: 20 }, { k: 'c2', l: 'Nhiệt dung riêng 2', u: 'J/kg.K', v: 4200 }],
  run(v) {
    const t = (v.m1 * v.c1 * v.t1 + v.m2 * v.c2 * v.t2) / (v.m1 * v.c1 + v.m2 * v.c2);
    return {
      out: [{ l: 'Nhiệt độ cân bằng', v: t, u: '°C' }, { l: 'Nhiệt toả ra', v: v.m1 * v.c1 * Math.abs(v.t1 - t), u: 'J' }, { l: 'Nhiệt thu vào', v: v.m2 * v.c2 * Math.abs(t - v.t2), u: 'J' }],
      steps: [
        { h: 'Bước 1 · Phương trình cân bằng', f: 'm₁c₁(t₁ − t) = m₂c₂(t − t₂)', c: `${v.m1}·${v.c1}(${v.t1} − t) = ${v.m2}·${v.c2}(t − ${v.t2})` },
        { h: 'Bước 2 · Giải', f: 't = (m₁c₁t₁ + m₂c₂t₂)/(m₁c₁ + m₂c₂)', c: `t = ${f2(t, 2)} °C` },
        { h: 'Bước 3 · Kiểm tra', f: 'Q_toả = Q_thu', c: `Q = ${f2(v.m1 * v.c1 * Math.abs(v.t1 - t))} J` }
      ]
    };
  }
};

S.nhiet_fuel = {

        { h: 'Bước 2 · Nhiệt toàn phần', f: 'Q_tp = Q_ci/H', c: `Q_tp = ${f2(Qi)}/${v.H / 100} = ${f2(Qt)} J` },

S.nhiet_joule = {

S.tu_trans = {
  cat: 'tu', name: 'Máy biến áp', tag: 'U₁/U₂ = n₁/n₂',
  desc: 'Nhập hiệu điện thế và số vòng hai cuộn — ra hiệu điện thế thứ cấp và dòng điện.',
  fields: [{ k: 'U1', l: 'Hiệu điện thế cuộn sơ cấp', u: 'V', v: 220 }, { k: 'n1', l: 'Số vòng sơ cấp', u: 'vòng', v: 4400 }, { k: 'n2', l: 'Số vòng thứ cấp', u: 'vòng', v: 220 }, { k: 'P', l: 'Công suất (bỏ trống nếu không cần)', u: 'W', v: 0 }],
  run(v) {
    const U2 = v.U1 * v.n2 / v.n1, out = [{ l: 'U₂', v: U2, u: 'V' }, { l: 'Tỉ số', v: v.n1 / v.n2, u: 'lần' }, { l: 'Máy', v: v.n1 > v.n2 ? 'hạ thế' : 'tăng thế', u: '', text: true }];
    const st = [
      { h: 'Bước 1 · Công thức', f: 'U₁/U₂ = n₁/n₂', c: `${v.U1}/U₂ = ${v.n1}/${v.n2}` },
      { h: 'Bước 2 · Suy ra U₂', f: 'U₂ = U₁·n₂/n₁', c: `U₂ = ${v.U1}·${v.n2}/${v.n1} = ${f2(U2)} V` },
      { h: 'Bước 3 · Kết luận', f: 'So sánh n₁, n₂', c: `n₁ ${v.n1 > v.n2 ? '>' : v.n1 < v.n2 ? '<' : '='} n₂ ⇒ máy ${v.n1 > v.n2 ? 'hạ thế' : 'tăng thế'}` }

  }
