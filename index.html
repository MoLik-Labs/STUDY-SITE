{t:1,q:'Công thức cộng vận tốc khi thuyền đi trên dòng nước?',
 k:'cong van toc|xuoi dong|nguoc dong|thuyen|nuoc',
 a:'Xuôi dòng: <code>v = v<sub>thuyền</sub> + v<sub>nước</sub></code>. Ngược dòng: <code>v = v<sub>thuyền</sub> − v<sub>nước</sub></code>. Từ hai phương trình suy ra vận tốc thuyền và vận tốc nước khi biết thời gian xuôi và ngược.'},
{t:1,q:'Tính tương đối của chuyển động nghĩa là gì?',
 k:'tuong doi|moc|quy chieu|chuyen dong hay dung yen',
 a:'Một vật có thể đứng yên so với mốc này nhưng chuyển động so với mốc khác. Vì vậy trước khi tính, luôn phải chọn mốc quy chiếu và ghi rõ chiều dương.'},

/* ---------- 2. Áp suất ---------- */
{t:2,q:'Áp suất chất lỏng phụ thuộc vào những gì?',
 k:'ap suat chat long|do sau|trong luong rieng|p=dh|binh thong nhau',
 a:'Chỉ phụ thuộc trọng lượng riêng của chất lỏng và độ sâu: <code>p = d·h</code>. Không phụ thuộc hình dạng bình hay diện tích đáy — đó là điều làm nên nguyên lí bình thông nhau.'},
{t:2,q:'Bình thông nhau hoạt động theo nguyên tắc nào?',
 k:'binh thong nhau|mat thoang|can bang|may nen thuy luc',
 a:'Khi cân bằng, mặt thoáng của cùng một chất lỏng ở các nhánh luôn cùng độ cao. Ứng dụng: ống đo mực nước, máy nén thuỷ lực với <code>F<sub>1</sub>/S<sub>1</sub> = F<sub>2</sub>/S<sub>2</sub></code>.'},
{t:2,q:'Lực đẩy Archimedes phụ thuộc gì?',
 k:'archimedes|FA|day|chim|the tich|trong luong rieng',
 a:'<code>F<sub>A</sub> = d·V<sub>chìm</sub></code> — phụ thuộc trọng lượng riêng của chất lỏng và thể tích phần vật chìm, không phụ thuộc vật làm bằng gì.'},
{t:2,q:'Khi nào vật nổi, lơ lửng, chìm?',
 k:'noi|lo lung|chim|so sanh|P FA',
 a:'Nổi: <code>F<sub>A</sub> > P</code> (d<sub>vật</sub> < d<sub>lỏng</sub>). Lơ lửng: <code>F<sub>A</sub> = P</code>. Chìm xuống đáy: <code>F<sub>A</sub> < P</code>, khi đó còn phản lực của đáy.'},
{t:2,q:'Vì sao tàu làm bằng thép nặng lại nổi?',
 k:'tau|thep|noi|rong|the tich chiem cho',
 a:'Vì tàu rỗng, thể tích phần chìm chiếm chỗ lớn nên trọng lượng riêng trung bình của cả tàu nhỏ hơn nước. So sánh phải là trọng lượng riêng trung bình, không phải của riêng thép.'},
{t:2,q:'Vì sao khi kéo vật ra khỏi nước lực kéo lại tăng dần?',
 k:'keo vat|ra khoi nuoc|luc keo tang|FA giam|cong bien thien',
 a:'Vì phần chìm giảm nên <code>F<sub>A</sub></code> giảm dần, lực kéo phải bù vào. Lực biến thiên tuyến tính theo độ sâu — công của nó bằng diện tích hình thang dưới đồ thị F–s.'},

/* ---------- 3. Năng lượng cơ ---------- */
{t:3,q:'Công thức tính công và khi nào công bằng 0?',
 k:'cong|A=Fscos|cong thuc|goc alpha|vuong goc',
 a:'<code>A = F·s·cos α</code>, α là góc giữa lực và độ dời. Công bằng 0 khi lực vuông góc với độ dời (α = 90°) — ví dụ trọng lực tác dụng lên vật chuyển động ngang, hoặc lực hướng tâm.'},
{t:3,q:'Công thức tính công suất?',
 k:'cong suat|P=A/t|P=Fv|oanh|giay',
 a:'<code>P = A/t = F·v</code>. Đơn vị oát (W). Với chuyển động đều, dùng <code>P = F·v</code> nhanh hơn nhiều so với tính công rồi chia thời gian.'},
{t:3,q:'Vì sao công của lực biến thiên bằng diện tích dưới đồ thị F–s?',
 k:'cong bien thien|dien tich|do thi|F-s|hinh thang|lo xo',
 a:'Vì chia quãng đường thành vô số đoạn nhỏ ds, mỗi đoạn công là F·ds — đúng bằng diện tích một dải mảnh dưới đồ thị. Với lực biến thiên bậc nhất: <code>A = ½(F<sub>1</sub>+F<sub>2</sub>)·s</code>; với lò xo: <code>A = ½kx<sup>2</sup></code>.'},
{t:3,q:'Máy cơ đơn giản có cho ta lợi về công không?',
 k:'may co don gian|loi cong|thiet cong|don bay|rong roc|mat phang nghieng',
 a:'Không. Được lợi bao nhiêu lần về lực thì thiệt bấy nhiêu lần về đường đi, công không đổi (bỏ qua ma sát). Đây là nội dung định luật về công.'},
{t:3,q:'Điều kiện cân bằng của đòn bẩy?',
 k:'don bay|can bang|F1d1|moment|diem tua',
 a:'<code>F<sub>1</sub>·d<sub>1</sub> = F<sub>2</sub>·d<sub>2</sub></code> với d là khoảng cách từ điểm tựa đến giá của lực (cánh tay đòn), không phải chiều dài thanh.'},
{t:3,q:'Cơ năng gồm những dạng nào?',
 k:'co nang|dong nang|the nang|gom',
 a:'<code>W = W<sub>đ</sub> + W<sub>t</sub></code> với <code>W<sub>đ</sub> = ½mv<sup>2</sup></code> và <code>W<sub>t</sub> = mgh</code> (mốc thế năng tại độ cao 0).'},
{t:3,q:'Bảo toàn cơ năng đúng khi nào?',
 k:'bao toan co nang|khi nao dung|ma sat|khong bao toan',
 a:'Khi vật chỉ chịu tác dụng của trọng lực và lực đàn hồi, bỏ qua ma sát và lực cản. Có ma sát thì <code>W<sub>sau</sub> − W<sub>đầu</sub> = A<sub>ms</sub> < 0</code>.'},
{t:3,q:'Động năng phụ thuộc vào khối lượng và vận tốc thế nào?',
 k:'dong nang|phu thuoc|binh phuong van toc|m v',
 a:'Tỉ lệ thuận với khối lượng, tỉ lệ với bình phương vận tốc: <code>W<sub>đ</sub> = ½mv<sup>2</sup></code>. Tăng vận tốc gấp đôi thì động năng gấp bốn — đây là lí do phanh gấp ở tốc độ cao lại nguy hiểm.'},
{t:3,q:'Thế năng có phụ thuộc mốc chọn không?',
 k:'the nang|moc|do cao|chon moc|mgh',
 a:'Có. Giá trị thế năng phụ thuộc mốc, nhưng độ biến thiên thế năng thì không. Vì vậy có thể chọn mốc tuỳ ý, miễn nhất quán trong cả bài.'},
{t:3,q:'Hiệu suất của mặt phẳng nghiêng tính thế nào?',
 k:'hieu suat|mat phang nghieng|H=Aich/Atp',
 a:'<code>H = A<sub>ích</sub>/A<sub>toàn phần</sub> = (P·h)/(F·l)</code>. Phần hao phí là công của lực ma sát: <code>A<sub>ms</sub> = F·l − P·h</code>.'},

/* ---------- 4. Quang hình ---------- */
{t:4,q:'Phát biểu định luật khúc xạ ánh sáng?',
 k:'khuc xa|dinh luat|sin i|sin r|chiec suat',
 a:'Tia khúc xạ nằm trong mặt phẳng tới và ở bên kia pháp tuyến; <code>n<sub>1</sub>·sin i = n<sub>2</sub>·sin r</code>. Đi từ môi trường chiết quang hơn sang kém hơn thì góc khúc xạ lớn hơn góc tới.'},
{t:4,q:'Khi nào xảy ra phản xạ toàn phần?',
 k:'phan xa toan phan|goc gioi han|i>igh|chiec suat',
 a:'Khi ánh sáng đi từ môi trường chiết quang hơn sang kém hơn và góc tới lớn hơn góc giới hạn: <code>i > i<sub>gh</sub></code> với <code>sin i<sub>gh</sub> = n<sub>2</sub>/n<sub>1</sub></code>.'},
{t:4,q:'Ảnh của vật qua thấu kính hội tụ khi vật nằm ngoài tiêu cự?',
 k:'thau kinh hoi tu|d>f|anh that|nguoc chieu|nho hon',
 a:'d > 2f: ảnh thật, ngược chiều, nhỏ hơn vật. d = 2f: ảnh thật, ngược chiều, bằng vật. f < d < 2f: ảnh thật, ngược chiều, lớn hơn vật.'},
{t:4,q:'Vật nằm trong tiêu cự của thấu kính hội tụ cho ảnh gì?',
 k:'trong tieu cu|d<f|anh ao|cung chieu|lon hon',
 a:'Ảnh ảo, cùng chiều, lớn hơn vật, nằm cùng phía với vật. Đây là nguyên lí của kính lúp.'},
{t:4,q:'Công thức thấu kính và quy ước dấu?',
 k:'cong thuc thau kinh|1/f|d|d phay|quy uoc dau',
 a:'<code>1/f = 1/d + 1/d′</code>, thấu kính hội tụ f > 0, phân kì f < 0; ảnh thật d′ > 0, ảnh ảo d′ < 0. Độ phóng đại <code>|k| = d′/d = A′B′/AB</code>.'},
{t:4,q:'Hệ hai thấu kính đồng trục giải thế nào?',
 k:'he hai thau kinh|dong truc|d2=a-d1|anh lien tiep',
 a:'Tính ảnh 1 làm vật cho thấu kính 2: <code>d<sub>2</sub> = a − d′<sub>1</sub></code> với a là khoảng cách hai kính. Nếu ảnh 1 nằm sau kính 2 thì d<sub>2</sub> âm (vật ảo).'},
{t:4,q:'Ba tia đặc biệt dùng để dựng ảnh qua thấu kính?',
 k:'dung anh|ba tia|tia song song|tia qua quang tam|tia qua tieu diem',
 a:'Tia song song trục chính → qua tiêu điểm ảnh; tia qua quang tâm → truyền thẳng; tia qua tiêu điểm vật → ló ra song song trục chính. Chỉ cần hai tia là đủ.'},
{t:4,q:'Góc lệch cực tiểu của lăng kính?',
 k:'lang kinh|goc lech|Dmin|2i-A|can bang',
 a:'Khi tia sáng đối xứng qua lăng kính: <code>D<sub>min</sub> = 2i − A</code>, lúc đó <code>r<sub>1</sub> = r<sub>2</sub> = A/2</code>.'},
{t:4,q:'Ảnh trên phim máy ảnh có tính chất gì?',
 k:'may anh|phim|anh that|nguoc chieu|nho hon',
 a:'Ảnh thật, ngược chiều, nhỏ hơn vật, hiện trên phim/cảm biến. Vật ở rất xa nên d lớn, ảnh cách quang tâm xấp xỉ tiêu cự.'},

/* ---------- 5. Điện ---------- */
{t:5,q:'Phát biểu định luật Ôm?',
 k:'dinh luat om|I=U/R|cuong do|cang hieu dien the|dien tro',
 a:'Cường độ dòng điện qua đoạn mạch tỉ lệ thuận với hiệu điện thế và tỉ lệ nghịch với điện trở: <code>I = U/R</code>.'},
{t:5,q:'Điện trở của dây dẫn phụ thuộc gì?',
 k:'dien tro day dan|R=rho l/S|chieu dai|tiet dien|vat lieu',
 a:'<code>R = ρ·l/S</code>: tỉ lệ thuận chiều dài, tỉ lệ nghịch tiết diện, phụ thuộc vật liệu qua điện trở suất ρ.'},
{t:5,q:'Mạch nối tiếp có đặc điểm gì?',
 k:'noi tiep|R=R1+R2|I bang nhau|U tong',
 a:'Cùng cường độ: <code>I = I<sub>1</sub> = I<sub>2</sub></code>; hiệu điện thế cộng lại: <code>U = U<sub>1</sub>+U<sub>2</sub></code>; <code>R = R<sub>1</sub>+R<sub>2</sub></code>. Hiệu điện thế chia theo điện trở.'},
{t:5,q:'Mạch song song có đặc điểm gì?',
 k:'song song|1/R|I tong|U bang nhau',
 a:'Cùng hiệu điện thế: <code>U = U<sub>1</sub> = U<sub>2</sub></code>; <code>I = I<sub>1</sub>+I<sub>2</sub></code>; <code>1/R = 1/R<sub>1</sub>+1/R<sub>2</sub></code>. Điện trở tương đương nhỏ hơn điện trở nhỏ nhất.'},
{t:5,q:'Công thức công suất điện và điện năng tiêu thụ?',
 k:'cong suat dien|P=UI|I2R|U2/R|dien nang|A=P t',
 a:'<code>P = U·I = I<sup>2</sup>R = U<sup>2</sup>/R</code>; điện năng <code>A = P·t</code> (1 kWh = 3,6.10<sup>6</sup> J).'},
{t:5,q:'Bóng đèn ghi 220V–60W nghĩa là gì?',
 k:'bong den|220v 60w|dinh muc|cong suat dinh muc|sang binh thuong',
 a:'220 V là hiệu điện thế định mức, 60 W là công suất định mức. Đèn sáng bình thường khi đặt đúng 220 V; khi đó <code>R<sub>đ</sub> = U<sub>đm</sub><sup>2</sup>/P<sub>đm</sub> = 806,7 Ω</code> và <code>I<sub>đm</sub> ≈ 0,273 A</code>.'},
{t:5,q:'Phát biểu định luật Jun–Lenxơ?',
 k:'jun lenxo|Q=I2Rt|nhiet luong|toa nhiet',
 a:'Nhiệt lượng toả ra trên dây dẫn tỉ lệ với bình phương cường độ, điện trở và thời gian: <code>Q = I<sup>2</sup>Rt</code>. Nếu tính bằng calo thì chia 4,18.'},
{t:5,q:'Mạch cầu cân bằng có điều kiện gì?',
 k:'mach cau|can bang|R1R4=R2R3|khong co dong dien|galvani',
 a:'<code>R<sub>1</sub>R<sub>4</sub> = R<sub>2</sub>R<sub>3</sub></code> (tích chéo bằng nhau). Khi đó không có dòng qua nhánh giữa, có thể bỏ nhánh đó để tính điện trở tương đương.'},
{t:5,q:'Cực trị công suất trên biến trở?',
 k:'cuc tri|cong suat lon nhat|bien tro|cauchy|Pmax|Rx=R0',
 a:'Với nguồn có điện trở trong R<sub>0</sub>, công suất trên biến trở cực đại khi <code>R<sub>x</sub> = R<sub>0</sub></code> và <code>P<sub>max</sub> = U<sup>2</sup>/(4R<sub>0</sub>)</code>.'},
{t:5,q:'Khi nào được chập hai điểm trong mạch điện?',
 k:'chap diem|chuyen mach|hai diem cung dien the|ve lai so do|ampe ke',
 a:'Khi hai điểm nối với nhau bằng dây dẫn (hoặc ampe kế lí tưởng) có điện trở không đáng kể — chúng cùng điện thế, chập lại không làm đổi dòng điện. Dùng để vẽ lại mạch cho dễ nhìn.'},
{t:5,q:'Ampe kế và vôn kế lí tưởng mắc thế nào?',
 k:'ampe ke|von ke|noi tiep|song song|ly tuong',
 a:'Ampe kế mắc nối tiếp với nhánh cần đo, điện trở rất nhỏ. Vôn kế mắc song song với đoạn cần đo, điện trở rất lớn. Mắc sai sẽ làm mạch bị nối tắt hoặc hở.'},

/* ---------- 6. Điện từ ---------- */
{t:6,q:'Quy tắc bàn tay trái dùng để làm gì?',
 k:'ban tay trai|luc dien tu|chieu dong dien|tu truong|chieu luc',
 a:'Xác định chiều lực điện từ: đặt bàn tay trái sao cho đường sức từ xuyên vào lòng bàn tay, chiều từ cổ tay đến ngón tay là chiều dòng điện, ngón tay cái choãi ra 90° chỉ chiều lực từ.'},
{t:6,q:'Quy tắc nắm tay phải dùng khi nào?',
 k:'nam tay phai|ong day|duong suc tu|chieu dong dien|nam cham dien',
 a:'Xác định chiều đường sức từ trong ống dây: nắm bàn tay phải sao cho bốn ngón theo chiều dòng điện, ngón cái choãi ra chỉ chiều đường sức từ bên trong ống dây (cũng là cực Bắc).'},
{t:6,q:'Làm sao tăng lực từ của nam châm điện?',
 k:'nam cham dien|tang luc tu|so vong|cuong do dong dien|loi sat',
 a:'Tăng số vòng dây, tăng cường độ dòng điện, hoặc dùng lõi sắt non thay vì lõi thép. Lõi thép giữ được từ tính sau khi ngắt điện.'},
{t:6,q:'Điều kiện xuất hiện dòng điện cảm ứng?',
 k:'cam ung|dong dien cam ung|dieu kien|duong suc bien thien',
 a:'Khi số đường sức từ xuyên qua tiết diện của cuộn dây biến thiên — bằng cách di chuyển nam châm, di chuyển cuộn dây, hoặc thay đổi dòng điện trong nam châm điện.'},
{t:6,q:'Vì sao phải tăng hiệu điện thế khi truyền tải điện đi xa?',
 k:'truyen tai|hao phi|tang hieu dien the|P2R/U2|may bien ap',
 a:'Công suất hao phí <code>P<sub>hp</sub> = P<sup>2</sup>R/U<sup>2</sup></code>. Tăng U lên n lần thì hao phí giảm n<sup>2</sup> lần — tăng 10 lần thì giảm 100 lần.'},
{t:6,q:'Máy biến áp hoạt động theo nguyên tắc nào?',
 k:'may bien ap|may bien the|U1/U2=n1/n2|hai cuon|hien tuong cam ung',
 a:'Dựa trên hiện tượng cảm ứng điện từ giữa hai cuộn dây có số vòng khác nhau: <code>U<sub>1</sub>/U<sub>2</sub> = n<sub>1</sub>/n<sub>2</sub></code>. Máy biến áp chỉ dùng với dòng xoay chiều.'},
{t:6,q:'Động cơ điện một chiều cấu tạo và nguyên lí?',
 k:'dong co dien mot chieu|cau tao|nguyen li|khung day|nam cham',
 a:'Gồm khung dây đặt trong từ trường của nam châm và bộ góp (cổ góp + chổi than) đổi chiều dòng điện mỗi nửa vòng. Lực điện từ tác dụng lên hai cạnh khung tạo mômen làm khung quay liên tục.'},
{t:6,q:'Dòng điện xoay chiều khác dòng một chiều ở đâu?',
 k:'xoay chieu|mot chieu|chieu dong dien|may phat|50hz',
 a:'Dòng xoay chiều đổi chiều liên tục (ở Việt Nam 50 Hz, đổi chiều 100 lần/s), dòng một chiều chỉ chạy một chiều. Dòng xoay chiều tạo ra được bằng máy phát xoay chiều và cần cho máy biến áp.'},

/* ---------- 7. Nhiệt ---------- */
{t:7,q:'Công thức tính nhiệt lượng và các đại lượng?',
 k:'nhiet luong|Q=mcΔt|nhiet dung rieng|c|do tang nhiet',
 a:'<code>Q = m·c·Δt</code>, m (kg), c là nhiệt dung riêng (J/kg.K) — của nước 4200, của nhôm 880, của đồng 380; Δt = t<sub>sau</sub> − t<sub>trước</sub>.'},
{t:7,q:'Viết phương trình cân bằng nhiệt?',
 k:'can bang nhiet|toa|thu|Q toa=Q thu|phuong trinh',
 a:'<code>ΣQ<sub>toả</sub> = ΣQ<sub>thu</sub></code> (bỏ qua hao phí). Nếu có hao phí: <code>Q<sub>toả</sub> = Q<sub>thu</sub> + Q<sub>hao phí</sub></code>. Vật nóng hơn toả, vật lạnh hơn thu.'},
{t:7,q:'Vì sao nước đá đang tan nhiệt độ không tăng dù vẫn nhận nhiệt?',
 k:'nuoc da|tan|0 do|nhiet do khong tang|an nhiet nong chay',
 a:'Nhiệt lượng nhận vào dùng để phá vỡ liên kết tinh thể, không làm tăng động năng trung bình của phân tử nên nhiệt độ giữ 0 °C. Đó là giai đoạn nằm ngang trên đồ thị nhiệt độ – thời gian: <code>Q = λm</code>.'},
{t:7,q:'Năng suất toả nhiệt của nhiên liệu dùng thế nào?',
 k:'nang suat toa nhiet|qm|nhien lieu|than|dau',
 a:'<code>Q = q·m</code> với q là năng suất toả nhiệt (J/kg). Nhiệt lượng này là Q<sub>toàn phần</sub> khi tính hiệu suất bếp hay động cơ.'},
{t:7,q:'Hiệu suất của bếp điện tính thế nào?',
 k:'hieu suat bep|H=Qich/Qtp|dun nuoc|hieu suat',
 a:'<code>H = Q<sub>ích</sub>/Q<sub>toàn phần</sub> = (mcΔt)/(P·t)</code>. Q<sub>toàn phần</sub> là điện năng bếp tiêu thụ, tính bằng công suất nhân thời gian.'},
{t:7,q:'Có mấy cách truyền nhiệt, khác nhau thế nào?',
 k:'dan nhiet|doi luu|buc xa nhiet|truyen nhiet',
 a:'Dẫn nhiệt (qua chất rắn, kim loại tốt nhất), đối lưu (qua chất lỏng/khí, có dòng chuyển động), bức xạ nhiệt (truyền được cả trong chân không, như Mặt Trời tới Trái Đất).'},
{t:7,q:'Hai vật trao đổi nhiệt đến khi nào thì dừng?',
 k:'trao doi nhiet|dung lai|can bang|cung nhiet do',
 a:'Đến khi nhiệt độ hai vật bằng nhau. Chú ý nếu một vật đang chuyển thể (nước đá tan) thì phải kiểm tra xem đá tan hết chưa rồi mới biện luận nhiệt độ cuối.'},

/* ---------- 8. Quang mở rộng ---------- */
{t:8,q:'Ảnh của vật qua gương phẳng có tính chất gì?',
 k:'guong phang|anh ao|khong hung duoc|doi xung|bang vat',
 a:'Ảnh ảo, không hứng được trên màn, lớn bằng vật, khoảng cách từ ảnh tới gương bằng khoảng cách từ vật tới gương, đối xứng nhau qua gương.'},
{t:8,q:'Hai gương phẳng hợp góc α cho bao nhiêu ảnh?',
 k:'hai guong|so anh|360/alpha|goc alpha|nhieu anh',
 a:'Nếu 360°/α là số nguyên chẵn: <code>n = 360°/α − 1</code>. Nếu lẻ thì số ảnh là 360°/α. Trường hợp α = 90° cho 3 ảnh.'},
{t:8,q:'Vì sao ảnh gương phẳng không hứng được trên màn?',
 k:'khong hung duoc|anh ao|chum tia phan xa|duong keo dai',
 a:'Vì các tia phản xạ từ gương không cắt nhau thật; đường kéo dài về phía sau gương mới cắt nhau, nên chỉ tạo ảnh ảo — mắt nhìn thấy như có vật ở sau gương.'},
{t:8,q:'Mắt cận thị là gì, sửa bằng kính nào?',
 k:'can thi|kính phan ki|OCv|nhin xa|sua tat',
 a:'Mắt cận nhìn rõ vật gần, không rõ vật xa vì ảnh hội tụ trước võng mạc. Sửa bằng thấu kính phân kì có tiêu cự <code>f = −OC<sub>v</sub></code> (kính sát mắt).'},
{t:8,q:'Mắt lão khác mắt cận ở điểm nào?',
 k:'mat lao|lao thi|phan ki|hoi tu|nhin gan',
 a:'Mắt lão mất khả năng điều tiết nhìn gần, điểm cực cận lùi ra xa; sửa bằng thấu kính hội tụ. Mắt cận thì ngược lại, phải dùng kính phân kì.'},
{t:8,q:'Số bội giác của kính lúp?',
 k:'kinh lup|boi giac|G=25/f|do phong dai',
 a:'<code>G = 25/f</code> với f tính bằng cm. Kính lúp thường có G từ 1,5× đến 20×; vật phải đặt trong tiêu cự để có ảnh ảo cùng chiều lớn hơn vật.'},
{t:8,q:'Ảnh qua thấu kính phân kì luôn có tính chất gì?',
 k:'phan ki|anh ao|cung chieu|nho hon|luon',
 a:'Luôn là ảnh ảo, cùng chiều, nhỏ hơn vật và nằm trong khoảng tiêu cự, bất kể vật đặt ở đâu.'},

/* ---------- 9. Ánh sáng & màu ---------- */
{t:9,q:'Ánh sáng trắng là gì?',
 k:'anh sang trang|hon hop|nhieu mau|quang pho',
 a:'Ánh sáng trắng là hỗn hợp của vô số ánh sáng đơn sắc có màu khác nhau. Có thể phân tích bằng lăng kính hoặc đĩa CD để thấy dải màu liên tục.'},
{t:9,q:'Hiện tượng tán sắc ánh sáng là gì?',
 k:'tan sac|lang kinh|dai mau|cau vong',
 a:'Là sự phân tách một chùm ánh sáng phức tạp thành các chùm sáng đơn sắc khác nhau khi khúc xạ qua lăng kính. Cầu vồng là tán sắc trong giọt nước.'},
{t:9,q:'Vì sao ban ngày lá cây màu xanh, ban đêm chiếu đèn đỏ lại thấy gần như đen?',
 k:'mau sac vat|la cay|xanh|den do|tan xa',
 a:'Vật tán xạ mạnh ánh sáng cùng màu với nó và hấp thụ các màu khác. Lá xanh tán xạ ánh sáng xanh nên dưới ánh sáng trắng thấy xanh; dưới ánh sáng đỏ nó hấp thụ hết nên thấy đen.'},
{t:9,q:'Có thể trộn các ánh sáng màu để được ánh sáng trắng không?',
 k:'tron anh sang|ba mau|do luc lam|trang|man hinh',
 a:'Có. Trộn ba ánh sáng màu đỏ, lục, lam (ba màu cơ bản) theo tỉ lệ thích hợp cho ánh sáng trắng. Đây là nguyên lí của màn hình màu.'},
{t:9,q:'Ánh sáng có những tác dụng gì?',
 k:'tac dung anh sang|nhiet|sinh hoc|quang dien|chup anh',
 a:'Tác dụng nhiệt (phơi nắng nóng lên), tác dụng sinh học (quang hợp, chữa bệnh), tác dụng quang điện (pin mặt trời, máy ảnh số).'},
{t:9,q:'Vì sao tờ giấy trắng nhìn dưới ánh sáng đỏ lại thành màu đỏ?',
 k:'to giay trang|duoi anh sang do|mau do|tan xa toan phan',
 a:'Tờ giấy trắng tán xạ tốt mọi ánh sáng màu, nên khi chỉ có ánh sáng đỏ chiếu vào thì nó tán xạ ánh sáng đỏ và mắt thấy tờ giấy đỏ.'},

/* ---------- 10. Bảo toàn năng lượng ---------- */
{t:10,q:'Phát biểu định luật bảo toàn và chuyển hoá năng lượng?',
 k:'bao toan nang luong|khong tu sinh|chuyen hoa|dinh luat',
 a:'Năng lượng không tự sinh ra và không tự mất đi, chỉ chuyển hoá từ dạng này sang dạng khác hoặc truyền từ vật này sang vật khác.'},
{t:10,q:'Vì sao hiệu suất luôn nhỏ hơn 100%?',
 k:'hieu suat|nho hon 100|hao phi|nhiet|ma sat',
 a:'Vì luôn có phần năng lượng chuyển thành dạng không mong muốn: nhiệt toả ra môi trường, ma sát, âm thanh, điện từ. Hiệu suất = năng lượng có ích / năng lượng toàn phần.'},
{t:10,q:'Năng lượng hao phí đi đâu?',
 k:'hao phi|di dau|nhiet|moi truong|khong mat',
 a:'Chuyển thành nhiệt năng toả ra môi trường và các dạng năng lượng khác (âm thanh, ánh sáng, sóng điện từ). Nó vẫn tồn tại, chỉ là không dùng được cho mục đích chính.'},
{t:10,q:'Động cơ nhiệt là gì?',
 k:'dong co nhiet|nhien lieu|hieu suat|A/Q',
 a:'Máy biến nhiệt năng của nhiên liệu thành cơ năng (động cơ ô tô, tàu hoả, máy hơi nước). Hiệu suất <code>H = A/Q<sub>nhiên liệu</sub></code>, thường chỉ 30–40%.'},
{t:10,q:'Năng lượng tái tạo gồm những dạng nào hay dùng ở lớp 9?',
 k:'tai tao|mat troi|gio|nuoc|sinh khoi',
 a:'Mặt trời (pin quang điện), gió (tuabin), nước (thuỷ điện), sinh khối. Đều bắt nguồn từ năng lượng Mặt Trời hoặc chuyển động của Trái Đất.'},

/* ---------- 11. Thực hành ---------- */
{t:11,q:'Vì sao đo tiêu cự bằng phương pháp Silbermann?',
 k:'silbermann|do tieu cu|phuong phap|L l|vi sao',
 a:'Vì không cần xác định quang tâm O, chỉ cần đo khoảng cách vật–màn L và dịch thấu kính để hai vị trí cho ảnh rõ cách nhau l, rồi tính <code>f = (L<sup>2</sup> − l<sup>2</sup>)/(4L)</code>. Sai số nhỏ hơn đo trực tiếp từ O tới F.'},
{t:11,q:'Vì sao không đo trực tiếp từ quang tâm tới tiêu điểm?',
 k:'khong do truc tiep|quang tam O|tieu diem F|kho tieu cu|sai so',
 a:'Vì quang tâm O và tiêu điểm F nằm bên trong thấu kính/không đánh dấu được chính xác. Silbermann chỉ đo trên băng quang học nên chính xác hơn.'},
{t:11,q:'Đo khối lượng riêng của một vật rắn không thấm nước?',
 k:'khoi luong rieng|D=m/V|binh chia do|luc ke|the tich',
 a:'Cân hoặc dùng lực kế để có m; dùng bình chia độ (hoặc bình tràn) để đo thể tích V bằng hiệu hai mức nước. <code>D = m/V</code>.'},
{t:11,q:'Sai số tuyệt đối và sai số tương đối khác nhau thế nào?',
 k:'sai so|tuyet doi|tuong doi|phan tram|do chinh xac',
 a:'Sai số tuyệt đối ΔA cùng đơn vị với A; sai số tương đối là ΔA/A (thường viết %), cho biết phép đo chính xác tới mức nào. Kết quả ghi A = Ā ± ΔA.'},
{t:11,q:'Khi đo tiêu cự cần bố trí thí nghiệm thế nào?',
 k:'bo tri|thau kinh hoi tu|vat sang|man chắn|bang quang hoc',
 a:'Đặt thấu kính giữa vật sáng và màn trên băng quang học, giữ vật và màn cố định cách nhau L > 4f, dịch thấu kính đến hai vị trí cho ảnh rõ nét.'},

/* ---------- 12. Đề thi & chiến thuật ---------- */
{t:12,q:'Nên phân bố thời gian thế nào trong bài thi tự luận?',
 k:'phan bo thoi gian|lam bai|thi|chien thuat|diem',
 a:'Đọc đề 5–10 phút và ghi nhanh hướng làm; làm câu dễ trước; mỗi câu dành thời gian theo số điểm (khoảng 1 phút cho 0,25 điểm). Dành 10 phút cuối soát đơn vị, dấu và kết luận.'},
{t:12,q:'Lỗi thường mất điểm trong bài Vật lí là gì?',
 k:'loi thuong gap|mat diem|don vi|dau|hinh ve|ket luan',
 a:'Thiếu đơn vị, sai dấu d′ (ảnh ảo), vẽ hình không ghi tia và ký hiệu, không kết luận, đổi đơn vị sai (cm sang m, g sang kg, phút sang giây), và làm tròn quá sớm ở bước trung gian.'},
{t:12,q:'Làm sao trình bày một bài quang hình cho đủ điểm?',
 k:'trinh bay|quang hinh|cham diem|hinh ve|tuong tu',
 a:'Vẽ hình đúng tỉ lệ với trục chính, quang tâm, tiêu điểm và các tia; ghi rõ ảnh thật/ảo; viết công thức thấu kính và công thức phóng đại; kết luận bằng câu trả lời có đơn vị.'}
];

/* =========================================================
   TRẮC NGHIỆM — 36 câu, 3 câu mỗi chủ đề
========================================================= */
window.QUIZ=[
{t:1,q:'Một xe đi 30 km với v = 30 km/h, rồi 30 km với v = 60 km/h. Vận tốc trung bình cả chặng là:',o:['40 km/h','45 km/h','50 km/h','35 km/h'],a:0,e:'Thời gian: 1 h + 0,5 h = 1,5 h; quãng đường 60 km ⇒ v_tb = 40 km/h. Trung bình cộng (45) là đáp án sai kinh điển.'},
{t:1,q:'Hai xe cách nhau 120 km chạy ngược chiều, vận tốc 40 km/h và 60 km/h. Sau bao lâu gặp nhau?',o:['2 h','1,2 h','3 h','2,4 h'],a:1,e:'t = s/(v₁+v₂) = 120/100 = 1,2 h.'},
{t:1,q:'Thuyền xuôi dòng 4 h, ngược dòng 6 h trên cùng quãng đường. Tỉ số vận tốc xuôi/ngược là:',o:['2/3','3/2','4/6 = 0,67 lần','Không xác định'],a:1,e:'Cùng s nên v tỉ lệ nghịch với t: v_xuôi/v_ngược = 6/4 = 1,5.'},

{t:2,q:'Ba bình có đáy bằng nhau, đựng cùng độ cao nước. Áp suất tại đáy:',o:['Bình to nhất lớn nhất','Bình hẹp nhất lớn nhất','Bằng nhau','Phụ thuộc thể tích nước'],a:2,e:'p = d·h, chỉ phụ thuộc độ sâu và trọng lượng riêng, không phụ thuộc hình dạng bình.'},
{t:2,q:'Vật có d_vật = 9000 N/m³ thả vào nước (d = 10000 N/m³). Vật sẽ:',o:['Chìm xuống đáy','Lơ lửng','Nổi, chìm một phần','Nổi hoàn toàn trên mặt'],a:2,e:'d_vật < d_nước nên nổi, phần chìm sao cho F_A = P ⇒ V_chìm/V_vật = 0,9.'},
{t:2,q:'Kéo một vật từ từ ra khỏi nước, lực kéo:',o:['Không đổi','Giảm dần','Tăng dần rồi bằng trọng lượng','Tăng rồi giảm'],a:2,e:'F_A giảm khi phần chìm giảm, nên lực kéo tăng dần đến khi vật ra hẳn thì bằng P.'},

{t:3,q:'Một lực 20 N kéo vật đi 5 m theo phương hợp với lực góc 60°. Công của lực là:',o:['100 J','50 J','86,6 J','0 J'],a:1,e:'A = F·s·cos60° = 20·5·0,5 = 50 J.'},
{t:3,q:'Công của lực đàn hồi khi lò xo k = 100 N/m giãn từ 0 đến 10 cm là:',o:['10 J','5 J','0,5 J','1 J'],a:2,e:'A = ½kx² = ½·100·0,1² = 0,5 J. Nhớ đổi cm sang m.'},
{t:3,q:'Vật rơi tự do từ độ cao h. Ở độ cao h/2, tỉ số động năng và thế năng là:',o:['1 : 1','2 : 1','1 : 2','4 : 1'],a:0,e:'Bảo toàn cơ năng: W_t = mg·h/2, W_đ = mg·h − mg·h/2 = mg·h/2 ⇒ bằng nhau.'},

{t:4,q:'Vật đặt cách thấu kính hội tụ f = 10 cm một khoảng 30 cm. Ảnh cách kính:',o:['15 cm','20 cm','30 cm','12 cm'],a:0,e:'1/d′ = 1/f − 1/d = 1/10 − 1/30 = 2/30 ⇒ d′ = 15 cm, ảnh thật ngược chiều, nhỏ hơn vật.'},
{t:4,q:'Ảnh của vật qua thấu kính phân kì luôn:',o:['Thật, ngược chiều','Ảo, cùng chiều, nhỏ hơn','Ảo, cùng chiều, lớn hơn','Thật, cùng chiều'],a:1,e:'Phân kính luôn cho ảnh ảo, cùng chiều, nhỏ hơn vật và nằm trong khoảng tiêu cự.'},
{t:4,q:'Góc giới hạn phản xạ toàn phần khi ánh sáng từ nước (n = 4/3) ra không khí xấp xỉ:',o:['41,8°','48,6°','53,1°','62,7°'],a:1,e:'sin i_gh = 1/(4/3) = 0,75 ⇒ i_gh ≈ 48,6°.'},

{t:5,q:'Hai điện trở 6 Ω và 3 Ω mắc song song. Điện trở tương đương là:',o:['9 Ω','4,5 Ω','2 Ω','1,5 Ω'],a:2,e:'1/R = 1/6 + 1/3 = 1/2 ⇒ R = 2 Ω, nhỏ hơn điện trở nhỏ nhất.'},
{t:5,q:'Bóng đèn 220 V – 100 W có điện trở xấp xỉ:',o:['220 Ω','484 Ω','48,4 Ω','100 Ω'],a:1,e:'R = U²/P = 220²/100 = 484 Ω.'},
{t:5,q:'Trong mạch cầu cân bằng, điều kiện là:',o:['R₁ + R₄ = R₂ + R₃','R₁R₄ = R₂R₃','R₁/R₂ = R₃/R₄','R₁R₂ = R₃R₄'],a:1,e:'Tích hai điện trở chéo bằng nhau thì không có dòng qua nhánh giữa.'},

{t:6,q:'Muốn giảm công suất hao phí trên đường dây 100 lần, phải:',o:['Tăng U 100 lần','Tăng U 10 lần','Giảm R 100 lần','Tăng I 10 lần'],a:1,e:'P_hp tỉ lệ nghịch với U², nên tăng U 10 lần là đủ.'},
{t:6,q:'Máy biến áp có n₁ = 1000 vòng, n₂ = 50 vòng, U₁ = 220 V. U₂ bằng:',o:['11 V','22 V','44 V','4,4 V'],a:0,e:'U₂ = U₁·n₂/n₁ = 220·50/1000 = 11 V.'},
{t:6,q:'Dòng điện cảm ứng xuất hiện khi:',o:['Nam châm đứng yên cạnh cuộn dây','Số đường sức từ qua cuộn dây biến thiên','Cuộn dây nằm trong từ trường mạnh','Có dòng điện một chiều chạy qua'],a:1,e:'Cần sự biến thiên số đường sức từ qua tiết diện cuộn dây, không chỉ cần có từ trường.'},

{t:7,q:'Vì sao nước biển lâu nóng hơn nước trong hồ?',
 k:'nuoc bien|nong cham|nhiet dung rieng|khoi luong|muoi',
 a:'Do khối lượng nước lớn và nhiệt dung riêng của nước cao (4200 J/kg.K), cần rất nhiều nhiệt để tăng 1 °C. Nước biển còn có muối làm thay đổi nhiệt dung và nhiệt độ sôi.'},
{t:7,q:'Vì sao khi đun nước, nước nóng đối lưu thành dòng?',
 k:'doi luu|dun nuoc|dong|noi len|lanh xuong',
 a:'Lớp nước dưới nóng lên, nở ra, khối lượng riêng giảm nên nổi lên; lớp lạnh phía trên chìm xuống tạo dòng đối lưu làm nước nóng đều.'},
{t:7,q:'Tại sao mùa đông mặc áo len lại ấm?',
 k:'ao len|mua dong|am|dan nhiet|khong khi',
 a:'Len dẫn nhiệt kém và giữ lớp không khí giữa các sợi, ngăn nhiệt truyền từ cơ thể ra ngoài. Áo không sinh nhiệt, chỉ giảm mất nhiệt.'},
{t:7,q:'Khi tính cân bằng nhiệt có vật chuyển thể, cần kiểm tra gì trước?',
 k:'chuyen the|kiem tra|nuoc da tan het|bien luan|nhiet do cuoi',
 a:'So sánh nhiệt lượng cần để vật chuyển thể hết với nhiệt lượng vật kia có thể toả ra. Nếu thiếu thì nhiệt độ cuối dừng ở nhiệt độ chuyển thể; nếu đủ mới tính tiếp nhiệt độ tăng.'},
{t:7,q:'Vì sao nắp ấm đậy kín nước sôi lâu hơn?',
 k:'nap am|day kin|lau soi|bay hoi|hao phi',
 a:'Vì giảm bay hơi — bay hơi lấy nhiệt từ khối nước nên làm nguội. Đậy nắp giữ hơi, giảm hao phí nhiệt ra không khí.'},

/* T8 */
{t:8,q:'Vì sao gương chiếu hậu ô tô dùng gương lồi?',
 k:'guong loi|chieu hau|o to|vung nhin thay|anh nho',
 a:'Gương cầu lồi cho vùng nhìn thấy rộng hơn gương phẳng cùng kích thước, dù ảnh nhỏ hơn. Ưu tiên quan sát phía sau hơn là kích thước ảnh.'},
{t:8,q:'Mắt viễn thị khác mắt lão ở điểm nào?',
 k:'vien thi|lao thi|khac nhau|hoi tu|diem cuc can',
 a:'Cả hai đều dùng kính hội tụ. Viễn thị là tật bẩm sinh, ảnh hội tụ sau võng mạc kể cả khi nhìn xa. Lão thị là do tuổi, mất khả năng điều tiết nhìn gần, nhìn xa vẫn rõ.'},
{t:8,q:'Vì sao khi chụp ảnh, người ta thường đứng xa để chụp toàn thân?',
 k:'chup anh|toan than|dung xa|tieu cu|anh nho',
 a:'Với tiêu cự cố định, muốn ảnh nhỏ lại cho vừa khung hình thì phải tăng d: <code>d′ = df/(d−f)</code> tiến dần về f và ảnh nhỏ đi.'},
{t:8,q:'Muốn quan sát một vật nhỏ, nên chọn kính lúp có bội giác lớn hay nhỏ?',
 k:'kinh lup|boi giac|chon|quan sat|f nho',
 a:'Chọn bội giác lớn, tức tiêu cự nhỏ (<code>G = 25/f</code>). Nhưng bội giác quá lớn làm vùng nhìn thấy hẹp và ảnh méo, nên thực tế dùng 2×–10×.'},
{t:8,q:'Ảnh của vật qua gương phẳng có hứng được bằng màn không? Vì sao?',
 k:'guong phang|hung duoc|anh ao|vi sao|man',
 a:'Không. Các tia phản xạ từ gương là chùm phân kì, đường kéo dài về sau gương mới cắt nhau, nên ảnh là ảnh ảo.'},

/* T9 */
{t:9,q:'Vì sao bầu trời màu xanh còn hoàng hôn màu đỏ?',
 k:'bau troi xanh|hoang hon|tan xa|mau do|anh sang',
 a:'Ánh sáng xanh bị tán xạ mạnh trong khí quyển nên mắt nhận xanh khi nhìn lên. Khi Mặt Trời thấp, ánh sáng đi qua lớp khí dày, phần xanh bị tán xạ hết, còn đỏ đi tới mắt.'},
{t:9,q:'Vì sao vật màu đen hấp thụ nhiều năng lượng ánh sáng?',
 k:'mau den|hap thu|nang luong|nong|anh sang',
 a:'Vật đen hấp thụ hầu hết các ánh sáng tới và tán xạ rất ít, nên nhận nhiều năng lượng và nóng lên nhanh hơn vật sáng màu.'},
{t:9,q:'Có thể tạo ánh sáng trắng bằng cách trộn hai màu không?',
 k:'tron hai mau|trang|do luc|bo sung|man hinh',
 a:'Có. Hai màu gọi là bổ sung cho nhau khi trộn lại thành trắng, ví dụ đỏ và lục lam. Ba màu cơ bản đỏ – lục – lam trộn theo tỉ lệ thích hợp cũng cho trắng.'},
{t:9,q:'Vì sao phim ảnh cũ phải chụp trong buồng tối đỏ?',
 k:'phim anh|buong toi do|anh sang do|hong phim',
 a:'Phim nhạy với ánh sáng xanh và tím, ít nhạy với đỏ, nên đèn đỏ không làm hỏng phim. Đây là ứng dụng của việc phân biệt màu ánh sáng theo bước sóng.'},
{t:9,q:'Ánh sáng có bị đổi màu khi truyền qua môi trường trong suốt không?',
 k:'truyen qua|doi mau|trong suot|chiec suat',
 a:'Không đổi tần số nên không đổi màu; chỉ đổi vận tốc và đổi hướng. Màu của một ánh sáng đơn sắc được quyết định bởi tần số.'},

/* T10 */
{t:10,q:'Vì sao không thể chế tạo động cơ có hiệu suất 100%?',
 k:'hieu suat 100|dong co|ma sat|nhiet|khong the',
 a:'Vì luôn có ma sát, toả nhiệt ra môi trường và tổn thất khác. Nhiệt sinh ra không được dùng hữu ích nên hiệu suất luôn nhỏ hơn 1.'},
{t:10,q:'Khi phanh xe, năng lượng đi đâu?',
 k:'phanh xe|nang luong|nhiet|ma sat|dien nang',
 a:'Động năng chuyển thành nhiệt ở má phanh và đĩa phanh (một phần thành âm thanh). Với xe điện, phần lớn được thu hồi thành điện năng (phanh tái sinh).'},
{t:10,q:'Năng lượng của bóng đèn LED so với bóng sợi đốt về hiệu suất?',
 k:'led|soi dot|hieu suat|anh sang|nhiet',
 a:'LED biến phần lớn điện năng thành ánh sáng nên hiệu suất cao hơn nhiều lần. Bóng sợi đốt chỉ khoảng 5% thành ánh sáng, còn lại là nhiệt.'},
{t:10,q:'Vì sao nói năng lượng của thức ăn cũng cuối cùng thành nhiệt?',
 k:'thuc an|hoa nang|nhiet|co the|chuyen hoa',
 a:'Hoá năng trong thức ăn chuyển thành cơ năng và nhiệt năng trong cơ thể, cuối cùng toả ra môi trường. Năng lượng chỉ đổi dạng, không mất đi.'},
{t:10,q:'Vì sao hiệu suất của quạt điện lại thấp hơn động cơ công nghiệp?',
 k:'quat dien|hieu suat|dong co|hao phi|cong suat nho',
 a:'Động cơ nhỏ có tỉ lệ tổn thất ma sát và toả nhiệt cao hơn so với công suất hữu ích. Máy lớn có thiết kế tối ưu hơn nên hiệu suất cao hơn.'},

/* T11 */
{t:11,q:'Vì sao trong thí nghiệm đo tiêu cự phải để vật sáng và màn song song?',
 k:'thí nghiem|do tieu cu|song song|vat sang|man',
 a:'Để trục chính vuông góc với mặt phẳng vật và màn, nhờ đó ảnh rõ nét và khoảng cách L đo đúng dọc theo trục chính.'},
{t:11,q:'Khi đo nhiều lần nên xử lý số liệu thế nào?',
 k:'do nhieu lan|trung binh|so lieu|sai so|ket qua',
 a:'Tính giá trị trung bình cộng của các lần đo, rồi tính sai số tuyệt đối trung bình. Ghi kết quả dạng <code>A = Ā ± ΔA</code> kèm đơn vị.'},
{t:11,q:'Vì sao cần đo độ dài bằng thước có ĐCNN nhỏ hơn?',
 k:'docnn|thuoc|do dai|do chinh xac|sai so',
 a:'ĐCNN nhỏ nghĩa là thước chia vạch mịn hơn, đọc được giá trị chi tiết hơn nên sai số dụng cụ nhỏ hơn. Sai số tuyệt đối không thể nhỏ hơn nửa ĐCNN.'},
{t:11,q:'Làm sao đo tiêu cự nếu chỉ có thấu kính và một vật ở rất xa?',
 k:'tieu cu|vat o xa|mat troi|anh|f',
 a:'Hứng ảnh của vật ở xa (Mặt Trời, đèn đường) lên màn; khi ảnh rõ nét thì khoảng cách từ thấu kính tới màn xấp xỉ bằng tiêu cự, vì d ≈ ∞ nên d′ ≈ f.'},
{t:11,q:'Sai số hệ thống khác sai số ngẫu nhiên ở đâu?',
 k:'sai so he thong|ngau nhien|khac nhau|dung cu',
 a:'Sai số hệ thống lặp lại như nhau do dụng cụ lệch hoặc phương pháp sai. Sai số ngẫu nhiên thay đổi mỗi lần đo do thao tác và điều kiện, giảm bằng cách đo nhiều lần.'},

/* T12 */
{t:12,q:'Nên đọc đề và ghi nhanh những gì?',
 k:'doc de|ghi nhanh|du kien|yeu cau|don vi',
 a:'Ghi dữ kiện đã cho kèm đơn vị, đại lượng cần tìm, và dạng bài nhận ra. Với bài quang, phác nhanh hình; với bài điện, vẽ lại sơ đồ mạch.'},
{t:12,q:'Khi bí một câu, nên viết gì để vẫn có điểm?',
 k:'bi|viet gi|co diem|huong lam|cong thuc',
 a:'Viết công thức liên quan, vẽ hình, nêu hướng giải và điều kiện. Giám khảo chấm theo bước nên phần đúng vẫn được điểm dù chưa ra kết quả.'},
{t:12,q:'Vì sao nên kiểm tra đơn vị ở bước cuối?',
 k:'kiem tra don vi|buoc cuoi|sai don vi|ket qua',
 a:'Vì phần lớn lỗi mất điểm là đổi đơn vị sai (cm sang m, gam sang kg, phút sang giây). Kiểm tra đơn vị cũng giúp phát hiện công thức sai.'},
{t:12,q:'Có nên học thuộc đáp án các đề đã chữa không?',
 k:'hoc thuoc|dap an|de chua|khong nen|phuong phap',
 a:'Không nên. Chỉ nên ghi lại dạng bài và lỗi sai. Học thuộc đáp án không giúp khi đề đổi số, còn nhận dạng lỗi thì áp dụng được cho mọi bài.'},
{t:12,q:'Thời gian hợp lý cho một bài thi 5 câu tự luận 120 phút?',
 k:'5 cau|120 phut|phan bo|thoi gian|chien thuat',
 a:'Khoảng 10 phút đọc và định hướng, 95 phút làm bài theo điểm số, 15 phút soát lại đơn vị, dấu và kết luận. Câu dễ làm trước.'}
];

{t:1,type:'tf',q:'Trên cùng một quãng đường, vận tốc và thời gian tỉ lệ nghịch với nhau.',a:true,

{t:2,type:'tf',q:'Áp suất của chất lỏng tại một điểm phụ thuộc vào diện tích đáy bình chứa.',a:false,
 e:'p = d·h chỉ phụ thuộc độ sâu và trọng lượng riêng, không phụ thuộc hình dạng hay diện tích đáy.'},
{t:2,type:'num',q:'Máy nén thuỷ lực: F₁ = 100 N trên pit-tông S₁ = 10 cm². Hỏi lực F₂ trên pit-tông S₂ = 200 cm²?',a:2000,tol:1,unit:'N',

{t:2,type:'mcq',q:'Khối gỗ nổi trong nước, phần nổi trên mặt bằng 1/3 thể tích. Trọng lượng riêng của gỗ (nước 10 000 N/m³) là:',o:['3 333 N/m³','6 667 N/m³','10 000 N/m³','1 000 N/m³'],a:1,

{t:3,type:'num',q:'Lực 50 N kéo vật đi 10 m, phương của lực hợp với phương chuyển động góc 60°. Công của lực (J)?',a:250,tol:0.5,unit:'J',

{t:3,type:'tf',q:'Máy cơ đơn giản cho ta lợi về công khi bỏ qua ma sát.',a:false,

{t:3,type:'multi',q:'Lực nào không sinh công trong các trường hợp sau?',o:['Trọng lực khi vật chuyển động ngang','Lực hướng tâm khi vật chuyển động tròn đều','Lực kéo cùng chiều chuyển động','Áp lực của vật lên mặt sàn khi vật trượt trên sàn'],a:[0,1,3],

{t:3,type:'num',q:'Công của lực đàn hồi khi lò xo k = 200 N/m giãn từ 0 đến 5 cm (J)?',a:0.25,tol:0.005,unit:'J',

{t:3,type:'mcq',q:'Vật rơi tự do từ độ cao h (bỏ qua sức cản). Khi chạm đất, động năng của vật:',o:['Bằng một nửa thế năng ban đầu','Bằng thế năng ban đầu','Lớn hơn thế năng ban đầu','Bằng 0'],a:1,

{t:3,type:'num',q:'Một lực kéo 200 N làm vật chuyển động đều với vận tốc 5 m/s. Công suất của lực kéo (W)?',a:1000,tol:1,unit:'W',
 e:'P = F·v = 200 × 5 = 1 000 W.'},

/* T4 */
{t:4,type:'num',q:'Vật cách thấu kính hội tụ f = 10 cm một khoảng d = 15 cm. Ảnh cách kính bao nhiêu cm?',a:30,tol:0.2,unit:'cm',

{t:4,type:'tf',q:'Ảnh của một vật qua thấu kính phân kì luôn nhỏ hơn vật.',a:true,

{t:4,type:'multi',q:'Điều kiện để có phản xạ toàn phần:',o:['Ánh sáng đi từ môi trường chiết quang hơn sang kém hơn','Góc tới lớn hơn góc giới hạn','Góc tới nhỏ hơn góc giới hạn','Ánh sáng chiếu vuông góc với mặt phân cách'],a:[0,1],
 e:'Đủ hai điều kiện: môi trường chiết quang hơn → kém hơn và i > i_gh.'},
{t:4,type:'num',q:'Máy ảnh có tiêu cự 5 cm chụp vật cách 200 cm. Ảnh cách vật kính bao nhiêu cm (làm tròn 2 chữ số)?',a:5.13,tol:0.05,unit:'cm',
 e:'d′ = df/(d−f) = 200×5/195 ≈ 5,13 cm — xấp xỉ tiêu cự vì vật ở rất xa.'},
{t:4,type:'mcq',q:'Vật đặt trong tiêu cự của thấu kính hội tụ cho ảnh ảo. Ảnh đó nằm:',o:['Cùng phía vật, xa kính hơn vật','Cùng phía vật, gần kính hơn vật','Khác phía vật','Ngay tại tiêu điểm'],a:0,

window.SOLVE=[
{t:3,title:'Công của lực biến thiên khi kéo vật ra khỏi nước',
 problem:'Một khối lập phương cạnh 20 cm, trọng lượng riêng 8 000 N/m³, đang chìm hoàn toàn trong nước (d = 10 000 N/m³). Kéo vật lên đều cho đến khi vừa ra khỏi mặt nước. Tính công của lực kéo, bỏ qua ma sát.',
 steps:['Vật chìm hoàn toàn, lực kéo cân bằng: F₁ = P − F_A = d_v·V − d_n·V = (8 000 − 10 000)·0,008 = −16 N. Dấu âm cho thấy vật tự nổi, phải giữ lại.','Khi vật vừa ra khỏi mặt nước: F₂ = P = 8 000 × 0,008 = 64 N.','Lực kéo biến thiên bậc nhất theo quãng đường, quãng đường kéo bằng cạnh vật s = 0,2 m.','Công bằng diện tích hình thang: A = ½(F₁ + F₂)s = ½(−16 + 64)×0,2 = 4,8 J.'],
 answer:'A = 4,8 J'}

,{t:3,title:'Bảo toàn cơ năng có ma sát trên mặt phẳng nghiêng',
 problem:'Vật 2 kg trượt không vận tốc đầu từ đỉnh mặt phẳng nghiêng cao 1,2 m, dài 3 m, hệ số ma sát 0,2. Tính vận tốc ở chân dốc. Lấy g = 10 m/s².',
 steps:['Cơ năng đầu: W₁ = mgh = 2×10×1,2 = 24 J (chọn mốc thế năng ở chân dốc).','Công của ma sát: A_ms = −F_ms·l = −μ·mg·cos α·l, với cos α = √(l² − h²)/l = √(9 − 1,44)/3 ≈ 0,919.','A_ms = −0,2×2×10×0,919×3 ≈ −11,0 J.','Định luật biến thiên cơ năng: W₂ − W₁ = A_ms ⇒ ½mv² = 24 − 11 = 13 J.','v = √(2×13/2) ≈ 3,6 m/s.'],
 answer:'v ≈ 3,6 m/s'}

,{t:4,title:'Hệ hai thấu kính hội tụ đồng trục',
 problem:'Hai thấu kính hội tụ f₁ = 20 cm, f₂ = 10 cm đặt cách nhau a = 50 cm. Vật AB cao 2 cm đặt trước L₁ cách 30 cm. Xác định vị trí, tính chất, độ cao ảnh cuối.',
 steps:['Với L₁: 1/d₁′ = 1/20 − 1/30 = 1/60 ⇒ d₁′ = 60 cm. Ảnh A₁B₁ là ảnh thật, ngược chiều, cách L₁ 60 cm.','Khoảng cách tới L₂: d₂ = a − d₁′ = 50 − 60 = −10 cm ⇒ vật ảo với L₂.','Với L₂: 1/d₂′ = 1/10 − 1/(−10) = 1/10 + 1/10 = 1/5 ⇒ d₂′ = 5 cm.','Ảnh cuối là ảnh thật, cách L₂ 5 cm về phía sau.','Độ phóng đại: k = (d₁′/d₁)·(d₂′/d₂) = (60/30)·(5/−10) = −1. Ảnh cao 2 cm, ngược chiều vật.'],
 answer:'Ảnh thật, cách L₂ 5 cm, cao 2 cm, ngược chiều'}

,{t:4,title:'Dịch vật lại gần thấu kính — ảnh dịch bao nhiêu?',
 problem:'Vật cách thấu kính hội tụ f = 12 cm một khoảng 36 cm. Dịch vật lại gần 12 cm. Hỏi ảnh dịch chuyển bao nhiêu và độ phóng đại thay đổi thế nào?',
 steps:['Trước: 1/d′ = 1/12 − 1/36 = 2/36 ⇒ d₁′ = 18 cm; k₁ = 18/36 = 0,5.','Sau khi dịch: d = 24 cm ⇒ 1/d′ = 1/12 − 1/24 = 1/24 ⇒ d₂′ = 24 cm; k₂ = 1.','Ảnh dịch ra xa thấu kính: 24 − 18 = 6 cm.','Độ phóng đại tăng từ 0,5 lên 1 (ảnh lớn gấp đôi so với trước).'],
 answer:'Ảnh dịch xa thêm 6 cm, độ phóng đại tăng gấp đôi'}

,{t:5,title:'Mạch cầu cân bằng và cách bỏ nhánh giữa',
 problem:'Mạch cầu gồm R₁ = 6 Ω, R₂ = 3 Ω ở nhánh trên; R₃ = 4 Ω, R₄ = 2 Ω ở nhánh dưới; điện trở R₅ = 10 Ω nối giữa hai điểm giữa. Tính điện trở tương đương.',
 steps:['Kiểm tra điều kiện cân bằng: R₁·R₄ = 6×2 = 12 và R₂·R₃ = 3×4 = 12 ⇒ cân bằng.','Cầu cân bằng nên không có dòng qua R₅, có thể bỏ R₅ khỏi mạch.','Mạch còn (R₁ nt R₂) // (R₃ nt R₄): nhánh trên 9 Ω, nhánh dưới 6 Ω.','R = (9×6)/(9+6) = 54/15 = 3,6 Ω.'],
 answer:'R = 3,6 Ω'}

,{t:5,title:'Cực trị công suất trên biến trở',
 problem:'Nguồn U = 18 V, điện trở trong R₀ = 6 Ω mắc với biến trở R_x. Tìm R_x để công suất trên biến trở lớn nhất và tính giá trị đó.',
 steps:['Dòng điện: I = U/(R₀ + R_x).','Công suất trên biến trở: P = I²R_x = U²R_x/(R₀+R_x)².','Áp dụng Cauchy: (R₀+R_x)² ≥ 4R₀R_x ⇒ P ≤ U²/(4R₀).','Dấu bằng khi R_x = R₀ = 6 Ω.','P_max = 18²/(4×6) = 324/24 = 13,5 W.'],
 answer:'R_x = 6 Ω, P_max = 13,5 W'}

,{t:5,title:'Bếp điện — hiệu suất và tiền điện',
 problem:'Bếp ghi 220 V – 1 000 W dùng đúng hiệu điện thế định mức để đun 2 lít nước từ 25 °C đến sôi. Hiệu suất 80%. Tính thời gian đun và điện năng tiêu thụ.',
 steps:['Nhiệt lượng có ích: Q = mcΔt = 2×4200×75 = 630 000 J.','Hiệu suất 80% ⇒ điện năng toàn phần A = Q/0,8 = 787 500 J.','Thời gian: t = A/P = 787 500/1 000 = 787,5 s ≈ 13,1 phút.','Điện năng theo kWh: 787 500/3,6.10⁶ ≈ 0,22 kWh.'],
 answer:'t ≈ 13,1 phút, A ≈ 0,22 kWh'}

,{t:7,title:'Cân bằng nhiệt có nước đá — biện luận trạng thái cuối',
 problem:'Thả 200 g nước đá ở 0 °C vào 1 kg nước ở 30 °C. Nước đá có tan hết không? Tính nhiệt độ cuối. Cho λ = 3,4.10⁵ J/kg, c = 4200 J/kg.K.',
 steps:['Nhiệt cần làm tan hết đá: Q₁ = λm = 3,4.10⁵ × 0,2 = 68 000 J.','Nhiệt nước toả khi hạ xuống 0 °C: Q₂ = mcΔt = 1×4200×30 = 126 000 J.','Q₂ > Q₁ nên đá tan hết, còn dư 58 000 J để làm ấm toàn bộ 1,2 kg nước.','Δt = Q_dư/(mc) = 58 000/(1,2×4200) ≈ 11,5 °C.'],
 answer:'Đá tan hết, nhiệt độ cuối ≈ 11,5 °C'}

,{t:7,title:'Hiệu suất bếp dầu đun nước',
 problem:'Đun 3 kg nước từ 20 °C đến 100 °C bằng bếp dầu, tiêu thụ 60 g dầu (q = 44.10⁶ J/kg). Tính hiệu suất bếp.',
 steps:['Q có ích: mcΔt = 3×4200×80 = 1 008 000 J.','Q toàn phần: q·m = 44.10⁶ × 0,06 = 2 640 000 J.','H = 1 008 000/2 640 000 ≈ 0,382.'],
 answer:'H ≈ 38%'}

,{t:11,title:'Xử lý số liệu đo tiêu cự bằng Silbermann',
 problem:'Bố trí vật – màn cách nhau L = 90 cm. Dịch thấu kính thấy hai vị trí cho ảnh rõ, cách nhau l = 30 cm. Tính tiêu cự và sai số nếu ΔL = Δl = 1 cm.',
 steps:['f = (L² − l²)/(4L) = (8 100 − 900)/360 = 20 cm.','Sai số tương đối: δf ≈ 2LΔL/(L²−l²) + 2lΔl/(L²−l²) + ΔL/L.','Thay số: 2×90/(7 200) + 2×30/(7 200) + 1/90 ≈ 0,025 + 0,0083 + 0,011 ≈ 4,4%.','Δf ≈ 0,044 × 20 ≈ 0,9 cm.'],
 answer:'f = 20 ± 0,9 cm'}

,{t:6,title:'Truyền tải điện năng — chọn hiệu điện thế',
 problem:'Cần truyền công suất 500 kW đi xa 20 km, dây có điện trở tổng 4 Ω. Hao phí cho phép không quá 2% công suất. Tìm hiệu điện thế tối thiểu.',
 steps:['Hao phí cho phép: P_hp = 2% × 500 000 = 10 000 W.','Công thức: P_hp = P²R/U² ⇒ U² = P²R/P_hp.','U² = (5.10⁵)² × 4/10⁴ = 10¹¹ × 4/10⁴ = 4.10⁷.','U = 6,32.10³ V ≈ 6,3 kV.'],
 answer:'U ≥ 6,3 kV'}

,{t:6,title:'Máy biến áp hai cấp',
 problem:'Máy tăng thế n₁ = 500 vòng, n₂ = 5 000 vòng nhận U₁ = 220 V. Cuộn thứ cấp nối vào đường dây. Tính U₂ và cường độ nếu công suất truyền đi 22 kW (bỏ qua hao phí máy).',
 steps:['U₂ = U₁·n₂/n₁ = 220 × 10 = 2 200 V.','Bỏ qua hao phí: P₁ = P₂ = 22 000 W.','I₂ = P₂/U₂ = 22 000/2 200 = 10 A.','I₁ = P₁/U₁ = 22 000/220 = 100 A — dòng sơ cấp lớn hơn 10 lần, đúng với máy tăng thế.'],
 answer:'U₂ = 2 200 V, I₂ = 10 A, I₁ = 100 A'}

,{t:1,title:'Hai vật chuyển động cùng chiều — bài toán đuổi kịp',
 problem:'Xe đạp khởi hành lúc 6h với v = 15 km/h. Xe máy khởi hành lúc 6h30 với v = 45 km/h cùng tuyến. Hỏi xe máy đuổi kịp lúc mấy giờ, cách điểm xuất phát bao xa?',
 steps:['Trong 30 phút đầu xe đạp đi được: 15 × 0,5 = 7,5 km.','Hiệu vận tốc: 45 − 15 = 30 km/h.','Thời gian đuổi: t = 7,5/30 = 0,25 h = 15 phút.','Thời điểm gặp: 6h30 + 15 phút = 6h45.','Quãng đường từ điểm xuất phát: 45 × 0,25 = 11,25 km.'],
 answer:'6h45, cách điểm xuất phát 11,25 km'}

,{t:2,title:'Vật nổi — tìm phần chìm và lực kéo',
 problem:'Khối gỗ thể tích 500 cm³, trọng lượng riêng 6 000 N/m³ nổi trong nước (10 000 N/m³). Tính thể tích phần chìm và lực cần ấn để vật chìm hoàn toàn.',
 steps:['Khi nổi: d_gỗ·V = d_nước·V_chìm ⇒ V_chìm = (6 000/10 000)×500 = 300 cm³.','Phần nổi: 200 cm³.','Khi ấn chìm hoàn toàn, lực đẩy tăng thêm: ΔF_A = d_nước·V_nổi = 10 000 × 200.10⁻⁶ = 2 N.','Vậy cần ấn với lực ít nhất 2 N.'],
 answer:'V_chìm = 300 cm³, lực ấn 2 N'}

,{t:9,title:'Màu sắc vật dưới ánh sáng màu',

/* ---------- tiny svg builders for pick tiles ---------- */
const T = inner => '<svg viewBox="0 0 120 76" class="tile-svg" aria-hidden="true">' + inner + '</svg>';
const ln = (x1, y1, x2, y2, extra) => '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + '" stroke="currentColor" stroke-width="1.3" fill="none" ' + (extra || '') + '/>';
const bx = (x, y, w, h) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
const arrowUp = (x, y, h) => '<path d="M' + x + ' ' + y + 'V' + (y - h) + '" stroke="currentColor" stroke-width="1.6"/><path d="M' + (x - 4) + ' ' + (y - h + 7) + 'l4 -7 4 7z" fill="currentColor"/>';

/* circuits: ser / par / mixA / mixB */
function circTile(kind) {
  const c = [];
  const bat = '<path d="M14 33v12M22 36v6" stroke="currentColor" stroke-width="1.5"/>';
  if (kind === 'ser') {
    c.push(ln(18, 46, 18, 22), ln(18, 22, 30, 22), bx(30, 15, 22, 14), ln(52, 22, 68, 22), bx(68, 15, 22, 14), ln(90, 22, 102, 22), ln(102, 22, 102, 46), ln(18, 46, 102, 46));
    c.push(bat);
  } else if (kind === 'par') {
    c.push(ln(18, 20, 18, 56), ln(102, 20, 102, 56), ln(18, 20, 34, 20), bx(34, 13, 24, 14), ln(58, 20, 102, 20),
      ln(18, 46, 40, 46), bx(40, 39, 24, 14), ln(64, 46, 102, 46), bat);
  } else if (kind === 'mixA') {
    c.push(ln(18, 20, 18, 56), ln(102, 20, 102, 56), ln(18, 20, 28, 20), bx(28, 13, 20, 14), ln(48, 20, 72, 20), bx(72, 13, 20, 14), ln(92, 20, 102, 20),
      ln(18, 56, 36, 56), bx(36, 49, 24, 14), ln(60, 56, 102, 56), bat);
  } else {
    c.push(ln(18, 20, 18, 56), ln(102, 20, 102, 56), ln(18, 20, 26, 20), bx(26, 13, 22, 14), ln(48, 20, 102, 20),
      ln(60, 20, 60, 24), ln(60, 24, 60, 32), bx(48, 32, 24, 14), ln(72, 32, 102, 32), ln(102, 32, 102, 56), bat);
  }
  return T(c.join(''));
}

/* lens tiles: real image / virtual (in front) / diverging / no ray */
function lensTile(kind) {
  const c = [ln(6, 38, 114, 38, 'stroke-dasharray="3 3" opacity=".55"')];
  c.push('<path d="M60 12c9 12 9 40 0 52-9-12-9-40 0-52z" fill="none" stroke="currentColor" stroke-width="1.4"/>');
  c.push('<circle cx="34" cy="38" r="1.8" fill="currentColor"/><circle cx="86" cy="38" r="1.8" fill="currentColor"/>');
  if (kind === 'real') {
    c.push(arrowUp(24, 38, 16));
    c.push('<path d="M84 38V' + 52 + '" stroke="currentColor" stroke-width="1.5"/><path d="M80 47l4 6 4-6z" fill="currentColor"/>');
    c.push(ln(24, 22, 60, 22), ln(60, 22, 96, 52), ln(24, 22, 96, 52, 'opacity=".6"'));
  } else if (kind === 'virt') {
    c.push(arrowUp(24, 38, 12));
    c.push('<path d="M40 38V' + 22 + '" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M36 27l4 -6 4 6z" fill="currentColor"/>');
    c.push(ln(24, 26, 60, 26), ln(60, 26, 104, 34), ln(40, 22, 60, 26, 'stroke-dasharray="3 3"'));
  } else if (kind === 'div') {
    c.push('<path d="M60 12c-8 12-8 40 0 52" fill="none" stroke="currentColor" stroke-width="1.4"/>');
    c.push(arrowUp(26, 38, 14));
    c.push('<path d="M44 38V' + 30 + '" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 3"/><path d="M40 34l4 -5 4 5z" fill="currentColor"/>');
    c.push(ln(26, 24, 60, 24), ln(60, 24, 104, 30), ln(44, 30, 60, 24, 'stroke-dasharray="3 3"'));
  } else {
    c.push(arrowUp(24, 38, 16), ln(24, 22, 60, 22), ln(60, 22, 100, 30));
  }
  return T(c.join(''));
}

/* buoyancy tiles */
function blockTile(state) {
  const c = ['<path d="M14 40H106" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>',
    '<rect x="34" y="' + (state === 'float' ? 30 : 20) + '" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.4"/>'];
  c.push('<path d="M51 ' + (state === 'float' ? 30 : 20) + 'V' + (state === 'float' ? 16 : 8) + '" stroke="currentColor" stroke-width="1.2"/><path d="M47 ' + (state === 'float' ? 21 : 13) + 'l4 5 4-5z" fill="currentColor"/>');
  c.push('<path d="M64 ' + (state === 'float' ? 60 : 50) + 'V' + (state === 'float' ? 66 : 60) + '" stroke="currentColor" stroke-width="1.2"/><path d="M60 ' + (state === 'float' ? 63 : 55) + 'l4 -4 4 4z" fill="currentColor"/>');
  if (state === 'equal') c.push('<path d="M96 32v12" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>');
  return T(c.join(''));
}

/* work tiles: force angle */
function forceTile(kind) {
  const c = [ln(14, 56, 106, 56, 'stroke-width="1"')];
  if (kind === 'same') {
    c.push('<rect x="34" y="34" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.3"/>');
    c.push('<path d="M60 45h30" stroke="currentColor" stroke-width="1.6"/><path d="M84 41l6 4-6 4z" fill="currentColor"/>');
  } else if (kind === 'perp') {
    c.push('<rect x="34" y="34" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.3"/>');
    c.push('<path d="M64 45h26" stroke="currentColor" stroke-width="1.2"/><path d="M84 41l6 4-6 4z" fill="currentColor"/>');
    c.push('<path d="M47 34V12" stroke="currentColor" stroke-width="1.6"/><path d="M43 18l4 -7 4 7z" fill="currentColor"/>');
  } else if (kind === 'opp') {
    c.push('<rect x="46" y="34" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.3"/>');
    c.push('<path d="M72 45h24" stroke="currentColor" stroke-width="1.2"/><path d="M90 41l6 4-6 4z" fill="currentColor"/>');
    c.push('<path d="M46 45h-24" stroke="currentColor" stroke-width="1.6"/><path d="M28 41l-6 4 6 4z" fill="currentColor"/>');
  } else {
    c.push('<rect x="34" y="34" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.3"/>');
    c.push('<path d="M60 34V18" stroke="currentColor" stroke-width="1.6"/><path d="M56 24l4 -7 4 7z" fill="currentColor"/>');
  }
  return T(c.join(''));
}

/* I–U graph tiles */
function graphTile(kind) {
  const c = ['<path d="M20 12v52h84" stroke="currentColor" stroke-width="1.2" fill="none"/>'];
  if (kind === 'linear') c.push('<path d="M20 58L98 18" stroke="currentColor" stroke-width="1.6"/>');
  if (kind === 'flat') c.push('<path d="M20 30H98" stroke="currentColor" stroke-width="1.6"/>');
  if (kind === 'curve') c.push('<path d="M20 58c30 0 50 -10 78 -44" stroke="currentColor" stroke-width="1.6" fill="none"/>');
  if (kind === 'inv') c.push('<path d="M22 16c0 30 30 38 76 42" stroke="currentColor" stroke-width="1.6" fill="none"/>');
  return T(c.join(''));
}

/* magnetic field tiles */
function magnetTile(kind) {
  const c = [bx(44, 28, 32, 20)];
  c.push('<text x="60" y="42" text-anchor="middle" font-size="9" font-family="monospace" fill="currentColor">N→S</text>');
  if (kind === 'out') {
    c.push('<path d="M40 24c-16 -8 -20 -2 -24 4" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#a)"/>');
    c.push('<path d="M80 24c16 -8 20 -2 24 4" stroke="currentColor" stroke-width="1.2" fill="none"/>');
    c.push('<path d="M96 30l6 -2-2 6z" fill="currentColor"/><path d="M24 30l-6 -2 2 6z" fill="currentColor"/>');
  } else if (kind === 'in') {
    c.push('<path d="M24 30c8 -8 12 -2 20 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M38 34l6 -2-2 6z" fill="currentColor"/>');
    c.push('<path d="M96 30c-8 -8 -12 -2 -20 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M82 34l-6 -2 2 6z" fill="currentColor"/>');
  } else if (kind === 'both') {
    c.push('<path d="M40 24c-14 -6 -18 0 -22 6" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M22 26l-4 6 6 0z" fill="currentColor"/>');
    c.push('<path d="M80 24c14 -6 18 0 22 6" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M98 26l4 6-6 0z" fill="currentColor"/>');
  } else {
    c.push('<path d="M60 28V8" stroke="currentColor" stroke-width="1.2"/><path d="M56 14l4 -7 4 7z" fill="currentColor"/>');
  }
  return T(c.join(''));
}

/* ammeter tiles */
function ammTile(kind) {
  const c = [ln(16, 20, 104, 20), ln(16, 56, 104, 56), ln(16, 20, 16, 56), ln(104, 20, 104, 56), bx(48, 13, 24, 14)];
  const meter = x => '<circle cx="' + x + '" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="' + x + '" y="23" text-anchor="middle" font-size="8" font-family="monospace" fill="currentColor">A</text>';
  if (kind === 'series') c.push(meter(88));
  if (kind === 'parallel') c.push('<path d="M88 20v14" stroke="currentColor" stroke-width="1.2"/>', meter(88));
  if (kind === 'short') c.push('<path d="M88 20h16" stroke="currentColor" stroke-width="1.2"/>', meter(112));
  if (kind === 'none') c.push('');
  return T(c.join(''));
}

{t: 4, type: "num", q: "Vật AB cao 4 cm đặt cách thấu kính hội tụ f = 10 cm một đoạn 15 cm. Chiều cao ảnh?", a: 8, tol: 0.096, unit: "cm", e: "d′ = 30 cm; |k| = d′/d = 2 ⇒ ảnh cao 8 cm, ngược chiều."},
{t: 5, type: "num", q: "Đặt 12 V vào hai đầu điện trở 20 Ω. Cường độ dòng điện?", a: 0.6, tol: 0.02, unit: "A", e: "I = U/R = 12/20 = 0,6 A."},
{t: 5, type: "num", q: "Hai điện trở 10 Ω và 15 Ω mắc song song. Điện trở tương đương?", a: 6.0, tol: 0.072, unit: "Ω", e: "R = 10·15/(10+15) = 150/25 = 6 Ω, nhỏ hơn cả hai điện trở thành phần."},
{t: 5, type: "num", q: "Hai điện trở 6 Ω và 12 Ω mắc nối tiếp, đặt vào hiệu điện thế 9 V. Cường độ dòng điện?", a: 0.5, tol: 0.02, unit: "A", e: "R = 18 Ω ⇒ I = 9/18 = 0,5 A, dòng như nhau qua cả hai."},
{t: 5, type: "num", q: "Dây dẫn dài 100 m, tiết diện 0,5 mm², điện trở suất 1,7·10⁻⁸ Ω·m. Điện trở dây?", a: 3.4, tol: 0.0408, unit: "Ω", e: "R = ρl/S = 1,7·10⁻⁸ × 100 / (0,5·10⁻⁶) = 3,4 Ω."},
{t: 5, type: "tf", q: "Trong đoạn mạch nối tiếp, hiệu điện thế giữa hai đầu mỗi điện trở tỉ lệ thuận với điện trở đó.", a: true, e: "U₁/U₂ = R₁/R₂ vì dòng điện bằng nhau."},
{t: 5, type: "mcq", q: "Đèn ghi 6 V – 3 W. Điện trở của đèn khi sáng bình thường là", o: ["2 Ω", "3 Ω", "12 Ω", "18 Ω"], a: 2, e: "R = U²/P = 36/3 = 12 Ω; dòng định mức I = P/U = 0,5 A."},
{t: 5, type: "num", q: "Ba điện trở 3 Ω giống nhau mắc song song. Điện trở tương đương?", a: 1, tol: 0.02, unit: "Ω", e: "R = R/3 = 1 Ω."},
{t: 6, type: "num", q: "R₁ = 10 Ω nối tiếp với cụm (R₂ = 20 Ω song song R₃ = 20 Ω). Điện trở tương đương?", a: 20, tol: 0.24, unit: "Ω", e: "Cụm song song = 20/2 = 10 Ω; cộng R₁ thành 20 Ω."},
{t: 6, type: "num", q: "Bếp điện 220 V – 484 Ω. Công suất tiêu thụ ở đúng hiệu điện thế 220 V?", a: 100.0, tol: 1.2, unit: "W", e: "P = U²/R = 48 400/484 = 100 W."},
{t: 6, type: "num", q: "Bóng 100 W dùng 5 giờ mỗi ngày trong 30 ngày. Điện năng tiêu thụ?", a: 15.0, tol: 0.18, unit: "kWh", e: "0,1 kW × 5 h × 30 ngày = 15 kWh."},
{t: 6, type: "num", q: "Mạch cầu cân bằng có R₁ = 6 Ω, R₂ = 9 Ω, R₃ = 8 Ω. R₄ bằng bao nhiêu?", a: 12.0, tol: 0.144, unit: "Ω", e: "Cân bằng: R₁/R₂ = R₃/R₄ ⇒ R₄ = R₂R₃/R₁ = 9·8/6 = 12 Ω."},
{t: 6, type: "tf", q: "Công suất toả nhiệt trên một điện trở có thể viết là P = I²R hoặc P = U²/R.", a: true, e: "Hai dạng tương đương nhau nhờ U = IR; chọn dạng nào tiện với dữ kiện đã cho."},
{t: 6, type: "mcq", q: "Biến trở R mắc nối tiếp với nguồn có điện trở trong r. Công suất trên biến trở lớn nhất khi", o: ["R rất lớn", "R = 0", "R = r", "R = 2r"], a: 2, e: "P = E²R/(R+r)² đạt cực đại khi R = r, giá trị E²/(4r)."},
{t: 6, type: "num", q: "Truyền công suất 100 kW đi xa bằng đường dây có R = 10 Ω, hiệu điện thế 10 kV. Công suất hao phí?", a: 1000.0, tol: 12.0, unit: "W", e: "P_hp = P²R/U² = (10⁵)²·10/(10⁴)² = 1 000 W, tức 1%."},
{t: 7, type: "num", q: "Đun 2 kg nước tăng thêm 30 °C (c = 4200 J/kg·K). Nhiệt lượng cần?", a: 252000, tol: 3024.0, unit: "J", e: "Q = mcΔt = 2 × 4200 × 30 = 252 000 J = 252 kJ."},
{t: 7, type: "num", q: "Trộn 1 kg nước 80 °C với 2 kg nước 20 °C. Nhiệt độ cân bằng?", a: 40.0, tol: 0.48, unit: "°C", e: "t = (m₁t₁ + m₂t₂)/(m₁+m₂) = (80 + 40)/3 = 40 °C."},
{t: 7, type: "num", q: "Đốt 0,2 kg dầu, năng suất toả nhiệt 44·10⁶ J/kg. Nhiệt lượng toả ra?", a: 8.8, tol: 0.1056, unit: "MJ", e: "Q = q·m = 44·10⁶ × 0,2 = 8,8·10⁶ J = 8,8 MJ."},
{t: 7, type: "num", q: "Đun 2 kg nước từ 20 °C đến 100 °C cần 672 kJ, bếp toả 800 kJ. Hiệu suất bếp?", a: 84.0, tol: 1.008, unit: "%", e: "Q_có ích = 2·4200·80 = 672 000 J; H = 672/800 = 84%."},
{t: 7, type: "tf", q: "Nhiệt lượng vật thu vào phụ thuộc khối lượng, độ tăng nhiệt độ và chất làm vật.", a: true, e: "Q = mcΔt: c đặc trưng cho chất, m và Δt là hai yếu tố còn lại."},
{t: 7, type: "num", q: "Bếp điện 1000 W đun nước 7 phút. Điện năng chuyển thành nhiệt?", a: 420.0, tol: 5.04, unit: "kJ", e: "Q = P·t = 1000 × 420 s = 420 000 J = 420 kJ."},
{t: 7, type: "mcq", q: "Trong suốt quá trình nóng chảy của nước đá, nhiệt độ của nó", o: ["Tăng dần", "Giảm dần", "Không đổi", "Tăng rồi giảm"], a: 2, e: "Nhiệt lượng nhận vào dùng để phá vỡ cấu trúc tinh thể, nhiệt độ giữ ở 0 °C."},
{t: 8, type: "num", q: "Vật cách gương phẳng 40 cm. Ảnh cách vật bao nhiêu?", a: 80, tol: 0.96, unit: "cm", e: "Ảnh đối xứng qua gương nên cách gương 40 cm, cách vật 80 cm."},
{t: 8, type: "mcq", q: "Ảnh của vật qua gương phẳng là", o: ["Ảnh thật, ngược chiều", "Ảnh ảo, cùng chiều, bằng vật", "Ảnh ảo, nhỏ hơn vật", "Ảnh thật, lớn hơn vật"], a: 1, e: "Ảnh ảo đối xứng, cùng chiều, cùng kích thước, không hứng được trên màn."},
{t: 8, type: "num", q: "Thấu kính phân kì f = 20 cm, vật cách 30 cm. Ảnh ảo cách kính bao nhiêu?", a: 12.0, tol: 0.144, unit: "cm", e: "1/d′ = 1/f − 1/d với f = −20 ⇒ |d′| = df/(d+f) = 30·20/50 = 12 cm, cùng phía vật."},
{t: 8, type: "tf", q: "Ảnh của một vật qua gương phẳng có thể hứng được trên màn chắn.", a: false, e: "Ảnh là ảnh ảo: chùm tia phản xạ không hội tụ thật, đặt màn không thu được ảnh."},
{t: 8, type: "num", q: "Ánh sáng truyền trong môi trường có vận tốc 2·10⁸ m/s. Chiết suất của môi trường?", a: 1.5, tol: 0.02, unit: "", e: "n = c/v = 3·10⁸/2·10⁸ = 1,5, cỡ của thuỷ tinh."},
{t: 8, type: "mcq", q: "Chiếu tia sáng tới gương phẳng với góc tới 30°. Góc hợp bởi tia tới và tia phản xạ là", o: ["30°", "60°", "90°", "120°"], a: 1, e: "Góc phản xạ bằng góc tới 30°, hai tia nằm hai bên pháp tuyến ⇒ góc giữa chúng là 60°."},
{t: 9, type: "mcq", q: "Trộn ánh sáng đỏ với ánh sáng lục ta được ánh sáng", o: ["Trắng", "Vàng", "Xanh lam", "Đen"], a: 1, e: "Trộn hai ánh sáng màu với nhau cho màu khác; đỏ + lục cho vàng."},
{t: 9, type: "tf", q: "Vật màu đỏ tán xạ tốt ánh sáng đỏ và tán xạ kém các ánh sáng màu khác.", a: true, e: "Đó là lý do đặt vật đỏ dưới ánh sáng xanh thì vật gần như đen."},
{t: 9, type: "mcq", q: "Nhìn một tờ giấy trắng qua kính lọc màu đỏ, ta thấy tờ giấy", o: ["Trắng", "Đỏ", "Đen", "Xanh"], a: 1, e: "Kính lọc chỉ cho ánh sáng đỏ đi qua; giấy trắng tán xạ đủ màu nên phần lọt qua là đỏ."},
{t: 9, type: "num", q: "Chiếu tia sáng từ không khí vào nước, góc tới 45°, góc khúc xạ 32°. Góc lệch giữa tia tới và tia khúc xạ?", a: 13, tol: 0.156, unit: "°", e: "Tia khúc xạ gãy về phía pháp tuyến nên lệch góc 45° − 32° = 13°."},
{t: 9, type: "tf", q: "Ánh sáng trắng là hỗn hợp của nhiều ánh sáng đơn sắc có màu biến thiên liên tục từ đỏ đến tím.", a: true, e: "Đó là kết luận từ thí nghiệm tán sắc của Newton qua lăng kính."},
{t: 10, type: "num", q: "Máy biến áp có N₁ = 1000 vòng, N₂ = 5000 vòng, đặt vào cuộn sơ cấp 220 V. Hiệu điện thế thứ cấp?", a: 1100, tol: 13.2, unit: "V", e: "U₂/U₁ = N₂/N₁ = 5 ⇒ U₂ = 1 100 V (máy tăng áp)."},
{t: 10, type: "num", q: "Máy biến áp lý tưởng: U₁ = 220 V, U₂ = 1100 V, dòng sơ cấp 10 A. Dòng thứ cấp?", a: 2.0, tol: 0.024, unit: "A", e: "P không đổi: U₁I₁ = U₂I₂ ⇒ I₂ = 2200/1100 = 2 A."},
{t: 10, type: "mcq", q: "Dòng điện xoay chiều là dòng điện", o: ["Có chiều không đổi", "Có cường độ không đổi", "Luôn đổi chiều theo chu kì", "Chỉ chạy một chiều"], a: 2, e: "Chiều và cường độ biến thiên tuần hoàn theo thời gian, ở lưới điện Việt Nam 50 Hz."},
{t: 10, type: "tf", q: "Máy phát điện xoay chiều hoạt động dựa trên hiện tượng cảm ứng điện từ.", a: true, e: "Cuộn dây quay trong từ trường khiến số đường sức qua nó biến thiên, sinh suất điện động cảm ứng."},
{t: 10, type: "mcq", q: "Muốn tăng lực từ của nam châm điện, ta", o: ["Giảm số vòng dây", "Tăng cường độ dòng điện", "Đổi chiều dòng điện", "Dùng lõi nhựa thay lõi sắt"], a: 1, e: "Tăng I hoặc tăng số vòng dây đều làm từ trường mạnh hơn; đổi chiều chỉ đổi cực."},
{t: 10, type: "num", q: "Cùng công suất truyền đi, nếu tăng hiệu điện thế đường dây lên 10 lần thì công suất hao phí giảm bao nhiêu lần?", a: 100, tol: 1.2, unit: "lần", e: "P_hp ~ 1/U² nên tăng U 10 lần thì hao phí giảm 100 lần."},
{t: 11, type: "num", q: "Thí nghiệm đo điện trở: vôn kế chỉ 6,0 V, ampe kế chỉ 0,5 A. R bằng bao nhiêu?", a: 12.0, tol: 0.144, unit: "Ω", e: "R = U/I = 6,0/0,5 = 12 Ω. Sai số lấy theo nửa vạch chia nhỏ nhất của mỗi đồng hồ."},
{t: 11, type: "mcq", q: "Để đo điện trở bằng vôn kế và ampe kế, cách mắc đúng là", o: ["Ampe kế song song, vôn kế nối tiếp", "Cả hai nối tiếp với R", "Ampe kế nối tiếp, vôn kế song song với R", "Cả hai song song với R"], a: 2, e: "Ampe kế phải nối tiếp để đo dòng qua R; vôn kế song song để đo đúng hiệu điện thế hai đầu R."},
{t: 11, type: "num", q: "Thí nghiệm đo tiêu cự: vật cách thấu kính 30 cm, màn cách 15 cm cho ảnh rõ. Tiêu cự?", a: 10.0, tol: 0.12, unit: "cm", e: "1/f = 1/30 + 1/15 = 1/10 ⇒ f = 10 cm."},
{t: 11, type: "num", q: "Treo vật vào lực kế: ngoài không khí 5,4 N, ngập trong nước 3,24 N. Khối lượng riêng của vật? (d_nước = 10 000 N/m³)", a: 2500, tol: 30.0, unit: "kg/m³", e: "F_A = 2,16 N ⇒ V = 2,16/10 000 = 2,16·10⁻⁴ m³; m = 0,54 kg ⇒ D = 0,54/2,16·10⁻⁴ = 2 500 kg/m³."},
{t: 11, type: "tf", q: "Trong thí nghiệm đo điện trở, phải thay đổi con chạy biến trở để lấy nhiều cặp số liệu rồi mới kết luận.", a: true, e: "Một cặp số liệu không cho biết sai số; nhiều điểm và đồ thị I–U mới đánh giá được kết quả."},
{t: 11, type: "mcq", q: "Khi đọc số chỉ trên đồng hồ kim, sai số thường lấy bằng", o: ["Cả vạch chia nhỏ nhất", "Nửa vạch chia nhỏ nhất", "Hai vạch chia nhỏ nhất", "Không cần sai số"], a: 1, e: "Mắt chỉ phân biệt được khoảng nửa vạch, nên sai số đọc là nửa độ chia nhỏ nhất."},
{t: 11, type: "order", q: "Sắp xếp đúng trình tự thí nghiệm đo tiêu cự thấu kính hội tụ.", s: ["Bố trí nến, thấu kính, màn trên giá quang học thẳng hàng", "Đặt vật ngoài 2f, dịch màn đến khi ảnh rõ nét nhất", "Đọc và ghi d, d′ vào bảng", "Lặp lại với ba vị trí vật khác nhau", "Tính f cho từng lần rồi lấy trung bình"], e: "Phải căn thẳng hàng trước, sau đó mới dịch màn; ba lần đo để giảm sai số ngẫu nhiên."},
{t: 11, type: "order", q: "Sắp xếp các bước đo khối lượng riêng của một vật rắn bằng lực kế.", s: ["Treo vật vào lực kế, đọc trọng lượng P trong không khí", "Nhúng vật ngập hoàn toàn trong nước, đọc F", "Tính F_A = P − F, suy ra thể tích V = F_A/d_nước", "Tính khối lượng m = P/10 rồi D = m/V"], e: "Thứ tự này tránh phải đo thể tích bằng bình chia độ khi vật không lọt bình."},
{t: 12, type: "num", q: "R₁ = 4 Ω nối tiếp với (R₂ = 6 Ω song song R₃ = 3 Ω), U = 12 V. Cường độ dòng mạch chính?", a: 2.0, tol: 0.024, unit: "A", e: "Cụm song song = 6·3/9 = 2 Ω; R = 6 Ω ⇒ I = 2 A."},
{t: 12, type: "num", q: "Vật 0,5 kg ở độ cao 2 m (g = 10 m/s²). Thế năng trọng trường?", a: 10.0, tol: 0.12, unit: "J", e: "W_t = mgh = 0,5·10·2 = 10 J, chọn mốc tại mặt đất."},
{t: 12, type: "num", q: "Nhiệt lượng để 0,5 kg nước tăng 20 °C (c = 4200 J/kg·K)?", a: 42.0, tol: 0.504, unit: "kJ", e: "Q = 0,5 × 4200 × 20 = 42 000 J = 42 kJ."},
{t: 12, type: "tf", q: "Điện trở tương đương của đoạn mạch song song luôn nhỏ hơn điện trở nhỏ nhất trong đoạn.", a: true, e: "Vì có thêm đường cho dòng điện đi, R giảm so với từng nhánh."},
{t: 12, type: "num", q: "Thấu kính hội tụ f = 12 cm, vật cách 36 cm. Ảnh cách kính?", a: 18.0, tol: 0.216, unit: "cm", e: "d′ = df/(d−f) = 36·12/24 = 18 cm; ảnh thật, ngược chiều, cao bằng nửa vật."},
{t: 12, type: "mcq", q: "Đơn vị nào KHÔNG phải của công suất?", o: ["W", "J/s", "kW", "J·s"], a: 3, e: "Công suất = công/thời gian nên đơn vị là J/s = W; J·s là đơn vị của một đại lượng khác (tác dụng của dòng điện)."},
{t: 12, type: "num", q: "Một bóng đèn 220 V – 60 W sáng bình thường. Điện trở của đèn?", a: 806.6667, tol: 9.68, unit: "Ω", e: "R = U²/P = 48 400/60 ≈ 806,7 Ω."}
];

const QA_EXTRA4 = [
{t: 1, q: "Vì sao trên cùng một quãng đường, vận tốc trung bình không bằng trung bình cộng hai vận tốc?", k: "van toc trung binh|trung binh cong|sai lam|hai nua quang duong", a: "Vì thời gian hai chặng khác nhau: chặng nhanh mất ít thời gian nên ít ảnh hưởng. Dùng <code>v<sub>tb</sub> = 2v₁v₂/(v₁+v₂)</code> cho hai nửa quãng đường bằng nhau."},
{t: 1, q: "Khi nào dùng công thức cộng vận tốc dạng cộng và khi nào dùng dạng trừ?", k: "cong van toc|thuyen|dong nuoc|xuoi|nguoc|dau", a: "Xuôi chiều (thuyền − nước, người − thang cuốn) thì cộng; ngược chiều thì trừ. Luôn cộng dạng vectơ: <code>v⃗<sub>13</sub> = v⃗<sub>12</sub> + v⃗<sub>23</sub></code>, rồi mới xét dấu."},
{t: 2, q: "Đặt vật lên cân trong thang máy đang đi lên nhanh dần, số chỉ thay đổi thế nào?", k: "can|thang may|trong luong bieu kien|nhanh dan|cham dan", a: "Số chỉ tăng, vì cân phải tác dụng lực lớn hơn trọng lượng để tạo gia tốc hướng lên: <code>N = m(g + a)</code>. Đi xuống nhanh dần thì số chỉ giảm."},
{t: 2, q: "Tại sao tàu thuỷ bằng thép nặng vẫn nổi?", k: "tau thuy|thep|noi|the tich chiem cho|trong luong rieng trung binh", a: "Vì toàn bộ thân tàu là một khối rỗng chiếm thể tích nước rất lớn. Trọng lượng riêng trung bình của cả tàu (kể cả khoang khí) nhỏ hơn của nước."},
{t: 3, q: "Công suất ghi trên máy có phải là công suất thực tế máy luôn sinh ra không?", k: "cong suat dinh muc|thuc te|hao phi|hieu suat", a: "Không. Đó là công suất định mức. Công suất thực tế nhỏ hơn vì hao phí: <code>P<sub>thực</sub> = H·P<sub>định mức</sub></code>."},
{t: 3, q: "Tại sao đi bộ đường dài lại mệt hơn đi trên cùng quãng đường bằng phẳng ngắn hơn?", k: "cong|cong can|ma sat|nang luong|met", a: "Cơ thể vẫn phải sinh công để thắng ma sát và nâng hạ trọng tâm. Cùng độ cao nhưng đường dài hơn ⇒ công của lực cản lớn hơn, năng lượng phải cung cấp nhiều hơn."},
{t: 4, q: "Vì sao khi chụp ảnh phải lấy nét?", k: "may anh|lay net|tieu cu|anh that|man", a: "Vì phim/cảm biến đóng vai trò cái màn cố định, muốn ảnh rõ thì phải dịch thấu kính để ảnh rơi đúng mặt phẳng cảm biến — tức thay đổi d′."},
{t: 4, q: "Ảnh ảo của thấu kính hội tụ có hứng được trên màn không, vì sao vẫn nhìn thấy?", k: "anh ao|hung man|nhin thay|thau kinh hoi tu", a: "Không hứng được vì các tia ló phân kì. Nhưng mắt đặt phía sau thấu kính vẫn nhận được chùm phân kì đó và “kéo dài” chúng về phía trước để thấy ảnh."},
{t: 5, q: "Vì sao ampe kế phải mắc nối tiếp và có điện trở rất nhỏ?", k: "ampe ke|noi tiep|dien tro nho|sai so", a: "Mắc nối tiếp để dòng cần đo chạy qua nó. Điện trở phải nhỏ để không làm thay đổi dòng điện của mạch, nếu không số đo sai."},

{t: 6, q: "Khi hai đèn mắc nối tiếp, đèn nào sáng hơn?", k: "hai den|noi tiep|sang hon|cong suat|dien tro", a: "Đèn có điện trở lớn hơn sáng hơn vì cùng dòng: <code>P = I²R</code>. Mắc song song thì ngược lại — đèn có điện trở nhỏ hơn sáng hơn do <code>P = U²/R</code>."},

{t: 7, q: "Vì sao nước đá đang tan lại ở 0 °C dù vẫn nhận nhiệt?", k: "nuoc da|tan|0 do|nong chay|nhiet do khong doi", a: "Nhiệt lượng nhận vào dùng để phá vỡ liên kết tinh thể chứ không làm tăng động năng trung bình của phân tử, nên nhiệt độ không đổi."},
{t: 7, q: "Vì sao ban ngày ở biển gió thổi từ biển vào đất liền?", k: "gio bien|doi luu|nhiet dung rieng|ban ngay", a: "Đất nóng nhanh hơn nước nên không khí trên đất bốc lên, không khí mát từ biển tràn vào thay chỗ. Ban đêm thì đảo chiều."},

{t: 10, q: "Vì sao máy biến áp không dùng được với dòng điện một chiều?", k: "may bien ap|mot chieu|xoat chieu|cam ung|tu thong bien thien", a: "Cần từ thông biến thiên mới có suất điện động cảm ứng. Dòng một chiều cho từ thông không đổi nên cuộn thứ cấp không có điện áp."},

{t: 11, q: "Vì sao phải mắc vôn kế song song đúng hai đầu điện trở cần đo, không phải hai đầu cả mạch?", k: "von ke|do dien tro|hai dau|sai|noi tiep", a: "Vì R = U/I phải dùng đúng U của chính điện trở đó. Mắc sang hai đầu cả mạch sẽ cộng thêm hiệu điện thế trên ampe kế và dây nối, kết quả sai."},

{t: 12, q: "Vì sao phải ghi đơn vị ngay trong bước tính?", k: "don vi|trinh bay|bai thi|sai don vi|diem", a: "Đơn vị là một phần của kết quả; ghi đúng đơn vị vừa cho điểm trình bày, vừa giúp phát hiện lỗi đổi đơn vị — lỗi làm mất điểm nhiều nhất trong bài điện và nhiệt."},

{t: 6, q: "Vì sao khi mắc thêm một bóng đèn song song, các đèn còn lại tối đi?", k: "mac them|song song|toi di|dien tro trong|sut ap", a: "Vì dòng tổng tăng, hiệu điện thế rơi trên điện trở trong và dây dẫn tăng, nên hiệu điện thế đặt vào các đèn giảm."}

{t: 11, title: "Đo tiêu cự bằng phương pháp Bessel (vật – màn cố định)", problem: "Giữ vật và màn cách nhau L = 90 cm. Dịch thấu kính hội tụ giữa chúng, thấy có hai vị trí cho ảnh rõ nét, hai vị trí cách nhau 30 cm. Tính tiêu cự thấu kính.", steps: ["Gọi d là khoảng cách vật – thấu kính ở một vị trí cho ảnh rõ, thì d + d′ = L.", "Từ 1/f = 1/d + 1/d′ với d′ = L − d, rút ra phương trình bậc hai: d² − Ld + Lf = 0.", "Phương trình có hai nghiệm d₁, d₂ thoả d₁ + d₂ = L và d₁d₂ = Lf.", "Hiệu hai nghiệm chính là khoảng cách hai vị trí thấu kính: Δ = |d₁ − d₂| = 30 cm.", "Bình phương: Δ² = L² − 4Lf ⇒ f = (L² − Δ²)/(4L) = (8100 − 900)/360 = 20 cm.", "Kiểm tra: với f = 20 cm, L = 90 cm thì hai nghiệm d = 60 cm và 30 cm, cách nhau đúng 30 cm."], answer: "f = 20 cm"},

<script>
/* ===== ỨNG DỤNG ===== */
/* phiên bản — sinh từ src/build.py */
const APP_VERSION = '10.1';
/* =========================================================
   KHO LƯU BỀN — không phụ thuộc cache
   4 tầng:
     1. localStorage  : bản chính (đọc tức thì, đồng bộ)
     2. IndexedDB     : bản sao + LỊCH SỬ 20 phiên bản có giờ
     3. Cookie        : cấu hình + tiến độ gọn (sống qua cả khi xoá site data)
     4. Tệp .json     : người dùng tự tải về / nhập lại
   Ghi xoay vòng 3 bản dự phòng trong localStorage để hỏng 1 bản vẫn còn.
   ========================================================= */
const APP_KEY = 'vnl9.v2';
const BAK_KEYS = ['vnl9.b1', 'vnl9.b2', 'vnl9.b3'];
const PREFS_KEY = 'vnl9.prefs';
const JOURNAL_N = 20;
const COOKIE = 'vnl9core';

const AppStore = (() => {
  let db = null, dbReady = null, lastWrite = 0, pending = null, cookieT = 0;

  /* ---------- cookie ---------- */
  function setCookie(name, val, days) {
    try {
      const d = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = name + '=' + encodeURIComponent(val) + '; expires=' + d + '; path=/; SameSite=Lax';
    } catch (e) {}
  }
  function getCookie(name) {
    try {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    } catch (e) { return null; }
  }

  /* ---------- bản gọn để nhét vừa cookie 4 KB ---------- */
  function core(st) {
    const done = Object.keys(st.done || {}).filter(k => st.done[k]).join(',');
    return {
      v: 1,
      at: Date.now(),
      prefs: st.prefs || {},
      pomo: st.pomoCfg || {},
      goal: st.goal || 20,
      streak: st.days ? Object.keys(st.days).length : 0,
      days: st.done ? Object.keys(st.done).length : 0,
      done: done.slice(0, 1400),
      last: st.last || null
    };
  }

  /* ---------- IndexedDB ---------- */
  function openDB() {
    if (dbReady) return dbReady;
    dbReady = new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      let req;
      try { req = indexedDB.open('vnl9', 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('journal')) d.createObjectStore('journal', { keyPath: 'at' });
      };
      req.onsuccess = () => { db = req.result; res(db); };
      req.onerror = () => res(null);
      setTimeout(() => res(db), 1200);
    });
    return dbReady;
  }
  function idbPut(store, val, key) {
    openDB().then(d => {
      if (!d) return;
      try {
        const tx = d.transaction(store, 'readwrite');
        const os = tx.objectStore(store);
        if (key === undefined) os.put(val);
        else os.put(val, key);
      } catch (e) {}
    });
  }
  function idbGet(store, key) {
    return openDB().then(d => new Promise(res => {
      if (!d) return res(null);
      try {
        const req = d.transaction(store, 'readonly').objectStore(store).get(key);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      } catch (e) { res(null); }
    }));
  }
  function idbAll(store) {
    return openDB().then(d => new Promise(res => {
      if (!d) return res([]);
      try {
        const req = d.transaction(store, 'readonly').objectStore(store).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      } catch (e) { res([]); }
    }));
  }
  function idbClear(store) {
    openDB().then(d => {
      if (!d) return;
      try { d.transaction(store, 'readwrite').objectStore(store).clear(); } catch (e) {}
    });
  }

  /* ---------- ghi ---------- */
  function write(state, opts) {
    opts = opts || {};
    const now = Date.now();
    let raw;
    try { raw = JSON.stringify(state); } catch (e) { return; }

    /* localStorage: bản chính + xoay vòng 3 bản dự phòng (mỗi 20 giây)
       Phải ĐỌC bản cũ TRƯỚC khi ghi đè, nếu không cả 3 bản dự phòng sẽ
       trỏ về cùng một nội dung mới và lưới an toàn coi như không có. */
    try {
      const prev = localStorage.getItem(APP_KEY);
      if (now - lastWrite > 20000 && prev && prev !== raw) {
        lastWrite = now;
        /* đẩy chuỗi bản cũ xuống: b1 ← b2, b0 ← b1, b0 ← prev */
        const old0 = localStorage.getItem(BAK_KEYS[0]);
        const old1 = localStorage.getItem(BAK_KEYS[1]);
        if (old0) localStorage.setItem(BAK_KEYS[1], old0);
        if (old1) localStorage.setItem(BAK_KEYS[2], old1);
        localStorage.setItem(BAK_KEYS[0], prev);
      }
      localStorage.setItem(APP_KEY, raw);
    } catch (e) {}

    /* cookie: phần lõi, chỉ ghi mỗi 4 giây */
    if (now - cookieT > 4000 || opts.force) {
      cookieT = now;
      try { setCookie(COOKIE, JSON.stringify(core(state)), 400); } catch (e) {}
    }

    /* IndexedDB: bản sao + lịch sử (gộp 60 giây/lần để không phình) */
    clearTimeout(pending);
    pending = setTimeout(() => {
      idbPut('kv', raw, 'state');
      if (now - (write._lastJournal || 0) > 60000 || opts.force) {
        write._lastJournal = now;
        idbPut('journal', { at: now, raw, note: opts.note || 'tự động' });
        idbAll('journal').then(rows => {
          rows.sort((a, b) => a.at - b.at);
          while (rows.length > JOURNAL_N) idbClear('journal').then(() => {
            rows.slice(-JOURNAL_N).forEach(r => idbPut('journal', r));
          });
        });
      }
    }, 400);
  }

  /* ---------- đọc ---------- */
  function parse(raw) {
    try { const o = JSON.parse(raw); return o && typeof o === 'object' ? o : null; }
    catch (e) { return null; }
  }
  function readSync() {
    let main = parse(localStorage.getItem(APP_KEY));
    if (main) return { data: main, from: 'máy này' };
    for (let i = 0; i < BAK_KEYS.length; i++) {
      const b = parse(localStorage.getItem(BAK_KEYS[i]));
      if (b) return { data: b, from: 'bản dự phòng ' + (i + 1) };
    }
    const c = parse(getCookie(COOKIE));
    if (c) return { data: c, from: 'cookie', partial: true };
    return { data: null, from: 'trống' };
  }
  function readAsync() {
    return idbGet('kv', 'state').then(raw => parse(raw));
  }
  function journal() { return idbAll('journal'); }

  function backupNow(state, note) { write(state, { force: true, note: note || 'thủ công' }); }

  function exportFile(state) {
    const blob = new Blob([JSON.stringify({ app: 'vat-li-9', v: 1, at: Date.now(), state }, null, 1)],
      { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = 'vat-li-9-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function importText(txt) {
    const o = parse(txt);
    if (!o) return null;
    const s = o.state || o;
    if (!s || typeof s !== 'object' || (!s.ans && !s.done && !s.prefs)) return null;
    return s;
  }

  function status() {
    let ls = 0, bak = 0;
    try { ls = (localStorage.getItem(APP_KEY) || '').length; } catch (e) {}
    try { bak = BAK_KEYS.map(k => (localStorage.getItem(k) || '').length).filter(Boolean).length; } catch (e) {}
    const ck = getCookie(COOKIE);
    return { ls, bak, cookie: ck ? ck.length : 0, idb: !!db };
  }

  function clearAll() {
    try { [APP_KEY].concat(BAK_KEYS).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    setCookie(COOKIE, '', -1);
    idbClear('kv'); idbClear('journal');
  }

  /* ghi nốt khi rời trang */
  window.addEventListener('pagehide', () => { if (write._state) write(write._state, { force: true, note: 'rời trang' }); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && write._state) write(write._state, { force: true, note: 'ẩn tab' });
  });

  return { write, readSync, readAsync, journal, backupNow, exportFile, importText, status, clearAll, core,
    remember: s => { write._state = s; } };
})();

/* =========================================================
   SEARCH
========================================================= */
function searchAll(q){
  const k=toks(q); if(!k.length) return [];
  const hit=(txt)=>{const t=norm(txt);return k.every(w=>t.includes(w));};
  const score=(txt)=>{const t=norm(txt);let s=0;k.forEach(w=>{if(t.includes(w))s++;});return s;};
  const out=[];
  DAYS.forEach(d=>d.sessions.forEach(s=>{
    if(hit(s.title+' '+s.obj+' '+d.title)) out.push({g:'Bài học',t:s.title,d:`Ngày ${String(d.n).padStart(2,'0')} · Ca ${s.n}`,href:sessionHref(d.n,s.n),sc:score(s.title+' '+s.obj)*2});
  }));
  Object.entries(LIB).forEach(([id,v])=>{
    if(hit(v.t+' '+(WHO[v.who]||''))) out.push({g:'Bài giảng',t:v.t,d:v.d,href:'#/vid/'+id,sc:score(v.t)});
  });
  QA.forEach((x,i)=>{
    if(hit(x.q+' '+x.k)) out.push({g:'Hỏi đáp',t:x.q,d:'',href:'#/qa?q='+encodeURIComponent(x.q),sc:score(x.q)*1.5});
  });
  NOTES.forEach(n=>n.rows.forEach(([a,b])=>{
    if(hit(a+' '+b.replace(/<[^>]+>/g,' '))) out.push({g:'Công thức',t:a,d:b.replace(/<[^>]+>/g,''),href:'#/notes?q='+encodeURIComponent(a),sc:score(a)});
  }));
  return out.sort((a,b)=>b.sc-a.sc).slice(0,14);
}

/* =========================================================
   Q&A ENGINE
========================================================= */
const QA_IDX=QA.map(x=>({x,set:new Set(norm(x.q+' '+x.k).split(' '))}));
const QA_DF=(()=>{const d={};QA_IDX.forEach(o=>o.set.forEach(w=>d[w]=(d[w]||0)+1));return d;})();

function askQA(query, topic){
  const raw=toks(query);
  if(!raw.length) return [];
  // bỏ những từ quá phổ biến (xuất hiện ở >22% câu) để tránh khớp rác
  const rare=raw.filter(w=>!QA_DF[w]||QA_DF[w]<=QA.length*0.22);
  const use=rare.length?rare:raw;
  const qn=norm(query);
  const scored=QA_IDX.map(o=>{
    let hit=0;
    use.forEach(w=>{ if(o.set.has(w)) hit++; });
    const frac=hit/use.length;
    if(!hit) return {x:o.x,s:-1};
    let s=frac*10+hit*0.4;
    if(topic&&o.x.t===topic) s+=0.9;
    if(qn.length>3&&norm(o.x.q).includes(qn)) s+=6;
    return {x:o.x,s,frac};
  }).filter(o=>o.s>=0&&o.frac>=0.5).sort((a,b)=>b.s-a.s);
  return scored.slice(0,3).map(o=>o.x);
}
