.tt-tab:hover{border-color:var(--ink-2);color:var(--ink)}
.tt-tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tt-tab.add{font-size:12px;padding:4px 9px}
.tt-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--card);padding:0}
.tt-grid{display:grid;grid-template-columns:var(--cols);min-width:680px}
.tt-corner,.tt-dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:7px 4px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--paper)}
.tt-corner span{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tt-dh b{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink)}
.tt-dh span{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tt-dh.first{border-left:0}
.tt-sess{grid-column:1/-1;background:var(--paper);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:var(--micro);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 8px}
.tt-srow{height:0;border-bottom:0}
.tt-time{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper);
  font-family:var(--mono);font-size:9px;color:var(--ink-3);cursor:pointer;padding:8px 0}
.tt-time:hover{color:var(--accent)}
.tt-cell{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--card);
  min-height:52px;padding:5px 6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;
  align-items:flex-start;justify-content:center;transition:background .12s}
.tt-cell.empty i{font-style:normal;color:var(--rule-2);font-size:12px;margin:0 auto;opacity:0;transition:opacity .12s}
.tt-cell.empty:hover i{opacity:1;color:var(--accent)}
.tt-cell.empty:hover{background:var(--paper)}
.tt-cell.filled{background:var(--cb);border-left:3px solid var(--cd)}
.tt-cell.filled b{font-family:var(--serif);font-size:12.5px;font-weight:500;color:var(--cf);line-height:1.2}
.tt-cell.filled i{font-style:normal;font-size:var(--micro);color:var(--cf);opacity:.78;line-height:1.2}
.tt-cell.filled u{text-decoration:none;font-family:var(--mono);font-size:var(--micro);color:var(--cf);opacity:.62}
.tt-cell.filled:hover{filter:brightness(.97)}
[data-theme="graphite"] .tt-cell.filled,[data-theme="midnight"] .tt-cell.filled,
[data-theme="pixelnight"] .tt-cell.filled{filter:saturate(.92) brightness(.9)}
.tt-legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:12px}
.tt-lg{font-family:var(--mono);font-size:var(--micro);letter-spacing:.04em;padding:3px 7px;border:1px solid}
.tt-settings{display:grid;grid-template-columns:2fr repeat(3,minmax(84px,1fr));gap:10px;margin-top:18px;
  border:1px solid var(--rule);background:var(--card);padding:12px 14px}
.tt-settings .st-row{margin:0}
.tt-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:12px;border-top:1px dashed var(--rule);
  font-size:10.5px;color:var(--ink-3)}
.tt-sign{font-family:var(--mono);font-size:9px}
.tt-brand{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--accent)}

/* popover sửa tiết */
.tt-pop{position:absolute;z-index:200;width:290px;background:var(--card);border:1px solid var(--ink);
  box-shadow:0 18px 44px rgba(20,18,14,.22);padding:12px}
.tt-pop-h{display:flex;align-items:center;margin-bottom:8px}
.tt-pop-h b{font-family:var(--serif);font-size:15px;font-weight:500}
.tt-pop-h .bd-x{margin-left:auto}
.tt-pf{display:block;margin-bottom:8px}
.tt-pf>span{display:block;font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.tt-pf input,.tt-pf select{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:12.5px;
  padding:6px 8px;outline:none;color:var(--ink)}
.tt-pf input:focus{border-color:var(--accent)}
.tt-pf2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tt-colors{display:flex;gap:4px;flex-wrap:wrap}
.tt-c{width:22px;height:22px;border:1px solid;cursor:pointer;display:grid;place-items:center;padding:0}
.tt-c i{display:block;width:7px;height:7px}
.tt-c.on{outline:2px solid var(--ink);outline-offset:1px}
.tt-pop-f{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--rule)}

/* ---- lịch ---- */
.cal-page{padding-bottom:90px}
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-arr{border:1px solid var(--rule);background:var(--card);width:26px;height:26px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.cal-arr:hover{border-color:var(--ink);color:var(--ink)}
.cal-label{font-family:var(--serif);font-size:17px;font-weight:400;margin-left:6px}
.cal-views{display:flex;gap:3px}
.cal-v{border:1px solid var(--rule);background:var(--card);font-family:var(--mono);font-size:9px;padding:5px 9px;cursor:pointer;color:var(--ink-2)}
.cal-v.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cal-grid{border:1px solid var(--rule);background:var(--card)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--rule)}
.cal-dh{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  padding:7px 6px;text-align:center;border-right:1px solid var(--rule)}
.cal-dh:last-child{border-right:0}
.cal-dh b{display:block;font-family:var(--serif);font-size:12px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0}
.cal-dh span{display:block;font-size:var(--micro);margin-top:1px}
.cal-dh.today b{color:var(--accent)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-grid.week .cal-body{grid-template-columns:repeat(7,1fr);min-height:260px}
.cal-cell{min-height:92px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:4px 5px 6px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--paper)}
.cal-cell.other{background:var(--paper);opacity:.55}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-dn{font-family:var(--mono);font-size:9px;color:var(--ink-3);align-self:flex-start}
.cal-cell.today .cal-dn{color:var(--paper);background:var(--accent);padding:1px 4px}
.cal-evs{display:flex;flex-direction:column;gap:2px;flex:1}
.cal-ev{font-size:9.5px;line-height:1.3;padding:2px 4px;background:var(--cb);color:var(--cf);
  border-left:2px solid var(--cd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev i{font-style:normal;font-family:var(--mono);font-size:var(--micro);opacity:.7;margin-right:3px}
.cal-ev.done{opacity:.5;text-decoration:line-through}
.cal-ev:hover{filter:brightness(.96)}
.cal-ev.big{display:block;padding:6px 7px;border-left-width:3px;white-space:normal;margin-bottom:4px}
.cal-ev.big b{display:block;font-size:11px;font-weight:500;line-height:1.35;margin-top:1px}
.cal-more{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);padding-left:3px}
.cal-add{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border:0;background:transparent;
  color:var(--rule-2);font-size:12px;line-height:1;cursor:pointer;opacity:0;transition:opacity .12s}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{color:var(--accent)}
.cal-add.wide{position:static;width:100%;border:1px dashed var(--rule-2);margin-top:4px;padding:4px;
  font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);opacity:1;height:auto}
.cal-wcol{border-right:1px solid var(--rule);padding:6px;min-height:260px;display:flex;flex-direction:column;gap:4px}
.cal-wcol:last-child{border-right:0}
.cal-wcol.today{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.cal-detail{margin-top:10px}
.cal-dbox{border:1px solid var(--ink);background:var(--card);padding:11px 13px}
.cal-dbox-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cal-dbox-h b{font-family:var(--serif);font-size:15px;font-weight:500}
.cal-drow{display:grid;grid-template-columns:8px minmax(0,1fr) auto 24px;gap:8px;align-items:center;
  padding:5px 0;border-top:1px dashed var(--rule)}
.cal-drow b{font-size:12px;font-weight:500;color:var(--ink);cursor:pointer}
.cal-drow span{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.cal-drow.done b{text-decoration:line-through;color:var(--ink-3)}
.cal-udot{width:7px;height:7px;display:block;border-radius:50%}
.cal-udone{border:1px solid var(--rule);background:var(--paper);width:20px;height:20px;font-size:9px;
  cursor:pointer;color:var(--ink-3);padding:0;line-height:1}
.cal-udone:hover{border-color:var(--green);color:var(--green)}
.cal-up{display:flex;flex-direction:column}
.cal-urow{display:grid;grid-template-columns:8px minmax(0,1fr) auto 22px;gap:8px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.cal-urow b{font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-udate{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);white-space:nowrap}
.cal-kinds{display:flex;gap:5px;flex-wrap:wrap}
.cal-kind{font-family:var(--mono);font-size:var(--micro);letter-spacing:.03em;padding:3px 7px;
  background:var(--cb);color:var(--cf);border:1px solid var(--cd)}
.cal-legend-all{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.cal-sw{width:16px;height:16px;display:block;border:1px solid}
.cal-ov .cal-modal{max-width:470px;width:calc(100% - 28px)}
.cal-mh,.cal-mf{display:flex;align-items:center;gap:8px;padding:12px 16px}
.cal-mh{border-bottom:1px solid var(--rule)}
.cal-mf{border-top:1px solid var(--rule)}
.cal-mb{padding:14px 16px;max-height:62vh;overflow:auto}
.cal-mb .st-row{margin-bottom:10px}
.cal-mb textarea{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:13px;
  padding:8px 10px;outline:none;resize:vertical;color:var(--ink)}
@media(max-width:760px){
  .tt-settings{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:64px}
  .cal-ev{font-size:var(--micro)}
  .cal-grid.week .cal-body{grid-template-columns:repeat(7,minmax(72px,1fr));overflow-x:auto}
}

/* ---- about / chủ sở hữu ---- */
.ab-page{padding:40px 0 90px}
.ab-card{max-width:720px;margin:0 auto;border:1px solid var(--rule);background:var(--card);padding:30px 32px}
.ab-card h1{font-family:var(--serif);font-size:clamp(28px,4vw,44px);font-weight:400;line-height:1.14;margin:10px 0 0}
.ab-card h1 em{font-style:italic;color:var(--accent)}
.ab-lead{font-size:14px;line-height:1.75;color:var(--ink-2);margin:14px 0 0}
.ab-own{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px;border:1px solid var(--ink);
  border-left:3px solid var(--accent);background:var(--paper)}
.ab-av{width:52px;height:52px;display:grid;place-items:center;background:var(--ink);color:var(--paper);
  font-family:var(--serif);font-size:20px;letter-spacing:.02em}
.ab-own-t b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;margin-top:2px}
.ab-own-t a{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--accent);text-decoration:none;margin-top:2px}
.ab-own-t a:hover{text-decoration:underline}
.ab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:20px}
.ab-stats>div{background:var(--paper);padding:12px;text-align:center}
.ab-stats b{display:block;font-family:var(--serif);font-size:22px;font-weight:400}
.ab-stats span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px}
.ab-ownnote{margin-top:20px;padding:14px;background:var(--paper);border:1px dashed var(--rule-2)}
.ab-ownnote p{font-size:12px;line-height:1.65;color:var(--ink-3);margin:0 0 8px}
.ab-ownnote code{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.ab-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
@media(max-width:640px){.ab-card{padding:22px}.ab-stats{grid-template-columns:1fr 1fr}}

/* ---- nhận diện tác giả ---- */
.tb-owner{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3);text-decoration:none;
  border:1px solid var(--rule);padding:3px 6px;white-space:nowrap}
.tb-owner:hover{color:var(--accent);border-color:var(--accent)}
.foot-own{display:inline-flex;align-items:center;gap:5px}
.foot-own a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule-2)}
.foot-own a:hover{color:var(--accent);border-color:var(--accent)}
.foot-own em{font-style:normal;color:var(--rule-2)}
@media(max-width:1100px){.tb-owner{display:none}}

/* in thời khoá biểu */
@media print{
  .tt-bar,.tt-settings,.tt-legend,.cal-bar,.foot,.rail,.topbar{display:none!important}
  .tt-wrap{border:0;box-shadow:none}
  .tt-cell{min-height:44px}
  .tt-brand{display:block!important}
}
.ui-mini{max-width:420px;width:calc(100% - 28px)}
.ui-mini textarea{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:13.5px;
  line-height:1.6;padding:9px 10px;outline:none;resize:vertical;color:var(--ink)}
.ui-mini textarea:focus{border-color:var(--accent)}
.ui-mini input{width:100%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:13.5px;
  padding:9px 10px;outline:none;color:var(--ink)}
.ui-mini input:focus{border-color:var(--accent)}
.ui-mini .ui-msg{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.ui-mini .ui-msg b{color:var(--ink)}
.btn.btn-danger{background:var(--heat4);border-color:var(--heat4);color:#fff}
.btn.btn-danger:hover{background:#6f2318;border-color:#6f2318;color:#fff}
html[data-theme^="pixel"] .btn.btn-danger{box-shadow:3px 3px 0 var(--rule-2)}
/* ô ngày trong lịch: cao đều, số ngày rõ, việc dễ đọc hơn */
.cal-cell{min-height:104px}
.cal-dn{font-family:var(--serif);font-size:13px;color:var(--ink-2);opacity:.75}
.cal-cell.today .cal-dn{color:#fff;opacity:1;font-size:11px;font-family:var(--mono)}
.cal-ev{font-size:10px;padding:3px 5px}
.cal-dh{background:var(--paper)}
.cal-head{border-bottom:1px solid var(--ink)}
/* tương phản cho khối CTA trên rail ở mọi theme */
.rs-main span{color:color-mix(in srgb, var(--paper) 64%, transparent)}
.rs-main b{color:var(--paper)}
html[data-theme="midnight"] .rs-main,
html[data-theme="graphite"] .rs-main,
html[data-theme="pixelnight"] .rs-main{background:var(--card-2);color:var(--ink);border:1px solid var(--rule-2)}
html[data-theme="midnight"] .rs-main b,
html[data-theme="graphite"] .rs-main b,
html[data-theme="pixelnight"] .rs-main b{color:var(--ink)}
html[data-theme="midnight"] .rs-main span,
html[data-theme="graphite"] .rs-main span,
html[data-theme="pixelnight"] .rs-main span{color:var(--ink-3)}
html[data-theme="midnight"] .rs-main.on,
html[data-theme="graphite"] .rs-main.on,
html[data-theme="pixelnight"] .rs-main.on{background:var(--accent);border-color:var(--accent)}
html[data-theme="midnight"] .rs-main.on b,
html[data-theme="graphite"] .rs-main.on b,
html[data-theme="pixelnight"] .rs-main.on b{color:#15130f}
html[data-theme="midnight"] .rs-main.on span,
html[data-theme="graphite"] .rs-main.on span,
html[data-theme="pixelnight"] .rs-main.on span{color:rgba(20,18,14,.66)}
html[data-theme="midnight"] .rs-main:hover,
html[data-theme="graphite"] .rs-main:hover,
html[data-theme="pixelnight"] .rs-main:hover{background:var(--card)}
.hero-sign{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3);margin:14px 0 0}
.hero-sign a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule-2)}
.hero-sign a:hover{color:var(--accent);border-color:var(--accent)}
.hero-sign span{color:var(--rule-2);margin:0 4px}
/* khối "Hôm nay có gì" trên dashboard */
.sy-today{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:18px;
  border:1px solid var(--ink);background:var(--card);padding:14px 16px;border-left:3px solid var(--accent)}
.sy-today-l{flex:1 1 340px;min-width:0}
.sy-today-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sy-td{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--rule);border-left:3px solid var(--accent);
  background:var(--paper);padding:4px 7px;max-width:100%}
.sy-td i{font-family:var(--mono);font-size:var(--micro);font-style:normal;color:var(--ink-3)}
.sy-td b{font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy-today-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sy-count{text-decoration:none;border:1px solid var(--rule);background:var(--paper);padding:8px 12px;min-width:130px}
.sy-count b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;color:var(--accent);line-height:1}
.sy-count i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:3px}
.sy-count:hover{border-color:var(--accent)}

/* empty state lịch */
.cal-empty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin:0 0 14px;
  border:1px dashed color-mix(in srgb,var(--ink) 26%,transparent);background:color-mix(in srgb,var(--paper) 92%,var(--ink) 8%)}
.cal-ek{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);border-right:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding-right:10px}
.cal-et{font-size:13px;color:var(--ink2);max-width:56ch}

.sy-count.empty b{font-size:22px;color:var(--ink2)}
.sy-count.empty i{color:var(--ink2)}

.foot-v{font-variant-numeric:tabular-nums;letter-spacing:.08em;font-size:11px;color:var(--ink2);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding:1px 6px}

/* =========================================================
   SỔ ĐIỂM  #/grades
   Bảng điểm kiểu sổ điểm giấy: cột hệ số, dòng môn, điểm trung bình
   in đậm ở cuối — nhưng tính đúng công thức và đổi ngay khi sửa.
   ========================================================= */
.gd-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 12px;
  border-bottom:1px solid var(--rule);padding-bottom:10px}
.gd-tabs{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.gd-tab{background:var(--card);border:0;padding:7px 14px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.gd-tab:hover{color:var(--ink);background:var(--paper)}
.gd-tab.on{background:var(--ink);color:var(--paper)}
.gd-target{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gd-target input{width:64px;border:1px solid var(--rule);background:var(--paper);padding:5px 7px;
  font-family:var(--mono);font-size:12px;color:var(--ink)}

.gd-list{border:1px solid var(--rule);background:var(--rule);display:flex;flex-direction:column;gap:1px}
.gd-row{background:var(--card);padding:11px 13px}
.gd-row-h{display:flex;align-items:baseline;gap:9px}
.gd-name{font-family:var(--serif);font-size:15.5px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gd-avg{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gd-avg.none{color:var(--ink-3);font-size:12px}
.gd-del{border:0;background:none;color:var(--ink-3);font-size:15px;line-height:1;cursor:pointer;
  padding:2px 5px;margin-left:2px}
.gd-del:hover{color:var(--accent);background:var(--accent-soft)}
.gd-marks{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.gd-kind{display:flex;align-items:center;gap:6px}
.gd-kind-h{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);min-width:52px}
.gd-kind-h i{font-style:normal;color:var(--accent)}
.gd-pills{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.gd-pill{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink);padding:2px 7px;cursor:pointer}
.gd-pill:hover{border-color:var(--accent);color:var(--accent);text-decoration:line-through}
.gd-add{width:20px;height:20px;border:1px dashed var(--rule-2);background:none;color:var(--ink-3);
  font-size:12px;line-height:1;cursor:pointer;padding:0}
.gd-add:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.gd-if{font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--ink-3);margin:7px 0 0}
.gd-if b{color:var(--accent);font-size:11px}
.gd-if.bad{color:#b3402f}
.gd-empty{border:1px dashed var(--rule-2);padding:22px;text-align:center}
.gd-empty p{margin:0;color:var(--ink-2);font-size:13px}
.gd-addrow{display:flex;gap:8px;margin-top:14px}
.gd-addrow input{flex:1;border:1px solid var(--rule);background:var(--paper);padding:9px 11px;
  font-family:var(--sans);font-size:13.5px;color:var(--ink)}
.gd-weak{margin-top:16px}
.gd-weak-r{display:grid;grid-template-columns:minmax(0,1fr) 62px auto;gap:10px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--rule)}
.gd-weak-r:last-child{border-bottom:0}
.gd-weak-v{font-family:var(--mono);font-size:13px;text-align:right}
.gd-weak-go{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);text-decoration:none;white-space:nowrap}
.gd-weak-go:hover{text-decoration:underline}
.gd-cfg{margin-top:20px;border-top:1px solid var(--rule);padding-top:12px}
.gd-cfg summary{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);cursor:pointer}
.gd-cfg summary:hover{color:var(--accent)}
.gd-cfg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}

/* =========================================================
   KẾ HOẠCH TUẦN  #/weekly
   7 cột như một tờ lịch treo tường. Việc con là chip nhỏ, độ khó
   thể hiện bằng độ đậm của chữ — đọc được mà không cần chú giải.
   ========================================================= */
.wk-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:14px 0}
.wk-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.wk-col{background:var(--card);display:flex;flex-direction:column;min-height:210px}
.wk-col.past{background:var(--card-2)}
.wk-col.off{background:color-mix(in srgb,var(--rule) 40%,var(--paper));opacity:.55}
.wk-col.today{box-shadow:inset 0 3px 0 var(--accent)}
.wk-col-h{display:flex;align-items:baseline;gap:5px;padding:8px 9px 6px;border-bottom:1px solid var(--rule)}
.wk-d{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.wk-date{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3)}
.wk-n{margin-left:auto;font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.wk-col-b{padding:6px;display:flex;flex-direction:column;gap:4px;flex:1}
.wk-empty{font-size:10px;color:var(--ink-3);text-align:center;padding:10px 0}
.wk-item{display:grid;grid-template-columns:15px minmax(0,1fr);gap:5px;align-items:start;
  background:var(--paper);border:1px solid var(--rule);padding:5px 6px}
.wk-item.ok{opacity:.5}
.wk-item.ok .wk-t b{text-decoration:line-through}
.wk-check{width:14px;height:14px;border:1px solid var(--rule-2);background:var(--card);
  font-size:9px;line-height:1;cursor:pointer;padding:0;color:var(--accent);margin-top:1px}
.wk-item.ok .wk-check{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.wk-t b{display:block;font-size:10.5px;line-height:1.35;font-weight:400;color:var(--ink)}
.wk-t b.d1{font-weight:400;color:var(--ink-2)}
.wk-t b.d2{font-weight:500}
.wk-t b.d3{font-weight:700}
.wk-t i{display:block;font-style:normal;font-family:var(--mono);font-size:var(--micro);
  letter-spacing:.03em;color:var(--ink-3);margin-top:2px;line-height:1.35}
.wk-t i a{color:var(--accent);text-decoration:none}
.wk-t i a:hover{text-decoration:underline}
.wk-add-sub{border:0;border-top:1px dashed var(--rule);background:none;color:var(--ink-3);
  font-size:11px;cursor:pointer;padding:3px;width:100%}
.wk-add-sub:hover{color:var(--accent);background:var(--paper)}
.wk-lower{margin-top:18px}
.wk-prj{border-bottom:1px solid var(--rule);padding:9px 0}
.wk-prj:last-of-type{border-bottom:0}
.wk-prj>summary{display:flex;align-items:baseline;gap:8px;cursor:pointer;list-style:none}
.wk-prj>summary::-webkit-details-marker{display:none}
.wk-prj-n{font-family:var(--serif);font-size:14.5px;font-weight:500}
.wk-prj-c{font-family:var(--mono);font-size:9px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wk-task{padding:7px 0 7px 12px;border-left:1px solid var(--rule);margin:6px 0 0 3px}
.wk-task-h{display:flex;align-items:baseline;gap:8px}
.wk-task-t{font-size:12px;color:var(--ink-2);flex:1;min-width:0}
.wk-link{font-family:var(--mono);font-size:var(--micro);letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);text-decoration:none;white-space:nowrap}
.wk-task-x{border:0;background:none;color:var(--ink-3);font-size:12px;cursor:pointer;padding:0 3px}
.wk-task-x:hover{color:var(--accent)}
.wk-subs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.wk-chip{display:inline-flex;align-items:baseline;gap:4px;background:var(--paper);
  border:1px solid var(--rule);padding:2px 6px;font-size:9.5px}
.wk-chip b{font-weight:400;color:var(--ink-2)}
.wk-chip.d3 b{font-weight:600;color:var(--ink)}
.wk-chip.ok{opacity:.45}
.wk-chip.ok b{text-decoration:line-through}
.wk-chip i{font-style:normal;font-family:var(--mono);font-size:var(--micro);color:var(--ink-3)}
.wk-empty-note{font-size:10px;color:var(--ink-3);font-style:italic}
.wk-split,.wk-addtask{margin-top:6px;font-size:9px!important;padding:3px 8px!important}
.wk-days{display:flex;gap:3px;margin:8px 0 12px}
.wk-day{flex:1;border:1px solid var(--rule);background:var(--paper);color:var(--ink-3);
  font-family:var(--mono);font-size:9px;padding:6px 0;cursor:pointer;letter-spacing:.05em}
.wk-day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wk-bars{height:76px;margin-top:4px}

@media(max-width:1000px){
  .wk-board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gd-cfg-grid{grid-template-columns:repeat(2,1fr)}
  .gd-marks{gap:9px}
}
@media(max-width:640px){
  .wk-board{grid-template-columns:1fr}
  .wk-col{min-height:0}
  .gd-kind-h{min-width:44px}
  .gd-mark-row{font-size:var(--micro)}
}

/* ---- đếm ngược + tính khả thi của kế hoạch ---- */
.pl-feas{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 4px;
  border:1px solid var(--rule);border-left:3px solid var(--ink-3);background:var(--card);
  padding:9px 12px;font-size:11.5px;color:var(--ink-2)}
.pl-feas-ok{border-left-color:#2f6b3f}
.pl-feas-tight{border-left-color:#b98a2e}
.pl-feas-over{border-left-color:#b3402f;background:color-mix(in srgb,#b3402f 5%,var(--card))}
.pl-feas-t b{font-family:var(--serif);font-size:13px;font-weight:500;color:var(--ink)}
.cd{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border-right:1px solid var(--rule);padding-right:12px;white-space:nowrap}
.cd b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--ink);
  letter-spacing:0;padding:0 2px}
.cd-soon b{color:var(--accent)}
.cd-now{color:var(--accent);font-weight:700}
.cd-past{color:var(--ink-3);font-style:italic}

.pg-k-l{color:var(--accent);text-decoration:none}
.pg-k-l:hover{text-decoration:underline}

/* =========================================================
   BRAND — the fox mark
   Drawn as a 16x16 grid of spans so it stays crisp at any size and
   never needs a second HTTP request.
   ========================================================= */
.px-mark{display:inline-grid;grid-template-rows:repeat(16,1fr);width:26px;height:26px;
  vertical-align:middle;flex:none;image-rendering:pixelated}
.px-mark>span{display:grid;grid-template-columns:repeat(16,1fr);gap:0}
.px-mark i{display:block;background:transparent}
.px-mark i.c1{background:#c6542d}
.px-mark i.c2{background:#a53e20}
.px-mark i.c3{background:#17150f}
.px-mark i.c4{background:#fcf9f2}
.brand{display:flex;align-items:center;gap:9px}
.brand-tx{display:flex;flex-direction:column;line-height:1.15}
.brand-tx b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand-tx span{font-family:var(--mono);font-size:var(--micro);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:1px}
@media(max-width:520px){.brand-tx b{font-size:13px}.px-mark{width:22px;height:22px}}

/* language switch */
.lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lang-btn{text-align:left;border:1px solid var(--rule);background:var(--paper);padding:10px 12px;cursor:pointer}
.lang-btn b{display:block;font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink)}
.lang-btn i{display:block;font-style:normal;font-family:var(--mono);font-size:var(--micro);line-height:1.5;
  letter-spacing:.03em;color:var(--ink-3);margin-top:3px}
.lang-btn:hover{border-color:var(--rule-2)}
.lang-btn.on{border-color:var(--ink);background:var(--card);box-shadow:inset 0 -2px 0 var(--accent)}

/* =========================================================
   PIXEL ARENA  #/game
   ========================================================= */
.px{display:grid;grid-template-rows:repeat(8,1fr);width:72px;height:72px;image-rendering:pixelated}
.px>span{display:grid;grid-template-columns:repeat(8,1fr)}
.px i{display:block;background:transparent}
.px i.c1{background:#5a6b4f}
.px i.c2{background:#8b2e22}
.px i.c3{background:#17150f}
.px i.c4{background:#c6542d}
.px.sm{width:44px;height:44px}
.px.foe{transform:scaleX(-1)}
.gm-arena-select{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:16px}
.gm-foe-card{background:var(--card);border:0;padding:18px 14px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.gm-foe-card:hover{background:var(--paper)}
.gm-foe-card b{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink)}
.gm-foe-card i{font-style:normal;font-size:10.5px;line-height:1.5;color:var(--ink-3)}
.gm-lv{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gm-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.gm-stat{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.gm-stat b{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);margin-left:3px}
.gm-stage{display:grid;grid-template-columns:1fr minmax(0,2fr) 1fr;gap:14px;align-items:center;
  border:1px solid var(--rule);background:var(--card);padding:18px 14px}
.gm-side{display:flex;flex-direction:column;align-items:center;gap:8px}
.gm-hp{width:100%;height:8px;background:var(--rule);border:1px solid var(--rule-2)}
.gm-hp i{display:block;height:100%;background:#3f6b4e;transition:width .25s}
.gm-hp.foe i{background:var(--accent)}
.gm-hp-t{font-family:var(--mono);font-size:var(--micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.gm-mid{min-height:130px;display:flex;flex-direction:column;justify-content:center}
.gm-q p{font-family:var(--serif);font-size:clamp(15px,2vw,19px);line-height:1.45;margin:8px 0 0}
.gm-unit{font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.05em}
.gm-over{text-align:center}
.gm-over b{display:block;font-family:var(--serif);font-size:22px;font-weight:500}
.gm-over span{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:4px}
.gm-over-sub{font-size:var(--micro)!important}
.gm-over .btn{margin-top:10px}
.gm-in{display:flex;gap:8px;margin-top:14px;max-width:520px}
.gm-in input{flex:1;border:1px solid var(--rule);background:var(--paper);padding:10px 12px;
  font-family:var(--mono);font-size:14px;color:var(--ink)}
.gm-in input:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 20%,transparent)}
.gm-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.gm-opt{border:1px solid var(--rule);background:var(--card);padding:11px;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.gm-opt:hover{border-color:var(--accent);background:var(--paper)}
.gm-hint{margin-top:7px}
.gm-log{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
.gm-log-r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:baseline;
  padding:5px 0;border-bottom:1px dashed var(--rule);font-size:10.5px}
.gm-log-r:last-child{border-bottom:0}
.gm-log-m{font-family:var(--mono)}
.gm-log-r.ok .gm-log-m{color:#3f6b4e}
.gm-log-r.no .gm-log-m{color:var(--accent)}
.gm-log-t{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-log-a{font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:nowrap}
@media(max-width:760px){
  .gm-stage{grid-template-columns:1fr;gap:10px}
  .gm-mid{order:-1;min-height:0}
  .gm-side{flex-direction:row;justify-content:center}
  .gm-hp{width:120px}
}

/* =========================================================
   PHYSICS LAB  #/special
   ========================================================= */
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.sp-card{border:1px solid var(--rule);background:var(--card);padding:15px 16px}
.sp-card.sp-wide{grid-column:1/-1}
.sp-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sp-badge{margin-left:auto;font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);padding:2px 6px}
.sp-card textarea{width:100%;border:1px solid var(--rule);background:var(--paper);padding:10px 12px;
  font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--ink);resize:vertical;margin-top:6px}
.sp-card textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.sp-out{margin-top:12px}
.sp-none{font-size:11.5px;color:var(--ink-3);margin:0}
.sp-qty{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.sp-chip{border:1px solid var(--rule);background:var(--paper);padding:3px 8px;
  display:inline-flex;align-items:baseline;gap:6px}
.sp-chip b{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.sp-chip i{font-style:normal;font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase}
.sp-laws{display:flex;flex-direction:column;gap:7px}
.sp-law{border-left:2px solid var(--rule-2);padding:6px 0 6px 10px}
.sp-law.full{border-left-color:var(--accent)}
.sp-law-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sp-law-h b{font-family:var(--serif);font-size:13.5px;font-weight:500}
.sp-law-h .mono{font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.sp-tag{font-family:var(--mono);font-size:var(--micro);letter-spacing:.07em;text-transform:uppercase;
  background:var(--accent);color:var(--paper);padding:1px 5px}
.sp-law p{margin:3px 0 0;font-size:10.5px;line-height:1.5;color:var(--ink-3)}
.sp-ans{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.sp-ans b{display:block;font-family:var(--serif);font-size:20px;font-weight:500;color:var(--accent);margin-top:3px}
.sp-sense{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px}
.sp-sense-p{font-family:var(--mono);font-size:9px;padding:1px 6px;border:1px solid var(--rule)}
.sp-sense-p.ok{color:#3f6b4e;border-color:#3f6b4e}
.sp-sense-p.no{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.sp-ok-t{font-style:normal;font-size:9.5px;color:#3f6b4e;margin-left:4px}
.sp-no-t{font-style:normal;font-size:9.5px;color:var(--accent);margin-left:4px}
.sp-sense-demo{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.sp-sense-r{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;border-left:2px solid var(--rule-2);padding-left:9px}
.sp-sense-r.ok{border-left-color:#3f6b4e}
.sp-sense-r.no{border-left-color:var(--accent)}
.sp-sense-r b{font-family:var(--mono);font-size:11px;grid-row:1}
.sp-sense-r span{font-family:var(--mono);font-size:var(--micro);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);grid-row:1;text-align:right}
.sp-sense-r i{grid-column:1/-1;font-style:normal;font-size:10px;line-height:1.5;color:var(--ink-2)}
.sp-tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.sp-tab th{text-align:left;font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule);padding:5px 4px}
.sp-tab td{border-bottom:1px solid var(--rule);padding:5px 4px}
.sp-tab td b{font-family:var(--mono);font-size:11px}
.sp-tab td span{font-size:9.5px;color:var(--ink-3);display:block;line-height:1.35}
.sp-tab td.mono{font-family:var(--mono);font-size:10.5px;text-align:right;white-space:nowrap}
.sp-prefix{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sp-pf{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);padding:2px 7px;background:var(--paper)}
.sp-pf b{color:var(--accent);margin-right:4px}
.sp-ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:10px 0}
.sp-f{background:var(--card);padding:9px 11px}
.sp-f-q{display:flex;align-items:baseline;gap:8px}
.sp-f-b{font-family:var(--mono);font-size:var(--micro);letter-spacing:.05em;color:var(--ink-3);
  border:1px solid var(--rule);padding:0 4px;flex:none}
.sp-f-q b{font-family:var(--serif);font-size:12.5px;font-weight:500}
.sp-f-a{font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:3px}
.sp-f i{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);margin-top:2px}
.sp-drill{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.sp-drill-q{font-family:var(--serif);font-size:16px;margin:6px 0 8px}
.sp-drill input{width:100%;max-width:340px;border:1px solid var(--rule);background:var(--paper);
  padding:9px 11px;font-family:var(--mono);font-size:13px}
.sp-y{color:#3f6b4e}.sp-n{color:var(--accent)}
.sp-done b{font-family:var(--serif);font-size:18px;font-weight:500}
@media(max-width:820px){.sp-grid{grid-template-columns:1fr}}

/* =========================================================
   SHARE CARD  #/share
   ========================================================= */
.sh-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;margin-top:18px;align-items:start}
.sh-prev{border:1px solid var(--rule);background:var(--paper-2);padding:12px}
.sh-prev canvas{width:100%;height:auto;display:block;box-shadow:0 2px 12px rgba(23,21,15,.08)}
.sh-kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:12px}
.sh-kpi>div{background:var(--card);padding:10px 12px}
.sh-kpi b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1}
.sh-kpi span{display:block;font-family:var(--mono);font-size:var(--micro);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.sh-note{border-top:1px solid var(--rule);margin-top:14px;padding-top:11px}
.sh-note ul{margin:7px 0 0;padding-left:16px}
.sh-note li{font-size:11px;line-height:1.7;color:var(--ink-2)}
.sh-note s{color:var(--accent);text-decoration-thickness:1px}
@media(max-width:820px){.sh-grid{grid-template-columns:1fr}}

/* =========================================================
   SHAREABLE LESSON  #/share/lesson/d/s
   ========================================================= */
.tag-share{border-color:var(--accent)!important;color:var(--accent)!important;text-decoration:none;
  transition:background .12s,color .12s}
.tag-share:hover,.tag-share:focus-visible{background:var(--accent);color:#fff!important}
.shl-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(200px,.9fr);gap:20px;margin-top:18px;align-items:start}
.shl-lbl{display:block;font-family:var(--mono);font-size:var(--micro);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:14px 0 6px}
.shl-lbl:first-child{margin-top:0}
.shl-link{display:flex;gap:6px}
.shl-link input{flex:1;min-width:0;font-family:var(--mono);font-size:11px;padding:8px 10px;
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink)}
.shl-ta{width:100%;font-family:var(--mono);font-size:11px;line-height:1.7;padding:10px;
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);resize:vertical}
.shl-qr{border:1px solid var(--rule);background:#fff;padding:10px;display:grid;place-items:center}
.shl-qr svg{width:100%;height:auto;display:block}
.shl-prev{margin-top:26px;border-top:1px solid var(--rule);padding-top:14px}
.shl-prevbody{margin-top:10px;border:1px solid var(--rule);background:var(--card);padding:18px 20px}
.shl-prevbody h3{font-family:var(--serif);font-size:19px;font-weight:400;margin:8px 0 6px}
@media(max-width:760px){.shl-grid{grid-template-columns:1fr}.shl-qr{max-width:230px;margin:0 auto}}

/* =========================================================
   WEEKLY BOARD  ·  #/weekly
   ---------------------------------------------------------
   Design notes, because this replaces a dense dashboard:
   · one strong number per screen (the percentage), everything else muted;
   · rules, not boxes — heavy borders make 7 columns feel like a spreadsheet;
   · the day column is a drop target, so it needs a visible hover state;
   · difficulty is carried by a left edge colour, not by coloured text, so the
     list still reads when the whole thing is printed or in dark mode.
   ========================================================= */
.wk-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--rule)}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-arrow{width:26px;height:26px;border:1px solid var(--rule);background:none;color:var(--ink-2);
  font-size:15px;line-height:1;cursor:pointer;border-radius:2px;padding:0}
.wk-arrow:hover{border-color:var(--ink);color:var(--ink)}
.wk-range{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-2);
  text-transform:uppercase}
.wk-today{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:underline}
.wk-headline{font-family:var(--serif);font-size:19px;line-height:1.35;margin:9px 0 0;color:var(--ink)}
.wk-top-r{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wk-prog{display:flex;align-items:baseline;gap:7px}
.wk-prog-pct{font-family:var(--serif);font-size:31px;line-height:1}
.wk-prog-n{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3)}
.wk-tools{display:flex;gap:5px;flex-wrap:wrap}
.wk-chip-btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:6px 9px;
  border:1px solid var(--rule);background:none;color:var(--ink-2);cursor:pointer;border-radius:2px;
  white-space:nowrap}
.wk-chip-btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.wk-chip-btn:disabled{opacity:.35;cursor:default}
.wk-chip-btn.wk-end{border-color:var(--ink-3);color:var(--ink)}

.wk-finished,.wk-warn{padding:9px 12px;margin:12px 0 0;font-size:11.5px;line-height:1.6;
  border-left:2px solid var(--green);background:var(--green-soft)}
.wk-warn{border-left-color:var(--accent);background:var(--accent-soft)}

.wk-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-top:18px;
  border-top:1px solid var(--rule)}
.wk-col{border-right:1px solid var(--rule);padding:0 7px 8px;min-height:220px;background:none;
  transition:background .12s}
.wk-col:last-child{border-right:0}
.wk-col.off{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
  rgba(122,114,100,.045) 5px,rgba(122,114,100,.045) 10px)}
.wk-col.past{opacity:.62}
.wk-col.today{background:var(--card);box-shadow:inset 0 2px 0 var(--accent)}
.wk-col.over{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.wk-col-h{display:flex;align-items:baseline;gap:5px;padding:9px 0 6px;position:sticky;top:0}
.wk-d{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);display:flex;flex-direction:column;gap:1px}
.wk-now{font-style:normal;font-size:var(--micro);letter-spacing:.09em;color:var(--accent)}
.wk-date{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);margin-left:auto}
.wk-n{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);order:2}
.wk-bar{height:2px;background:var(--rule);margin-bottom:8px}
.wk-bar i{display:block;height:2px;background:var(--ink-3)}
.wk-col-b{display:flex;flex-direction:column;gap:5px}
.wk-empty{font-family:var(--mono);font-size:10px;color:var(--rule-2);text-align:center;padding:8px 0}

.wk-item{display:flex;gap:5px;align-items:flex-start;background:var(--card);
  border:1px solid var(--rule);border-left-width:2px;padding:5px 6px;cursor:grab;
  border-radius:2px;transition:border-color .1s,opacity .1s}
.wk-item:hover{border-color:var(--rule-2)}
.wk-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wk-item.dragging{opacity:.4}
.wk-item.d1{border-left-color:var(--green)}
.wk-item.d2{border-left-color:var(--ink-3)}
.wk-item.d3{border-left-color:var(--accent)}
.wk-item.ok{opacity:.5}
.wk-item.ok b{text-decoration:line-through;text-decoration-thickness:1px}
.wk-check{flex:0 0 13px;width:13px;height:13px;border:1px solid var(--rule-2);background:none;
  border-radius:2px;cursor:pointer;font-size:9px;line-height:1;padding:0;color:var(--green);
  margin-top:1px}
.wk-item.ok .wk-check{border-color:var(--green);background:var(--green-soft)}
.wk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wk-t b{font-family:var(--sans);font-size:10.5px;font-weight:500;line-height:1.35;
  overflow-wrap:anywhere}
.wk-t i{font-family:var(--mono);font-size:var(--micro);font-style:normal;color:var(--ink-3);
  display:flex;align-items:center;gap:3px;overflow-wrap:anywhere}
.wk-t i a{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}
.wk-dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px;display:inline-block}
.wk-diff{font-family:var(--mono);font-size:var(--micro);letter-spacing:.04em;text-transform:uppercase;
  align-self:center;flex:0 0 auto;padding:1px 3px;border-radius:2px;border:1px solid var(--rule)}
.wk-diff.d1{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.wk-diff.d2{color:var(--ink-3)}
.wk-diff.d3{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.wk-add-sub{width:100%;height:20px;border:1px dashed var(--rule);background:none;color:var(--ink-3);
  cursor:pointer;border-radius:2px;margin-top:5px;font-size:11px;line-height:1;padding:0}
.wk-add-sub:hover{border-color:var(--ink-3);color:var(--ink);background:var(--card)}
.wk-hint{font-size:10.5px;color:var(--ink-3);margin:12px 0 0;line-height:1.7}
.wk-only-fine{color:var(--ink-2)}

.wk-overdue{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;
  padding:10px 13px;border:1px solid var(--rule);border-left:2px solid var(--accent);
  background:var(--accent-soft);font-size:11.5px}
.wk-overdue .grow{flex:1}

.wk-lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;margin-top:26px}
.wk-panel{border:1px solid var(--rule);background:var(--card);padding:14px 16px}
.wk-panel-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;
  border-bottom:1px solid var(--rule);margin-bottom:10px}
.wk-panel-h .kicker{font-family:var(--mono);font-size:var(--micro);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.wk-panel-h .grow{flex:1}
.wk-swatch{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.wk-prj{border-bottom:1px solid var(--rule);padding:8px 0}
.wk-prj:last-child{border-bottom:0}
.wk-prj summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none}
.wk-prj summary::-webkit-details-marker{display:none}
.wk-prj-n{font-family:var(--serif);font-size:14px}
.wk-prj-c{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.wk-task{padding:7px 0 3px 15px;border-left:1px solid var(--rule);margin:6px 0 0 4px}
.wk-task-h{display:flex;align-items:center;gap:7px}
.wk-task-t{font-size:11.5px;font-weight:500}
.wk-link{font-family:var(--mono);font-size:var(--micro);color:var(--accent);text-decoration:none}
.wk-task-x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:12px;
  margin-left:auto;padding:0 2px;line-height:1}
.wk-task-x:hover{color:var(--accent)}
.wk-subs{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.wk-chip{font-family:var(--mono);font-size:var(--micro);padding:2px 6px;border:1px solid var(--rule);
  border-radius:2px;display:inline-flex;gap:5px;align-items:center}
.wk-chip b{font-weight:400}
.wk-chip i{font-style:normal;color:var(--ink-3);font-size:var(--micro)}
.wk-chip.d3{border-color:var(--accent)}
.wk-chip.ok{opacity:.5;text-decoration:line-through}
.wk-empty-note{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3)}
.wk-task-a{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.wk-days{display:flex;gap:4px;margin:10px 0 14px}
.wk-day{flex:1;padding:7px 0;border:1px solid var(--rule);background:none;color:var(--ink-3);
  font-family:var(--mono);font-size:9px;cursor:pointer;border-radius:2px}
.wk-day.on{border-color:var(--ink);color:var(--ink);background:var(--card)}
.wk-day:hover{border-color:var(--ink-2)}
.wk-load{display:flex;flex-direction:column;gap:3px}
.wk-load-r{display:flex;align-items:center;gap:7px}
.wk-load-d{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);width:16px}
.wk-load-bar{flex:1;height:5px;background:var(--rule);border-radius:1px;overflow:hidden}
.wk-load-bar i{display:block;height:5px;background:var(--ink-3);transition:width .2s}
.wk-load-n{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);width:26px;text-align:right}

@media(max-width:900px){
  .wk-board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wk-col{border-bottom:1px solid var(--rule)}
  .wk-lower{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wk-board{grid-template-columns:1fr}
  .wk-top-r{width:100%;justify-content:space-between}
}
@media print{
  .wk-add-sub,.wk-tools,.wk-hint,.wk-overdue,.wk-nav{display:none}
  .wk-col{min-height:auto}
}

/* ---------- guided empty state ---------- */
.wk-guide{border:1px solid var(--rule);background:var(--card);padding:26px 28px;margin-top:18px}
.wk-guide-h h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:6px 0 6px}
.wk-guide-h p{font-size:12px;color:var(--ink-2);margin:0}
.wk-steps{list-style:none;margin:22px 0 18px;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}
.wk-steps li{display:flex;gap:10px;align-items:flex-start}
.wk-step-n{flex:0 0 22px;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;font-family:var(--mono);font-size:10px}
.wk-steps b{font-size:12px;font-weight:600;display:block;margin-bottom:3px}
.wk-steps p{font-size:11px;line-height:1.6;color:var(--ink-2);margin:0 0 7px}
.wk-steps code{font-family:var(--mono);font-size:10px;color:var(--ink-3);
  background:var(--paper-2);padding:2px 5px;border-radius:2px}

/* ---------- lesson picker ---------- */
.wk-pick{max-width:560px}
.wk-pick .cal-mb{display:flex;flex-direction:column;gap:9px;max-height:min(62vh,460px)}
#wkPickQ{width:100%;padding:8px 10px;border:1px solid var(--rule);background:var(--paper-2);
  font-family:var(--sans);font-size:12px;color:var(--ink)}
.wk-pick-list{overflow-y:auto;border:1px solid var(--rule);display:flex;flex-direction:column}
.wk-pick-r{display:flex;gap:9px;align-items:baseline;text-align:left;padding:7px 10px;border:0;
  border-bottom:1px solid var(--rule);background:none;cursor:pointer;color:var(--ink)}
.wk-pick-r:last-child{border-bottom:0}
.wk-pick-r:hover,.wk-pick-r:focus-visible{background:var(--accent-soft)}
.wk-pick-r.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.wk-pick-d{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);flex:0 0 52px}
.wk-pick-t{font-size:11.5px;line-height:1.4}
.wk-linkbtn{border:0;background:none;cursor:pointer;font-family:var(--mono);font-size:var(--micro);
  color:var(--ink-3);padding:0 2px}
.wk-linkbtn:hover{color:var(--accent);text-decoration:underline}

/* =========================================================
   PHYSICS HUB · #/physics
   ========================================================= */
.tb-key{position:relative}
.tb-key::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent)}
.ph-hero{display:flex;gap:26px;align-items:center;justify-content:space-between;
  padding-bottom:20px;border-bottom:1px solid var(--rule)}
.ph-hero h1{font-family:var(--serif);font-size:38px;font-weight:400;margin:8px 0 10px;line-height:1.05}
.ph-hero p{font-size:12.5px;line-height:1.75;color:var(--ink-2);max-width:54ch;margin:0}
.ph-hero-l{min-width:0}
.ph-ring{position:relative;flex:0 0 108px;width:108px;height:108px}
.ph-ring svg{width:108px;height:108px;display:block}
.ph-ring-bg{fill:none;stroke:var(--rule);stroke-width:5}
.ph-ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:butt;
  transition:stroke-dasharray .5s ease}
.ph-ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ph-ring-t b{font-family:var(--serif);font-size:20px;font-weight:400;display:block;line-height:1}
.ph-ring-t span{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3)}

.ph-next{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;
  margin-top:16px;padding:13px 16px;border:1px solid var(--rule);border-left:3px solid var(--accent);
  background:var(--card);text-decoration:none;color:inherit;transition:background .12s}
.ph-next:hover{background:var(--accent-soft)}
.ph-next.done{border-left-color:var(--green);cursor:default}
.ph-next-k{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.ph-next-t{font-family:var(--serif);font-size:16px;line-height:1.3}
.ph-next-a{font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}

.ph-phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:20px}
.ph-phase{background:var(--card);padding:12px 14px}
.ph-phase-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.ph-phase-k{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ph-phase-n{font-family:var(--mono);font-size:9px;color:var(--ink-2)}
.ph-phase-bar{height:2px;background:var(--rule);margin-bottom:8px}
.ph-phase-bar i{display:block;height:2px;background:var(--accent)}
.ph-phase-d{font-size:10px;line-height:1.55;color:var(--ink-3);margin:0}

.ph-sec{margin-top:30px}
.ph-sec-h{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;
  border-bottom:1px solid var(--rule);margin-bottom:14px}
.ph-sec-h .kicker{font-family:var(--mono);font-size:var(--micro);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.ph-sec-n{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:auto}
.ph-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:22px}
.ph-group h3{font-family:var(--mono);font-size:var(--micro);letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px;font-weight:400}
.ph-tool{display:block;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none;
  color:inherit;transition:padding-left .12s}
.ph-tool:last-child{border-bottom:0}
.ph-tool:hover{padding-left:6px}
.ph-tool b{display:block;font-size:12px;font-weight:500;margin-bottom:2px}
.ph-tool span{display:block;font-size:10.5px;line-height:1.55;color:var(--ink-3)}
.ph-tool:hover b{color:var(--accent)}

.ph-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;margin-top:30px}
.ph-panel{border:1px solid var(--rule);background:var(--card);padding:16px 18px}
.ph-big{font-family:var(--serif);font-size:34px;line-height:1;margin:6px 0 8px}
.ph-big span{font-size:16px;color:var(--ink-3)}
.ph-weak{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;padding:6px 0}
.ph-weak-n{font-size:11.5px;line-height:1.35;overflow-wrap:anywhere}
.ph-weak-b{height:3px;background:var(--rule)}
.ph-weak-b i{display:block;height:3px;background:var(--accent)}
.ph-weak-r{font-family:var(--mono);font-size:var(--micro);color:var(--ink-3);white-space:nowrap}

@media(max-width:820px){
  .ph-hero{flex-direction:column;align-items:flex-start;gap:14px}
  .ph-phases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ph-two{grid-template-columns:1fr}
  .ph-next{grid-template-columns:1fr auto}
  .ph-next-t{grid-column:1/-1}
}

/* ============================================================
   KHÁM PHÁ — trang #/discover + popup thanh trên
   Pixel-art flavour: hard rules, mono labels, no soft shadows.
   ============================================================ */
.expl-page{padding-bottom:80px}
.expl-search{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);background:var(--card);
  padding:10px 12px;margin-top:20px}
.expl-search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.7;flex:none}
.expl-search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:none}
.expl-search kbd{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1px solid var(--rule-2);
  padding:2px 5px;color:var(--ink-3);flex:none}
.expl-search:focus-within{border-color:var(--accent);box-shadow:2px 2px 0 var(--accent-soft)}

.expl-top{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(auto-fit,minmax(150px,.6fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.expl-resume{background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.expl-resume:hover{background:var(--paper)}
.expl-resume b{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.expl-resume i{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-style:normal}
.expl-resume em{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent);font-style:normal;margin-top:6px}
.expl-due{background:var(--card);padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.expl-due:hover{background:var(--paper)}
.expl-due b{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1;color:var(--accent)}
.expl-due span{font-size:12px;color:var(--ink-2)}
.expl-due em{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-style:normal;margin-top:5px}

.expl-empty-top{border:1px dashed var(--rule-2);background:var(--card-2);padding:20px 22px;margin-top:22px}
.expl-empty-top b{font-family:var(--serif);font-size:17px}
.expl-empty-top p{margin:5px 0 12px;font-size:13px;color:var(--ink-2);max-width:52ch}

.expl-sec{margin-top:30px}
.expl-sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:1px}
.expl-sec-h .kicker{color:var(--ink)}
.expl-sec-h em{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-style:normal;margin-left:auto}
.expl-sec-h a{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.expl-sec-h a:hover{color:var(--accent)}

.expl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-top:0}
.expl-card{background:var(--card);padding:13px 15px 14px;display:flex;flex-direction:column;gap:4px;
  min-height:78px;transition:background .12s}
.expl-card:hover{background:var(--paper)}
.expl-card b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.3}
.expl-card span{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.expl-card:hover b{color:var(--accent)}

.expl-recent{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-top:0;
  flex-wrap:wrap}
.expl-recent a{background:var(--card);padding:10px 13px;min-width:170px;flex:1}
.expl-recent a:hover{background:var(--paper)}
.expl-recent b{display:block;font-size:13px;font-weight:600}
.expl-recent i{display:block;font-size:10.5px;color:var(--ink-3);font-style:normal;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.expl-out{margin-top:18px;border:1px solid var(--rule)}
.expl-h{display:flex;align-items:baseline;gap:12px;padding:9px 13px;background:var(--card-2);border-bottom:1px solid var(--rule)}
.expl-h .kicker{color:var(--ink-2)}
.expl-clear{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.expl-clear:hover{color:var(--accent)}
.expl-row{display:grid;grid-template-columns:82px minmax(0,1fr) minmax(0,.9fr) 18px;gap:12px;align-items:baseline;
  padding:10px 13px;border-bottom:1px solid var(--rule);background:var(--card)}
.expl-row:last-child{border-bottom:0}
.expl-row:hover,.expl-row.on{background:var(--paper)}
.expl-row.on{box-shadow:inset 3px 0 0 var(--accent)}
.expl-row .k{font-family:var(--mono);font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.expl-row .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expl-row .d{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expl-row .go{font-family:var(--mono);color:var(--ink-3);text-align:right}
.expl-row:hover .go{color:var(--accent)}
.expl-none{padding:22px 18px;background:var(--card)}
.expl-none b{font-family:var(--serif);font-size:16px}
.expl-none p{margin:5px 0 12px;font-size:12.5px;color:var(--ink-2)}

/* ---- popup Khám phá (thanh trên) ---- */
.tb-menu{max-height:min(74vh,620px);overflow:auto;min-width:300px;columns:2;column-gap:0;padding:0}
/* .tb-menu.on ở trên đặt display:flex — flex container BỎ QUA columns, nên hai cột
   không bao giờ hiện ra. Đổi sang block để thuộc tính columns có tác dụng. */
.tb-menu.on{display:block}
.tb-menu .tm-head{column-span:all;padding:10px 12px;border-bottom:1px solid var(--rule)}
.tb-menu .tm-all b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink)}
.tb-menu .tm-all span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.tb-menu .tm-all:hover b{color:var(--accent)}
.tb-menu .tm-grp{break-inside:avoid;padding:6px 4px 8px}
.tb-menu .tm-2{columns:2;column-gap:0;break-inside:avoid}
.tb-menu .tm-2 a{break-inside:avoid;white-space:nowrap}
.tb-menu .tm-lbl{display:block;font-family:var(--mono);font-size:var(--micro);letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);padding:6px 9px 4px}
.tb-menu a[data-nav]{display:block;break-inside:avoid}
.tb-menu a[data-nav]:hover,.tb-menu a[data-nav]:focus-visible{background:var(--paper);color:var(--accent)}
@media(max-width:760px){
  .tb-menu{columns:1;min-width:0;width:min(88vw,320px)}
  .expl-top{grid-template-columns:1fr}
  .expl-row{grid-template-columns:70px minmax(0,1fr) 16px}
  .expl-row .d{display:none}
  .expl-grid{grid-template-columns:1fr}
  .expl-search input{font-size:14px}
}

/* Nút Khám phá phải sống trên điện thoại: sáu .tb-btn bị ẩn ở ≤760px nên trước
   đây màn hình hẹp không có lối vào công cụ nào ngoài ngăn kéo ☰. */
.tb-key{display:none;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);border:1px solid var(--ink);padding:5px 8px;white-space:nowrap;background:var(--card)}
.tb-key:hover{background:var(--ink);color:var(--paper)}
/* ≤980px: nút Khám phá gọn thay cho popup. Hai nút cùng tên cạnh nhau là lỗi. */
@media(max-width:980px){.tb-key{display:inline-block}.tb-more{display:none}}
@media(max-width:560px){.tb-key{padding:4px 7px;font-size:9.5px}}

/* ==== Vật lí đứng đầu: một nút riêng, có tiến độ, luôn thấy ==== */
.tb-phys{display:flex;align-items:baseline;gap:6px;border:1px solid var(--accent);background:var(--accent);
  color:var(--paper);padding:5px 9px;white-space:nowrap;transition:background .12s}
.tb-phys b{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.tb-phys span{font-family:var(--mono);font-size:9px;letter-spacing:.04em;opacity:.8}
.tb-phys:hover{background:var(--ink);border-color:var(--ink)}
.tb-gear{display:none;width:30px;height:30px;place-items:center;border:1px solid var(--rule);background:var(--card)}
.tb-gear svg{width:14px;height:14px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.tb-gear:hover{border-color:var(--ink)}
@media(max-width:1180px){.tb-gear{display:grid}}
@media(max-width:980px){.tb-phys{display:none}}
@media(max-width:560px){.tb-gear{display:none}}

/* ==== Vật lí đứng đầu trong ngăn kéo ==== */
.rail-phys{margin:12px 0 4px;border:1px solid var(--accent);background:var(--card)}
.rail-phys.on{box-shadow:inset 3px 0 0 var(--accent)}
.rp-main{display:block;padding:11px 12px 12px}
.rp-k{display:block;font-family:var(--mono);font-size:var(--micro);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.rp-main b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:600;margin-top:3px}
.rp-bar{display:block;height:3px;background:var(--rule);margin-top:8px}
.rp-bar i{display:block;height:3px;background:var(--accent)}
.rp-links{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.rp-links a{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-2);
  padding:7px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.rp-links a:nth-child(2n){border-right:0}
.rp-links a:nth-child(n+3){border-bottom:0}
.rp-links a:hover,.rp-links a.on{background:var(--paper);color:var(--accent)}

/* ==== thẻ Vật lí trên trang chủ, đứng trước thẻ tự học ==== */
.hero-phys{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-top:26px;
  border:1px solid var(--accent);background:var(--accent);color:var(--paper);padding:16px 20px;
  transition:background .14s}
.hero-phys:hover{background:var(--ink);border-color:var(--ink)}
.hp-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-phys .kicker{color:rgba(252,249,242,.72)}
.hp-l b{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2}
.hp-sub{font-size:12px;color:rgba(252,249,242,.78)}
.hp-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.hp-bar{display:block;width:110px;height:3px;background:rgba(252,249,242,.28)}
.hp-bar i{display:block;height:3px;background:var(--paper)}
.hp-r u{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;text-decoration:none}
@media(max-width:760px){
  .hero-phys{flex-direction:column;align-items:flex-start;gap:12px}
  .hp-r{align-items:flex-start;width:100%}
  .hp-bar{width:100%}
}

/* ==== đọc dễ hơn: dùng biến từ Tuỳ biến ==== */
:root{--measure:68ch;--lh:1.62}
.read-article{max-width:var(--measure)}
body{line-height:var(--lh)}
[data-underline="on"] .read-article a,[data-underline="on"] .prose a,[data-underline="on"] .read-rel a span{
  text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}

/* ==== Tuỳ biến: bố cục hai cột, có mục lục ==== */
.set-page{display:grid;grid-template-columns:196px minmax(0,1fr);gap:34px;align-items:start;margin-top:8px}
.set-nav{position:sticky;top:72px;display:flex;flex-direction:column;gap:1px}
.set-nav a{display:flex;align-items:baseline;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--ink-2);
  border-left:2px solid var(--rule)}
.set-nav a b{font-family:var(--mono);font-size:9px;color:var(--ink-3);font-weight:500}
.set-nav a:hover{background:var(--card);color:var(--ink)}
.set-nav a.on{border-left-color:var(--accent);background:var(--card);color:var(--ink)}
.set-nav a.on b{color:var(--accent)}
.set-nav .set-nav-h{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 10px 5px}
.set-body{min-width:0}
.set-body .set-sec{margin-bottom:26px}
.set-body .set-sec:last-child{margin-bottom:0}
.set-anchor{display:block;position:relative;top:-70px;visibility:hidden}
.set-row-note{font-size:11.5px;color:var(--ink-3);margin:-2px 0 8px;max-width:56ch}
.set-range{display:flex;align-items:center;gap:10px}
.set-range input[type=range]{flex:1;max-width:230px;accent-color:var(--accent)}
.set-range em{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-style:normal;min-width:52px}
.set-save-hint{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-top:10px}
.set-save-hint::before{content:"";width:6px;height:6px;background:var(--green);display:block}
@media(max-width:860px){
  .set-page{grid-template-columns:minmax(0,1fr);gap:0}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;gap:0;border-bottom:1px solid var(--rule);margin-bottom:18px}
  .set-nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:8px 12px}
  .set-nav a.on{border-bottom-color:var(--accent)}
  .set-nav .set-nav-h{display:none}
}
.read-preview{border:1px solid var(--rule);background:var(--card);padding:14px 16px;margin-top:14px}
.read-preview p{margin:6px 0 0;max-width:var(--measure);line-height:var(--lh);font-size:13.5px;color:var(--ink-2)}

/* ==== dải "Đi tiếp" cuối mỗi trang công cụ ==== */
.next-steps{margin-top:44px;padding-bottom:60px}
.ns-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--ink);padding-bottom:6px}
.ns-h .kicker{color:var(--ink)}
.ns-h a{font-family:var(--mono);font-size:var(--micro);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ns-h a:hover{color:var(--accent)}
.ns-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-top:0}
.ns-card{display:flex;flex-direction:column;gap:3px;padding:13px 15px;background:var(--card);min-width:0}
.ns-card:hover{background:var(--paper)}
.ns-card b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.3}
.ns-card span{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.ns-card:hover b{color:var(--accent)}
.ns-first{box-shadow:inset 0 -3px 0 var(--accent)}
.ns-first span{color:var(--accent);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;font-size:var(--micro)}
@media(max-width:760px){
  .ns-grid{grid-template-columns:minmax(0,1fr)}
  .next-steps{margin-top:32px}
}
.wk-h1{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.24;margin:7px 0 10px;
  letter-spacing:-.01em;max-width:34ch;text-wrap:balance}
@media(max-width:760px){.wk-h1{font-size:20px}}

/* ==== nút lùi trên mọi trang con ==== */
.pg-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:var(--micro);
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-decoration:none;
  padding:5px 0;margin-bottom:14px;border-bottom:1px solid transparent}
.pg-back:hover{color:var(--accent);border-bottom-color:var(--accent)}
.pg-back span{font-size:12px;line-height:1}

/* ==== cam kết "nếu … thì …" ==== */
.ift-ask{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:start;
  border:1px solid var(--ink);background:var(--card);padding:18px 20px;margin-top:22px}
.ift-ask-l b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;margin-top:5px}
.ift-ask-l p{font-size:12px;color:var(--ink-2);margin:6px 0 0;max-width:44ch}
.ift-form{display:flex;flex-direction:column;gap:8px}
.ift-form label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:var(--micro);
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ift-form input{flex:1;min-width:0;font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;
  color:var(--ink);border:1px solid var(--rule);background:var(--paper);padding:7px 9px}
.ift-form input:focus{border-color:var(--accent);outline:none}
.ift-btns{display:flex;gap:8px;margin-top:2px}
.sy-ifthen{border-left:3px solid var(--accent);background:var(--card);padding:12px 16px;margin-top:20px}
.ift-line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:4px 0;font-size:13.5px}
.ift-line span{font-family:var(--mono);font-size:var(--micro);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ift-line b{font-weight:600}
.ift-x{margin-left:auto;color:var(--ink-3);font-size:15px;line-height:1;padding:0 4px}
.ift-x:hover{color:var(--accent)}
.ift-more{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:var(--micro);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ift-more:hover{color:var(--accent)}
@media(max-width:760px){.ift-ask{grid-template-columns:minmax(0,1fr);gap:14px}}


/* ---------- tài khoản & đồng bộ (src/account.js) ---------- */
.acct-lead { font-size: 1.05rem; margin: 0 0 .4rem; }
.acct-form { display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin: .8rem 0; }
.acct-field { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; min-width: min(100%, 16rem); }
.acct-field input, .acct-field select {
  font: inherit; min-height: 44px; padding: .5rem .6rem;
  color: var(--ink); background: var(--card); border: 1px solid var(--rule);
