  const f = S.practiceFilter = S.practiceFilter || { g: 'all', s: 'all', n: 10 };
  const pool = syLessonQuestions();
  const subjectsInPool = [...new Set(pool.map(q => q.s))];
  const results = S.results.slice(-8).reverse();

  const filteredN = pool.filter(q => (f.g === 'all' || q.g === +f.g) && (f.s === 'all' || q.s === f.s)).length;

  $('#main').innerHTML = `<section class="wrap wide sy-page">
    ${pageHead('Luyện đề tự tạo', pool.length + ' câu hỏi lấy từ bài học · mọi lớp, mọi môn',
    'Chọn phạm vi rồi làm. Trả lời bằng lời của em trước khi mở đáp án — tự chấm đúng/sai. Câu chưa đúng được đưa vào lượt ôn sau và tạo thẻ ghi nhớ bằng một cú bấm.')}

    <div class="pr-form">
      <label class="st-row"><span>Lớp</span>
        <select id="prG"><option value="all"${f.g === 'all' ? ' selected' : ''}>Mọi lớp</option>
          ${Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<option value="${n}"${String(f.g) === String(n) ? ' selected' : ''}>Lớp ${n}</option>`).join('')}</select></label>
      <label class="st-row"><span>Môn</span>
        <select id="prS"><option value="all"${f.s === 'all' ? ' selected' : ''}>Mọi môn</option>
          ${subjectsInPool.map(id => `<option value="${id}"${f.s === id ? ' selected' : ''}>${syScopeName(0, id)}</option>`).join('')}</select></label>
      <label class="st-row"><span>Số câu</span>
        <select id="prN">${[5, 10, 15, 20, 30].map(n => `<option value="${n}"${f.n === n ? ' selected' : ''}>${n} câu</option>`).join('')}</select></label>
      <div class="pr-go"><span class="kicker">${filteredN} câu phù hợp</span>
        <button class="btn" id="prStart"${filteredN ? '' : ' disabled'}>Bắt đầu →</button></div>
    </div>

    <div id="prBody"></div>

    ${results.length ? `<div class="cd-list-h"><span class="kicker">Đề đã làm</span></div>
      <div class="pr-hist">${results.map(r => `<div class="pr-hrow">
        <b>${r.right}/${r.total}</b>
        <span>Lớp ${r.g === 'all' ? 'nhiều' : r.g} · ${r.s === 'all' ? 'nhiều môn' : syScopeName(0, r.s)}</span>
        <i>${syDateVN(r.at)} ${syTime(r.at)}</i>
        <em class="${r.right / r.total >= 0.8 ? 'good' : r.right / r.total >= 0.5 ? 'mid' : 'bad'}">${Math.round(r.right / r.total * 100)}%</em>
      </div>`).join('')}</div>` : ''}
  </section>`;

  const sync = () => {
    f.g = $('#prG').value; f.s = $('#prS').value; f.n = +$('#prN').value;
    save(); renderPractice();
  };
  ['#prG', '#prS', '#prN'].forEach(s => { const el = $(s); if (el) el.onchange = sync; });
  const st = $('#prStart');
  if (st) st.onclick = () => {
    const qs = syLessonQuestions()
      .filter(q => (f.g === 'all' || q.g === +f.g) && (f.s === 'all' || q.s === f.s));
    if (!qs.length) return;
    const n = Math.min(f.n, qs.length);
    syRunPractice(shuffle(qs).slice(0, n), f);
  };
}

function syRunPractice(questions, f) {
  const body = $('#prBody');
  if (!body) return;
  let i = 0, shown = false, right = 0;
  const wrong = [];

  const finish = () => {
    const total = questions.length;
    const S = studyState();
    S.results.push({ at: Date.now(), g: f.g, s: f.s, total, right, wrong: wrong.map(q => q.id) });
    if (S.results.length > 60) S.results = S.results.slice(-60);
    save();
    syCleanup();
    syLog(Math.max(2, total * 1.2), 'Luyện đề ' + total + ' câu', 'practice');
    body.innerHTML = `<div class="cd-done">
      <span class="kicker">Kết quả</span>
      <h3>${right}/${total} câu đúng · ${Math.round(right / total * 100)}%</h3>
      <div class="cd-done-btns">
        ${wrong.length ? `<button class="btn sm" id="prCards">Tạo ${wrong.length} thẻ từ câu chưa đúng</button>
          <button class="btn ghost sm" id="prRedo">Làm lại ${wrong.length} câu sai</button>` : '<span class="sy-note">Không có câu sai — tăng số câu hoặc đổi môn để thử sức.</span>'}
        <a class="btn ghost sm" href="#/study">Về Học hôm nay</a>
      </div>
      ${wrong.length ? `<div class="pr-wrong"><span class="kicker">Cần xem lại</span>
        ${wrong.map(q => `<a class="pr-w" href="#/read/${q.lesson}"><b>${esc(q.q)}</b><i>Lớp ${q.g} · ${syScopeName(q.g, q.s)} · ${esc(q.topic)}</i></a>`).join('')}</div>` : ''}
    </div>`;
    const pc = $('#prCards');
    if (pc) pc.onclick = () => {
      let n = 0;
      wrong.forEach(q => { if (syAddCard({ front: q.q, back: q.a || '(tự trả lời)', g: q.g, s: q.s, lesson: q.lesson })) n++; });
      toast('Đã tạo ' + n + ' thẻ'); location.hash = '#/cards';
    };
    const pr = $('#prRedo');
    if (pr) pr.onclick = () => syRunPractice(shuffle(wrong.slice()), f);
  };

  const draw = () => {
    if (i >= questions.length) return finish();
    const q = questions[i];
    body.innerHTML = `<div class="pr-card">
      <div class="cd-prog"><span class="kicker">Câu ${i + 1} / ${questions.length}</span>
        <div class="cd-bar"><i style="width:${Math.round(i / questions.length * 100)}%"></i></div>
        <span class="cd-box">Lớp ${q.g} · ${syScopeName(q.g, q.s)}</span></div>
      <div class="pr-topic">${esc(q.topic)}${q.tag ? ' · ' + esc(q.tag) : ''}</div>
      <div class="cd-q">${esc(q.q)}</div>
      ${shown ? `<div class="cd-div"></div><span class="kicker">Đáp án / gợi ý</span>
        <div class="cd-a">${esc(q.a || '—')}</div>
        <p class="pr-hint">Em tự chấm: đã trả lời đúng chưa?</p>
        <div class="cd-grades">
          <button class="cd-g g1" data-ok="0">Chưa đúng<kbd>1</kbd></button>
          <button class="cd-g g2" data-ok="1">Đúng rồi<kbd>2</kbd></button>
          <a class="cd-g g0" href="#/read/${q.lesson}">Mở bài học</a>
        </div>`
      : `<button class="cd-show" id="prShow">Xem đáp án <kbd>Space</kbd></button>`}
    </div>`;
    const sh = $('#prShow'); if (sh) sh.onclick = () => { shown = true; draw(); };
    $$('[data-ok]').forEach(b => b.onclick = () => {
      const ok = b.dataset.ok === '1';
      if (ok) right++; else wrong.push(q);
      i++; shown = false; draw();
    });
  };
  draw();
  syBindKeys(e => {
    if (e.key === ' ' && !shown) { e.preventDefault(); shown = true; draw(); }
    else if (shown && (e.key === '1' || e.key === '2')) {
      const b = $(`[data-ok="${e.key === '2' ? 1 : 0}"]`); if (b) b.click();
    }
  });
}

/* =========================================================
   ROUTE · KẾ HOẠCH HỌC  #/plan
   ========================================================= */
function renderPlan() {
  const S = studyState();
  const sc = schoolState();
  const plan = S.plan;
  const today = syDayKey();

  const form = `<div class="pl-form">
    <label class="st-row"><span>Tên kế hoạch</span><input id="plName" type="text" placeholder="Ví dụ: Ôn thi giữa kì I" value="${plan ? esc(plan.name) : ''}"></label>
    <div class="st-two">
      <label class="st-row"><span>Ngày thi / hạn cuối</span><input id="plDate" type="date" value="${plan ? plan.examISO : new Date(Date.now() + 21 * SY_DAY).toISOString().slice(0, 10)}"></label>
      <label class="st-row"><span>Phút mỗi ngày</span><input id="plMin" type="number" min="10" max="480" step="5" value="${plan ? plan.min : 60}"></label>
    </div>
    <div class="st-two">
      <label class="st-row"><span>Lớp</span><select id="plG">${Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<option value="${n}"${n === (plan ? plan.g : sc.grade) ? ' selected' : ''}>Lớp ${n}</option>`).join('')}</select></label>
      <label class="st-row"><span>Môn</span><select id="plS"></select></label>
    </div>
    <div class="sy-btnrow"><button class="btn" id="plBuild">${plan ? 'Dựng lại kế hoạch' : 'Dựng kế hoạch →'}</button>
      ${plan ? '<button class="btn ghost sm" id="plClear">Xoá kế hoạch</button>' : ''}</div>
  </div>`;

  const body = plan ? syPlanBody(plan, today) : '';

  $('#main').innerHTML = `<section class="wrap wide sy-page">
    ${pageHead('Kế hoạch học', plan ? 'tới ' + plan.examVN + ' · ' + plan.days.length + ' ngày' : 'chia đều bài học tới ngày thi',
    'Chọn môn và hạn cuối, máy chia bài thành từng ngày vừa sức — mỗi ngày có phần đọc bài mới và một nhịp ôn lại. Đánh dấu khi xong, kế hoạch tự nhớ.')}
    ${form}
    ${body}
  </section>`;

  const fillS = () => {
    const g = +$('#plG').value;
    const subs = subjectsFor(g).filter(sb => lessonList(g, sb.id).length);
    const cur = plan ? plan.s : (sc.subj);
    $('#plS').innerHTML = subs.map(sb => `<option value="${sb.id}"${sb.id === cur ? ' selected' : ''}>${sb.name}</option>`).join('') || '<option value="">—</option>';
  };
  fillS();
  $('#plG').onchange = fillS;

  $('#plBuild').onclick = () => {
    const g = +$('#plG').value, sId = $('#plS').value;
    if (!sId) return toast('Lớp này chưa có bài để lập kế hoạch');
    const iso = $('#plDate').value;
    const exam = new Date(iso + 'T08:00:00');
    if (!iso || isNaN(exam)) return toast('Chọn ngày thi');
    const min = Math.max(10, Math.min(480, +$('#plMin').value || 60));
    const name = ($('#plName').value || '').trim() || ('Ôn ' + syScopeName(g, sId) + ' lớp ' + g);
    const lessons = lessonList(g, sId);
    if (!lessons.length) return toast('Môn này chưa có bài');

    const start = new Date(); start.setHours(8, 0, 0, 0);
    const total = Math.max(1, Math.min(120, Math.round((exam - start) / SY_DAY) + 1));

    /* hàng đợi: đọc bài mới → ôn lại → luyện đề → thẻ → thi thử */
    const queue = lessons.map(l => ({ k: 'read', id: l.id, t: l.t, href: '#/read/' + l.id }));
    const extras = [];
    if (total >= 3) extras.push({ k: 'drill', t: 'Luyện 10 câu tự tạo', href: '#/practice' });
    if (total >= 5) extras.push({ k: 'cards', t: 'Ôn toàn bộ thẻ ghi nhớ', href: '#/cards' });
    if (total >= 7) extras.push({ k: 'exam', t: 'Thi thử 15 câu', href: '#/exam' });
    if (total >= 9) extras.push({ k: 'drill', t: 'Luyện đề lần hai · tập trung câu sai', href: '#/practice' });

    const want = Math.max(queue.length + extras.length, total);
    let k = 0;
    while (queue.length + extras.length < want && lessons.length) {
      const l = lessons[k % lessons.length]; k++;
      queue.push({ k: 'review', id: l.id, t: 'Ôn lại: ' + l.t, href: '#/read/' + l.id });
    }
    const items = queue.concat(extras);
    const days = [];
    for (let d = 0; d < total; d++) {
      const date = new Date(start.getTime() + d * SY_DAY);
      const from = Math.floor(d * items.length / total);
      const to = Math.floor((d + 1) * items.length / total);
      const take = items.slice(from, Math.max(from + 1, to)).map((x, j) =>
        Object.assign({}, x, { key: date.toISOString().slice(0, 10) + '-' + d + '-' + j }));
      days.push({ date: date.toISOString().slice(0, 10), dateVN: syDateVN(date.getTime()), items: take });
    }

    S.plan = { name, examISO: iso, examVN: syDateVN(exam.getTime()), min, g, s: sId, created: Date.now(), days, totalCount: 0, doneCount: 0 };
    syRecount(); save(); renderPlan(); toast('Đã dựng kế hoạch ' + days.length + ' ngày');
  };
  const cl = $('#plClear');
  if (cl) cl.onclick = () => {
    uiConfirm('Xoá kế hoạch', `Xoá kế hoạch <b>${esc(plan.name)}</b> cùng toàn bộ dấu đã đánh?`, () => {
      S.plan = null; save(); renderPlan(); toast('Đã xoá kế hoạch');
    }, { danger: true, okText: 'Xoá kế hoạch' });
  };

  /* đánh dấu xong */
  $$('[data-pk]').forEach(b => b.onclick = () => {
    const k = b.dataset.pk;
    S.planDone = S.planDone || {};
    if (S.planDone[k]) delete S.planDone[k]; else S.planDone[k] = Date.now();
    syRecount(); save(); renderPlan();
  });
}

function syRecount() {
  const S = studyState();
  const p = S.plan; if (!p) return;
  S.planDone = S.planDone || {};
  let total = 0, done = 0;
  p.days.forEach(d => d.items.forEach(it => { total++; if (S.planDone[it.key]) done++; }));
  p.totalCount = total; p.doneCount = done;
}

function syPlanBody(plan, todayKey) {
  const S = studyState();
  S.planDone = S.planDone || {};
  const pct = plan.totalCount ? Math.round(plan.doneCount / plan.totalCount * 100) : 0;
  let shownToday = false;
  return `<div class="pl-body">
    <div class="pl-head">
      <div><span class="kicker">${plan.name}</span>
        <h2>${plan.doneCount}/${plan.totalCount} mục · ${pct}%</h2>
        <p class="sy-note">Tới <b>${plan.examVN}</b> · ${plan.days.length} ngày · ${plan.min} phút/ngày · Lớp ${plan.g} › ${syScopeName(plan.g, plan.s)}</p></div>
      <div class="pl-ring" style="--p:${pct}">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="sy-r-bg"/><circle cx="60" cy="60" r="52" class="sy-r-fg"/></svg>
        <div class="sy-ring-t"><b>${pct}%</b><span>hoàn thành</span></div>
      </div>
    </div>
    <div class="pl-days">
      ${plan.days.map(d => {
    const isToday = d.date === todayKey;
    const isPast = d.date < todayKey;
    const allDone = d.items.every(it => S.planDone[it.key]);
    const open = isToday || (!shownToday && !isPast && !allDone);
    if (open) shownToday = true;
    return `<details class="pl-day${isToday ? ' today' : ''}${allDone ? ' done' : ''}"${open ? ' open' : ''}>
          <summary>
            <span class="pl-date">${d.dateVN}</span>
            <span class="pl-title">${isToday ? 'Hôm nay' : allDone ? 'Đã xong' : 'Ngày ' + (plan.days.indexOf(d) + 1)}</span>
            <span class="pl-cnt">${d.items.filter(it => S.planDone[it.key]).length}/${d.items.length}</span>
          </summary>
          <div class="pl-items">
            ${d.items.map(it => `<div class="pl-item${S.planDone[it.key] ? ' ok' : ''}">
              <button class="pl-check" data-pk="${it.key}" aria-label="Đánh dấu xong">${S.planDone[it.key] ? '✓' : ''}</button>
              <a href="${it.href}">${it.t}</a>
              <span class="pl-kind">${({ read: 'đọc bài', drill: 'luyện đề', cards: 'ôn thẻ', exam: 'thi thử' })[it.k] || ''}</span>
            </div>`).join('')}
          </div>
        </details>`;
  }).join('')}
    </div>
  </div>`;
}

/* =========================================================
   ROUTE · TẬP TRUNG  #/focus
   ========================================================= */
function syFocusState() {
  const S = studyState();
  const f = S.focus;
  f.mode = +f.mode || 25;
  if (f.running && f.endAt) {
    f.left = Math.max(0, Math.round((f.endAt - Date.now()) / 1000));
    if (f.left <= 0) {
      f.running = false; f.endAt = 0; f.left = 0;
      f.done = (f.done || 0) + 1;
      syLog(f.mode, 'Tập trung ' + f.mode + ' phút', 'focus');
      if (typeof chime === 'function') { try { chime(false); } catch (e) { } }
      if (typeof toast === 'function') toast('Hết ' + f.mode + ' phút — nghỉ một chút nhé');
      save();
    }
  }
  return f;
}
const syFmt = s => {
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

let syFocusTimer = null;
function renderFocus() {
  const S = studyState();
  const f = syFocusState();
  const total = f.mode * 60;
  const pct = Math.max(0, Math.min(100, Math.round((1 - f.left / total) * 100)));
  const todayMin = syMinutesOn(syDayKey());
  const log = S.sessions.filter(s => syDayKey(s.at) === syDayKey()).slice().reverse();
  const week = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = new Date(); d.setDate(d.getDate() - i);
    return { k: syDayKey(d.getTime()), vn: syDateVN(d.getTime()), min: syMinutesOn(syDayKey(d.getTime())) };
  }).reverse();
  const maxMin = Math.max(30, ...week.map(w => w.min));

  $('#main').innerHTML = `<section class="wrap wide sy-page">
    ${pageHead('Đồng hồ tập trung', todayMin + ' phút hôm nay · ' + S.sessions.length + ' phiên đã ghi',
    'Một việc, một đồng hồ. Hết giờ tự ghi vào nhật ký và báo chuông. Điện thoại để xa tầm tay — 25 phút không gián đoạn hiệu quả hơn 2 giờ vừa học vừa lướt.')}
    <div class="fc-wrap">
      <div class="fc-main">
        <div class="fc-modes">
          ${[15, 25, 45, 50].map(m => `<button class="fc-mode${f.mode === m ? ' on' : ''}" data-mode="${m}">${m} phút</button>`).join('')}
        </div>
        <div class="fc-ring" style="--p:${pct}">
          <svg viewBox="0 0 240 240">
            <circle cx="120" cy="120" r="104" class="fc-bg"/>
            <circle cx="120" cy="120" r="104" class="fc-fg"/>
          </svg>
          <div class="fc-t">
            <b id="fcTime">${syFmt(f.left)}</b>
            <span>${f.running ? 'đang chạy · ' + f.mode + ' phút' : 'sẵn sàng'}</span>
          </div>
        </div>
        <div class="fc-btns">
          <button class="btn" id="fcStart">${f.running ? 'Tạm dừng' : (f.left === total ? 'Bắt đầu' : 'Tiếp tục')}</button>
          <button class="btn ghost sm" id="fcReset">Đặt lại</button>
          <button class="btn ghost sm" id="fcLog">Ghi thủ công</button>
        </div>
        <p class="sy-note fc-note">Đồng hồ chạy tiếp khi bạn chuyển trang — mở bài đọc rồi quay lại vẫn đúng giờ.</p>
      </div>

      <aside class="fc-side">
        <div class="sy-box">
          <div class="sy-box-h"><span class="kicker">7 ngày gần đây</span><span class="grow"></span><b>${week.reduce((a, w) => a + w.min, 0)} phút</b></div>
          <div class="fc-week">${week.map(w => `<div class="fc-wcol">
            <div class="fc-wbar"><i style="height:${Math.round(w.min / maxMin * 100)}%"></i></div>
            <span>${w.vn}</span><em>${w.min}</em></div>`).join('')}</div>
        </div>
        <div class="sy-box">
          <div class="sy-box-h"><span class="kicker">Phiên hôm nay</span><span class="grow"></span></div>
          ${log.length ? `<div class="fc-log">${log.map(s => `<div class="fc-lrow"><b>${syTime(s.at)}</b><span>${esc(s.label || 'Tập trung')}</span><em>${s.min}′</em></div>`).join('')}</div>`
      : '<p class="sy-note">Chưa có phiên nào hôm nay.</p>'}
        </div>
      </aside>
    </div>
  </section>`;

  if (syFocusTimer) { clearInterval(syFocusTimer); syFocusTimer = null; }
  const tick = () => {
    const st = studyState().focus;
    if (!st.running) return;
    const left = Math.max(0, Math.round((st.endAt - Date.now()) / 1000));
    const el = $('#fcTime');
    if (el) el.textContent = syFmt(left);
    const ring = document.querySelector('.fc-ring');
    if (ring) ring.style.setProperty('--p', Math.max(0, Math.min(100, Math.round((1 - left / (st.mode * 60)) * 100))));
    if (left <= 0) { clearInterval(syFocusTimer); syFocusTimer = null; renderFocus(); }
  };
  if (f.running) syFocusTimer = setInterval(tick, 500);

  $$('[data-mode]').forEach(b => b.onclick = () => {
    f.mode = +b.dataset.mode; f.running = false; f.endAt = 0; f.left = f.mode * 60; save(); renderFocus();
  });
  const start = $('#fcStart');
  if (start) start.onclick = () => {
    if (f.running) {
      f.left = Math.max(0, Math.round((f.endAt - Date.now()) / 1000));
      f.running = false; f.endAt = 0;
    } else {
      if (f.left <= 0) f.left = f.mode * 60;
      f.running = true; f.endAt = Date.now() + f.left * 1000;
    }
    save(); renderFocus();
  };
  const rs = $('#fcReset');
  if (rs) rs.onclick = () => { f.running = false; f.endAt = 0; f.left = f.mode * 60; save(); renderFocus(); };
  const lg = $('#fcLog');
  if (lg) lg.onclick = () => uiPrompt('Số phút vừa học', '30', v => {
    if (!isFinite(+v) || +v <= 0) return;
    syLog(+v, 'Học thủ công', 'manual'); toast('Đã ghi ' + Math.round(+v) + ' phút'); renderFocus();
  }, { type: 'number' });
}

/* =========================================================
   ĐỌC THÀNH TIẾNG (Web Speech API, chạy trong máy)
   ========================================================= */
let sySpeechOn = false;
function sySpeak(text) {
  if (!('speechSynthesis' in window)) { toast('Trình duyệt này không hỗ trợ đọc thành tiếng'); return false; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; u.rate = 0.95;
  const vs = speechSynthesis.getVoices().filter(v => /vi/i.test(v.lang));
  if (vs[0]) u.voice = vs[0];
  u.onend = () => { sySpeechOn = false; const b = $('#syRead'); if (b) b.textContent = 'Đọc thành tiếng'; };
  speechSynthesis.speak(u);
  sySpeechOn = true;
  return true;
}
function syStopSpeak() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  sySpeechOn = false;
  const b = $('#syRead'); if (b) b.textContent = 'Đọc thành tiếng';
}

async function syImportAll(file) {
  try {
    const pack = JSON.parse(await file.text());
    if (pack.kind === 'study-backup') {
      if (pack.school && pack.school.lessons) {
        state.school = state.school || {};
        state.school.lessons = Object.assign({}, state.school.lessons || {}, pack.school.lessons);
      }
      if (pack.study) {

   ========================================================= */
function syWeekMinutes(offset) {
  const out = [];
  const base = new Date(); base.setHours(12, 0, 0, 0);
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base.getTime() - (i + (offset || 0) * 7) * SY_DAY);
    const k = syDayKey(d.getTime());
    out.push({ k, vn: syDateVN(d.getTime()), dow: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()], min: syMinutesOn(k) });
  }
  return out;
}
function syAccuracy() {
  const S = studyState();
  const bySub = {};
  S.results.forEach(r => {
    const key = r.s === 'all' ? 'all' : r.s;
    bySub[key] = bySub[key] || { right: 0, total: 0, runs: 0 };
    bySub[key].right += r.right; bySub[key].total += r.total; bySub[key].runs++;
  });
  return bySub;
}
function syAdvice() {
  const S = studyState();
  const out = [];
  const due = syDue().length;
  const today = syToday();
  const acc = syAccuracy();
  const weak = Object.keys(acc).filter(k => k !== 'all' && acc[k].total >= 3)
    .map(k => ({ k, p: acc[k].right / acc[k].total })).sort((a, b) => a.p - b.p)[0];

  if (due > 0) out.push({ t: `Ôn ${due} thẻ đang đến hạn`, d: 'Đây là việc hiệu quả nhất lúc này — ôn đúng lúc sắp quên thì nhớ lâu gấp nhiều lần đọc lại.', href: '#/cards', cta: 'Ôn thẻ' });
  if (weak && weak.p < 0.8) out.push({ t: `Môn yếu nhất: ${syScopeName(0, weak.k)}`, d: `Tỉ lệ đúng ${Math.round(weak.p * 100)}%. Làm lại 5 câu dễ trước, rồi mở bài học tương ứng để vá chỗ hổng.`, href: '#/practice', cta: 'Luyện lại' });
  if (S.cards.length === 0) out.push({ t: 'Chưa có thẻ ghi nhớ nào', d: 'Mở một bài đọc rồi bấm “Thành thẻ ghi nhớ” — máy lấy câu hỏi trong bài làm thẻ cho bạn.', href: '#/cards', cta: 'Tạo thẻ' });
  if (!S.plan) out.push({ t: 'Chưa có kế hoạch', d: 'Đặt ngày thi và số ngày còn lại, máy chia bài cho vừa sức mỗi ngày.', href: '#/plan', cta: 'Tạo kế hoạch' });
  if (today.min === 0) out.push({ t: 'Hôm nay chưa có phút học nào', d: 'Bật đồng hồ 15 phút và học một mục nhỏ nhất. Bắt đầu là quan trọng hơn làm nhiều.', href: '#/focus', cta: 'Bắt đầu 15′' });
  if (today.min > 0 && today.min < S.goal.min) out.push({ t: `Còn ${S.goal.min - today.min} phút để đủ mục tiêu`, d: 'Mục tiêu nhỏ mà đều hiệu quả hơn một buổi dài rồi nghỉ vài ngày.', href: '#/focus', cta: 'Học tiếp' });
  if (!out.length) out.push({ t: 'Hôm nay bạn đang rất đều', d: 'Làm thêm một đề ngắn để mở rộng vùng kiến thức, hoặc đọc một bài ở môn khác.', href: '#/practice', cta: 'Luyện thêm' });
  return out.slice(0, 3);
}

/* =========================================================
   HỘP THOẠI NHỎ — thay cho prompt() của trình duyệt
   ========================================================= */
/* Hộp xác nhận nội trang — thay hẳn confirm() của trình duyệt.
   confirm() bị chặn trong iframe/preview và làm treo bộ QA, nên mọi chỗ xoá
   dữ liệu đều đi qua đây. `danger` tô nút xác nhận bằng màu cảnh báo. */
function uiConfirm(title, message, onOk, opt) {
  opt = opt || {};
  const d = document.createElement('div');
  d.className = 'overlay ui-ov';
  d.innerHTML = `<div class="ov-panel ui-mini" role="alertdialog" aria-label="${esc(title)}">
    <div class="cal-mh"><span class="kicker">${esc(title)}</span><span class="grow"></span><button class="bd-x" aria-label="Đóng">×</button></div>
    <div class="cal-mb"><p class="ui-msg">${message}</p></div>
    <div class="cal-mf"><span class="grow"></span>
      <button class="btn ghost sm" id="ucNo">Huỷ</button>
      <button class="btn sm${opt.danger ? ' btn-danger' : ''}" id="ucYes">${esc(opt.okText || 'Đồng ý')}</button></div>
  </div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener('keydown', onKey, true); };
  const yes = () => { close(); onOk(); };
  const onKey = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    if (e.key === 'Enter') { e.preventDefault(); yes(); }
  };
  d.querySelector('.bd-x').onclick = close;
  $('#ucNo', d).onclick = close;
  $('#ucYes', d).onclick = yes;
  d.onclick = e => { if (e.target === d) close(); };
  document.addEventListener('keydown', onKey, true);
  setTimeout(() => { const b = $('#ucYes', d); if (b) b.focus(); }, 40);
}

function uiPrompt(title, def, onOk, opt) {
  opt = opt || {};
  const d = document.createElement('div');
  d.className = 'overlay ui-ov';
  d.innerHTML = `<div class="ov-panel ui-mini" role="dialog" aria-label="${esc(title)}">
    <div class="cal-mh"><span class="kicker">${esc(title)}</span><span class="grow"></span><button class="bd-x" aria-label="Đóng">×</button></div>
    <div class="cal-mb">
      ${opt.multiline
      ? `<textarea id="uiV" rows="3">${esc(def || '')}</textarea>`
      : `<input id="uiV" type="${opt.type || 'text'}" value="${esc(def || '')}">`}
      ${opt.hint ? `<p class="sy-note">${esc(opt.hint)}</p>` : ''}
    </div>
    <div class="cal-mf"><span class="grow"></span>
      <button class="btn ghost sm" id="uiNo">Huỷ</button>
      <button class="btn sm" id="uiYes">Đồng ý</button></div>
  </div>`;
  document.body.appendChild(d);
  const inp = $('#uiV', d);
  const close = () => d.remove();
  const ok = () => { const v = inp.value.trim(); if (v === '') return; close(); onOk(v); };
  d.querySelector('.bd-x').onclick = close;
  $('#uiNo', d).onclick = close;
  $('#uiYes', d).onclick = ok;
  d.onclick = e => { if (e.target === d) close(); };
  inp.onkeydown = e => {
    if (e.key === 'Enter' && !opt.multiline) { e.preventDefault(); ok(); }
    if (e.key === 'Escape') close();
  };
  setTimeout(() => { inp.focus(); inp.select && inp.select(); }, 40);
}

  d.querySelector('.bd-x').onclick = close;
  $('#ucNo', d).onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  $('#ucYes', d).onclick = () => {
    const f = $('#ucF', d).value.trim(), b = $('#ucB', d).value.trim();
    if (!f) return toast('Chưa nhập mặt trước');
    syAddCard({ front: f, back: b, g: +$('#ucG', d).value, s: $('#ucS', d).value });
    close(); toast('Đã thêm thẻ');
    if (/^#\/cards/.test(location.hash)) renderCards(); else if (/^#\/study/.test(location.hash)) renderStudy();
  };
  setTimeout(() => $('#ucF', d).focus(), 40);
}

/* =========================================================
   LỊCH & THỜI KHOÁ BIỂU
   · Thời khoá biểu: sáng/chiều, 5–6 ngày, tự xếp môn, in được
   · Lịch tháng/tuần: sự kiện màu, việc học, hạn nộp, lịch thi
   ========================================================= */

const OWNER = { tag: '@nggkhaiz', name: 'Nguyễn Khải', gh: 'github.com/Ngg.Khaiz', ghUrl: 'https://github.com/Ngg.Khaiz' };

const SCH_DAYS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
const SCH_DAYS_SHORT = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

/* bảng màu môn học — trầm, sang, in ra vẫn đọc được */
const SCH_COLORS = [
  { id: 'brick', bg: '#f3e2de', fg: '#7d2b20', bd: '#c8837a', name: 'Gạch' },
  { id: 'navy', bg: '#e0e6ef', fg: '#22375a', bd: '#8a9dbb', name: 'Chàm' },

  { id: 'plum', bg: '#ece0ea', fg: '#5c2952', bd: '#a9859d', name: 'Mận' },
  { id: 'teal', bg: '#dcecea', fg: '#155a54', bd: '#7eaaa4', name: 'Ngọc' },
  { id: 'rose', bg: '#f6e3e4', fg: '#8a3540', bd: '#cf9aa0', name: 'Hồng' },

  { id: 'sage', bg: '#e2ece0', fg: '#33523a', bd: '#8fb096', name: 'Xanh lá' },
  { id: 'indigo', bg: '#e3e2f0', fg: '#36326b', bd: '#8f8cbb', name: 'Chàm tía' },
  { id: 'coral', bg: '#f8e6dd', fg: '#8c4526', bd: '#d59d80', name: 'San hô' }
];
const schColor = id => SCH_COLORS.find(c => c.id === id) || SCH_COLORS[0];

/* ---------------- state ---------------- */
function schedState() {
  if (!state.sched) state.sched = {};
  const S = state.sched;
  if (!Array.isArray(S.tables)) S.tables = [];
  if (!S.tables.length) S.tables.push(schNewTable('Thời khoá biểu chính khoá'));
  if (!S.activeId || !S.tables.find(t => t.id === S.activeId)) S.activeId = S.tables[0].id;
  if (!Array.isArray(S.events)) S.events = [];
  if (!S.calView) S.calView = 'month';
  if (!S.cursor) S.cursor = new Date().toISOString().slice(0, 10);
  return S;
}
const schedTable = () => {
  const S = schedState();
  return S.tables.find(t => t.id === S.activeId) || S.tables[0];
};
const cellKey = (d, k, idx) => d + '-' + k + '-' + idx;
const schId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const schNewTable = name => ({ id: schId(), name: name || 'Thời khoá biểu', days: 6, morning: 5, afternoon: 3, cells: {} });

const SCH_ISO = d => {
  const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
};
const SCH_VN = iso => {
  const p = String(iso).split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
};

/* =========================================================
   TRANG · THỜI KHOÁ BIỂU  #/timetable
   ========================================================= */
function renderTimetable() {
  const S = schedState();
  const T = schedTable();
  const subList = (typeof SUBJECTS !== 'undefined' ? SUBJECTS : []);
  const used = new Set();
  Object.values(T.cells).forEach(c => { if (c && c.s) used.add(c.s); });

  const sessions = [
    { k: 'm', label: 'Sáng', n: +T.morning || 5 },
    { k: 'a', label: 'Chiều', n: +T.afternoon || 0 }
  ].filter(s => s.n > 0);

  const gridCols = `54px repeat(${T.days}, minmax(0,1fr))`;

  const cellHTML = (d, k, i) => {
    const c = T.cells[cellKey(d, k, i)];
    if (!c || !c.s) return `<button class="tt-cell empty" data-cell="${cellKey(d, k, i)}" aria-label="Thêm môn"><i>+</i></button>`;
    const col = schColor(c.c);
    return `<button class="tt-cell filled" data-cell="${cellKey(d, k, i)}"
      style="--cb:${col.bg};--cf:${col.fg};--cd:${col.bd}">
      <b>${esc(c.s)}</b>
      ${c.t ? `<i>${esc(c.t)}</i>` : ''}
      ${c.r ? `<u>${esc(c.r)}</u>` : ''}

  };

  $('#main').innerHTML = `<section class="wrap wide tt-page">
    ${pageHead('Thời khoá biểu', 'Lưới tuần · tự xếp · in ra dán tường',
    'Bấm vào ô trống để thêm môn, bấm ô đã có để sửa. Màu môn giữ nguyên khi in và khi xuất ảnh. Có thể tạo nhiều bảng: chính khoá, ôn thi, lịch hè…')}

    <div class="tt-bar">
      <span class="tt-tabs">
        ${S.tables.map(t => `<button class="tt-tab${t.id === S.activeId ? ' on' : ''}" data-table="${t.id}">${esc(t.name)}</button>`).join('')}
        <button class="tt-tab add" id="ttNew" title="Bảng mới">+</button>
      </span>
      <span class="grow"></span>
      <button class="btn ghost sm" id="ttAuto">Tự xếp môn</button>
      <button class="btn ghost sm" id="ttToCal">Đưa vào lịch tuần này</button>
      <button class="btn ghost sm" id="ttClear">Xoá trắng</button>
      <button class="btn ghost sm" id="ttPrint">In / lưu PDF</button>
    </div>

    <div class="tt-wrap">
      <div class="tt-grid" style="--cols:${gridCols}">
        <div class="tt-corner"><span>Tiết</span></div>
        ${Array.from({ length: T.days }, (_, d) => `<div class="tt-dh${d === 0 ? ' first' : ''}">
          <b>${SCH_DAYS_SHORT[d]}</b><span>${SCH_DAYS[d]}</span></div>`).join('')}

        ${sessions.map(se => `
          <div class="tt-sess">${se.label}</div>
          <div class="tt-srow" style="grid-column:1/-1"></div>
          ${Array.from({ length: se.n }, (_, i) => `
            <button class="tt-time" data-time="${se.k}-${i}">${se.k === 'm' ? 'S' : 'C'}${i + 1}</button>
            ${Array.from({ length: T.days }, (_, d) => cellHTML(d, se.k, i)).join('')}
          `).join('')}
        `).join('')}
      </div>
    </div>

    <div class="tt-legend">
      <span class="kicker">Môn đang có</span>
      ${used.size ? [...used].map(n => {
        const c = Object.values(T.cells).find(x => x && x.s === n);
        const col = schColor(c && c.c);
        return `<span class="tt-lg" style="background:${col.bg};color:${col.fg};border-color:${col.bd}">${esc(n)}</span>`;
      }).join('') : '<span class="sy-note">Chưa xếp môn nào — bấm “Tự xếp môn” để có lưới mẫu.</span>'}
    </div>

    <div class="tt-settings">
      <label class="st-row"><span>Tên bảng</span><input id="ttName" type="text" value="${esc(T.name)}"></label>
      <label class="st-row"><span>Số ngày</span>
        <select id="ttDays">${[5, 6, 7].map(n => `<option value="${n}"${T.days === n ? ' selected' : ''}>${n} ngày</option>`).join('')}</select></label>
      <label class="st-row"><span>Tiết sáng</span>
        <select id="ttM">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => `<option value="${n}"${T.morning === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="st-row"><span>Tiết chiều</span>
        <select id="ttA">${[0, 1, 2, 3, 4, 5, 6].map(n => `<option value="${n}"${T.afternoon === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
      ${S.tables.length > 1 ? `<label class="st-row"><span>Bảng</span><button class="btn ghost sm" id="ttDel">Xoá bảng này</button></label>` : ''}
    </div>

    <div class="tt-foot">
      <span class="tt-sign">Người lập: ______________________</span>
      <span class="tt-sign">Học sinh / Lớp: ______________________</span>
      <span class="tt-brand">${OWNER.tag} · ${OWNER.gh}</span>
    </div>
  </section>`;

  /* chọn bảng */
  $$('[data-table]').forEach(b => b.onclick = () => { S.activeId = b.dataset.table; save(); renderTimetable(); });
  const nw = $('#ttNew'); if (nw) nw.onclick = () => {
    uiPrompt('Tên bảng mới', 'Ôn thi học kì', name => {
      const t = schNewTable(name);
      S.tables.push(t);
      S.activeId = t.id; save(); renderTimetable(); toast('Đã tạo bảng mới');
    });
  };
  const del = $('#ttDel'); if (del) del.onclick = () => {
    uiConfirm('Xoá bảng thời khoá biểu', `Xoá <b>${esc(T.name)}</b> cùng toàn bộ tiết đã xếp trong đó?`, () => {
      S.tables = S.tables.filter(t => t.id !== T.id);
      if (!S.tables.length) S.tables.push(schNewTable('Thời khoá biểu chính khoá'));
      S.activeId = S.tables[0].id; save(); renderTimetable(); toast('Đã xoá bảng');
    }, { danger: true, okText: 'Xoá bảng' });
  };

  /* sửa cấu hình */
  const bind = (sel, fn) => { const el = $(sel); if (el) el.onchange = () => { fn(el.value); save(); renderTimetable(); }; };
  bind('#ttName', v => { T.name = v.trim() || 'Thời khoá biểu'; });
  bind('#ttDays', v => { T.days = +v; });
  bind('#ttM', v => { T.morning = +v; });
  bind('#ttA', v => { T.afternoon = +v; });

  /* mở ô sửa */
  $$('[data-cell]').forEach(b => b.onclick = e => { e.stopPropagation(); schCellEditor(b.dataset.cell, T); });

  const auto = $('#ttAuto'); if (auto) auto.onclick = () => schAutoFill(T);
  const t2c = $('#ttToCal'); if (t2c) t2c.onclick = () => schPushWeek(T);
  const clr = $('#ttClear'); if (clr) clr.onclick = () => {
    uiConfirm('Xoá toàn bộ tiết', 'Mọi môn đã xếp trong bảng này sẽ bị xoá. Cấu trúc tuần vẫn giữ nguyên.', () => {
      T.cells = {}; save(); renderTimetable(); toast('Đã xoá toàn bộ tiết');
    }, { danger: true, okText: 'Xoá hết' });
  };
  const pr = $('#ttPrint'); if (pr) pr.onclick = () => window.print();

  /* phụ đề in */
  document.title = 'Thời khoá biểu · ' + (T.name || '') + ' · ' + OWNER.tag;
}

/* popover sửa ô */
function schCellEditor(key, T) {
  schClosePop();
  const cur = T.cells[key] || { s: '', t: '', r: '', c: 'brick' };
  const subList = (typeof SUBJECTS !== 'undefined' ? SUBJECTS : []);
  const opts = [...new Set([...subList.map(s => s.name), 'Toán', 'Ngữ văn', 'Tiếng Anh', 'Vật lí', 'Hoá học', 'Sinh học', 'Lịch sử', 'Địa lí', 'GDCD', 'Tin học', 'Công nghệ', 'Thể dục', 'Âm nhạc', 'Mĩ thuật', 'Chào cờ', 'Sinh hoạt lớp', 'Tự học', 'Ôn thi'])];
  const el = document.querySelector(`[data-cell="${key}"]`);
  const r = el.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'tt-pop';
  pop.style.left = Math.min(window.innerWidth - 300, Math.max(8, r.left)) + 'px';
  pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
  pop.innerHTML = `<div class="tt-pop-h"><b>Sửa tiết</b><button class="bd-x" aria-label="Đóng">×</button></div>
    <label class="tt-pf"><span>Môn</span><input id="tpS" list="tpList" value="${esc(cur.s || '')}" placeholder="Gõ hoặc chọn">
      <datalist id="tpList">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>
    <div class="tt-pf2">
      <label class="tt-pf"><span>Giáo viên</span><input id="tpT" value="${esc(cur.t || '')}"></label>
      <label class="tt-pf"><span>Phòng</span><input id="tpR" value="${esc(cur.r || '')}"></label>
    </div>
    <div class="tt-pf"><span>Màu</span>
      <div class="tt-colors">${SCH_COLORS.map(c => `<button class="tt-c${(cur.c === c.id) ? ' on' : ''}" data-c="${c.id}"
        style="background:${c.bg};border-color:${c.bd}" title="${c.name}"><i style="background:${c.fg}"></i></button>`).join('')}</div></div>
    <div class="tt-pop-f">
      <button class="btn ghost sm" id="tpDel">Xoá tiết</button>
      <span class="grow"></span>
      <button class="btn sm" id="tpSave">Lưu</button>
    </div>`;
  document.body.appendChild(pop);
  schPop = pop;
  let color = cur.c || 'brick';
  const close = () => schClosePop();
  pop.querySelector('.bd-x').onclick = close;
  $$('.tt-c', pop).forEach(b => b.onclick = () => {
    color = b.dataset.c; $$('.tt-c', pop).forEach(x => x.classList.toggle('on', x === b));
  });
  $('#tpDel', pop).onclick = () => { delete T.cells[key]; save(); close(); renderTimetable(); };
  $('#tpSave', pop).onclick = () => {
    const s = $('#tpS', pop).value.trim();
    if (!s) { delete T.cells[key]; } else {
      T.cells[key] = { s, t: $('#tpT', pop).value.trim(), r: $('#tpR', pop).value.trim(), c: color };
    }
    save(); close(); renderTimetable();
  };
  setTimeout(() => { const i = $('#tpS', pop); if (i) { i.focus(); i.select(); } }, 30);
  $('#tpS', pop).onkeydown = e => { if (e.key === 'Enter') $('#tpSave', pop).click(); };
  setTimeout(() => document.addEventListener('mousedown', schOutside), 10);
}
let schPop = null;
function schOutside(e) {
  if (schPop && !schPop.contains(e.target) && !e.target.closest('[data-cell]')) schClosePop();
}
function schClosePop() {
  document.removeEventListener('mousedown', schOutside);
  if (schPop) { schPop.remove(); schPop = null; }
}

/* tự xếp môn — trình điền ngay trong trang */
function schAutoFill(T) {
  schClosePop();
  const dflt = (typeof SUBJECTS !== 'undefined' ? SUBJECTS.filter(s => ['toan', 'van', 'anh', 'vatli', 'hoa', 'sinh', 'tin'].includes(s.id)).map(s => s.name).join(', ') : '');
  const d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = `<div class="ov-panel" style="max-width:520px">
    <div class="cal-mh"><span class="kicker">Tự xếp môn</span><span class="grow"></span><button class="bd-x">×</button></div>
    <div class="cal-mb">
      <p class="sy-note" style="margin-top:0">Nhập các môn cần xếp — cách nhau bằng dấu phẩy, chấm phẩy hoặc xuống dòng. Máy rải đều và tô màu tự động; sửa lại từng ô tuỳ ý.</p>
      <label class="st-row"><span>Danh sách môn</span><textarea id="taList" rows="3">${esc(dflt)}</textarea></label>
      <div class="sy-btnrow"><button class="btn sm" id="taGo">Xếp lên lưới</button></div>
    </div></div>`;
  document.body.appendChild(d);
  const close = () => d.remove();
  d.querySelector('.bd-x').onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  setTimeout(() => $('#taList', d).focus(), 40);
  $('#taGo', d).onclick = () => {
    const list = [...new Set($('#taList', d).value.split(/[,;\n\r]+/).map(x => x.trim()).filter(Boolean))];
    if (!list.length) return toast('Chưa nhập môn nào');
    close(); schApplyAuto(T, list);
  };
}
function schApplyAuto(T, list) {
  if (!list.length) return;
  T.cells = {};
  const colorOf = n => SCH_COLORS[list.indexOf(n) % SCH_COLORS.length].id;
  const sessions = [['m', +T.morning || 0], ['a', +T.afternoon || 0]].filter(x => x[1] > 0);
  let k = 0;
  sessions.forEach(([sk, n]) => {
    for (let i = 0; i < n; i++) {
      for (let d = 0; d < T.days; d++) {
        /* bỏ tiết cuối chiều thứ 7 để có khoảng nghỉ */
        if (sk === 'a' && d === 5 && i === n - 1 && n > 2) continue;
        T.cells[cellKey(d, sk, i)] = { s: list[k % list.length], t: '', r: '', c: colorOf(list[k % list.length]) };
        k++;
      }
    }
  });
  save(); renderTimetable();
  toast('Đã xếp ' + list.length + ' môn — sửa lại tuỳ ý');
}

/* =========================================================
   TRANG · LỊCH  #/calendar
   ========================================================= */
function calAdd(o) {
  const S = schedState();
  const ev = Object.assign({ id: schId(), date: SCH_ISO(Date.now()), title: '', time: '', color: 'brick', kind: 'study', done: false }, o);
  if (!ev.title) return null;
  S.events.push(ev); save(); return ev;
}
function calDel(id) {
  const S = schedState();
  S.events = S.events.filter(e => e.id !== id); save();
}

function renderCalendar() {
  const S = schedState();
  const view = S.calView;
  const cur = new Date(S.cursor + 'T12:00:00');
  const todayISO = SCH_ISO(Date.now());

  const eventsOn = iso => S.events.filter(e => e.date === iso).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));

  let head = '', grid = '';
  if (view === 'month') {
    const y = cur.getFullYear(), m = cur.getMonth();
    const first = new Date(y, m, 1);
    const startShift = (first.getDay() + 6) % 7;
    const start = new Date(y, m, 1 - startShift);
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getTime() + i * 864e5);
      cells.push(d);
    }
    head = `${SCH_DAYS_SHORT.map(d => `<div class="cal-dh">${d}</div>`).join('')}`;
    grid = cells.map(d => {
      const iso = SCH_ISO(d);
      const other = d.getMonth() !== m;
      const evs = eventsOn(iso);
      return `<div class="cal-cell${other ? ' other' : ''}${iso === todayISO ? ' today' : ''}" data-day="${iso}">
        <span class="cal-dn">${d.getDate()}</span>
        <div class="cal-evs">${evs.slice(0, 3).map(e => {
        const c = schColor(e.color);
        return `<span class="cal-ev${e.done ? ' done' : ''}" data-ev="${e.id}" style="--cb:${c.bg};--cf:${c.fg};--cd:${c.bd}">
            ${e.time ? `<i>${e.time}</i>` : ''}${esc(e.title)}</span>`;
      }).join('')}${evs.length > 3 ? `<span class="cal-more">+${evs.length - 3}</span>` : ''}</div>
        <button class="cal-add" data-add="${iso}" aria-label="Thêm việc">+</button>
      </div>`;
    }).join('');
  } else {
    /* tuần */
    const shift = (cur.getDay() + 6) % 7;
    const start = new Date(cur.getTime() - shift * 864e5);
    const week = Array.from({ length: 7 }, (_, i) => new Date(start.getTime() + i * 864e5));
    head = week.map(d => `<div class="cal-dh${SCH_ISO(d) === todayISO ? ' today' : ''}">
      <b>${SCH_DAYS_SHORT[(d.getDay() + 6) % 7]}</b><span>${d.getDate()}/${d.getMonth() + 1}</span></div>`).join('');
    grid = week.map(d => {
      const iso = SCH_ISO(d);
      const evs = eventsOn(iso);
      return `<div class="cal-wcol${iso === todayISO ? ' today' : ''}" data-day="${iso}">
        ${evs.map(e => {
        const c = schColor(e.color);
        return `<span class="cal-ev big${e.done ? ' done' : ''}" data-ev="${e.id}" style="--cb:${c.bg};--cf:${c.fg};--cd:${c.bd}">
            ${e.time ? `<i>${e.time}</i>` : ''}<b>${esc(e.title)}</b></span>`;
      }).join('')}
        <button class="cal-add wide" data-add="${iso}">+ Thêm</button>
      </div>`;
    }).join('');
  }

  const monthLabel = view === 'month'
    ? 'Tháng ' + (cur.getMonth() + 1) + ' · ' + cur.getFullYear()
    : 'Tuần ' + SCH_VN(SCH_ISO(new Date(cur.getTime() - ((cur.getDay() + 6) % 7) * 864e5)));
  const upcoming = S.events.filter(e => e.date >= todayISO && !e.done).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(0, 6);

/* đưa một tuần thời khoá biểu vào lịch (tạo việc có giờ) */
const SCH_SLOTS = {
  m: ['07:00', '07:45', '08:35', '09:25', '10:15', '11:05'],
  a: ['13:30', '14:20', '15:10', '16:00', '16:50', '17:40']
};
function schPushWeek(T) {
  const S = schedState();
  const base = new Date(); base.setHours(12, 0, 0, 0);
  const monday = new Date(base.getTime() - ((base.getDay() + 6) % 7) * 864e5);
  let made = 0, skipped = 0;
  Object.keys(T.cells).forEach(k => {
    const [d, sess, idx] = k.split('-');
    const dd = +d;
    if (dd >= T.days) return;
    const c = T.cells[k];
    if (!c || !c.s) return;
    const date = SCH_ISO(new Date(monday.getTime() + dd * 864e5));
    const time = (SCH_SLOTS[sess] || [])[+idx] || '';
    const title = c.s + (c.r ? ' · ' + c.r : '');
    const dup = S.events.some(e => e.date === date && e.time === time && e.title === title && e.src === 'tt');
    if (dup) { skipped++; return; }
    S.events.push({
      id: schId(), date, time, title,
      color: c.c || 'navy', kind: 'study', done: false, src: 'tt', note: c.t || ''
    });
    made++;
  });
  save(); toast(made ? 'Đã thêm ' + made + ' tiết vào lịch tuần này' + (skipped ? ' · bỏ qua ' + skipped + ' tiết đã có' : '') : 'Không có tiết nào để đưa vào');
  if (made) { location.hash = '#/calendar'; return; }
  if (!Object.keys(T.cells).some(k => T.cells[k] && T.cells[k].s)) {
    toast('Thời khoá biểu còn trống — xếp môn trước đã nhé'); location.hash = '#/timetable';
  }
}

/* =========================================================
   XUẤT LỊCH RA .ICS — nhập được vào Google / Apple / Outlook
   ========================================================= */
function schICS() {
  const S = schedState();
  const pad = n => String(n).padStart(2, '0');
  const stamp = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
  /* RFC 5545 §3.3.11: thoát \\ ; , và xuống dòng; gấp dòng dài quá 75 octet (§3.1) */
  const esc2 = t => String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;')
    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = line => {
    if (line.length <= 73) return line;
    const out = [];
    let rest = line;
    out.push(rest.slice(0, 73));
    rest = rest.slice(73);
    while (rest.length) { out.push(' ' + rest.slice(0, 72)); rest = rest.slice(72); }
    return out.join('\r\n');
  };
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hoc moi thu//@nggkhaiz//VI', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  let n = 0;
  S.events.forEach(e => {
    const t = (e.time || '08:00').split(':').map(Number);
    const start = new Date(e.date + 'T00:00:00');
    start.setHours(t[0] || 8, t[1] || 0, 0, 0);
    const end = new Date(start.getTime() + 45 * 60000);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + e.id + '@nggkhaiz');
    lines.push('DTSTAMP:' + stamp(new Date()));
    lines.push('DTSTART:' + stamp(start));
    lines.push('DTEND:' + stamp(end));
    lines.push('SUMMARY:' + esc2(e.title));
    if (e.note) lines.push('DESCRIPTION:' + esc2(e.note));
    lines.push('CATEGORIES:' + esc2((CAL_KINDS.find(k => k.id === e.kind) || {}).t || 'Học tập'));
    lines.push('END:VEVENT');
    n++;
  });
  lines.push('END:VCALENDAR');
  if (!n) { toast('Chưa có việc nào để xuất'); return; }
  const blob = new Blob([lines.map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lich-hoc-' + (S.events[0] ? S.events[0].date : '') + '.ics';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Đã xuất ' + n + ' việc · nhập được vào Google / Apple Calendar');
}

/* tóm tắt cho trang Học hôm nay */
function schTodaySummary() {
  const S = schedState();
  const iso = SCH_ISO(Date.now());
  const today = S.events.filter(e => e.date === iso && !e.done)
    .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const exams = S.events.filter(e => e.kind === 'exam' && e.date >= iso)
    .sort((a, b) => a.date.localeCompare(b.date));
  const next = exams[0];
  let days = null;
  if (next) days = Math.round((new Date(next.date + 'T00:00:00') - new Date(iso + 'T00:00:00')) / 864e5);
  return { today, next, days };
}

/* =========================================================
   MUSIC DOCK — user supplied YouTube links
   Nocookie embed by default, optional Invidious instance.
   ========================================================= */

function musicState() {
  if (!state.music) state.music = { q: [], i: 0, open: false, loop: true, shuffle: false, inst: '', minimised: true };
  const ms = state.music;
  if (!Array.isArray(ms.q)) ms.q = [];
  /* âm lượng + cách cư xử khi có bài giảng */
  if (typeof ms.vol !== 'number') ms.vol = 35;
  if (typeof ms.muted !== 'boolean') ms.muted = false;
  if (!ms.videoMode) ms.videoMode = 'duck';      /* duck | pause | off */
  if (typeof ms.duckTo !== 'number') ms.duckTo = 12;
  if (typeof ms.fade !== 'boolean') ms.fade = true;
  if (typeof ms.ducked !== 'boolean') ms.ducked = false;
  if (typeof ms.playing !== 'boolean') ms.playing = false;
  return ms;
}

/* ---------- điều khiển iframe YouTube bằng postMessage ---------- */
function ytCmd(func, args) {
  const fr = document.querySelector('#muStage iframe');
  if (!fr || !fr.contentWindow) return;
  try {
    fr.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*');
  } catch (e) {}
}
function musicTargetVol() {
  const ms = musicState();
  if (ms.muted) return 0;
  return ms.ducked ? Math.min(ms.vol, ms.duckTo) : ms.vol;
}
let musicFadeT = null;
function musicApplyVol(instant) {
  const ms = musicState();
  const target = musicTargetVol();
  clearInterval(musicFadeT);
  if (!ms.fade || instant) { ytCmd('setVolume', [target]); return; }
  let cur = musicTargetVol.__cur === undefined ? target : musicTargetVol.__cur;
  const step = (target - cur) / 8;
  let n = 0;
  musicFadeT = setInterval(() => {
    n++;
    cur = n >= 8 ? target : cur + step;
    ytCmd('setVolume', [Math.round(cur)]);
    if (n >= 8) { clearInterval(musicFadeT); musicTargetVol.__cur = target; }
  }, 60);
}
/* gọi từ chỗ mở / đóng video bài giảng */
function musicDuck(on) {
  const ms = musicState();
  const mode = ms.videoMode || 'duck';
  if (mode === 'off') return;
  if (on) {
    if (mode === 'pause') { ytCmd('pauseVideo'); ms.ducked = false; }
    else { ms.ducked = true; musicApplyVol(); }
    ms._wasPlayingBeforeVideo = true;
  } else {
    if (mode === 'pause') { ytCmd('playVideo'); }
    ms.ducked = false;
    musicApplyVol();
  }
}

function parseYT(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  const list = (s.match(/[?&]list=([\w-]+)/) || [])[1] || null;
  const v = (s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/) || [])[1] || null;
  if (v) return { id: v, list };
  if (/^[\w-]{11}$/.test(s)) return { id: s, list: null };
  if (list) return { id: null, list };
  return null;
}

function musicURL(tr, autoplay) {
  const ms = musicState();
  const host = (ms.inst || '').trim().replace(/\/+$/, '');
  const ap = autoplay ? 1 : 0;
  if (host) {
    if (tr.list && !tr.id) return `${host}/playlist?list=${tr.list}`;
    return `${host}/embed/${tr.id}?autoplay=${ap}&enablejsapi=1`;
  }
  if (tr.list && !tr.id) {
    return `https://www.youtube-nocookie.com/embed/videoseries?list=${tr.list}&autoplay=${ap}&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1`;
  }
  return `https://www.youtube-nocookie.com/embed/${tr.id}?autoplay=${ap}&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1${ms.loop ? `&loop=1&playlist=${tr.id}` : ''}`;
}

          <button data-vm="pause" class="${musicState().videoMode === 'pause' ? 'on' : ''}">Tạm dừng</button>

      ? ms.q.map((t, i) => `<div class="mu-row${i === ms.i ? ' on' : ''}" data-i="${i}">
          <span class="mu-i">${i === ms.i ? '▶' : '♪'}</span>
          <span class="mu-t">${esc(t.title || (t.list && !t.id ? 'Playlist ' + t.list : t.id))}</span>
          <button class="mu-del" data-del="${i}" aria-label="Xoá">×</button></div>`).join('')
      : '<p class="mu-empty">Chưa có bài nào. Dán một link YouTube ở trên — chỉ bạn quyết định danh sách.</p>';

           </div>`
        : '';
      const pb = $('#muPlay');
      if (pb) pb.onclick = () => { ms.playing = true; save(); draw(); };
    } else if (stage.querySelector('iframe') === null || stage.dataset.src !== want) {
      stage.dataset.src = want;
      stage.innerHTML = `<iframe src="${want}" title="Trình phát nhạc" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;

    $('#muCount').textContent = ms.q.length ? `${ms.i + 1} / ${ms.q.length}` : '';

    $('#muShuffle').classList.toggle('on', !!ms.shuffle);
    $('#muLoop').classList.toggle('on', !!ms.loop);
    $('#muPillTxt').textContent = cur ? (cur.title || 'Nhạc · ' + (ms.i + 1) + '/' + ms.q.length).slice(0, 18) : 'Nhạc';
    document.querySelectorAll('[data-mu="prev"]').forEach(b => b.disabled = !ms.q.length);
    document.querySelectorAll('[data-mu="next"]').forEach(b => b.disabled = !ms.q.length);
    $$('#muList [data-i]').forEach(r => r.onclick = e => {
      if (e.target.dataset.del !== undefined) return;
      ms.i = +r.dataset.i; save(); draw();
    });
    $$('#muList [data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const i = +b.dataset.del;
      ms.q.splice(i, 1);
      if (ms.i >= ms.q.length) ms.i = Math.max(0, ms.q.length - 1);

    $('#muInstSt').textContent = ms.inst ? 'đang dùng máy chủ riêng' : 'đang dùng youtube-nocookie';

    const ms = musicState();
    ms.open = open === undefined ? !ms.open : open;

    $('#muPanel').hidden = !ms.open;
    $('#musicDock').classList.toggle('open', ms.open);
    if (ms.open) { draw(); setTimeout(() => $('#muUrl').focus(), 60); }

  const mi = $('#muVol');
  if (mi) mi.oninput = () => {
    const ms = musicState();
    ms.vol = +mi.value;
    if (ms.vol > 0) ms.muted = false;
    $('#muVolV').textContent = ms.vol + '%';
    $('#muVolIco').textContent = ms.vol === 0 || ms.muted ? '🔇' : ms.vol < 40 ? '🔈' : '🔉';
    musicApplyVol();
    save();
  };
  if (mi) mi.onchange = () => { ytCmd('setVolume', [musicTargetVol()]); };
  const sb = $('#muStop');
  if (sb) sb.onclick = () => {
    const ms = musicState();
    ms.playing = false; ms.ducked = false; save(); draw();
    toast('Đã dừng nhạc nền');
  };
  const mb = $('#muMute');
  if (mb) mb.onclick = () => {
    const ms = musicState();
    ms.muted = !ms.muted;
    mb.textContent = ms.muted ? 'bật lại' : 'tắt';
    mb.setAttribute('aria-pressed', String(ms.muted));
    $('#muVolIco').textContent = ms.muted ? '🔇' : '🔈';

    save();
    toast(ms.muted ? 'Đã tắt tiếng nhạc nền' : 'Đã bật lại nhạc nền');
  };
  $$('[data-vm]').forEach(b => b.onclick = () => {
    const ms = musicState();
    ms.videoMode = b.dataset.vm;
    $$('[data-vm]').forEach(x => x.classList.toggle('on', x === b));
    if (ms.videoMode === 'duck' && ms.ducked) musicApplyVol();
    save();
    toast(b.dataset.vm === 'duck' ? 'Nhạc sẽ tự nhỏ khi mở bài giảng'
      : b.dataset.vm === 'pause' ? 'Nhạc sẽ tạm dừng khi mở bài giảng'
      : 'Nhạc giữ nguyên âm lượng');
  });
  $('#muPill').onclick = () => toggle();
  $('#muClose').onclick = () => toggle(false);
  $('#muAdd').onclick = add;
  $('#muUrl').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('#muInstSave').onclick = () => {
    const ms = musicState();
    ms.inst = $('#muInst').value.trim();
    save(); draw(); toast(ms.inst ? 'Đã đổi máy chủ phát' : 'Đã quay lại youtube-nocookie');
  };
  $$('[data-mu]').forEach(b => b.onclick = () => {
    const ms = musicState();
    if (!ms.q.length) return;
    if (b.dataset.mu === 'shuffle') { ms.shuffle = !ms.shuffle; save(); draw(); return; }
    if (b.dataset.mu === 'loop') { ms.loop = !ms.loop; save(); draw(); return; }
    if (b.dataset.mu === 'next') ms.i = (ms.i + 1 + ms.q.length) % ms.q.length;
    if (b.dataset.mu === 'prev') ms.i = (ms.i - 1 + ms.q.length) % ms.q.length;
    save(); draw();
  });

  function add() {
    const ms = musicState();
    const raw = $('#muUrl').value;
    const p = parseYT(raw);
    if (!p) { toast('Link không đọc được — dán link youtube.com/watch?v=… hoặc youtu.be/…'); return; }
    const tr = { id: p.id, list: p.list, title: (p.id || 'Playlist') };
    ms.q.push(tr);
    ms.i = ms.q.length - 1;
    $('#muUrl').value = '';
    save(); draw(); toggle(true);
    if (p.id) {
      // optional title lookup; silently falls back when offline
      try {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 2500);
        fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + p.id + '&format=json', { signal: ctl.signal })
          .then(r => r.ok ? r.json() : null)
          .then(j => { if (j && j.title) { tr.title = j.title; save(); draw(); } })
          .catch(() => {})
          .finally(() => clearTimeout(t));
      } catch (e) { /* offline — keep the id as the label */ }
    }
  }

  if (musicState().open) { $('#muPanel').hidden = false; $('#musicDock').classList.add('open'); }
  draw();
}

/* =========================================================
   POMODORO — small hourglass that flips at every phase
   Sand drains top → bottom, then the glass turns over.
   ========================================================= */

/* người dùng tự đặt 3 ô giờ, kiểu đồng hồ, màu cát, chuông */
function pomoCfg() {
  const def = { presets: [[25, 5], [50, 10], [15, 3]], style: 'pixel', tint: 'accent', sound: true, v: 2 };
  const c = Object.assign(def, state.pomoCfg || {});
  if (!Array.isArray(c.presets) || c.presets.length < 3) c.presets = def.presets.map(x => x.slice());
  /* cấu hình cũ (chưa có v) một lần chuyển sang đồng hồ cát pixel */
  if (!c.v) { c.style = 'pixel'; c.v = 2; }
  state.pomoCfg = c;
  return c;
}
const pomoPreset = i => {
  const c = pomoCfg();
  return c.presets[Math.max(0, Math.min(c.presets.length - 1, i || 0))] || [25, 5];
};
const pomoTint = () => {
  const t = pomoCfg().tint;
  return t === 'green' ? 'var(--green)' : t === 'ink' ? 'var(--ink)' : 'var(--accent)';
};

function pomoState() {
  if (!state.pomo) state.pomo = { m: 0, phase: 'focus', left: 25 * 60, endAt: 0, running: false, auto: true, rounds: 0 };
  const p = state.pomo;
  /* dữ liệu cũ có thể thiếu trường — chuẩn hoá để không ra NaN */
  if (!isFinite(p.m)) p.m = 0;
  if (!isFinite(p.left) || p.left < 0) p.left = pomoTotal(p);
  if (!isFinite(p.endAt)) p.endAt = 0;
  if (!p.phase) p.phase = 'focus';
  if (p.running && !p.endAt) p.running = false;
  return p;
}
const pomoTotal = p => {
  const pr = pomoPreset(p.m);
  return (p.phase === 'focus' ? pr[0] : pr[1]) * 60;
};
const mmss = s => {
  if (!isFinite(s)) s = 0;
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

let AC = null;
function chime(breath) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    const notes = breath ? [440, 587.33] : [523.25, 783.99];
    notes.forEach((fr, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = fr;
      const at = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.09, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.95);
      o.connect(g).connect(AC.destination);
      o.start(at); o.stop(at + 1);
    });
  } catch (e) { /* audio blocked until first gesture — fine */ }
}

/* =========================================================
   ĐỒNG HỒ CÁT PIXEL ART — sprite vẽ theo lưới 26×32 ô
   Khung gỗ · bình thuỷ tinh · cát chảy + dòng hạt ở cổ
   ========================================================= */
const PX_HW = { 7:6, 8:6, 9:5, 10:5, 11:4, 12:4, 13:3, 14:2, 15:1,
                16:1, 17:2, 18:3, 19:4, 20:4, 21:5, 22:5, 23:6, 24:6 };

function pxPal(isRest) {
  const t = isRest ? 'green' : pomoCfg().tint;
  const sand = t === 'green' ? ['#3f8f57', '#7fd396', '#2a5c3a']
             : t === 'ink'   ? ['#4d4d59', '#8b8b9e', '#292932']
             : ['#e0483a', '#f0796b', '#a32a20'];
  return {
    dark: '#3a2030', woodD: '#8c4433', wood: '#c8694a', woodH: '#ec9a72', woodL: '#e08a63',
    glass: '#d6eef7', glassE: '#9cc9dc', shine: '#ffffff',
    sand: sand[0], sandH: sand[1], sandS: sand[2]
  };
}
const pxRow = (r, a, b, f) => `<rect x="${a}" y="${r}" width="${b - a + 1}" height="1" fill="${f}"/>`;

function pxFrame() {
  const P = pxPal(); let s = '';
  /* đỉnh: nắp gỗ bo góc */
  s += pxRow(0, 8, 17, P.dark);
  s += pxRow(1, 6, 19, P.dark);
  s += pxRow(2, 5, 20, P.woodD);
  s += pxRow(3, 4, 21, P.wood);
  s += pxRow(4, 4, 21, P.woodH);
  s += pxRow(5, 5, 20, P.wood);
  s += pxRow(6, 6, 19, P.woodD);
  /* hai cột gỗ dọc thân */
  for (let r = 7; r <= 24; r++) {
    s += pxRow(r, 5, 5, P.woodH);
    s += pxRow(r, 6, 6, P.woodD);
    s += pxRow(r, 19, 19, P.woodD);
    s += pxRow(r, 20, 20, P.woodL);
  }
  /* đáy: nắp gỗ bo góc */
  s += pxRow(25, 6, 19, P.woodD);
  s += pxRow(26, 5, 20, P.wood);
  s += pxRow(27, 4, 21, P.woodH);
  s += pxRow(28, 4, 21, P.wood);
  s += pxRow(29, 5, 20, P.woodD);
  s += pxRow(30, 6, 19, P.dark);
  s += pxRow(31, 8, 17, P.dark);
  return s;
}

/* frac = phần thời gian còn lại (0..1) */
function pxGlassSand(frac, running, isRest) {
  const P = pxPal(isRest); let s = '';
  const f = Math.max(0, Math.min(1, isFinite(frac) ? frac : 1));

  /* thân bình: bóng thuỷ tinh */
  for (let r = 7; r <= 24; r++) {
    const hw = PX_HW[r];
    s += pxRow(r, 13 - hw, 12 + hw, P.glass);
  }
  /* phản chiếu */
  s += pxRow(8, 9, 9, P.shine) + pxRow(9, 9, 10, P.shine) + pxRow(10, 9, 9, P.shine);
  s += pxRow(22, 15, 15, P.shine) + pxRow(23, 15, 15, P.shine);

  /* cát bình trên: đầy khi còn nhiều thời gian, rút dần lên trên */
  const topFull = Math.round(f * 9);
  for (let i = 0; i < topFull; i++) {
    const r = 15 - i;
    if (r < 7) break;
    const hw = PX_HW[r];
    const edge = i === 0;
    s += pxRow(r, 13 - hw + 1, 12 + hw - 1, edge ? P.sandH : P.sand);
  }
  /* mặt cát hơi lõm ở giữa */
  if (topFull > 0) {
    const r = 15 - topFull + 1;
    if (r >= 7) s += pxRow(r, 12, 13, P.sandS);
  }

  /* cát bình dưới: đống hình nón, đỉnh nhọn, hai vai thoải */
  const bot = Math.round((1 - f) * 9);
  for (let i = 0; i < bot; i++) {
    const r = 24 - i;
    if (r < 16) break;
    const hw = Math.max(1, Math.min(PX_HW[r] - 1, bot - i));
    s += pxRow(r, 13 - hw, 12 + hw, P.sand);
  }
  if (bot > 0) {
    const rTop = 24 - bot;
    if (rTop >= 16) s += pxRow(rTop, 12, 13, P.sandH);
    s += pxRow(24, 11, 14, P.sandH);
  }

  /* dòng hạt rơi ở cổ bình */
  if (running && f > 0.004 && f < 0.996) {
    const topOfPile = 24 - bot;
    for (let r = 16; r <= Math.max(16, topOfPile); r++) {
      s += `<rect x="${12 + (r % 2)}" y="${r}" width="1" height="1" fill="${P.sandH}"/>`;
    }
  }

  /* thành bình vẽ sau cùng cho cát nằm gọn bên trong */
  for (let r = 7; r <= 24; r++) {
    const hw = PX_HW[r];
    s += `<rect x="${13 - hw}" y="${r}" width="1" height="1" fill="${P.glassE}"/>`;
    s += `<rect x="${12 + hw}" y="${r}" width="1" height="1" fill="${P.glassE}"/>`;
  }
  return s;
}

function pomoWidgetHTML(frac, isPreview) {
  const c = pomoCfg();
  const pr = pomoPreset(0);
  const mm = String(pr[0]).padStart(2, '0');
  const html = `<div class="pomo${c.style === 'pixel' ? ' pix' : ''}${isPreview ? ' preview' : ''}" id="pomo">
      <div class="hg-box" id="hgBox">
        <svg class="hg" viewBox="0 0 60 92" aria-hidden="true">
          <defs>
            <clipPath id="hgTop${isPreview ? 'P' : ''}"><polygon points="12,8 48,8 30,45"/></clipPath>
            <clipPath id="hgBot${isPreview ? 'P' : ''}"><polygon points="12,84 48,84 30,47"/></clipPath>
          </defs>
          <rect x="8" y="8" width="44" height="37" fill="${pomoTint()}" opacity=".8" clip-path="url(#hgTop${isPreview ? 'P' : ''})" id="sandTop"/>
          <rect x="8" y="47" width="44" height="37" fill="${pomoTint()}" opacity=".8" clip-path="url(#hgBot${isPreview ? 'P' : ''})" id="sandBot"/>
          <path d="M12 8h36L30 45 12 8Z" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/>
          <path d="M12 84h36L30 47 12 84Z" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/>
          <path d="M10 6h40M10 86h40" stroke="var(--ink)" stroke-width="1.6"/>
          <path d="M30 45v2" stroke="var(--ink-2)" stroke-width="1"/>
        </svg>
      </div>
      <div class="px-box" id="pxBox">
        <svg class="pxg" viewBox="0 0 26 32" shape-rendering="crispEdges" aria-hidden="true">
          <g>${pxFrame()}</g>
          <g id="pxSand">${pxGlassSand(frac, false, false)}</g>
        </svg>
      </div>
      <div class="pomo-meta">
        <span class="pomo-t" id="pomoT">${mm}:00</span>
        <button class="pomo-play" id="pomoPlay" aria-label="Bắt đầu">▶</button>
      </div>
      <div class="pomo-ph" id="pomoPh">tập trung</div>
      <div class="pomo-modes" id="pomoModes">
        ${c.presets.map((x, i) => `<button data-mode="${i}">${x[0]}/${x[1]}</button>`).join('')}
        <button data-pomo="skip" title="Sang chặng khác">⤳</button>
      </div>
      <div class="pomo-dots" id="pomoDots"></div>
    </div>`;
  return isPreview ? html.replace(/ id="[^"]*"/g, '') : html;
}

function rebuildPomo() {
  const old = $('#pomoDock');
  if (old) old.remove();
  mountPomo();
}

function mountPomo() {
  if ($('#pomoDock')) return;
  const d = document.createElement('div');
  d.id = 'pomoDock';
  d.className = 'dock dock-l';
  d.innerHTML = pomoWidgetHTML(1, false);
  document.body.appendChild(d);

  /* điện thoại: thu gọn thành một viên nhỏ, bấm vào đồng hồ cát để mở */
  const collapse = () => {
    const box = $('#pomo');
    if (window.innerWidth <= 640) box.classList.add('min');
    else box.classList.remove('min');
  };
  collapse();
  window.addEventListener('resize', collapse);
  const hg = $('#hgBox');
  if (hg) hg.onclick = () => { if (window.innerWidth <= 640) $('#pomo').classList.toggle('min'); };

  const paint = () => {
    const p = pomoState();
    const total = pomoTotal(p);
    const f = Math.max(0, Math.min(1, p.left / total));
    const topH = 37 * f, botH = 37 * (1 - f);
    const st = $('#sandTop'), sb = $('#sandBot');
    st.setAttribute('y', String(45 - topH));
    st.setAttribute('height', String(Math.max(0, topH)));
    sb.setAttribute('y', String(84 - botH));
    sb.setAttribute('height', String(Math.max(0, botH)));
    const tint = p.phase === 'focus' ? pomoTint() : 'var(--green)';
    st.setAttribute('fill', tint);
    sb.setAttribute('fill', tint);
    $('#pomoT').textContent = mmss(p.left);
    $('#pomoPh').textContent = p.phase === 'focus' ? 'tập trung' : 'nghỉ';
    $('#pomoPlay').textContent = p.running ? '❙❙' : '▶';
    $('#pomoPlay').setAttribute('aria-label', p.running ? 'Tạm dừng' : 'Bắt đầu');
    $('#pomo').classList.toggle('running', p.running);
    $('#pomo').classList.toggle('rest', p.phase !== 'focus');
    /* pixel: tô lại lưới ô vuông theo phần thời gian còn lại */
    if (pomoCfg().style === 'pixel') {
      const g = $('#pxSand');
      if (g) g.innerHTML = pxGlassSand(f, p.running, p.phase !== 'focus');
      $('#pomo').classList.toggle('running', p.running);
      return;
    }
    $$('#pomoModes [data-mode]').forEach(b => b.classList.toggle('on', +b.dataset.mode === p.m));
    $('#pomoDots').innerHTML = Array.from({ length: Math.min(6, Math.max(0, p.rounds % 7)) }).map(() => '<i></i>').join('') || '';
  };

  const flip = () => {
    if (pomoCfg().style === 'pixel') {
      const box = $('#pxBox');
      if (box) {
        box.classList.add('flip');
        setTimeout(() => { box.classList.remove('flip'); paint(); }, 620);
      } else paint();
      return;
    }
    const box = $('#hgBox');
    box.classList.add('flip');
    setTimeout(() => {
      box.style.transition = 'none';
      box.classList.remove('flip');
      void box.offsetHeight;
      box.style.transition = '';
      paint();
    }, 720);
  };

  const finish = () => {
    const p = pomoState();
    if (p.phase === 'focus') { p.rounds = (p.rounds || 0) + 1; p.phase = 'rest'; }
    else p.phase = 'focus';
    p.left = pomoTotal(p);
    if (pomoCfg().sound !== false) chime(p.phase === 'rest');
    if (p.running) p.endAt = Date.now() + p.left * 1000;
    save();
    flip();
    if (p.phase === 'rest') toast('Hết một phiên · nghỉ ' + pomoPreset(p.m)[1] + ' phút');
    else toast('Nghỉ xong · vào phiên tiếp');
  };

  const tick = () => {
    const p = pomoState();
    if (p.running) {
      p.left = (p.endAt - Date.now()) / 1000;
      if (!isFinite(p.left)) { p.left = pomoTotal(p); p.endAt = Date.now() + p.left * 1000; }
      if (p.left <= 0) { p.left = 0; finish(); return; }
      paint();
    }
  };
  /* chỉ một nhịp duy nhất: mỗi lần dựng lại đồng hồ thì dọn nhịp cũ trước */
  if (window.__pomoTick) clearInterval(window.__pomoTick);
  window.__pomoTick = setInterval(tick, 400);

  $('#pomoPlay').onclick = () => {
    const p = pomoState();
    if (p.running) { p.left = Math.max(0, (p.endAt - Date.now()) / 1000); p.running = false; }
    else {
      if (p.left <= 0.5) p.left = pomoTotal(p);
      p.endAt = Date.now() + p.left * 1000;
      p.running = true;
      try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    save(); paint();
  };
  $$('#pomoModes [data-mode]').forEach(b => b.onclick = () => {
    const p = pomoState();
    p.m = +b.dataset.mode;
    p.phase = 'focus';
    p.running = false;
    p.left = pomoTotal(p);
    save(); paint();
  });
  $('#pomoModes [data-pomo="skip"]').onclick = () => { finish(); };

  paint();
}

const DEF_PREFS = {
  theme: 'paper', accent: '', fs: 1, density: 'cozy', radius: 'sharp',
  motion: true, hl: true
};

function prefs() {
  state.prefs = Object.assign({}, DEF_PREFS, state.prefs || {});
  return state.prefs;
}

function applyPrefs() {
  const p = prefs();
  const root = document.documentElement;
  root.setAttribute('data-theme', p.theme || 'paper');
  root.setAttribute('data-density', p.density === 'compact' ? 'compact' : 'cozy');
  root.setAttribute('data-radius', p.radius === 'soft' ? 'soft' : 'sharp');
  root.setAttribute('data-motion', p.motion === false ? 'off' : 'on');
  root.style.setProperty('--fs', String(p.fs || 1));
  if (p.accent) root.style.setProperty('--accent', p.accent);
  else root.style.removeProperty('--accent');
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ theme: p.theme, fs: p.fs, accent: p.accent, density: p.density, radius: p.radius, motion: p.motion })); } catch (e) {}
}

function setPref(k, v) {
  prefs()[k] = v;
  applyPrefs();
  save();
  if (typeof paintLab === 'function' && /^#\/lab/.test(location.hash)) paintLab(true);
}

  function fillHist() {
    const hb = $('#histBox');
    if (!hb) return;
    hb.innerHTML = '<p class="muted" style="font-size:12px">Đang đọc lịch sử…</p>';
    AppStore.journal().then(rows => {
      rows.sort((a, b) => b.at - a.at);
      if (!rows.length) {

          return `<div class="hist-row">

          state = Object.assign(state, JSON.parse(row.raw));
          applyPrefs(); save(); render(); toast('Đã khôi phục mốc ' + new Date(at).toLocaleTimeString('vi-VN'));
        } catch (e) { toast('Mốc này hỏng, thử mốc khác'); }
      });
    });
  }

  function sel(btn, group) {
    $$(group).forEach(x => x.classList.toggle('on', x === btn));
  }
}

/* =========================================================
   PHÒNG THÍ NGHIỆM — bàn thực hành dựng bằng SVG
   1 · Điện: vôn–ampe, nối tiếp, song song, ghi số liệu, đồ thị
   2 · Quang: băng quang học, kéo nến / thấu kính / màn
   3 · Cơ: lực kế + Archimedes, hạ vật vào chất lỏng
   4 · Nhiệt: nhiệt lượng kế, trộn hai khối nước
========================================================= */
const LAB_ST = () => {
  if (!state.lab) state.lab = {
    st: 'dc', mode: 'A', E: 6, Rv: 8, sw: true, rec: [], simT: 0,
    lensF: 12, dObj: 30, dScr: 20,
    liquid: 0, depth: 0, liq: 'nuoc', mat: 'nhom', log: [],
    m1: 0.2, t1: 80, m2: 0.3, t2: 20, mixed: false, tEq: 0, tNow: 20
  };
  return state.lab;
};
const float = (x, n = 2) => {
  const s = (+x).toFixed(n);
  if (s.indexOf('.') < 0) return s;                 /* 7800 phải giữ nguyên, không cắt thành 78 */
  const t = s.replace(/0+$/, '').replace(/\.$/, '');
  return t === '-0' ? '0' : t;
};
const nuocD = { nuoc: 1000, dau: 800, ruou: 790, muoi: 1100 };
const LAB_MAT = { nhom: ['nhôm', 2700], sat: ['sắt', 7800], dong: ['đồng', 8900], da: ['đá', 2500], go: ['gỗ', 700] };
const LAB_NAME = { dc: 'Bàn 1 · Điện', opt: 'Bàn 2 · Quang', arch: 'Bàn 3 · Cơ', heat: 'Bàn 4 · Nhiệt' };
const nuocN = { nuoc: 'nước', dau: 'dầu', ruou: 'rượu', muoi: 'nước muối' };

/* ---------- cảnh báo an toàn của bàn điện ---------- */
function labAlerts(L, r) {
  const w = [];
  if (!L.sw) w.push(['hở', 'Khoá K đang mở — mạch hở, I = 0. Đóng K để có dòng.']);
  else {
    if (r.I > 1) w.push(['quá', `I = ${float(r.I, 2)} A vượt thang ampe kế 1 A: kim chạm cữ, số đọc không còn đúng. Tăng điện trở biến trở hoặc giảm E.`]);
    if (r.U > 15) w.push(['quá', `U = ${float(r.U, 1)} V vượt thang vôn kế 15 V.`]);
    const PR = L.mode === 'A' ? r.I * r.I * 10 : L.mode === 'B' ? r.I * r.I * 6 : r.I1 * r.I1 * 6;
    if (PR > 2) w.push(['nóng', `Công suất trên điện trở ${float(PR, 2)} W > định mức 2 W — điện trở nóng lên, giá trị R trôi theo nhiệt độ, dây có thể cháy.`]);
  }
  if (!w.length) return `<div class="lab-ok">Mạch kín, mọi đại lượng nằm trong thang đo — số đọc tin được.</div>`;
  return `<div class="lab-alerts">${w.map(([k, t]) => `<div class="lab-alert ${k}"><b>${k === 'hở' ? 'Mạch hở' : k === 'quá' ? 'Quá thang' : 'Quá công suất'}</b>${t}</div>`).join('')}</div>`;
}

/* ---------- hình học bàn điện ---------- */
const DC = { L: 96, R: 646, T: 138, B: 348 };

function dcSolve(L) {
  const E = L.E, r = 0.4;
  const R1 = 6, R2 = 12, R = 10;
  if (L.mode === 'A') {
    const Rt = R + L.Rv + r, I = L.sw ? E / Rt : 0;
    return { I, U: I * R, U1: 0, U2: 0, I1: 0, I2: 0, Req: R + L.Rv, items: [{ R, U: I * R }] };
  }
  if (L.mode === 'B') {
    const Rt = R1 + R2 + L.Rv + r, I = L.sw ? E / Rt : 0;
    return { I, U: I * (R1 + R2), U1: I * R1, U2: I * R2, I1: I, I2: I, Req: R1 + R2, items: [{ R: R1, U: I * R1 }, { R: R2, U: I * R2 }] };
  }
  const Rp = (R1 * R2) / (R1 + R2), Rt = Rp + L.Rv + r, I = L.sw ? E / Rt : 0;
  const U = I * Rp;
  return { I, U, U1: U, U2: U, I1: U / R1, I2: U / R2, Req: Rp, items: [{ R: R1, U }, { R: R2, U }] };
}

/* kim đồng hồ: kim quay từ -52° đến +52° */
function dial(cx, cy, val, max, label, unit) {
  const a = (-52 + 104 * Math.max(0, Math.min(1, val / max))) * Math.PI / 180;
  const len = 30;
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const t = (-52 + 104 * i / 10) * Math.PI / 180;
    const big = i % 5 === 0, r1 = 34, r2 = big ? 27 : 30.5;
    return `<line x1="${cx + Math.sin(t) * r1}" y1="${cy - Math.cos(t) * r1}"
      x2="${cx + Math.sin(t) * r2}" y2="${cy - Math.cos(t) * r2}"
      stroke="var(--ink-3)" stroke-width="${big ? 1.2 : .7}"/>`;
  }).join('');
  const nums = [0, .5, 1].map((f, i) => {
    const t = (-52 + 104 * f) * Math.PI / 180;
    return `<text x="${cx + Math.sin(t) * 21}" y="${cy - Math.cos(t) * 21 + 3}" text-anchor="middle"
      font-family="var(--mono)" font-size="7" fill="var(--ink-3)">${float(max * f, 1)}</text>`;
  }).join('');
  return `<g class="meter">
    <circle cx="${cx}" cy="${cy}" r="40" fill="var(--card)" stroke="var(--ink-2)" stroke-width="1.4"/>
    <circle cx="${cx}" cy="${cy}" r="35" fill="none" stroke="var(--rule)" stroke-width=".8"/>
    <path d="M${cx - 34} ${cy + 14} A34 34 0 0 1 ${cx + 34} ${cy + 14}Z" fill="var(--paper)" opacity=".55"/>
    ${ticks}${nums}
    <line x1="${cx}" y1="${cy}" x2="${cx + Math.sin(a) * len}" y2="${cy - Math.cos(a) * len}"
      stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3.4" fill="var(--ink)"/>
    <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--ink-2)">${label}</text>
    <text x="${cx}" y="${cy - 22}" text-anchor="middle" font-family="var(--mono)" font-size="6.5" letter-spacing=".1em" fill="var(--ink-3)">${unit}</text>
  </g>`;
}

function wire(pts, hot) {
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  return `<path d="${d}" fill="none" stroke="${hot ? 'var(--accent)' : 'var(--ink-2)'}" stroke-width="2.1"
    stroke-linecap="round" stroke-linejoin="round"/>`;
}
function term(x, y) {
  return `<circle cx="${x}" cy="${y}" r="3.6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.2"/>
          <circle cx="${x}" cy="${y}" r="1.3" fill="var(--ink)"/>`;
}

function dcBench(L) {
  const r = dcSolve(L);
  const A = { x: 108 };            /* ắc quy */

    <path d="M${RS.x - 9} ${midY - 40} l9 9 l-9 9 l9 9 l-9 9 l9 9 l-9 9" fill="none" stroke="var(--ink-2)" stroke-width="1.4"/>
    <text x="${RS.x}" y="${midY - 74}" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="var(--ink-2)">${rLabel}</text>
  </g>`;

  /* vôn kế mắc song song với điện trở */
  const VX = RS.x - 112;
  w += wire([[RS.x, midY - 62], [VX, midY - 62]]);
  w += wire([[VX, midY - 62], [VX, midY - 40]]);
  w += wire([[VX, midY + 40], [VX, midY + 62]]);
  w += wire([[VX, midY + 62], [RS.x, midY + 62]]);
  w += dial(VX, midY, r.U, 15, 'V', 'VÔN KẾ 0–15 V');

  /* khoá K */
  w += `<g id="dcSwitch" style="cursor:pointer">

    <line x1="${SW.x0}" y1="${by}" x2="${SW.x1}" y2="${by}" stroke="var(--ink-2)" stroke-width="2.2"
